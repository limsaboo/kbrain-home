<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="pragma" content="no-cache">
<meta http-equiv="expires" content="0">
<title>축정 진행 중 BAM - 뇌심리 평가</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { 
    background: linear-gradient(180deg, #1a472a 0%, #2d5a3d 100%);
    font-family: 'Segoe UI', 'Noto Sans KR', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 500px;
    background: white;
    border-radius: 16px;
    padding: 20px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.3);
}

.screen { display: none; }
.screen.active { display: block; animation: slideIn 0.5s; }

@keyframes slideIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}

.header {
    background: #1a472a;
    color: white;
    padding: 15px 20px;
    border-radius: 12px;
    margin-bottom: 20px;
    text-align: center;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
}

.header-icon { font-size: 24px; }
.header-title { font-size: 20px; font-weight: 700; }

.start-screen { text-align: center; }
.start-screen h1 { color: #1a472a; font-size: 28px; margin-bottom: 15px; font-weight: 700; }
.start-screen .subtitle { color: #666; font-size: 14px; margin-bottom: 20px; line-height: 1.6; }

.info-box {
    background: #f5f5f5;
    border-left: 4px solid #00BCD4;
    padding: 15px;
    border-radius: 8px;
    text-align: left;
    font-size: 13px;
    color: #555;
    margin-bottom: 20px;
    line-height: 1.8;
}

.form-group { margin-bottom: 15px; }
.form-group label {
    display: block;
    font-weight: 700;
    color: #333;
    margin-bottom: 8px;
    font-size: 13px;
}

.form-group input,
.form-group select {
    width: 100%;
    padding: 10px 12px;
    border: 2px solid #e0e0e0;
    border-radius: 8px;
    font-size: 13px;
}

.btn {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 10px;
}

.btn-primary {
    background: #00BCD4;
    color: white;
}

.btn-primary:hover {
    background: #0097a7;
}

.test-screen {
    display: flex;
    flex-direction: column;
    min-height: 600px;
}

.progress-bar {
    width: 100%;
    height: 6px;
    background: #e0e0e0;
    border-radius: 10px;
    margin-bottom: 15px;
    overflow: hidden;
}

.progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #00BCD4 0%, #0097a7 100%);
    transition: width 0.3s;
}

.question-counter {
    text-align: center;
    font-size: 12px;
    color: #666;
    font-weight: 700;
    margin-bottom: 15px;
}

.image-container {
    background: linear-gradient(135deg, #f5f5f5 0%, #eeeeee 100%);
    border: 2px solid #00BCD4;
    border-radius: 12px;
    padding: 15px;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 220px;
    margin-bottom: 15px;
    overflow: hidden;
}

.image-container img {
    max-width: 95%;
    max-height: 95%;
    object-fit: contain;
    border-radius: 8px;
}

.image-error {
    color: #e53935;
    font-size: 12px;
    font-weight: 700;
}

.question-text {
    text-align: center;
    font-size: 13px;
    font-weight: 800;
    color: #1a472a;
    margin-bottom: 15px;
}

.choices {
    display: grid;
    grid-template-columns: 1fr;
    gap: 10px;
    margin-bottom: 20px;
    flex: 1;
}

.choice-card {
    border: 2px solid #e0e0e0;
    border-radius: 8px;
    padding: 14px 16px;
    cursor: pointer;
    text-align: center;
    min-height: 50px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: white;
    font-weight: 700;
    color: #333;
    font-size: 13px;
    width: 100%;
    box-sizing: border-box;
}

.choice-card:hover {
    border-color: #00BCD4;
    background: #f0f9ff;
}

.choice-card.selected {
    border-color: #00BCD4;
    background: #00BCD4;
    color: white;
}

.nav-buttons {
    display: flex;
    gap: 10px;
    margin-top: auto;
}

.btn-nav {
    flex: 1;
    padding: 12px;
    border: 2px solid #00BCD4;
    background: white;
    color: #00BCD4;
    border-radius: 8px;
    font-weight: 700;
    cursor: pointer;
    font-size: 14px;
}

.btn-nav:hover {
    background: #00BCD4;
    color: white;
}

.btn-nav:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

.result-screen { text-align: center; }
.result-title { font-size: 24px; color: #1a472a; margin-bottom: 20px; font-weight: 700; }

.result-box {
    background: linear-gradient(135deg, #00BCD4 0%, #0097a7 100%);
    color: white;
    padding: 25px;
    border-radius: 12px;
    margin-bottom: 20px;
}

.result-label { font-size: 12px; opacity: 0.9; margin-bottom: 8px; }
.result-value { font-size: 32px; font-weight: 700; }

.domain-results {
    background: #f5f5f5;
    padding: 15px;
    border-radius: 8px;
    margin-bottom: 20px;
    text-align: left;
}

.domain-item {
    padding: 8px 0;
    border-bottom: 1px solid #e0e0e0;
    font-size: 12px;
    color: #333;
}

.domain-item:last-child { border-bottom: none; }
.domain-name { font-weight: 700; display: inline-block; width: 60px; }
.domain-score { color: #00BCD4; font-weight: 700; }

@media (max-width: 600px) {
    .container { padding: 15px; }
    .image-container { min-height: 180px; }
}
</style>
</head>
<body>

<div class="container">
    <div id="startScreen" class="screen active">
        <div class="header">
            <div class="header-icon">📋</div>
            <div class="header-title">축정 진행 중</div>
        </div>
        
        <h1>뇌 기능 평가</h1>
        <p class="subtitle">20개의 그림을 보고 직관적으로 응답해주세요.</p>
        
        <div class="info-box">
            📌 정답이 없으며, 시간 제한도 없습니다.<br>
            📌 각 그림에 대한 첫 인상을 선택하세요.
        </div>

        <div class="form-group">
            <label>이름</label>
            <input type="text" id="userName" placeholder="홍길동" required>
        </div>

        <div class="form-group">
            <label>성별</label>
            <select id="userGender" required>
                <option value="">선택</option>
                <option value="남">남</option>
                <option value="여">여</option>
            </select>
        </div>

        <div class="form-group">
            <label>생년월일</label>
            <input type="date" id="userBirth" required>
        </div>

        <div class="form-group">
            <label>지역</label>
            <select id="userRegion" required>
                <option value="">선택</option>
                <option value="서울">서울</option>
                <option value="부산">부산</option>
                <option value="대구">대구</option>
                <option value="인천">인천</option>
                <option value="광주">광주</option>
                <option value="대전">대전</option>
                <option value="울산">울산</option>
                <option value="세종">세종</option>
                <option value="경기">경기</option>
                <option value="강원">강원</option>
                <option value="충북">충북</option>
                <option value="충남">충남</option>
                <option value="전북">전북</option>
                <option value="전남">전남</option>
                <option value="경북">경북</option>
                <option value="경남">경남</option>
                <option value="제주">제주</option>
            </select>
        </div>

        <button class="btn btn-primary" onclick="startTest()">평가 시작</button>
    </div>

    <div id="testScreen" class="screen">
        <div class="header">
            <div class="header-icon">📋</div>
            <div class="header-title">축정 진행 중</div>
        </div>

        <div class="progress-bar">
            <div class="progress-fill" id="progressBar"></div>
        </div>

        <div class="question-counter">
            <span id="questionNum">1</span>/20
        </div>

        <div class="image-container" id="imageContainer">
            <div class="image-error">이미지 로드 중...</div>
        </div>

        <p class="question-text">【집중】?</p>

        <div class="choices" id="choicesContainer"></div>

        <div class="nav-buttons">
            <button class="btn-nav" id="prevBtn" onclick="prevQuestion()" disabled>← 이전</button>
            <button class="btn-nav" id="nextBtn" onclick="nextQuestion()">다음 →</button>
        </div>
    </div>

    <div id="resultScreen" class="screen">
        <div class="header">
            <div class="header-icon">✅</div>
            <div class="header-title">평가 완료</div>
        </div>

        <h1 class="result-title">평가 결과</h1>

        <div class="result-box">
            <div class="result-label">평균 점수</div>
            <div class="result-value" id="avgScore">0</div>
        </div>

        <div class="domain-results" id="domainResults"></div>

        <button class="btn btn-primary" onclick="location.reload()">다시 평가하기</button>
    </div>
</div>

<script>
const SUPABASE_URL = 'https://grxqfaeznqqohnlltged.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdyeHFmYWV6bnFxb2hubmx0Z2VkIiwicm9sZSI6ImFub24iLCJpYXQiOjE2OTQxNzk4NzAsImV4cCI6MjAwOTc1OTg3MH0.LRQWT2F2o7L-KKGP3Ek-V72B_VAhJbKWzG4cN_8i9Gc';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const domains = ['기억', '속도', '집중', '감정', '판단', '실행', '조절', '공간'];

const imageList = [
    '/assets/img/bac-projection-images/1000073550.png',
    '/assets/img/bac-projection-images/1000073552.png',
    '/assets/img/bac-projection-images/1000073554.png',
    '/assets/img/bac-projection-images/1000073556.png',
    '/assets/img/bac-projection-images/1000073558.png',
    '/assets/img/bac-projection-images/1000073560.png',
    '/assets/img/bac-projection-images/1000073562.png',
    '/assets/img/bac-projection-images/1000073564.png',
    '/assets/img/bac-projection-images/1000073566.png',
    '/assets/img/bac-projection-images/1000073599.png',
    '/assets/img/bac-projection-images/1000073601.png',
    '/assets/img/bac-projection-images/1000073607.png',
    '/assets/img/bhc-brain-cards/우뇌구성력 R1 상.png',
    '/assets/img/bhc-brain-cards/우뇌상황력맥락이해 R6 상.png',
    '/assets/img/bhc-brain-cards/우뇌주의력 R3 중.png',
    '/assets/img/bhc-brain-cards/우뇌집중력 R2 상.png',
    '/assets/img/bhc-brain-cards/우뇌창의응용력 R5 상.png',
    '/assets/img/bac-projection-images/1000073821.png',
    '/assets/img/bac-projection-images/1000073823.png',
    '/assets/img/bac-projection-images/1000073825.png'
];

let state = {
    currentQ: 0,
    answers: {},
    userData: {}
};

function showScreen(screenId) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(screenId).classList.add('active');
}

function startTest() {
    const name = document.getElementById('userName').value.trim();
    const gender = document.getElementById('userGender').value;
    const birth = document.getElementById('userBirth').value;
    const region = document.getElementById('userRegion').value;

    if (!name || !gender || !birth || !region) {
        alert('모든 정보를 입력해주세요.');
        return;
    }

    state.userData = { name, gender, birth, region };
    state.currentQ = 0;
    state.answers = {};
    loadQuestion();
    showScreen('testScreen');
}

function loadQuestion() {
    const q = state.currentQ;
    const imageUrl = imageList[q];
    const domain = domains[q % 8];

    document.getElementById('progressBar').style.width = ((q + 1) / 20 * 100) + '%';
    document.getElementById('questionNum').textContent = q + 1;

    const imgContainer = document.getElementById('imageContainer');
    imgContainer.innerHTML = '';

    const img = new Image();
    img.onload = () => {
        imgContainer.innerHTML = '';
        imgContainer.appendChild(img);
    };

    img.onerror = () => {
        imgContainer.innerHTML = '<div class="image-error">이미지를 불러올 수 없습니다.</div>';
    };

    img.src = imageUrl;
    img.style.maxWidth = '100%';
    img.style.maxHeight = '100%';
    img.style.objectFit = 'contain';
    img.style.borderRadius = '8px';

    const choicesContainer = document.getElementById('choicesContainer');
    choicesContainer.innerHTML = '';

    ['긍정적', '보통', '부정적', '무관심'].forEach(option => {
        const card = document.createElement('div');
        card.className = 'choice-card';
        if (state.answers[q]?.option === option) card.classList.add('selected');
        card.textContent = option;
        card.onclick = () => selectAnswer(q, option, card);
        choicesContainer.appendChild(card);
    });

    document.getElementById('prevBtn').disabled = q === 0;
    document.getElementById('nextBtn').textContent = q === 19 ? '완료' : '다음 →';
}

function selectAnswer(q, option, card) {
    const scoreMap = { '긍정적': 100, '보통': 50, '부정적': 25, '무관심': 10 };
    state.answers[q] = {
        domain: domains[q % 8],
        option,
        score: scoreMap[option]
    };

    document.querySelectorAll('.choice-card').forEach(c => c.classList.remove('selected'));
    card.classList.add('selected');
}

function prevQuestion() {
    if (state.currentQ > 0) {
        state.currentQ--;
        loadQuestion();
    }
}

function nextQuestion() {
    if (!state.answers[state.currentQ]) {
        alert('선택지를 선택해주세요.');
        return;
    }

    if (state.currentQ < 19) {
        state.currentQ++;
        loadQuestion();
    } else {
        showResults();
    }
}

async function showResults() {
    const scores = Object.values(state.answers).map(a => a.score);
    const avgScore = Math.round(scores.reduce((a, b) => a + b, 0) / scores.length);

    document.getElementById('avgScore').textContent = avgScore;

    const domainScores = {};
    domains.forEach(d => domainScores[d] = []);

    Object.values(state.answers).forEach(a => {
        domainScores[a.domain].push(a.score);
    });

    const domainResults = document.getElementById('domainResults');
    domainResults.innerHTML = '';

    Object.entries(domainScores).forEach(([domain, scores]) => {
        const avg = Math.round(scores.reduce((a, b) => a + b, 0) / scores.length);
        const item = document.createElement('div');
        item.className = 'domain-item';
        item.innerHTML = `<span class="domain-name">${domain}</span> <span class="domain-score">${avg}점</span>`;
        domainResults.appendChild(item);
    });

    await supabase.from('bam_results').insert({
        name: state.userData.name,
        gender: state.userData.gender,
        birth_date: state.userData.birth,
        region: state.userData.region,
        avg_score: avgScore,
        answers: JSON.stringify(state.answers),
        created_at: new Date().toISOString()
    });

    showScreen('resultScreen');
}
</script>

</body>
</html>
