<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="pragma" content="no-cache">
<meta http-equiv="expires" content="0">
<title>BAM 뇌 기능 평가 | 한국뇌심리연구소</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; }
body { 
    background: linear-gradient(180deg, #1a472a 0%, #2d5a3d 100%);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    overflow: hidden;
}

.container {
    width: 100%;
    height: 100%;
    max-width: 100%;
    background: white;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
}

.screen { display: none; width: 100%; min-height: 100%; padding: 20px; flex-direction: column; }
.screen.active { display: flex; }

.header { background: #1a472a; color: white; padding: 20px; text-align: center; margin-bottom: 20px; }
.header h1 { font-size: 28px; font-weight: 900; margin-bottom: 8px; }
.header p { font-size: 13px; opacity: 0.9; }

.start-screen { justify-content: flex-start; gap: 20px; }
.logo-box { background: linear-gradient(135deg, #00BCD4 0%, #0097A7 100%); border-radius: 20px; padding: 35px 20px; text-align: center; color: white; margin-bottom: 15px; }
.logo-emoji { font-size: 60px; margin-bottom: 15px; }
.logo-title { font-size: 32px; font-weight: 900; margin-bottom: 5px; }
.logo-subtitle { font-size: 13px; opacity: 0.9; }

.info-box { background: #f0f8fa; border-left: 5px solid #00BCD4; border-radius: 12px; padding: 16px; font-size: 13px; line-height: 1.8; color: #333; margin-bottom: 15px; }

.form-group { margin-bottom: 16px; }
.form-label { font-size: 13px; font-weight: 700; color: #333; margin-bottom: 8px; display: block; }
.form-input, .form-select { width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 10px; font-size: 13px; }

.btn { width: 100%; padding: 14px; border: none; border-radius: 12px; font-size: 14px; font-weight: 700; cursor: pointer; margin-top: 10px; }
.btn-primary { background: linear-gradient(135deg, #00BCD4 0%, #0097A7 100%); color: white; }

.test-screen { justify-content: flex-start; gap: 14px; }
.progress-bar-container { background: #e8e8e8; height: 6px; border-radius: 20px; margin-bottom: 12px; }
.progress-bar { height: 100%; background: linear-gradient(90deg, #00BCD4 0%, #0097A7 100%); transition: width 0.3s; }
.progress-text { font-size: 12px; color: #666; font-weight: 600; margin-bottom: 12px; }

.image-section { 
    background: linear-gradient(135deg, #f5f5f5 0%, #eeeeee 100%);
    border: 2px solid #00BCD4;
    border-radius: 12px;
    padding: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 240px;
    margin: 12px 0;
}

.image-section img {
    max-width: 95%;
    max-height: 95%;
    object-fit: contain;
}

.question-text { font-size: 14px; font-weight: 700; color: #222; margin: 15px 0; text-align: center; }

.options { display: grid; grid-template-columns: 1fr; gap: 10px; margin: 15px 0; }
.option-btn { 
    border: 2px solid #ddd;
    border-radius: 10px;
    padding: 14px 16px;
    background: white;
    color: #333;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    min-height: 48px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.option-btn.selected { border-color: #00BCD4; background: #B2EBF2; }

.nav-buttons { display: flex; gap: 10px; margin-top: auto; padding-top: 15px; }
.btn-nav { flex: 1; padding: 12px; border: 2px solid #00BCD4; background: white; color: #00BCD4; border-radius: 10px; font-weight: 700; font-size: 13px; cursor: pointer; }
.btn-nav:disabled { opacity: 0.3; }

.result-screen { justify-content: flex-start; gap: 15px; }
.result-box { background: linear-gradient(135deg, #00BCD4 0%, #0097A7 100%); color: white; border-radius: 16px; padding: 25px; text-align: center; }
.result-label { font-size: 12px; opacity: 0.9; }
.result-value { font-size: 48px; font-weight: 900; }

.brain-region { margin-top: 20px; padding: 15px; background: linear-gradient(135deg, #FFE5E5 0%, #E8F5FF 100%); border-radius: 12px; }
.brain-region-title { font-weight: 900; color: #1a472a; margin-bottom: 12px; }

@media (max-width: 600px) {
    .screen { padding: 12px; }
    .header { padding: 15px; }
}
</style>
</head>
<body>

<div class="container">
    <div id="startScreen" class="screen active">
        <div class="header">
            <h1>📋 BAM 평가</h1>
            <p>뇌 기능 평가 시스템</p>
        </div>
        
        <div class="logo-box">
            <div class="logo-emoji">🧠</div>
            <div class="logo-title">뇌 기능 평가</div>
            <div class="logo-subtitle">20개 그림으로 편도체·기저핵·소뇌 반응 측정</div>
        </div>
        
        <div class="info-box">
            ✓ 정답이 없습니다<br>
            ✓ 시간 제한이 없습니다<br>
            ✓ 첫 느낌을 선택하세요<br>
            ✓ 소요 시간: 약 5~10분
        </div>

        <div class="form-group">
            <label class="form-label">이름</label>
            <input type="text" id="userName" class="form-input" placeholder="홍길동">
        </div>

        <div class="form-group">
            <label class="form-label">성별</label>
            <select id="userGender" class="form-select">
                <option value="">선택</option>
                <option value="남">남</option>
                <option value="여">여</option>
            </select>
        </div>

        <div class="form-group">
            <label class="form-label">생년월일</label>
            <input type="date" id="userBirth" class="form-input">
        </div>

        <div class="form-group">
            <label class="form-label">지역</label>
            <select id="userRegion" class="form-select">
                <option value="">선택</option>
                <option value="서울">서울</option>
                <option value="부산">부산</option>
                <option value="대구">대구</option>
                <option value="인천">인천</option>
                <option value="광주">광주</option>
                <option value="대전">대전</option>
                <option value="울산">울산</option>
                <option value="세종">세종</option>
                <option value="경기">경기</option>
                <option value="강원">강원</option>
                <option value="충북">충북</option>
                <option value="충남">충남</option>
                <option value="전북">전북</option>
                <option value="전남">전남</option>
                <option value="경북">경북</option>
                <option value="경남">경남</option>
                <option value="제주">제주</option>
            </select>
        </div>

        <button class="btn btn-primary" onclick="startTest()">평가 시작</button>
    </div>

    <div id="testScreen" class="screen">
        <div class="header">
            <h1>📋 BAM 평가</h1>
            <p id="progressText">1/20</p>
        </div>

        <div class="progress-bar-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <div class="image-section">
            <img id="testImage" src="" alt="테스트 이미지">
        </div>

        <p class="question-text" id="questionText">첫 느낌은?</p>

        <div class="options" id="optionsContainer"></div>

        <div class="nav-buttons">
            <button class="btn-nav" id="prevBtn" onclick="prevQ()" disabled>← 이전</button>
            <button class="btn-nav" id="nextBtn" onclick="nextQ()">다음 →</button>
        </div>
    </div>

    <div id="resultScreen" class="screen">
        <div class="header">
            <h1>✅ 평가 완료</h1>
            <p>결과가 저장되었습니다</p>
        </div>

        <div class="result-box">
            <div class="result-label">평균 반응점수</div>
            <div class="result-value" id="avgScore">0</div>
        </div>

        <div id="domainResults" style="margin: 20px 0; padding: 15px; background: #f5f5f5; border-radius: 12px;"></div>

        <div id="brainAnalysis" class="brain-region">
            <div class="brain-region-title">🧠 뇌 영역별 반응 분석</div>
            <div id="brainResults"></div>
        </div>

        <button class="btn btn-primary" onclick="location.reload()">다시 평가하기</button>
    </div>
</div>

<script>
const SUPABASE_URL = 'https://grxqfaeznqqohnlltged.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdyeHFmYWV6bnFxb2hubmx0Z2VkIiwicm9sZSI6ImFub24iLCJpYXQiOjE2OTQxNzk4NzAsImV4cCI6MjAwOTc1OTg3MH0.LRQWT2F2o7L-KKGP3Ek-V72B_VAhJbKWzG4cN_8i9Gc';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const domains = ['기억', '속도', '집중', '감정', '판단', '실행', '조절', '공간', '창의', '통찰'];

const imageList = [
    '/assets/img/bam-projection-1.jpg',
    '/assets/img/bam-projection-2.png',
    '/assets/img/bam-projection-3.png',
    '/assets/img/bam-projection-4.jpg',
    '/assets/img/bam-projection-5.png',
    '/assets/img/bam-projection-6.png',
    '/assets/img/bam-projection-7.png',
    '/assets/img/bam-projection-8.png',
    '/assets/img/bam-projection-9.png',
    '/assets/img/bam-projection-10.png',
    '/assets/img/bam-projection-11.png',
    '/assets/img/bam-projection-12.png',
    '/assets/img/bam-projection-13.jpg',
    '/assets/img/bam-projection-14.jpg',
    '/assets/img/bam-projection-15.jpg',
    '/assets/img/bam-projection-16.jpg',
    '/assets/img/bam-projection-17.png',
    '/assets/img/bam-projection-18.png',
    '/assets/img/bam-projection-19.jpg',
    '/assets/img/bam-projection-20.jpg'
];

let state = { currentQ: 0, answers: {}, userData: {} };

function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
}

function startTest() {
    const name = document.getElementById('userName').value.trim();
    const gender = document.getElementById('userGender').value;
    const birth = document.getElementById('userBirth').value;
    const region = document.getElementById('userRegion').value;
    
    if (!name || !gender || !birth || !region) {
        alert('모든 정보를 입력해주세요.');
        return;
    }
    
    state.userData = { name, gender, birth, region };
    state.currentQ = 0;
    state.answers = {};
    loadQuestion();
    showScreen('testScreen');
}

function loadQuestion() {
    const q = state.currentQ;
    const img = imageList[q];
    
    document.getElementById('progressBar').style.width = ((q + 1) / 20 * 100) + '%';
    document.getElementById('progressText').textContent = (q + 1) + '/20';
    document.getElementById('testImage').src = img;
    
    const optionsContainer = document.getElementById('optionsContainer');
    optionsContainer.innerHTML = '';
    
    ['긍정적', '보통', '부정적', '무관심'].forEach(opt => {
        const btn = document.createElement('div');
        btn.className = 'option-btn';
        if (state.answers[q]?.option === opt) btn.classList.add('selected');
        btn.textContent = opt;
        btn.onclick = () => selectAnswer(q, opt, btn);
        optionsContainer.appendChild(btn);
    });
    
    document.getElementById('prevBtn').disabled = q === 0;
    document.getElementById('nextBtn').textContent = q === 19 ? '완료' : '다음 →';
}

function selectAnswer(q, option, elem) {
    const scoreMap = { '긍정적': 100, '보통': 50, '부정적': 25, '무관심': 10 };
    state.answers[q] = {
        domain: domains[q % 10],
        option,
        score: scoreMap[option]
    };
    
    document.querySelectorAll('.option-btn').forEach(e => e.classList.remove('selected'));
    elem.classList.add('selected');
}

function prevQ() {
    if (state.currentQ > 0) {
        state.currentQ--;
        loadQuestion();
    }
}

function nextQ() {
    if (!state.answers[state.currentQ]) {
        alert('선택해주세요.');
        return;
    }
    
    if (state.currentQ < 19) {
        state.currentQ++;
        loadQuestion();
    } else {
        showResults();
    }
}

async function showResults() {
    const scores = Object.values(state.answers).map(a => a.score);
    const avgScore = Math.round(scores.reduce((a, b) => a + b, 0) / scores.length);
    
    document.getElementById('avgScore').textContent = avgScore;
    
    const domainScores = {};
    domains.forEach(d => domainScores[d] = []);
    
    Object.values(state.answers).forEach(a => {
        domainScores[a.domain].push(a.score);
    });
    
    // 도메인별 점수
    const html = Object.entries(domainScores).map(([d, scores]) => {
        const avg = Math.round(scores.reduce((a, b) => a + b, 0) / scores.length);
        return `<div style="padding: 8px 0; border-bottom: 1px solid #ddd; display: flex; justify-content: space-between; font-weight: 700;"><span>${d}</span> <span style="color: #00BCD4;">${avg}점</span></div>`;
    }).join('');
    
    // 뇌 영역별 점수 계산
    const amygdalaScore = Math.round((domainScores['감정'].reduce((a,b)=>a+b,0)/domainScores['감정'].length + 
                                      domainScores['판단'].reduce((a,b)=>a+b,0)/domainScores['판단'].length) / 2);
    const basalGangliaScore = Math.round((domainScores['실행'].reduce((a,b)=>a+b,0)/domainScores['실행'].length + 
                                         domainScores['조절'].reduce((a,b)=>a+b,0)/domainScores['조절'].length) / 2);
    const cerebellumScore = Math.round((domainScores['속도'].reduce((a,b)=>a+b,0)/domainScores['속도'].length + 
                                       domainScores['집중'].reduce((a,b)=>a+b,0)/domainScores['집중'].length) / 2);
    
    const brainHtml = `
        <div style="padding: 8px 0; display: flex; justify-content: space-between; border-bottom: 1px solid #ddd;"><span style="font-weight: 700;">❤️ 편도체 (정서)</span> <span style="color: #FF6B6B; font-weight: 900;">${amygdalaScore}점</span></div>
        <div style="padding: 8px 0; display: flex; justify-content: space-between; border-bottom: 1px solid #ddd;"><span style="font-weight: 700;">⚡ 기저핵 (의사결정)</span> <span style="color: #FFD93D; font-weight: 900;">${basalGangliaScore}점</span></div>
        <div style="padding: 8px 0; display: flex; justify-content: space-between;"><span style="font-weight: 700;">🎯 소뇌 (시간감각)</span> <span style="color: #6BCB77; font-weight: 900;">${cerebellumScore}점</span></div>
    `;
    
    document.getElementById('domainResults').innerHTML = html;
    document.getElementById('brainResults').innerHTML = brainHtml;
    
    await supabase.from('bam_results').insert({
        name: state.userData.name,
        gender: state.userData.gender,
        birth_date: state.userData.birth,
        region: state.userData.region,
        avg_score: avgScore,
        amygdala_score: amygdalaScore,
        basal_ganglia_score: basalGangliaScore,
        cerebellum_score: cerebellumScore,
        answers: JSON.stringify(state.answers),
        created_at: new Date().toISOString()
    });
    
    showScreen('resultScreen');
}
</script>

</body>
</html>
