<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BAM TEST</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#fff;font-family:'Noto Sans KR';color:#333;}
.container{max-width:480px;margin:0 auto;}
.screen{display:none;padding:20px;min-height:100vh;}
.screen.active{display:block;}
input,select{width:100%;padding:10px;margin:10px 0;border:1px solid #ddd;border-radius:5px;}
button{width:100%;padding:12px;background:#00BCD4;color:#fff;border:none;border-radius:5px;cursor:pointer;font-weight:bold;margin:10px 0;}
.image-box{width:100%;max-width:300px;height:300px;background:#f0f0f0;border:2px solid #00BCD4;border-radius:8px;margin:20px auto;display:flex;align-items:center;justify-content:center;}
.image-box img{max-width:100%;max-height:100%;object-fit:contain;}
.options{display:flex;flex-direction:column;gap:10px;margin:20px 0;}
.opt{padding:10px;border:2px solid #ddd;border-radius:5px;cursor:pointer;text-align:center;}
.opt.selected{border-color:#00BCD4;background:#E0F7FA;}
</style>
</head>
<body>

<div class="container">

<div id="screen1" class="screen active">
  <h1>BAM 진단</h1>
  <input type="text" id="name" placeholder="이름">
  <select id="gender">
    <option value="">성별</option>
    <option value="M">남</option>
    <option value="F">여</option>
  </select>
  <input type="date" id="birth">
  <button onclick="start()">시작</button>
</div>

<div id="screen2" class="screen">
  <h2 id="prog">1/20</h2>
  <div class="image-box">
    <img id="img" src="">
  </div>
  <p>첫 반응은?</p>
  <div id="opts" class="options"></div>
  <button onclick="prev()">이전</button>
  <button id="nextBtn" onclick="next()">다음</button>
</div>

<div id="screen3" class="screen">
  <h1>결과</h1>
  <h2 id="brainAge">-</h2>
  <p id="bs">하위뇌: -</p>
  <p id="mb">중뇌: -</p>
  <p id="ct">상위뇌: -</p>
  <div id="domains"></div>
  <button onclick="location.reload()">다시</button>
</div>

</div>

<script>
const domains=[
  {name:'반응속도',bs:60,mb:30,ct:10},
  {name:'보상처리',bs:20,mb:60,ct:20},
  {name:'동기부여',bs:20,mb:70,ct:10},
  {name:'감정반응',bs:50,mb:35,ct:15},
  {name:'판단력',bs:5,mb:15,ct:80},
  {name:'실행력',bs:10,mb:70,ct:20},
  {name:'조절력',bs:10,mb:80,ct:10},
  {name:'공간감각',bs:15,mb:15,ct:70},
  {name:'창의성',bs:5,mb:15,ct:80},
  {name:'통찰력',bs:5,mb:20,ct:75}
];

const imgs=['/assets/img/bam-projection-1.jpg','/assets/img/bam-projection-2.png','/assets/img/bam-projection-3.png','/assets/img/bam-projection-4.jpg','/assets/img/bam-projection-5.png','/assets/img/bam-projection-6.png','/assets/img/bam-projection-7.png','/assets/img/bam-projection-8.png','/assets/img/bam-projection-9.png','/assets/img/bam-projection-10.png','/assets/img/bam-projection-11.png','/assets/img/bam-projection-12.png','/assets/img/bam-projection-13.jpg','/assets/img/bam-projection-14.jpg','/assets/img/bam-projection-15.jpg','/assets/img/bam-projection-16.jpg','/assets/img/bam-projection-17.png','/assets/img/bam-projection-18.png','/assets/img/bam-projection-19.jpg','/assets/img/bam-projection-20.jpg'];

let q=0, ans={};

function start(){
  const n=document.getElementById('name').value;
  const g=document.getElementById('gender').value;
  const b=document.getElementById('birth').value;
  if(!n||!g||!b)return alert('입력하세요');
  q=0;
  ans={};
  show('screen2');
  load();
}

function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function load(){
  document.getElementById('prog').textContent=(q+1)+'/20';
  document.getElementById('img').src=imgs[q];
  const os=document.getElementById('opts');
  os.innerHTML='';
  ['즉각 끌림','조금 끌림','조금 거부','즉각 거부'].forEach(o=>{
    const d=document.createElement('div');
    d.className='opt';
    if(ans[q]?.o===o)d.classList.add('selected');
    d.textContent=o;
    d.onclick=()=>pick(q,o,d);
    os.appendChild(d);
  });
  document.getElementById('nextBtn').textContent=q===19?'완료':'다음';
}

function pick(idx,opt,elem){
  const sc={'즉각 끌림':100,'조금 끌림':70,'조금 거부':40,'즉각 거부':0};
  ans[idx]={o:opt,s:sc[opt]};
  document.querySelectorAll('.opt').forEach(e=>e.classList.remove('selected'));
  elem.classList.add('selected');
}

function prev(){
  if(q>0){q--;load();}
}

function next(){
  if(!ans[q])return alert('선택');
  if(q<19){q++;load();}else calc();
}

function calc(){
  let bsS=0,mbS=0,ctS=0;
  const da=domains.map((d,i)=>{
    let ds=[];
    for(let k in ans){
      if(parseInt(k)%10===i){
        ds.push(ans[k].s);
      }
    }
    let da=ds.length?ds.reduce((a,b)=>a+b,0)/ds.length:0;
    bsS+=da*(d.bs/100);
    mbS+=da*(d.mb/100);
    ctS+=da*(d.ct/100);
    return{n:d.name,s:Math.round(da)};
  });
  
  let bs=Math.round(bsS/10);
  let mb=Math.round(mbS/10);
  let ct=Math.round(ctS/10);
  let ba=Math.round(bs*0.6+mb*0.3+ct*0.1);
  
  document.getElementById('brainAge').textContent=ba+'점';
  document.getElementById('bs').textContent='하위뇌: '+bs;
  document.getElementById('mb').textContent='중뇌: '+mb;
  document.getElementById('ct').textContent='상위뇌: '+ct;
  
  let dh='<h3>도메인</h3>';
  da.forEach(d=>{dh+='<p>'+d.n+': '+d.s+'</p>';});
  document.getElementById('domains').innerHTML=dh;
  
  show('screen3');
}
</script>

</body>
</html>
