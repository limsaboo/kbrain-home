<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BAM</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Noto Sans KR'; background: white; }
.screen { display: none; }
.screen.show { display: block; }

.intro { min-height: 100vh; padding: 40px 20px; text-align: center; background: white; }
.intro h1 { font-size: 36px; color: #1a472a; margin: 30px 0; font-weight: 900; }
.intro p { color: #666; margin: 20px 0; }
.intro input, .intro select { width: 100%; max-width: 300px; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; }
.intro button { width: 100%; max-width: 300px; padding: 14px; margin-top: 20px; background: #00BCD4; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; }

.test { min-height: 100vh; display: flex; flex-direction: column; }
.test-header { background: #1a472a; color: white; padding: 20px; text-align: center; border-bottom: 4px solid #00BCD4; }
.test-header h2 { font-size: 24px; font-weight: 900; }
.test-body { flex: 1; padding: 30px 20px; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; }
.test-image { width: 100%; max-width: 340px; height: 340px; border: 3px solid #00BCD4; border-radius: 12px; margin-bottom: 30px; display: flex; align-items: center; justify-content: center; background: #f5f5f5; }
.test-image img { width: 100%; height: 100%; object-fit: contain; }
.test-question { width: 100%; max-width: 340px; text-align: center; margin-bottom: 20px; }
.test-question p { font-size: 18px; font-weight: 900; color: #1a472a; }
.test-options { width: 100%; max-width: 340px; display: flex; flex-direction: column; gap: 8px; margin-bottom: 30px; }
.test-opt { padding: 12px; border: 2px solid #ddd; background: white; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 700; }
.test-opt.active { border-color: #00BCD4; background: #E0F7FA; }
.test-nav { width: 100%; max-width: 340px; display: flex; gap: 10px; padding-bottom: 30px; }
.test-nav button { flex: 1; padding: 12px; border: 1px solid #ddd; background: white; border-radius: 6px; font-weight: bold; cursor: pointer; }
.test-nav button:disabled { opacity: 0.3; }

.result { min-height: 100vh; padding: 20px; background: #f5f5f5; }
.result-box { background: white; padding: 20px; margin-bottom: 12px; border-radius: 8px; }
.result-title { font-size: 24px; font-weight: 900; color: #1a472a; margin-bottom: 8px; }
.result-value { font-size: 32px; font-weight: 900; color: #1a472a; }
.result-label { font-size: 12px; color: #666; }
.result-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #eee; }
.result-bar { width: 100%; height: 6px; background: #e0e0e0; margin-top: 4px; border-radius: 3px; }
.result-fill { height: 100%; background: #00BCD4; }
.result-btn { width: 100%; padding: 14px; background: #00BCD4; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 20px; margin-bottom: 30px; }
</style>
</head>
<body>

<div id="intro" class="screen show">
  <h1>🧠 BAM</h1>
  <p>뇌나이 진단</p>
  <input type="text" id="name" placeholder="이름">
  <select id="gender">
    <option value="">성별</option>
    <option value="M">남</option>
    <option value="F">여</option>
  </select>
  <input type="date" id="birth">
  <button onclick="start()">시작</button>
</div>

<div id="test" class="screen">
  <div class="test-header">
    <h2 id="progress">1/20</h2>
  </div>
  <div class="test-body">
    <div class="test-image">
      <img id="img" src="">
    </div>
    <div class="test-question">
      <p>?</p>
    </div>
    <div class="test-options" id="opts"></div>
    <div class="test-nav">
      <button id="prev" onclick="prev()" disabled>이전</button>
      <button id="next" onclick="next()">다음</button>
    </div>
  </div>
</div>

<div id="result" class="screen">
  <div class="result-box" style="background: #1a472a; color: white; text-align: center;">
    <p>진단 완료</p>
  </div>
  <div class="result-box">
    <div class="result-label">뇌나이</div>
    <div class="result-value" id="brain">0</div>
  </div>
  <div class="result-box">
    <p style="font-weight: 900; margin-bottom: 12px;">뇌 영역</p>
    <div class="result-item">
      <span>하위뇌</span>
      <span id="bs">0</span>
    </div>
    <div class="result-item">
      <span>중뇌</span>
      <span id="mb">0</span>
    </div>
    <div class="result-item">
      <span>상위뇌</span>
      <span id="ct">0</span>
    </div>
  </div>
  <div class="result-box">
    <p style="font-weight: 900; margin-bottom: 12px;">도메인</p>
    <div id="doms"></div>
  </div>
  <button class="result-btn" onclick="location.reload()">다시</button>
</div>

<script>
const domains=[
  {n:'반응속도',b:60,m:30,c:10},
  {n:'보상처리',b:20,m:60,c:20},
  {n:'동기부여',b:20,m:70,c:10},
  {n:'감정반응',b:50,m:35,c:15},
  {n:'판단력',b:5,m:15,c:80},
  {n:'실행력',b:10,m:70,c:20},
  {n:'조절력',b:10,m:80,c:10},
  {n:'공간감각',b:15,m:15,c:70},
  {n:'창의성',b:5,m:15,c:80},
  {n:'통찰력',b:5,m:20,c:75}
];

const imgs=['assets/img/bam-projection-1.jpg','assets/img/bam-projection-2.png','assets/img/bam-projection-3.png','assets/img/bam-projection-4.jpg','assets/img/bam-projection-5.png','assets/img/bam-projection-6.png','assets/img/bam-projection-7.png','assets/img/bam-projection-8.png','assets/img/bam-projection-9.png','assets/img/bam-projection-10.png','assets/img/bam-projection-11.png','assets/img/bam-projection-12.png','assets/img/bam-projection-13.jpg','assets/img/bam-projection-14.jpg','assets/img/bam-projection-15.jpg','assets/img/bam-projection-16.jpg','assets/img/bam-projection-17.png','assets/img/bam-projection-18.png','assets/img/bam-projection-19.jpg','assets/img/bam-projection-20.jpg'];

let q=0, a={};

function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('show'));
  document.getElementById(id).classList.add('show');
}

function start(){
  if(!document.getElementById('name').value) return alert('입력');
  q=0; a={}; show('test'); load();
}

function load(){
  document.getElementById('progress').textContent=(q+1)+'/20';
  document.getElementById('img').src=imgs[q];
  const o=document.getElementById('opts');
  o.innerHTML='';
  ['끌림','조금','거부','강거부'].forEach(t=>{
    const b=document.createElement('button');
    b.className='test-opt';
    if(a[q]?.t===t)b.classList.add('active');
    b.textContent=t;
    b.onclick=()=>{a[q]={t,s:t==='끌림'?100:t==='조금'?70:t==='거부'?40:0}; document.querySelectorAll('.test-opt').forEach(x=>x.classList.remove('active')); b.classList.add('active');};
    o.appendChild(b);
  });
  document.getElementById('prev').disabled=q===0;
  document.getElementById('next').textContent=q===19?'완료':'다음';
}

function prev(){
  if(q>0){q--; load();}
}

function next(){
  if(!a[q]) return alert('선택');
  if(q<19){q++; load();}else calc();
}

function calc(){
  let bS=0,mS=0,cS=0;
  const ds=domains.map((d,i)=>{
    let ss=[];
    for(let k in a) if(parseInt(k)%10===i) ss.push(a[k].s);
    const av=ss.length?Math.round(ss.reduce((x,y)=>x+y)/ss.length):0;
    bS+=av*d.b/100; mS+=av*d.m/100; cS+=av*d.c/100;
    return{n:d.n,s:av};
  });
  
  const bs=Math.round(bS/10), mb=Math.round(mS/10), ct=Math.round(cS/10), ba=Math.round(bs*0.6+mb*0.3+ct*0.1);
  
  document.getElementById('brain').textContent=ba;
  document.getElementById('bs').textContent=bs;
  document.getElementById('mb').textContent=mb;
  document.getElementById('ct').textContent=ct;
  
  let dh='';
  ds.forEach(d=>{dh+='<div class="result-item"><span>'+d.n+'</span><span>'+d.s+'</span></div><div class="result-bar"><div class="result-fill" style="width:'+d.s+'%"></div></div>';});
  document.getElementById('doms').innerHTML=dh;
  
  show('result');
}
</script>

</body>
</html>
