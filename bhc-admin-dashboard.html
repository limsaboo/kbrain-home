<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BHC 관리자 대시보드 - 통계 및 분석</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #f5f5f5; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif; color: #333; }
.container { max-width: 1400px; margin: 0 auto; padding: 20px; }
header { background: linear-gradient(135deg, #00BCD4 0%, #0097A7 100%); color: white; padding: 30px 20px; border-radius: 12px; margin-bottom: 30px; }
h1 { font-size: 32px; font-weight: 900; margin-bottom: 10px; }
.header-subtitle { font-size: 14px; opacity: 0.9; }

.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 30px; }
.stat-card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
.stat-value { font-size: 36px; font-weight: 900; color: #00BCD4; margin: 10px 0; }
.stat-label { font-size: 13px; font-weight: 600; color: #666; }

.chart-section { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 30px; }
.chart-title { font-size: 18px; font-weight: 800; color: #333; margin-bottom: 20px; }

.table-section { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); overflow-x: auto; }
.data-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.data-table th { background: #f5f5f5; padding: 12px; text-align: left; font-weight: 700; border-bottom: 2px solid #ddd; }
.data-table td { padding: 12px; border-bottom: 1px solid #eee; }
.data-table tr:hover { background: #f9f9f9; }

.filter-box { background: white; border-radius: 12px; padding: 20px; margin-bottom: 20px; display: flex; gap: 15px; flex-wrap: wrap; align-items: center; }
.filter-input, .filter-select { padding: 10px; border: 2px solid #ddd; border-radius: 8px; font-size: 13px; }
.btn { padding: 10px 20px; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px; }
.btn-primary { background: #00BCD4; color: white; }
.btn-primary:hover { background: #0097A7; }
.btn-secondary { background: #f5f5f5; color: #333; border: 1px solid #ddd; }

.loading { text-align: center; padding: 20px; }
.spinner { display: inline-block; width: 30px; height: 30px; border: 3px solid #f3f3f3; border-top: 3px solid #00BCD4; border-radius: 50%; animation: spin 1s linear infinite; }
@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="container">
  <header>
    <h1>📊 BHC 관리자 대시보드</h1>
    <div class="header-subtitle">뇌나이측정(BAM) 검사 통계 및 분석</div>
  </header>

  <!-- 통계 카드 -->
  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-label">총 검사 수</div>
      <div class="stat-value" id="totalTests">-</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">등록 사용자</div>
      <div class="stat-value" id="totalUsers">-</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">평균 뇌 나이</div>
      <div class="stat-value" id="avgBrainAge">-</div>
      <div class="stat-label">세</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">평균 총점</div>
      <div class="stat-value" id="avgScore">-</div>
      <div class="stat-label">점</div>
    </div>
  </div>

  <!-- 필터 -->
  <div class="filter-box">
    <input type="text" id="searchName" class="filter-input" placeholder="사용자명 검색" style="flex: 1;">
    <select id="domainFilter" class="filter-select">
      <option value="">모든 영역</option>
      <option value="기억">기억</option>
      <option value="집중">집중</option>
      <option value="감정">감정</option>
      <option value="판단">판단</option>
      <option value="실행">실행</option>
      <option value="조절">조절</option>
      <option value="공간">공간</option>
      <option value="속도">속도</option>
    </select>
    <button class="btn btn-primary" onclick="loadData()">🔄 새로고침</button>
    <button class="btn btn-secondary" onclick="exportData()">📥 다운로드</button>
  </div>

  <!-- 차트 1: 8가지 영역별 평균 점수 -->
  <div class="chart-section">
    <div class="chart-title">📈 8가지 인지 영역 평균 점수</div>
    <canvas id="domainChart" height="80"></canvas>
  </div>

  <!-- 차트 2: 뇌 나이 분포 -->
  <div class="chart-section">
    <div class="chart-title">🧠 뇌 나이 분포</div>
    <canvas id="brainAgeChart" height="80"></canvas>
  </div>

  <!-- 테이블: 검사 기록 -->
  <div class="table-section">
    <div class="chart-title">📋 최근 검사 기록</div>
    <div id="tableLoading" class="loading">
      <div class="spinner"></div>
      <p>데이터를 불러오는 중입니다...</p>
    </div>
    <table class="data-table" id="dataTable" style="display: none;">
      <thead>
        <tr>
          <th>사용자명</th>
          <th>생년</th>
          <th>성별</th>
          <th>지역</th>
          <th>뇌 나이</th>
          <th>총점</th>
          <th>기억</th>
          <th>집중</th>
          <th>감정</th>
          <th>판단</th>
          <th>실행</th>
          <th>조절</th>
          <th>공간</th>
          <th>속도</th>
          <th>검사일</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
</div>

<script>
// Supabase 초기화
const SUPABASE_URL = "https://grxqfaeznqqohnlltged.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdyeHFmYWV6bnFxb2hubGx0Z2VkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MDY4MjQ3MzUsImV4cCI6MjAyMjQwMDczNX0.7sLJ-8VKTvGu9d7rC0q5HN4bQ0K1H5ZmQsQ3B5X0Y5M";

const { createClient } = window.supabase;
const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

const DOMAINS = ["기억", "집중", "감정", "판단", "실행", "조절", "공간", "속도"];
let allData = [];
let domainChart = null;
let brainAgeChart = null;

async function loadData() {
  try {
    // 1. 모든 검사 데이터 로드
    const { data: tests, error: testsError } = await supabase.from("bam_tests").select("*");
    if (testsError) throw testsError;

    // 2. 모든 점수 데이터 로드
    const { data: scores, error: scoresError } = await supabase.from("bam_scores").select("*");
    if (scoresError) throw scoresError;

    // 3. 모든 사용자 데이터 로드
    const { data: users, error: usersError } = await supabase.from("bam_users").select("*");
    if (usersError) throw usersError;

    // 데이터 병합
    allData = tests.map(test => {
      const user = users.find(u => u.user_id === test.user_id);
      const testScores = scores.filter(s => s.test_id === test.test_id);
      const scoreMap = {};
      testScores.forEach(s => scoreMap[s.domain] = s.score);

      return {
        ...test,
        user: user || {},
        scores: scoreMap
      };
    });

    updateStatistics();
    updateCharts();
    updateTable();
  } catch (error) {
    alert("데이터 로드 실패: " + error.message);
    console.error(error);
  }
}

function updateStatistics() {
  const totalTests = allData.length;
  const totalUsers = new Set(allData.map(d => d.user_id)).size;
  const avgBrainAge = allData.length > 0 
    ? Math.round(allData.reduce((sum, d) => sum + d.brain_age, 0) / allData.length)
    : 0;
  const avgScore = allData.length > 0
    ? Math.round(allData.reduce((sum, d) => sum + d.total_score, 0) / allData.length)
    : 0;

  document.getElementById("totalTests").textContent = totalTests;
  document.getElementById("totalUsers").textContent = totalUsers;
  document.getElementById("avgBrainAge").textContent = avgBrainAge;
  document.getElementById("avgScore").textContent = avgScore;
}

function updateCharts() {
  // 영역별 평균 점수
  const domainAverages = {};
  DOMAINS.forEach(d => {
    const scores = allData.map(test => test.scores[d] || 0).filter(s => s > 0);
    domainAverages[d] = scores.length > 0 ? Math.round(scores.reduce((a, b) => a + b) / scores.length) : 0;
  });

  if (domainChart) domainChart.destroy();
  const domainCtx = document.getElementById("domainChart").getContext("2d");
  domainChart = new Chart(domainCtx, {
    type: "bar",
    data: {
      labels: DOMAINS,
      datasets: [{
        label: "평균 점수",
        data: DOMAINS.map(d => domainAverages[d]),
        backgroundColor: "#00BCD4",
        borderColor: "#0097A7",
        borderWidth: 2,
        borderRadius: 8
      }]
    },
    options: {
      responsive: true,
      plugins: { legend: { display: false } },
      scales: { y: { min: 0, max: 100 } }
    }
  });

  // 뇌 나이 분포
  const brainAgeDistribution = {
    "20~30세": 0, "31~40세": 0, "41~50세": 0, "51~60세": 0, "61~70세": 0, "71~80세": 0, "81세 이상": 0
  };

  allData.forEach(d => {
    const age = d.brain_age;
    if (age <= 30) brainAgeDistribution["20~30세"]++;
    else if (age <= 40) brainAgeDistribution["31~40세"]++;
    else if (age <= 50) brainAgeDistribution["41~50세"]++;
    else if (age <= 60) brainAgeDistribution["51~60세"]++;
    else if (age <= 70) brainAgeDistribution["61~70세"]++;
    else if (age <= 80) brainAgeDistribution["71~80세"]++;
    else brainAgeDistribution["81세 이상"]++;
  });

  if (brainAgeChart) brainAgeChart.destroy();
  const brainAgeCtx = document.getElementById("brainAgeChart").getContext("2d");
  brainAgeChart = new Chart(brainAgeCtx, {
    type: "pie",
    data: {
      labels: Object.keys(brainAgeDistribution),
      datasets: [{
        data: Object.values(brainAgeDistribution),
        backgroundColor: ["#00BCD4", "#4DD0E1", "#80DEEA", "#B2EBF2", "#B3E5FC", "#E0F2F1", "#E1F5FE"]
      }]
    },
    options: {
      responsive: true,
      plugins: { legend: { position: 'bottom' } }
    }
  });
}

function updateTable() {
  const searchName = document.getElementById("searchName").value.toLowerCase();
  const filtered = allData.filter(d => 
    d.user.name.toLowerCase().includes(searchName)
  );

  const tbody = document.getElementById("tableBody");
  tbody.innerHTML = filtered.map(d => `
    <tr>
      <td>${d.user.name || "-"}</td>
      <td>${d.user.birth_year || "-"}</td>
      <td>${d.user.gender === "M" ? "남성" : d.user.gender === "F" ? "여성" : "-"}</td>
      <td>${d.user.region || "-"}</td>
      <td><strong>${d.brain_age}세</strong></td>
      <td>${d.total_score}점</td>
      ${DOMAINS.map(dom => `<td>${d.scores[dom] || "-"}</td>`).join("")}
      <td>${new Date(d.test_date).toLocaleDateString('ko-KR')}</td>
    </tr>
  `).join("");

  document.getElementById("tableLoading").style.display = "none";
  document.getElementById("dataTable").style.display = "table";
}

function exportData() {
  const csv = [
    ["사용자명", "생년", "성별", "지역", "뇌 나이", "총점", ...DOMAINS, "검사일"].join(","),
    ...allData.map(d => [
      d.user.name || "-",
      d.user.birth_year || "-",
      d.user.gender === "M" ? "남성" : d.user.gender === "F" ? "여성" : "-",
      d.user.region || "-",
      d.brain_age,
      d.total_score,
      ...DOMAINS.map(dom => d.scores[dom] || "-"),
      new Date(d.test_date).toLocaleDateString('ko-KR')
    ].join(","))
  ].join("\n");

  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = `BHC_통계_${new Date().toISOString().split('T')[0]}.csv`;
  link.click();
}

// 초기 로드
loadData();
</script>

</body>
</html>
