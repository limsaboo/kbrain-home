* {

  padding: 0;
  box-sizing: border-box;
}

:root {
  --primary: #667EEA;
  --secondary: #764BA2;
  --success: #4CAF50;
  --warning: #FF9800;
  --danger: #F44336;
}

html, body {
  height: 100%;
  background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
  font-family: 'Segoe UI', 'Noto Sans KR', sans-serif;
  color: #333;
}

.app-container {
  width: 100%;
  max-width: 800px;
  margin: 0 auto;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  padding: 20px;
}

.header {
  background: white;
  border-radius: 15px;
  padding: 20px;
  margin-bottom: 20px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.2);
  text-align: center;
}

.header h1 {
  color: var(--primary);
  font-size: 28px;
  margin-bottom: 10px;
}

.milestones-info {
  display: flex;
  justify-content: space-around;
  gap: 10px;
  margin-top: 15px;
  flex-wrap: wrap;
}

.milestone-card {
  background: #f5f5f5;
  padding: 12px 16px;
  border-radius: 10px;
  text-align: center;
  flex: 1;
  min-width: 100px;
}

.milestone-card.active {
  background: rgba(76, 175, 80, 0.2);
  border: 2px solid #4CAF50;
}

.milestone-time {
  font-size: 18px;
  font-weight: 700;
  color: var(--primary);
}

.milestone-label {
  font-size: 12px;
  color: #666;
  margin-top: 5px;
}

.content {
  flex: 1;
  display: flex;
  flex-direction: column;
}

.screen {
  background: white;
  border-radius: 15px;
  padding: 20px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.2);
  display: none;
  flex: 1;
}

.screen.active {
  display: flex;
  flex-direction: column;
}

/* 도메인 선택 화면 */
.domains-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 15px;
  overflow-y: auto;
  flex: 1;
}

.domain-card {
  background: linear-gradient(135deg, #667EEA 0%, #764BA2 100%);
  color: white;
  padding: 20px;
  border-radius: 12px;
  text-align: center;
  cursor: pointer;
  transition: all 0.3s;
  box-shadow: 0 5px 15px rgba(0,0,0,0.1);
}

.domain-card:hover {
  transform: translateY(-5px);
  box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
}

.domain-icon {
  font-size: 40px;
  margin-bottom: 10px;
}

.domain-name {
  font-size: 16px;
  font-weight: 600;
  margin-bottom: 5px;
}

.domain-count {
  font-size: 12px;
  opacity: 0.9;
}

/* 훈련 선택 화면 */
.trainings-list {
  overflow-y: auto;
  flex: 1;
  margin-bottom: 15px;
}

.training-item {
  background: #f9f9f9;
  padding: 15px;
  border-radius: 10px;
  margin-bottom: 10px;
  cursor: pointer;
  border: 2px solid #e0e0e0;
  transition: all 0.3s;
}

.training-item:hover {
  border-color: var(--primary);
  background: #f0f4ff;
  transform: translateX(5px);
}

.training-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
}

.training-name {
  font-weight: 600;
  color: var(--primary);
}

.training-duration {
  background: var(--primary);
  color: white;
  padding: 4px 10px;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 600;
}

.training-description {
  font-size: 13px;
  color: #666;
  line-height: 1.5;
}

/* 훈련 화면 */
.training-screen {
  display: flex;
  flex-direction: column;
}

.training-info {
  background: #f5f5f5;
  padding: 15px;
  border-radius: 10px;
  margin-bottom: 15px;
  text-align: center;
}

.training-title {
  font-size: 20px;
  font-weight: 700;
  color: var(--primary);
  margin-bottom: 10px;
}

.training-timer {
  font-size: 14px;
  color: #666;
}

.training-content {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, #f5f5f5, #e0e0e0);
  border-radius: 10px;
  min-height: 200px;
  margin-bottom: 15px;
  text-align: center;
}

.training-canvas {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
}

.training-placeholder {
  font-size: 60px;
  color: #999;
  margin-bottom: 10px;
}

.training-instruction {
  font-size: 14px;
  color: #666;
  margin-top: 10px;
}

.control-buttons {
  display: flex;
  gap: 10px;
  margin-top: auto;
}

.btn {
  flex: 1;
  padding: 12px;
  border: none;
  border-radius: 10px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s;
}

.btn-primary {
  background: var(--primary);
  color: white;
}

.btn-primary:hover {
  background: var(--secondary);
  transform: translateY(-2px);
}

.btn-secondary {
  background: #f0f0f0;
  color: #333;
}

.btn-secondary:hover {
  background: #e0e0e0;
}

.btn-success {
  background: var(--success);
  color: white;
}

.btn-success:hover {
  background: #45a049;
}

  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.result-icon {
  font-size: 80px;
  margin-bottom: 20px;
  animation: bounce 0.6s;
}

@keyframes bounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-20px); }
}

.result-title {
  font-size: 24px;
  font-weight: 700;
  color: var(--primary);
  margin-bottom: 10px;
}

.result-message {
  font-size: 16px;
  color: #666;
  margin-bottom: 15px;
}

.milestones-progress {
  width: 100%;
  background: #e0e0e0;
  border-radius: 10px;
  height: 30px;
  overflow: hidden;
  margin-bottom: 15px;
}

.milestones-bar {

  align-items: center;
  justify-content: center;

  font-size: 12px;

  display: inline-block;

  border-radius: 20px;

  margin: 5px;
}

.tier-bronze {
  background: #CD7F32;
  color: white;
}

.tier-silver {
  background: #C0C0C0;
  color: #333;
}

.tier-gold {
  background: #FFD700;
  color: #333;
}

/* 반응형 */
@media (max-width: 600px) {
  .domains-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .header {
    padding: 15px;
  }

  .header h1 {
    font-size: 24px;
  }
}

      </div>

let currentDomain = null;
let currentTraining = null;
let trainingStartTime = null;

// ============================================
// 초기화
// ============================================

window.addEventListener('load', async () => {
  console.log('🧠 뇌훈련 프로그램 로드');
  
  try {
    const { createClient } = window.supabase;
    supabase = createClient(SUPABASE_URL, SUPABASE_KEY);
    
    const { data: { session } } = await supabase.auth.getSession();
    if (session) {
      currentUserId = session.user.id;
      loadUserProgress();
    }
  } catch (e) {
    console.error('❌ 초기화 실패:', e);
  }

  renderDomains();
});

// ============================================
// UI 렌더링
// ============================================

function renderDomains() {
  const grid = document.getElementById('domainsGrid');
  grid.innerHTML = '';

  TRAINING_PROGRAMS.forEach((program, idx) => {
    const card = document.createElement('div');
    card.className = 'domain-card';
    card.onclick = () => selectDomain(idx);
    card.innerHTML = `
      <div class="domain-icon">${program.icon}</div>
      <div class="domain-name">${program.domain}</div>
      <div class="domain-count">${program.trainings.length}개 훈련</div>
    `;
    grid.appendChild(card);
  });

  showScreen('domainsScreen');
}

function selectDomain(idx) {
  currentDomain = idx;
  renderTrainings();
  showScreen('trainingsScreen');
}

function renderTrainings() {
  const program = TRAINING_PROGRAMS[currentDomain];
  const list = document.getElementById('trainingsList');
  list.innerHTML = `<div style="font-size: 18px; font-weight: 700; color: var(--primary); margin-bottom: 15px;">${program.domain} (${program.icon})</div>`;

  program.trainings.forEach((training, idx) => {
    const item = document.createElement('div');
    item.className = 'training-item';
    item.onclick = () => startTraining(idx);
    item.innerHTML = `
      <div class="training-header">
        <span class="training-name">${training.name}</span>
        <span class="training-duration">${training.duration}분</span>
      </div>
      <div class="training-description">${training.description}</div>
    `;
    list.appendChild(item);
  });
}

function startTraining(idx) {
  currentTraining = TRAINING_PROGRAMS[currentDomain].trainings[idx];
  trainingStartTime = Date.now();

  document.getElementById('trainingTitle').textContent = currentTraining.name;
  document.getElementById('trainingInstruction').textContent = currentTraining.description;
  
  // 타이머 시작
  let seconds = currentTraining.duration * 60;
  updateTimer(seconds);
  
  const timerInterval = setInterval(() => {
    seconds--;
    updateTimer(seconds);
    
    if (seconds <= 0) {
      clearInterval(timerInterval);
      completeTraining();
    }
  }, 1000);

  document.getElementById('completeBtn').dataset.timerInterval = timerInterval;
  showScreen('trainingScreen');
}

function updateTimer(seconds) {
  const mins = Math.floor(seconds / 60);
  const secs = seconds % 60;
  document.getElementById('trainingTimer').textContent = 
    `⏱️ ${mins}:${secs.toString().padStart(2, '0')}`;
}

// ============================================
// 훈련 완료
// ============================================

function completeTraining() {
  const timerInterval = document.getElementById('completeBtn').dataset.timerInterval;
  if (timerInterval) clearInterval(timerInterval);

  const duration = currentTraining.duration;
  totalMinutes += duration;

  // Supabase에 저장
  if (currentUserId) {
    saveTrainingLog(duration);
  }

  // 결과 화면 표시
  document.getElementById('resultMessage').textContent = 
    `${currentTraining.name} 완료!\n${duration}분이 누적되었습니다.`;

  updateProgressBar();
  updateTierInfo();
  showScreen('resultScreen');
}

async function saveTrainingLog(duration) {
  try {
    // bhc_training_log에 저장
    await supabase
      .from('bhc_training_log')
      .insert({
        member_id: currentUserId,
        training_domain: TRAINING_PROGRAMS[currentDomain].domain,
        training_name: currentTraining.name,
        training_id: currentTraining.id,
        duration_minutes: duration,
        score: 100
      });

    // bhc_milestones 업데이트
    const { data: milestone } = await supabase
      .from('bhc_milestones')
      .select('total_minutes')
      .eq('member_id', currentUserId)
      .single();

    if (milestone) {
      const newTotal = (milestone.total_minutes || 0) + duration;
      const tier = newTotal >= 300 ? 'Gold' : newTotal >= 200 ? 'Silver' : 'Bronze';

      await supabase
        .from('bhc_milestones')
        .update({
          total_minutes: newTotal,
          current_tier: tier
        })
        .eq('member_id', currentUserId);

      console.log('✅ 마일리지 저장:', newTotal, '분');

      // 각 마일스톤 달성 시 알림
      if (newTotal === 100 || newTotal === 200 || newTotal === 300) {
        showMilestoneNotification(newTotal);
      }
    }
  } catch (error) {
    console.error('❌ 저장 실패:', error);
  }
}

function updateProgressBar() {
  const bar = document.getElementById('progressBar');
  const text = document.getElementById('progressText');
  
  const nextMilestone = totalMinutes >= 300 ? 300 : totalMinutes >= 200 ? 200 : 100;
  const prevMilestone = nextMilestone === 300 ? 200 : nextMilestone === 200 ? 100 : 0;
  
  const progress = ((totalMinutes - prevMilestone) / (nextMilestone - prevMilestone)) * 100;
  bar.style.width = Math.min(progress, 100) + '%';
  text.textContent = totalMinutes + '/' + nextMilestone + '분';
}

function updateTierInfo() {
  const info = document.getElementById('tierInfo');
  let html = '';

  if (totalMinutes >= 300) {
    html += '<span class="tier-badge tier-gold">🥇 Gold 등급 달성!</span>';
  } else if (totalMinutes >= 200) {
    html += '<span class="tier-badge tier-silver">🥈 Silver 등급</span>';
  } else if (totalMinutes >= 100) {
    html += '<span class="tier-badge tier-bronze">🥉 Bronze 등급</span>';
  }

  info.innerHTML = html;
}

function showMilestoneNotification(minutes) {
  const tierName = minutes === 300 ? '🥇 Gold' : minutes === 200 ? '🥈 Silver' : '🥉 Bronze';
  alert(`축하합니다! ${tierName} 등급에 도달했습니다!\n\n이벤트 초대권이 발급되었습니다.`);
}

// ============================================
// 네비게이션
// ============================================

function cancelTraining() {
  const timerInterval = document.getElementById('completeBtn').dataset.timerInterval;
  if (timerInterval) clearInterval(timerInterval);
  backToDomains();
}

function backToDomains() {
  renderDomains();
}

function showScreen(screenId) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(screenId).classList.add('active');
}

function goHome() {
  window.location.href = '/';
}

function showTierInfo(minutes) {
  alert(`🎯 ${minutes}분 달성 시 혜택\n\n✨ 한국뇌심리연구소 이벤트/세미나 무료 초대\n✨ YouTube 인터뷰 기회\n✨ VIP 회원 혜택`);
}

// ============================================
// 사용자 진행 로드
// ============================================

async function loadUserProgress() {
  try {
    const { data } = await supabase
      .from('bhc_milestones')
      .select('total_minutes, current_tier')
      .eq('member_id', currentUserId)
      .single();

    if (data) {
      totalMinutes = data.total_minutes || 0;
      document.getElementById('totalMinutes').textContent = totalMinutes + '분';
      
      // 마일스톤 상태 업데이트
      if (totalMinutes >= 100) {
        document.getElementById('tier100').classList.add('active');
      }
      if (totalMinutes >= 200) {
        document.getElementById('tier200').classList.add('active');
      }
      if (totalMinutes >= 300) {
        document.getElementById('tier300').classList.add('active');
      }
    }
  } catch (e) {
    console.warn('진행 상황 로드 실패:', e);
  }
}

console.log('✅ 뇌훈련 프로그램 로드 완료');
</script>
