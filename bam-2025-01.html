<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate, max-age=0">
<meta http-equiv="pragma" content="no-cache">
<meta http-equiv="expires" content="-1">
<title>BAM</title>
<style>
body { margin: 0; padding: 0; font-family: 'Noto Sans KR'; background: white; }
.page { display: none; width: 100%; min-height: 100vh; }
.page.active { display: flex; }

.intro { flex-direction: column; justify-content: center; align-items: center; padding: 20px; text-align: center; }
.intro h1 { font-size: 48px; margin: 20px 0; }
.intro h2 { font-size: 28px; color: #1a472a; font-weight: 900; margin: 20px 0; }
.intro input, .intro select { width: 280px; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; }
.intro button { width: 280px; padding: 14px; margin-top: 20px; background: #00BCD4; color: white; border: none; border-radius: 6px; font-weight: bold; font-size: 16px; cursor: pointer; }

.test { flex-direction: column; }
.test-header { background: #1a472a; color: white; padding: 20px; text-align: center; border-bottom: 4px solid #00BCD4; }
.test-header h2 { font-size: 24px; font-weight: 900; margin: 0; }
.test-content { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 20px; overflow-y: auto; }
.test-img { width: 280px; height: 280px; border: 3px solid #00BCD4; border-radius: 8px; margin-bottom: 15px; display: flex; align-items: center; justify-content: center; background: #f5f5f5; }
.test-img img { width: 100%; height: 100%; object-fit: contain; }
.test-q { width: 280px; text-align: center; font-size: 16px; font-weight: 900; color: #1a472a; margin-bottom: 15px; }
.test-opts { width: 280px; display: flex; flex-direction: column; gap: 8px; margin-bottom: 15px; }
.opt { padding: 12px; border: 2px solid #999; background: white; border-radius: 6px; font-weight: 700; font-size: 13px; text-align: center; cursor: pointer; }
.opt.active { background: #00BCD4; border-color: #00BCD4; color: white; }
.test-btns { width: 280px; display: flex; gap: 10px; margin-bottom: 20px; }
.test-btns button { flex: 1; padding: 12px; border: 1px solid #ccc; background: white; border-radius: 6px; font-weight: bold; cursor: pointer; }
.test-btns button:disabled { opacity: 0.3; cursor: not-allowed; }

.result { flex-direction: column; padding: 20px; background: #f5f5f5; }
.result-title { background: #1a472a; color: white; padding: 20px; text-align: center; border-radius: 6px; font-size: 20px; font-weight: 900; margin-bottom: 15px; }
.result-box { background: white; padding: 15px; border-radius: 6px; margin-bottom: 10px; }
.result-label { font-size: 11px; color: #666; margin-bottom: 3px; }
.result-num { font-size: 36px; font-weight: 900; color: #1a472a; }
.result-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #eee; }
.result-item:last-child { border: none; }
.result-btn { width: 280px; margin: 15px auto; padding: 12px; background: #00BCD4; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
</style>
</head>
<body>

<div class="page intro active">
  <h1>🧠</h1>
  <h2>뇌나이 진단</h2>
  <input type="text" id="name" placeholder="이름">
  <select id="gender">
    <option value="">성별</option>
    <option value="M">남</option>
    <option value="F">여</option>
  </select>
  <input type="date" id="birth">
  <button onclick="startTest()">시작</button>
</div>

<div class="page test">
  <div class="test-header">
    <h2 id="progress">1/20</h2>
  </div>
  <div class="test-content">
    <div class="test-img"><img id="qimg" src=""></div>
    <div class="test-q">?</div>
    <div class="test-opts" id="opts"></div>
    <div class="test-btns">
      <button id="prevBtn" onclick="prevQ()" disabled>이전</button>
      <button id="nextBtn" onclick="nextQ()">다음</button>
    </div>
  </div>
</div>

<div class="page result">
  <div class="result-title">진단 완료</div>
  <div class="result-box">
    <div class="result-label">뇌나이</div>
    <div class="result-num" id="brainAge">0</div>
  </div>
  <div class="result-box">
    <div class="result-label">뇌 영역</div>
    <div class="result-item"><span>하위뇌</span><span id="bs">0</span></div>
    <div class="result-item"><span>중뇌</span><span id="mb">0</span></div>
    <div class="result-item"><span>상위뇌</span><span id="ct">0</span></div>
  </div>
  <div class="result-box">
    <div class="result-label">도메인</div>
    <div id="domains"></div>
  </div>
  <button class="result-btn" onclick="location.reload()">다시 시작</button>
</div>

<script>
const domains = [
  {name:'반응속도',b:60,m:30,c:10},
  {name:'보상처리',b:20,m:60,c:20},
  {name:'동기부여',b:20,m:70,c:10},
  {name:'감정반응',b:50,m:35,c:15},
  {name:'판단력',b:5,m:15,c:80},
  {name:'실행력',b:10,m:70,c:20},
  {name:'조절력',b:10,m:80,c:10},
  {name:'공간감각',b:15,m:15,c:70},
  {name:'창의성',b:5,m:15,c:80},
  {name:'통찰력',b:5,m:20,c:75}
];

const images = [
  'assets/img/bam-projection-1.jpg','assets/img/bam-projection-2.png','assets/img/bam-projection-3.png','assets/img/bam-projection-4.jpg','assets/img/bam-projection-5.png','assets/img/bam-projection-6.png','assets/img/bam-projection-7.png','assets/img/bam-projection-8.png','assets/img/bam-projection-9.png','assets/img/bam-projection-10.png','assets/img/bam-projection-11.png','assets/img/bam-projection-12.png','assets/img/bam-projection-13.jpg','assets/img/bam-projection-14.jpg','assets/img/bam-projection-15.jpg','assets/img/bam-projection-16.jpg','assets/img/bam-projection-17.png','assets/img/bam-projection-18.png','assets/img/bam-projection-19.jpg','assets/img/bam-projection-20.jpg'
];

const options = ['금정적', '보통', '거부', '무관심'];
const scores = [100, 50, 25, 0];

let currentQ = 0;
let answers = {};

function startTest() {
  if (!document.getElementById('name').value) return;
  showPage('test');
  loadQ();
}

function showPage(name) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelector(`.${name}`).classList.add('active');
}

function loadQ() {
  document.getElementById('progress').textContent = (currentQ + 1) + '/20';
  document.getElementById('qimg').src = images[currentQ];
  
  const opts = document.getElementById('opts');
  opts.innerHTML = '';
  
  options.forEach((opt, idx) => {
    const btn = document.createElement('div');
    btn.className = 'opt';
    btn.textContent = opt;
    if (answers[currentQ]?.option === opt) btn.classList.add('active');
    btn.onclick = () => {
      answers[currentQ] = {option: opt, score: scores[idx]};
      document.querySelectorAll('.opt').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    };
    opts.appendChild(btn);
  });
  
  document.getElementById('prevBtn').disabled = (currentQ === 0);
  document.getElementById('nextBtn').textContent = (currentQ === 19) ? '완료' : '다음';
}

function prevQ() {
  if (currentQ > 0) {
    currentQ--;
    loadQ();
  }
}

function nextQ() {
  if (!answers[currentQ]) return;
  if (currentQ < 19) {
    currentQ++;
    loadQ();
  } else {
    calcResult();
  }
}

function calcResult() {
  let bs = 0, mb = 0, ct = 0;
  
  const domainScores = domains.map((d, idx) => {
    let scores = [];
    for (let i in answers) {
      if (parseInt(i) % 10 === idx) {
        scores.push(answers[i].score);
      }
    }
    const avg = scores.length > 0 ? Math.round(scores.reduce((a,b) => a+b) / scores.length) : 0;
    bs += avg * d.b / 100;
    mb += avg * d.m / 100;
    ct += avg * d.c / 100;
    return {name: d.name, score: avg};
  });
  
  bs = Math.round(bs / 10);
  mb = Math.round(mb / 10);
  ct = Math.round(ct / 10);
  const brainAge = Math.round(bs * 0.6 + mb * 0.3 + ct * 0.1);
  
  document.getElementById('brainAge').textContent = brainAge;
  document.getElementById('bs').textContent = bs;
  document.getElementById('mb').textContent = mb;
  document.getElementById('ct').textContent = ct;
  
  let html = '';
  domainScores.forEach(d => {
    html += '<div class="result-item"><span>' + d.name + '</span><span>' + d.score + '</span></div>';
  });
  document.getElementById('domains').innerHTML = html;
  
  showPage('result');
}
</script>

</body>
</html>
