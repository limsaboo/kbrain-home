<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>방문자 통계 대시보드 | 한국뇌심리연구소</title>
<meta name="robots" content="noindex,nofollow">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#f3faf8;--bg2:#e8f5f0;--bg3:#dcefe6;--ink:#14162c;--body:#2b2e40;
    --line:#dceae4;--teal:#14b8ad;--orange:#f5a524;--purple:#7c5cff;--gold:#c9a84c;--navy:#161a3d;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;}

  #gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  .gate-box{background:#fff;border-radius:18px;padding:40px 32px;max-width:360px;width:100%;box-shadow:0 20px 50px -30px rgba(20,22,44,.3);text-align:center;}
  .gate-box h1{font-size:19px;font-weight:900;color:var(--navy);margin-bottom:8px;}
  .gate-box p{font-size:13px;color:var(--body);margin-bottom:20px;}
  .gate-box input{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:10px;font-size:15px;margin-bottom:12px;text-align:center;letter-spacing:2px;}
  .gate-box button{width:100%;padding:13px;background:var(--navy);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:800;cursor:pointer;}
  .gate-err{color:#e5484d;font-size:12.5px;margin-top:10px;min-height:16px;font-weight:700;}

  #dash{display:none;max-width:1100px;margin:0 auto;padding:28px 18px 60px;}
  .dash-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:22px;}
  .dash-head h1{font-size:22px;font-weight:900;color:var(--navy);}
  .dash-head .links a{font-size:12.5px;font-weight:700;color:var(--navy);margin-right:14px;}
  .refresh-btn{background:var(--teal);color:#fff;border:none;padding:10px 18px;border-radius:9px;font-size:13.5px;font-weight:800;cursor:pointer;}

  .summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:28px;}
  .sum-card{background:var(--navy);color:#fff;border-radius:16px;padding:22px;}
  .sum-card .num{font-size:32px;font-weight:900;}
  .sum-card .lbl{font-size:13px;font-weight:700;color:var(--gold);margin-top:4px;}

  .panel{background:#fff;border-radius:16px;padding:22px;margin-bottom:20px;box-shadow:0 8px 20px -18px rgba(20,22,44,.25);}
  .panel h2{font-size:15.5px;font-weight:900;color:var(--navy);margin-bottom:16px;}
  .bar-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:12.5px;}
  .bar-label{width:90px;flex-shrink:0;font-weight:700;color:var(--ink);white-space:nowrap;}
  .bar-track{flex:1;background:var(--bg2);border-radius:6px;height:20px;overflow:hidden;}
  .bar-fill{height:100%;background:var(--teal);border-radius:6px;}
  .bar-count{width:44px;text-align:right;font-weight:800;color:var(--navy);}

  table{width:100%;border-collapse:collapse;}
  thead th{background:var(--navy);color:#fff;font-size:12px;font-weight:800;padding:10px;text-align:left;}
  tbody td{padding:9px 10px;font-size:13px;border-top:1px solid var(--line);}
  tbody tr:nth-child(even){background:var(--bg);}
  .empty-msg{text-align:center;padding:30px;color:var(--body);font-size:13px;}
</style>
</head>
<body>

<div id="gate">
  <div class="gate-box">
    <h1>🔒 방문자 통계 대시보드</h1>
    <p>관리자 비밀번호를 입력하세요.</p>
    <input type="password" id="pw" placeholder="비밀번호" onkeydown="if(event.key==='Enter'){checkPw();}">
    <button onclick="checkPw()">입장</button>
    <div class="gate-err" id="gateErr"></div>
  </div>
</div>

<div id="dash">
  <div class="dash-head">
    <div>
      <h1>📊 방문자 통계</h1>
      <div class="links" style="margin-top:6px;">
        <a href="admin-coupons.html">쿠폰 관리</a>
        <a href="admin-members.html">회원 관리</a>
      </div>
    </div>
    <button class="refresh-btn" onclick="loadAll()">새로고침</button>
  </div>

  <div class="summary-grid" id="summaryGrid"></div>

  <div class="panel">
    <h2>최근 14일 방문 추이</h2>
    <div id="dailyChart"></div>
  </div>

  <div class="panel">
    <h2>페이지별 방문수 (전체 기간)</h2>
    <div id="pageChart"></div>
  </div>

  <div class="panel">
    <h2>최근 방문 기록 (최신 50건)</h2>
    <div style="overflow-x:auto;">
      <table>
        <thead><tr><th>시각</th><th>페이지</th><th>유입경로</th></tr></thead>
        <tbody id="recentBody"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
const ADMIN_PASS = "brain2025!";
const SB_URL = "https://grxqfaeznqqohnlltged.supabase.co";
const SB_KEY = "sb_publishable_Sgv6BVPo1dOnVICcX1tfzA_gf7T5Z4I";
let sb = null;
let allVisits = [];

const PAGE_LABELS = {
  index: '홈페이지',
  'brain-picture-test-intro': '그림검사 소개',
  signup: '회원가입 페이지 조회수'
};

function checkPw(){
  const pw = document.getElementById('pw').value;
  if(pw === ADMIN_PASS){
    document.getElementById('gate').style.display = 'none';
    document.getElementById('dash').style.display = 'block';
    sb = window.supabase.createClient(SB_URL, SB_KEY);
    loadAll();
  } else {
    document.getElementById('gateErr').textContent = '비밀번호가 올바르지 않습니다.';
  }
}

async function loadAll(){
  try{
    const { data, error } = await sb.from('page_visits').select('*').order('visited_at', {ascending:false}).limit(5000);
    if(error) throw error;
    allVisits = data || [];
    renderSummary();
    renderDaily();
    renderPages();
    renderRecent();
  }catch(e){
    document.getElementById('summaryGrid').innerHTML = `<div class="empty-msg">데이터를 불러오지 못했습니다: ${e.message||e}</div>`;
  }
}

function startOfDay(d){ const x = new Date(d); x.setHours(0,0,0,0); return x; }

function renderSummary(){
  const now = new Date();
  const today = startOfDay(now);
  const weekAgo = new Date(today); weekAgo.setDate(weekAgo.getDate()-6);
  const monthAgo = new Date(today); monthAgo.setDate(monthAgo.getDate()-29);

  const todayCount = allVisits.filter(v => new Date(v.visited_at) >= today).length;
  const weekCount = allVisits.filter(v => new Date(v.visited_at) >= weekAgo).length;
  const monthCount = allVisits.filter(v => new Date(v.visited_at) >= monthAgo).length;
  const totalCount = allVisits.length;

  document.getElementById('summaryGrid').innerHTML = `
    <div class="sum-card"><div class="num">${todayCount}</div><div class="lbl">오늘 방문</div></div>
    <div class="sum-card"><div class="num">${weekCount}</div><div class="lbl">최근 7일</div></div>
    <div class="sum-card"><div class="num">${monthCount}</div><div class="lbl">최근 30일</div></div>
    <div class="sum-card"><div class="num">${totalCount}</div><div class="lbl">전체 누적</div></div>
  `;
}

function renderDaily(){
  const days = [];
  const today = startOfDay(new Date());
  for(let i=13;i>=0;i--){
    const d = new Date(today); d.setDate(d.getDate()-i);
    days.push(d);
  }
  const counts = days.map(d=>{
    const next = new Date(d); next.setDate(next.getDate()+1);
    return allVisits.filter(v=>{
      const t = new Date(v.visited_at);
      return t >= d && t < next;
    }).length;
  });
  const max = Math.max(...counts, 1);
  const html = days.map((d,i)=>{
    const label = `${d.getMonth()+1}/${d.getDate()}`;
    const pct = Math.round((counts[i]/max)*100);
    return `<div class="bar-row"><span class="bar-label">${label}</span><div class="bar-track"><div class="bar-fill" style="width:${pct}%;"></div></div><span class="bar-count">${counts[i]}</span></div>`;
  }).join('');
  document.getElementById('dailyChart').innerHTML = html;
}

function renderPages(){
  const counts = {};
  allVisits.forEach(v=>{ counts[v.page] = (counts[v.page]||0) + 1; });
  const entries = Object.entries(counts).sort((a,b)=>b[1]-a[1]);
  const max = Math.max(...entries.map(e=>e[1]), 1);
  if(!entries.length){ document.getElementById('pageChart').innerHTML = '<div class="empty-msg">데이터가 없습니다.</div>'; return; }
  const html = entries.map(([page,count])=>{
    const label = PAGE_LABELS[page] || page;
    const pct = Math.round((count/max)*100);
    return `<div class="bar-row"><span class="bar-label">${label}</span><div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:var(--purple);"></div></div><span class="bar-count">${count}</span></div>`;
  }).join('');
  document.getElementById('pageChart').innerHTML = html;
}

function renderRecent(){
  const rows = allVisits.slice(0,50);
  if(!rows.length){ document.getElementById('recentBody').innerHTML = '<tr><td colspan="3" class="empty-msg">방문 기록이 없습니다.</td></tr>'; return; }
  document.getElementById('recentBody').innerHTML = rows.map(v=>{
    const t = new Date(v.visited_at).toLocaleString('ko-KR');
    const page = PAGE_LABELS[v.page] || v.page;
    const ref = v.referrer ? v.referrer.slice(0,40) : '직접 방문';
    return `<tr><td>${t}</td><td>${page}</td><td>${ref}</td></tr>`;
  }).join('');
}
</script>
</body>
</html>
