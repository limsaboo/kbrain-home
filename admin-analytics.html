<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>관리자 대시보드 — 한국뇌심리연구소</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --primary: #2c3e50;
  --secondary: #34495e;
  --accent: #3498db;
  --success: #27ae60;
  --warning: #e67e22;
  --danger: #e74c3c;
  --light: #ecf0f1;
  --bg: #f8f9fa;
  --white: #ffffff;
}

html, body {
  background: var(--bg);
  color: var(--primary);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto", "Pretendard", sans-serif;
  line-height: 1.6;
}

.container { max-width: 1600px; margin: 0 auto; padding: 20px; }

.topbar {
  background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
  color: var(--white);
  padding: 24px;
  border-radius: 14px;
  margin-bottom: 30px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  box-shadow: 0 4px 16px rgba(0,0,0,.12);
}
.topbar h1 { font-size: 26px; font-weight: 900; }
.topbar .controls {
  display: flex;
  gap: 12px;
  align-items: center;
}
.logout-btn, .download-btn {
  background: var(--danger);
  color: var(--white);
  border: none;
  padding: 10px 18px;
  border-radius: 8px;
  cursor: pointer;
  font-weight: 600;
  font-size: 13px;
}
.download-btn { background: var(--accent); }
.logout-btn:hover { background: #c0392b; }
.download-btn:hover { background: #2980b9; }

.login-screen {
  max-width: 420px;
  margin: 100px auto;
  background: var(--white);
  padding: 48px;
  border-radius: 16px;
  box-shadow: 0 8px 32px rgba(0,0,0,.12);
  text-align: center;
}
.login-screen h1 { font-size: 28px; margin-bottom: 8px; color: var(--primary); font-weight: 900; }
.login-screen .subtitle { color: var(--secondary); margin-bottom: 32px; font-size: 14px; }
.login-screen .field { margin-bottom: 16px; text-align: left; }
.login-screen label {
  display: block;
  font-weight: 700;
  margin-bottom: 8px;
  color: var(--secondary);
  font-size: 13px;
}
.login-screen input {
  width: 100%;
  padding: 14px;
  border: 2px solid var(--light);
  border-radius: 10px;
  font-size: 14px;
  font-family: inherit;
}
.login-screen input:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 4px rgba(52, 152, 219, .1);
}
.login-btn {
  width: 100%;
  padding: 14px;
  background: linear-gradient(135deg, var(--accent) 0%, #2980b9 100%);
  color: var(--white);
  border: none;
  border-radius: 10px;
  font-weight: 700;
  font-size: 15px;
  cursor: pointer;
  margin-top: 24px;
  transition: .2s;
}
.login-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 16px rgba(52, 152, 219, .3); }
.login-error { color: var(--danger); font-size: 13px; margin-top: 12px; }

.dashboard { display: none; }

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 20px;
  margin-bottom: 30px;
}
.stat-card {
  background: var(--white);
  padding: 24px;
  border-radius: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,.08);
  border-top: 4px solid var(--accent);
}
.stat-card.orange { border-top-color: var(--warning); }
.stat-card.green { border-top-color: var(--success); }
.stat-card.red { border-top-color: var(--danger); }

.stat-label {
  font-size: 12px;
  color: var(--secondary);
  font-weight: 600;
  margin-bottom: 10px;
  text-transform: uppercase;
  letter-spacing: .5px;
}
.stat-number {
  font-size: 32px;
  font-weight: 900;
  color: var(--primary);
  margin-bottom: 8px;
}
.stat-change {
  font-size: 12px;
  color: var(--success);
}

.section {
  background: var(--white);
  padding: 28px;
  border-radius: 12px;
  margin-bottom: 30px;
  box-shadow: 0 2px 8px rgba(0,0,0,.08);
}
.section h2 {
  font-size: 18px;
  font-weight: 900;
  margin-bottom: 24px;
  color: var(--primary);
  border-bottom: 2px solid var(--light);
  padding-bottom: 14px;
}

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 14px;
}
th {
  background: var(--bg);
  padding: 14px;
  text-align: left;
  font-weight: 700;
  color: var(--secondary);
  border-bottom: 2px solid var(--light);
}
td {
  padding: 14px;
  border-bottom: 1px solid var(--light);
}
tr:hover { background: var(--bg); }

.badge {
  display: inline-block;
  padding: 4px 12px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 700;
}
.badge.active { background: #d5f4e6; color: var(--success); }
.badge.inactive { background: #fadbd8; color: var(--danger); }

.search-box { margin-bottom: 20px; }
.search-box input {
  width: 100%;
  max-width: 320px;
  padding: 11px 14px;
  border: 2px solid var(--light);
  border-radius: 8px;
  font-size: 14px;
}
.search-box input:focus {
  outline: none;
  border-color: var(--accent);
}

.chart-container {
  background: var(--white);
  padding: 24px;
  border-radius: 12px;
  margin-bottom: 30px;
  box-shadow: 0 2px 8px rgba(0,0,0,.08);
  min-height: 320px;
}

.loading { text-align: center; color: var(--secondary); padding: 20px; }

@media(max-width: 768px) {
  .topbar { flex-direction: column; gap: 15px; text-align: center; }
  .stats-grid { grid-template-columns: 1fr; }
  .topbar .controls { flex-direction: column; width: 100%; }
  .logout-btn, .download-btn { width: 100%; }
  table { font-size: 12px; }
  th, td { padding: 10px; }
}
</style>
</head>
<body>

<div id="loginScreen" class="login-screen">
  <h1>🔒 관리자 대시보드</h1>
  <p class="subtitle">한국뇌심리연구소</p>
  <div class="field">
    <label for="password">관리자 비밀번호</label>
    <input type="password" id="password" placeholder="비밀번호 입력" onkeypress="if(event.key==='Enter') login()">
  </div>
  <button class="login-btn" onclick="login()">로그인</button>
  <div id="loginError" class="login-error"></div>
</div>

<div id="dashboardScreen" class="dashboard">
  <div class="container">
    <div class="topbar">
      <h1>📊 관리자 대시보드</h1>
      <div class="controls">
        <button class="download-btn" onclick="downloadCSV()">📥 CSV 다운로드</button>
        <button class="logout-btn" onclick="logout()">로그아웃</button>
      </div>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">총 방문자</div>
        <div class="stat-number" id="totalVisitors">로딩중...</div>
        <div class="stat-change">누적 방문자 수</div>
      </div>
      <div class="stat-card green">
        <div class="stat-label">오늘 방문</div>
        <div class="stat-number" id="todayVisitors">0</div>
        <div class="stat-change">오늘의 방문자</div>
      </div>
      <div class="stat-card orange">
        <div class="stat-label">평균 체류시간</div>
        <div class="stat-number" id="avgTime">4분</div>
        <div class="stat-change">평균값</div>
      </div>
      <div class="stat-card red">
        <div class="stat-label">인기 시스템</div>
        <div class="stat-number" id="topSystem">BMS</div>
        <div class="stat-change">가장 많은 접속</div>
      </div>
    </div>

    <div class="section">
      <h2>📈 일일 방문자 추이 (최근 30일)</h2>
      <div class="chart-container">
        <canvas id="visitChart"></canvas>
      </div>
    </div>

    <div class="section">
      <h2>🖥️ 시스템별 접속 현황</h2>
      <table>
        <thead>
          <tr>
            <th>시스템명</th>
            <th>접속 횟수</th>
            <th>비율</th>
            <th>상태</th>
          </tr>
        </thead>
        <tbody id="systemBody">
        </tbody>
      </table>
    </div>

    <div class="section">
      <h2>📋 방문 기록 (최근 50개)</h2>
      <div class="search-box">
        <input type="text" id="visitSearch" placeholder="방문 기록 검색..." onkeyup="filterVisits()">
      </div>
      <table>
        <thead>
          <tr>
            <th>시간</th>
            <th>페이지</th>
            <th>참조 페이지</th>
          </tr>
        </thead>
        <tbody id="visitBody">
        </tbody>
      </table>
    </div>
  </div>
</div>

<script>
const ADMIN_PASSWORD = 'brain2025!';
const SUPABASE_URL = 'https://grxqfaeznqqohnlltged.supabase.co';
const SUPABASE_KEY = 'sb_publishable_Sgv6BVPo1dOnVICcX1tfzA_gf7T5Z4I';

let supabase;
let allVisits = [];
let visitChart;

function initSupabase() {
  supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
}

function login() {
  const pwd = document.getElementById('password').value;
  if (pwd === ADMIN_PASSWORD) {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('dashboardScreen').style.display = 'block';
    initSupabase();
    loadDashboard();
  } else {
    document.getElementById('loginError').textContent = '❌ 비밀번호가 올바르지 않습니다';
  }
}

function logout() {
  document.getElementById('dashboardScreen').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'block';
  document.getElementById('password').value = '';
  document.getElementById('loginError').textContent = '';
  if (visitChart) visitChart.destroy();
}

async function loadDashboard() {
  try {
    // 전체 방문 기록 조회
    const { data, error } = await supabase
      .from('page_visits')
      .select('*')
      .order('created_at', { ascending: false })
      .limit(1000);

    if (error) throw error;
    allVisits = data || [];

    // 통계 계산
    const totalVisits = allVisits.length;
    const todayVisits = allVisits.filter(v => {
      const visitDate = new Date(v.created_at).toDateString();
      const today = new Date().toDateString();
      return visitDate === today;
    }).length;

    const systemCounts = {};
    allVisits.forEach(v => {
      systemCounts[v.page] = (systemCounts[v.page] || 0) + 1;
    });
    const topSys = Object.keys(systemCounts).reduce((a, b) => 
      systemCounts[a] > systemCounts[b] ? a : b, 'index') || 'index';

    // UI 업데이트
    document.getElementById('totalVisitors').textContent = totalVisits.toLocaleString();
    document.getElementById('todayVisitors').textContent = todayVisits;
    document.getElementById('topSystem').textContent = topSys === 'index' ? 'BMS' : topSys.toUpperCase();

    // 시스템별 테이블
    const sysBody = document.getElementById('systemBody');
    sysBody.innerHTML = '';
    Object.entries(systemCounts)
      .sort((a, b) => b[1] - a[1])
      .forEach(([sys, count]) => {
        const pct = ((count / totalVisits) * 100).toFixed(1);
        sysBody.innerHTML += `
          <tr>
            <td><strong>${sys === 'index' ? '홈페이지' : sys}</strong></td>
            <td>${count.toLocaleString()}</td>
            <td>${pct}%</td>
            <td><span class="badge active">✓ 정상</span></td>
          </tr>
        `;
      });

    // 방문 기록 테이블
    const visitBody = document.getElementById('visitBody');
    visitBody.innerHTML = '';
    allVisits.slice(0, 50).forEach(v => {
      const time = new Date(v.created_at).toLocaleString('ko-KR');
      const page = v.page === 'index' ? '홈페이지' : v.page;
      const ref = v.referrer || '직접 접속';
      visitBody.innerHTML += `
        <tr>
          <td>${time}</td>
          <td>${page}</td>
          <td style="font-size:12px;color:#7f8c8d;">${ref}</td>
        </tr>
      `;
    });

    // 차트 그리기
    drawChart();

  } catch (e) {
    console.error('데이터 로드 실패:', e);
  }
}

function drawChart() {
  const dailyData = {};
  const today = new Date();
  
  for (let i = 29; i >= 0; i--) {
    const date = new Date(today);
    date.setDate(date.getDate() - i);
    const dateStr = date.toLocaleDateString('ko-KR', { month: 'short', day: 'numeric' });
    dailyData[dateStr] = 0;
  }

  allVisits.forEach(v => {
    const visitDate = new Date(v.created_at).toLocaleDateString('ko-KR', { month: 'short', day: 'numeric' });
    if (visitDate in dailyData) dailyData[visitDate]++;
  });

  const ctx = document.getElementById('visitChart');
  if (visitChart) visitChart.destroy();
  
  visitChart = new Chart(ctx, {
    type: 'line',
    data: {
      labels: Object.keys(dailyData),
      datasets: [{
        label: '방문자 수',
        data: Object.values(dailyData),
        borderColor: '#3498db',
        backgroundColor: 'rgba(52, 152, 219, 0.1)',
        borderWidth: 3,
        tension: 0.4,
        fill: true,
        pointRadius: 5,
        pointBackgroundColor: '#3498db',
        pointBorderColor: '#fff',
        pointBorderWidth: 2,
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: true,
      plugins: {
        legend: { display: false }
      },
      scales: {
        y: {
          beginAtZero: true,
          grid: { color: 'rgba(0,0,0,0.05)' }
        },
        x: {
          grid: { display: false }
        }
      }
    }
  });
}

function filterVisits() {
  const search = document.getElementById('visitSearch').value.toLowerCase();
  const rows = document.getElementById('visitBody').getElementsByTagName('tr');
  
  for (let row of rows) {
    const text = row.innerText.toLowerCase();
    row.style.display = text.includes(search) ? '' : 'none';
  }
}

function downloadCSV() {
  if (allVisits.length === 0) {
    alert('다운로드할 데이터가 없습니다.');
    return;
  }

  let csv = '시간,페이지,참조\n';
  allVisits.forEach(v => {
    const time = new Date(v.created_at).toLocaleString('ko-KR');
    const page = v.page === 'index' ? '홈페이지' : v.page;
    const ref = (v.referrer || '직접 접속').replace(/,/g, ' ');
    csv += `"${time}","${page}","${ref}"\n`;
  });

  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = `방문기록_${new Date().toLocaleDateString('ko-KR')}.csv`;
  link.click();
}

window.onload = () => document.getElementById('password').focus();
</script>

</body>
</html>
