<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>말서재 · 음성 일기장 (시험판 v1.7)</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Noto Sans KR",system-ui,sans-serif;background:#FFF4D6;color:#111;font-size:20px;line-height:1.9;font-weight:700;padding:12px 12px 40px}
.top{background:#D50000;color:#fff;border-radius:18px;padding:16px;text-align:center;margin-bottom:12px}
.top h1{font-size:26px;line-height:1.5;font-weight:900}
.top p{font-size:17px;line-height:1.7}
.box{background:#fff;border:4px solid #0033CC;border-radius:18px;padding:14px;margin-bottom:12px}
.box h2{font-size:21px;line-height:1.6;color:#0033CC;margin-bottom:6px;font-weight:900}
#status{background:#00A651;color:#fff;border-radius:14px;padding:10px 12px;text-align:center;font-size:19px;line-height:1.7;margin-bottom:10px;font-weight:900}
#status.bad{background:#D50000}
#status.rec{background:#FF6A00}
.mic{display:block;width:100%;border:none;border-radius:60px;background:#D50000;color:#fff;font-size:30px;font-weight:900;line-height:1.5;padding:26px 10px;margin-bottom:10px}
.mic.on{background:#FF6A00}
.row{display:flex;gap:8px;margin-bottom:10px}
.row button{flex:1;border:none;border-radius:16px;font-size:20px;font-weight:900;line-height:1.5;padding:16px 4px;color:#fff}
.b-save{background:#00A651}.b-read{background:#0033CC}.b-clear{background:#7A00CC}
.moods{display:flex;gap:6px;margin-bottom:10px}
.moods button{flex:1;border:3px solid #0033CC;background:#fff;border-radius:14px;font-size:30px;line-height:1.4;padding:6px 0}
.moods button.sel{background:#FFD600;border-color:#D50000}
textarea{width:100%;min-height:200px;border:3px solid #111;border-radius:14px;font-size:22px;line-height:2;font-weight:700;padding:10px;font-family:inherit;color:#111}
select{width:100%;border:3px solid #0033CC;border-radius:14px;font-size:20px;font-weight:900;line-height:1.6;padding:12px 8px;background:#fff;color:#111;margin-bottom:8px;font-family:inherit}
.lab{font-size:18px;line-height:1.7;color:#D50000;font-weight:900}
.entry{border:3px solid #00A651;border-radius:14px;padding:10px;margin-bottom:10px;background:#F2FFF7}
.entry .d{color:#D50000;font-size:18px;line-height:1.6;font-weight:900}
.entry .t{font-size:20px;line-height:1.9;white-space:pre-wrap;word-break:break-all}
.entry .a{display:flex;gap:6px;margin-top:6px}
.entry .a button{flex:1;border:none;border-radius:12px;font-size:17px;font-weight:900;padding:10px 2px;color:#fff;line-height:1.4}
.mon{background:#0033CC;color:#fff;border-radius:12px;padding:6px 12px;font-size:20px;line-height:1.6;margin:8px 0;font-weight:900}
.dl{display:block;width:100%;border:none;border-radius:16px;background:#FF6A00;color:#fff;font-size:21px;font-weight:900;line-height:1.5;padding:16px;margin-top:6px}
.note{font-size:16px;line-height:1.8;color:#111}
#live{font-size:15px;line-height:1.6;color:#7A00CC;font-weight:900;margin-bottom:8px;word-break:break-all}
#diag{font-size:16px;line-height:1.8;word-break:break-all}
</style>
</head>
<body>

<div class="top">
<h1>말서재 · 음성 일기장</h1>
<p>한국뇌심리연구소 부설 · 시험판 v1.7</p>
</div>

<div class="box">
<h2>① 오늘 기분</h2>
<div class="moods" id="moods">
<button data-m="😊">😊</button><button data-m="😐">😐</button><button data-m="😢">😢</button><button data-m="😠">😠</button><button data-m="😴">😴</button>
</div>
</div>

<div class="box">
<h2>② 말하기</h2>
<div id="status">준비 중...</div>
<div id="live"></div>
<button class="mic" id="mic">🎤 말하기 시작</button>
<textarea id="txt" placeholder="말하면 여기에 글자로 나옵니다. 고쳐 쓸 수도 있습니다."></textarea>
<div class="row" style="margin-top:10px">
<button class="b-save" id="save">💾 저장</button>
<button class="b-read" id="read">🔊 읽어줘</button>
<button class="b-clear" id="clear">🧹 비우기</button>
</div>
<p class="note">말하는 중에 "저장"이라고 말하면 자동 저장됩니다.</p>
</div>

<div class="box">
<h2>③ 읽어주는 목소리</h2>
<select id="voice"></select>
<div class="lab">기계 목소리 높낮이 (낮게 = 굵은 목소리)</div>
<select id="pitch">
<option value="0.3">가장 낮게</option>
<option value="0.5">아주 낮게</option>
<option value="0.6">낮게</option>
<option value="0.8">조금 낮게</option>
<option value="1" selected>보통</option>
<option value="1.25">높게</option>
</select>
<select id="recon">
<option value="1">내 목소리 녹음 켜기 (기본)</option>
<option value="0">내 목소리 녹음 끄기</option>
</select>
<div class="lab">듣기 방식 (끊김이 심하면 "이어 듣기"를 써 보세요)</div>
<select id="mode">
<option value="0">안정 듣기 (기본)</option>
<option value="1">이어 듣기 (실험, 끊김 적음)</option>
</select>
<p class="note">기본은 내가 말한 목소리 그대로 다시 들려줍니다. 글을 고쳐 쓰면 녹음은 고치기 전 말 그대로입니다. 목소리를 바꾸면 고친 글이 기계 목소리로 읽힙니다.</p>
</div>

<div class="box">
<h2>④ 내 일기 (연·월·일·시 순서)</h2>
<div id="list"></div>
<button class="dl" id="dl">📥 전체를 파일로 내려받기 (.md)</button>
</div>

<div class="box">
<h2>⑤ 시험 결과 확인용</h2>
<div id="diag"></div>
</div>

<script>
(function(){
var KEY='malseojae_diary_v0';
var $=function(i){return document.getElementById(i)};
var st=$('status'),mic=$('mic'),txt=$('txt');
var mood='';
var listening=false,rec=null,base='',finalText='',errCount=0,recStarted=false,gotResult=false,forceStable=false,wd=null;
var diag=[];
function log(m){diag.push(new Date().toTimeString().slice(0,8)+' '+m);if(diag.length>16)diag.shift();$('diag').innerHTML=diag.join('<br>');var lv=$('live');if(lv)lv.innerHTML=diag.slice(-3).join('<br>');}
function p2(n){return n<10?'0'+n:''+n}
function stamp(d){return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())+' '+p2(d.getHours())+':'+p2(d.getMinutes())}
function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return []}}
function store(a){try{localStorage.setItem(KEY,JSON.stringify(a));return true}catch(e){log('저장 오류: '+e.message);return false}}
function pref(k,v){try{if(v===undefined)return localStorage.getItem('malseojae_'+k);localStorage.setItem('malseojae_'+k,v)}catch(e){}return null}
function setStatus(t,c){st.textContent=t;st.className=c||''}

/* ---------- 녹음 보관소 (IndexedDB) ---------- */
var DB=null;
function openDB(){
 try{
  var r=indexedDB.open('malseojae',1);
  r.onupgradeneeded=function(){r.result.createObjectStore('audio')};
  r.onsuccess=function(){DB=r.result;log('녹음 보관소 준비')};
  r.onerror=function(){log('녹음 보관소 오류')};
 }catch(e){log('녹음 보관소 사용 불가')}
}
function putAudio(id,blobs,cb){
 if(!DB){cb(false);return}
 try{var tx=DB.transaction('audio','readwrite');tx.objectStore('audio').put(blobs,id);tx.oncomplete=function(){cb(true)};tx.onerror=function(){cb(false)}}catch(e){cb(false)}
}
function getAudio(id,cb){
 if(!DB){cb(null);return}
 try{var q=DB.transaction('audio').objectStore('audio').get(id);q.onsuccess=function(){cb(q.result||null)};q.onerror=function(){cb(null)}}catch(e){cb(null)}
}
function delAudio(id){
 if(!DB)return;
 try{DB.transaction('audio','readwrite').objectStore('audio').delete(id)}catch(e){}
}

/* ---------- 내 목소리 녹음 ---------- */
var mr=null,curBlobs=[],flushing=false,pendingSave=false;
function recOn(){return $('recon').value==='1'&&!!window.MediaRecorder&&!!navigator.mediaDevices}
function startRecorder(done){
 if(!recOn()){done();return}
 navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}}).then(function(s){
  var mt='';
  ['audio/webm;codecs=opus','audio/webm','audio/mp4'].forEach(function(t){if(!mt&&MediaRecorder.isTypeSupported(t))mt=t});
  var ch=[];
  var m=new MediaRecorder(s,mt?{mimeType:mt}:{});
  m.ondataavailable=function(e){if(e.data&&e.data.size)ch.push(e.data)};
  m.onstop=function(){
   mr=null;flushing=false;
   try{s.getTracks().forEach(function(t){t.stop()})}catch(e){}
   try{
    if(ch.length){var b=new Blob(ch,{type:m.mimeType||'audio/webm'});curBlobs.push(b);log('내 목소리 녹음 '+Math.round(b.size/1024)+'KB'+(b.size<4000?' (너무 작음: 마이크 충돌 가능)':''))}
    else log('녹음 데이터 없음');
   }catch(e){log('녹음 처리 오류: '+e.message)}
   if(pendingSave){pendingSave=false;doSave()}
  };
  m.onerror=function(e){log('녹음기 오류: '+(e.error&&e.error.name||'?'));mr=null;flushing=false};
  mr=m;m.start();log('내 목소리 녹음 시작');
  done();
 }).catch(function(e){log('녹음 실패: '+e.name+' (글자 변환만 진행)');done()});
}
function stopRecorder(){
 if(mr&&mr.state!=='inactive'){flushing=true;try{mr.stop()}catch(x){flushing=false}}
}

/* ---------- 읽어주기 ---------- */
var curAudio=null,voices=[];
function stopPlay(){
 try{if(curAudio){curAudio.pause();curAudio=null}}catch(e){}
 try{window.speechSynthesis&&speechSynthesis.cancel()}catch(e){}
}
var elCache=new WeakMap(),blobCache={};
function getEl(b){
 return new Audio(URL.createObjectURL(b));
}
function playBlobs(arr){
 stopPlay();
 var t0=performance.now(),i=0;
 function next(){
  if(i>=arr.length)return;
  var first=(i===0);
  var a=getEl(arr[i++]);
  curAudio=a;a.onended=next;
  a.onerror=function(){log('재생 파일 오류')};
  a.onplaying=function(){a.onplaying=null;if(first)log('재생 시작까지 '+Math.round(performance.now()-t0)+'ms')};
  a.play().catch(function(e){log('재생 오류: '+e.name)});
 }
 next();
}
function warm(list){
 var n=0;
 list.forEach(function(e){
  if(!e.audio||n>=5)return;
  n++;
  if(blobCache[e.id])return;
  getAudio(e.id,function(bl){if(bl)blobCache[e.id]=bl});
 });
}
function speak(t){
 if(!window.speechSynthesis){setStatus('읽어주기가 안 되는 기기입니다.','bad');return}
 stopPlay();
 var u=new SpeechSynthesisUtterance(t);
 u.lang='ko-KR';u.rate=0.9;
 u.pitch=parseFloat($('pitch').value)||1;
 var sel=$('voice').value;
 if(sel!=='me'){
  for(var i=0;i<voices.length;i++){if(voices[i].voiceURI===sel){u.voice=voices[i];break}}
 }
 speechSynthesis.speak(u);
}
function readText(t,blobs){
 var sel=$('voice').value;
 if(sel==='me'){
  if(blobs&&blobs.length){playBlobs(blobs);return}
  setStatus('내 목소리 녹음이 없어 기계 목소리로 읽습니다.','bad');
 }
 speak(t);
}
function fillVoices(){
 var all=window.speechSynthesis?speechSynthesis.getVoices():[];
 voices=all.filter(function(v){return /^ko/i.test(v.lang)});
 var cur=pref('voice')||'me';
 var h='<option value="me">🙂 내 목소리 (기본)</option>';
 voices.forEach(function(v,i){h+='<option value="'+v.voiceURI+'">기계 목소리 '+(i+1)+' · '+v.name+'</option>'});
 $('voice').innerHTML=h;
 $('voice').value=cur;
 if($('voice').value!==cur)$('voice').value='me';
 log('한국어 기계 목소리 '+voices.length+'개: '+voices.map(function(v){return v.name+'/'+v.lang+(v.localService?'/기기':'/인터넷')}).join(' , '));
}
if(window.speechSynthesis){fillVoices();speechSynthesis.onvoiceschanged=fillVoices}
else $('voice').innerHTML='<option value="me">🙂 내 목소리 (기본)</option>';
$('voice').onchange=function(){pref('voice',$('voice').value);log('목소리 선택: '+$('voice').options[$('voice').selectedIndex].text)};
$('pitch').value=pref('pitch')||'1';
$('pitch').onchange=function(){pref('pitch',$('pitch').value)};
$('recon').value=pref('recon')||'1';
$('recon').onchange=function(){pref('recon',$('recon').value)};
$('mode').value=pref('mode')||'0';
$('mode').onchange=function(){pref('mode',$('mode').value);log('듣기 방식: '+$('mode').options[$('mode').selectedIndex].text)};

document.querySelectorAll('#moods button').forEach(function(b){
 b.onclick=function(){mood=b.dataset.m;document.querySelectorAll('#moods button').forEach(function(x){x.classList.remove('sel')});b.classList.add('sel')}
});

/* ---------- 음성 인식 ---------- */
var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
log('주소: '+location.protocol+'//'+(location.host||'(파일)'));
log('음성인식 지원: '+(SR?'예':'아니오'));
log('녹음 지원: '+(window.MediaRecorder?'예':'아니오'));
if(!SR){setStatus('이 브라우저는 음성 입력이 안 됩니다. 크롬으로 열어 주세요.','bad');mic.disabled=true}
else setStatus('준비됐습니다. 빨간 버튼을 누르세요.');
openDB();

function build(){
 rec=new SR();
 rec.lang='ko-KR';
 rec.continuous=!forceStable&&($('mode').value==='1'||recOn());
 rec.interimResults=true;
 rec.maxAlternatives=1;
 rec.onstart=function(){
  setStatus('듣고 있습니다... 말씀하세요','rec');log('듣기 시작');
  if(!recStarted){recStarted=true;startRecorder(function(){})}
  clearTimeout(wd);
  if(rec.continuous&&!gotResult){
   wd=setTimeout(function(){
    if(listening&&!gotResult&&rec&&rec.continuous){
     forceStable=true;log('이어 듣기 응답 없음 → 안정 듣기로 자동 전환');
     var old=rec;
     old.onend=function(){if(listening){build();try{rec.start()}catch(e){log('전환 실패: '+e.message)}}};
     try{old.abort()}catch(e){}
    }
   },7000);
  }
 };
 rec.onresult=function(e){
  gotResult=true;clearTimeout(wd);
  if(rec.continuous){
   var full='';
   for(var k=0;k<e.results.length;k++){full+=e.results[k][0].transcript}
   errCount=0;
   var lf=e.results[e.results.length-1].isFinal;
   if(lf&&/저장\s*$/.test(full.trim())){
    txt.value=(base+full.replace(/\s*저장\s*$/,'')).trim();
    stop();doSave();return;
   }
   txt.value=(base+full).replace(/\s+$/,'');
   return;
  }
  var interim='';
  for(var i=e.resultIndex;i<e.results.length;i++){
   var r=e.results[i];
   if(r.isFinal){finalText+=r[0].transcript+' ';errCount=0;log('인식: '+r[0].transcript)}
   else interim+=r[0].transcript;
  }
  txt.value=(base+finalText+interim).replace(/\s+$/,'');
  if(/저장\s*$/.test(finalText.trim())){
   finalText=finalText.replace(/\s*저장\s*$/,'')+' ';
   txt.value=(base+finalText).trim();
   stop();doSave();
  }
 };
 rec.onerror=function(e){
  log('오류: '+e.error);
  if(e.error==='not-allowed'||e.error==='service-not-allowed'){
   setStatus(location.protocol==='https:'?'마이크 허용이 필요합니다. 주소창 왼쪽 자물쇠에서 마이크를 허용하세요.':'파일로 직접 연 화면에서는 마이크가 막힙니다. 인터넷 주소(https)로 열어야 합니다.','bad');
   stop(true);
  }
  else if(e.error==='network'){setStatus('인터넷 연결이 필요합니다.','bad');stop(true)}
  else if(e.error==='audio-capture'){setStatus('마이크를 쓸 수 없습니다. 녹음을 끄고 다시 해 보세요.','bad');stop(true)}
  else if(e.error==='no-speech'){errCount++}
 };
 rec.onend=function(){
  log('듣기 끝');
  if(listening){
   if(errCount>=8){stop();setStatus('말씀이 들리지 않아 멈췄습니다.','bad');return}
   if(rec.continuous){base=txt.value.replace(/\s+$/,'');base=base?base+' ':''}
   try{rec.start()}catch(x){setTimeout(function(){if(listening){try{rec.start()}catch(y){log('재시작 실패: '+y.message)}}},100)}
  }
 };
}
function begin(){
 build();
 listening=true;mic.textContent='⏹ 말하기 끝내기';mic.classList.add('on');
 try{rec.start()}catch(x){log('시작 실패: '+x.message);stop(true)}
}
function start(){
 if(!SR)return;
 stopPlay();
 base=txt.value?txt.value.replace(/\s+$/,'')+' ':'';
 finalText='';errCount=0;recStarted=false;gotResult=false;forceStable=false;
 begin();
}
function stop(quiet){
 listening=false;clearTimeout(wd);
 try{rec&&rec.stop()}catch(x){}
 stopRecorder();
 mic.textContent='🎤 말하기 시작';mic.classList.remove('on');
 if(!quiet)setStatus('멈췄습니다. 글을 확인하고 저장하세요.');
}
mic.onclick=function(){listening?stop():start()};

function doSave(){
 if(flushing){pendingSave=true;return}
 var t=txt.value.trim();
 if(!t){setStatus('저장할 글이 없습니다.','bad');return}
 var id=Date.now();
 var blobs=curBlobs.slice();
 function finish(hasAudio){
  var a=load();
  if(hasAudio)blobCache[id]=blobs;
  a.push({id:id,ts:id,mood:mood,text:t,audio:hasAudio});
  if(store(a)){txt.value='';curBlobs=[];base='';finalText='';setStatus('저장했습니다 ('+stamp(new Date())+')'+(hasAudio?' · 내 목소리 포함':''));render()}
 }
 if(blobs.length){putAudio(id,blobs,function(ok){if(!ok)log('녹음 저장 실패 (글만 저장)');finish(ok)})}
 else finish(false);
}
$('save').onclick=function(){if(listening)stop();doSave()};
$('clear').onclick=function(){if(listening)stop();txt.value='';curBlobs=[];base='';finalText='';stopPlay();setStatus('비웠습니다.')};
$('read').onclick=function(){
 if(listening)stop();
 var t=txt.value.trim();
 if(!t){setStatus('읽을 글이 없습니다.','bad');return}
 if(flushing){setTimeout(function(){readText(t,curBlobs)},400)}
 else readText(t,curBlobs);
};

function esc(s){return s.replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}
function render(){
 var a=load().sort(function(x,y){return y.ts-x.ts});
 var h='',cur='';
 if(!a.length)h='<p class="note">아직 저장된 일기가 없습니다.</p>';
 a.forEach(function(e){
  var d=new Date(e.ts),ym=d.getFullYear()+'년 '+(d.getMonth()+1)+'월';
  if(ym!==cur){h+='<div class="mon">'+ym+'</div>';cur=ym}
  h+='<div class="entry"><div class="d">'+stamp(d)+' '+(e.mood||'')+(e.audio?' 🎙':'')+'</div><div class="t">'+esc(e.text)+'</div>'+
  '<div class="a"><button style="background:#0033CC" data-r="'+e.id+'">🔊 읽기</button><button style="background:#D50000" data-x="'+e.id+'">🗑 지우기</button></div></div>';
 });
 $('list').innerHTML=h;
 $('list').querySelectorAll('[data-r]').forEach(function(b){b.onclick=function(){
  var f=load().filter(function(x){return String(x.id)===b.dataset.r})[0];
  if(!f)return;
  if(f.audio){
   if(blobCache[f.id])readText(f.text,blobCache[f.id]);
   else getAudio(f.id,function(bl){if(bl)blobCache[f.id]=bl;readText(f.text,bl)});
  }
  else readText(f.text,null);
 }});
 warm(a);
 $('list').querySelectorAll('[data-x]').forEach(function(b){b.onclick=function(){
  if(!confirm('이 일기를 지울까요?'))return;
  store(load().filter(function(x){if(String(x.id)===b.dataset.x){delAudio(x.id);delete blobCache[x.id];return false}return true}));render()}});
}
$('dl').onclick=function(){
 var a=load().sort(function(x,y){return x.ts-y.ts});
 if(!a.length){setStatus('내려받을 일기가 없습니다.','bad');return}
 var s='# 말서재 · 음성 일기장\n\n';
 a.forEach(function(e){var d=new Date(e.ts);s+='## '+stamp(d)+' '+(e.mood||'')+'\n\n'+e.text+'\n\n';});
 var d=new Date();
 var name=d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())+'_'+p2(d.getHours())+p2(d.getMinutes())+'_일기모음.md';
 var bl=new Blob([s],{type:'text/markdown'});
 var l=document.createElement('a');l.href=URL.createObjectURL(bl);l.download=name;document.body.appendChild(l);l.click();
 setTimeout(function(){URL.revokeObjectURL(l.href);l.remove()},500);
 log('내려받기: '+name);
};
render();
})();
</script>
</body>
</html>
