<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>뇌건강체크 BHC 2.0 - 임상 검사</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: linear-gradient(135deg, #667EEA 0%, #764BA2 100%); font-family: 'Segoe UI', 'Noto Sans KR', sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
.container { width: 100%; max-width: 680px; background: white; border-radius: 20px; padding: 30px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
.screen { display: none; }
.screen.active { display: block; animation: slideIn 0.5s; }
@keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

.start-screen { text-align: center; }
.brain-icon { font-size: 60px; margin-bottom: 20px; }
h1 { color: #667EEA; font-size: 32px; margin-bottom: 10px; font-weight: 700; }
.subtitle { color: #888; font-size: 14px; margin-bottom: 20px; }
.info-box { background: #F5F5F5; border-left: 4px solid #667EEA; padding: 15px; border-radius: 8px; text-align: left; font-size: 14px; color: #555; margin-bottom: 20px; line-height: 1.8; }
.btn { width: 100%; padding: 15px; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.3s; margin-top: 15px; }
.btn-primary { background: #667EEA; color: white; }
.btn-primary:hover { background: #764BA2; transform: translateY(-2px); }

.test-screen { display: flex; flex-direction: column; min-height: 700px; }
.progress-bar { width: 100%; height: 8px; background: #e0e0e0; border-radius: 10px; margin-bottom: 20px; overflow: hidden; }
.progress-fill { height: 100%; background: linear-gradient(90deg, #667EEA, #764BA2); width: 0%; transition: width 0.5s; }
.question-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
.question-num { font-weight: 600; color: #667EEA; font-size: 16px; }
.domain-badge { background: #667EEA; color: white; padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 600; }
.timer { font-weight: 600; color: #FF6B6B; }

/* 문제 이미지 */
.problem-image { 
  width: 100%; 
  height: 280px; 
  background: linear-gradient(135deg, #f5f5f5, #e8e8e8); 
  border-radius: 15px; 
  display: flex; 
  align-items: center; 
  justify-content: center; 
  margin-bottom: 20px;
  border: 2px solid #667EEA;
  position: relative;
  overflow: hidden;
}
.problem-image svg { width: 90%; height: 90%; }

/* 선택지 이미지 */
.choices { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 25px; }
.choice-card { 
  border: 2px solid #ddd; 
  border-radius: 10px; 
  padding: 12px; 
  cursor: pointer; 
  transition: all 0.3s; 
  text-align: center;
  min-height: 120px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
.choice-card:hover { border-color: #667EEA; background: #F0F4FF; transform: scale(1.05); }
.choice-card.selected { border-color: #667EEA; background: #E8EAFF; border-width: 3px; }
.choice-image { font-size: 48px; margin-bottom: 8px; }
.choice-label { font-size: 12px; font-weight: 600; color: #333; }

.nav-buttons { display: flex; gap: 10px; margin-top: auto; }
.btn-nav { flex: 1; padding: 12px; border: 2px solid #667EEA; background: white; color: #667EEA; border-radius: 8px; font-weight: 600; cursor: pointer; transition: all 0.3s; }
.btn-nav:hover { background: #667EEA; color: white; }
.btn-nav:disabled { opacity: 0.5; cursor: not-allowed; }

.result-screen { text-align: center; }
.result-title { font-size: 28px; color: #667EEA; margin-bottom: 20px; font-weight: 700; }
.brain-age-box { background: linear-gradient(135deg, #667EEA, #764BA2); color: white; padding: 30px; border-radius: 15px; margin-bottom: 20px; cursor: pointer; transition: all 0.3s; }
.brain-age-box:hover { transform: scale(1.05); }
.brain-age-label { font-size: 14px; opacity: 0.9; margin-bottom: 10px; }
.brain-age-num { font-size: 56px; font-weight: 700; margin-bottom: 10px; }
.chart-box { background: #f9f9f9; padding: 20px; border-radius: 15px; margin-bottom: 20px; }

@media (max-width: 600px) { 
  .container { padding: 20px; } 
  h1 { font-size: 24px; } 
  .problem-image { height: 220px; }
  .choices { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<div class="container">
  <!-- 시작 화면 -->
  <div id="startScreen" class="screen active">
    <div class="brain-icon">🧠</div>
    <h1>뇌건강체크 BHC 2.0</h1>
    <p class="subtitle">Brain Health Check - 임상 인지 검사</p>
    <div class="info-box">
      <p>💡 8가지 인지 영역을 45개 임상 검사로 측정합니다.</p>
      <p style="margin-top: 10px;">⏱️ 소요 시간: 약 15~20분</p>
      <p style="margin-top: 10px;">📊 당신의 뇌 나이와 인지 강점을 알아보세요!</p>
    </div>
    <button class="btn btn-primary" onclick="startTest()">🚀 검사 시작하기</button>
  </div>

  <!-- 검사 화면 -->
  <div id="testScreen" class="screen test-screen">
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="question-header">
      <span class="question-num" id="questionNum">문항 1/45</span>
      <span class="domain-badge" id="domainBadge">기억</span>
      <span class="timer" id="timer">⏱ 10초</span>
    </div>
    
    <!-- 문제 이미지 -->
    <div class="problem-image" id="problemImage">
      <svg viewBox="0 0 400 280"></svg>
    </div>

    <!-- 선택지 이미지 -->
    <div class="choices" id="choices"></div>

    <div class="nav-buttons">
      <button class="btn-nav" onclick="prevQuestion()" id="prevBtn" disabled>← 이전</button>
      <button class="btn-nav" onclick="nextQuestion()" id="nextBtn" disabled>다음 →</button>
    </div>
  </div>

  <!-- 결과 화면 -->
  <div id="resultScreen" class="screen result-screen">
    <div class="result-title">🎉 검사 완료!</div>
    <div class="brain-age-box" onclick="goToTraining()">
      <div class="brain-age-label">당신의 뇌 나이</div>
      <div class="brain-age-num" id="brainAge">--</div>
      <div style="font-size: 14px; margin-top: 10px;">👉 뇌훈련 프로그램 시작</div>
    </div>
    <div class="chart-box">
      <div style="font-size: 14px; font-weight: 600; color: #666; margin-bottom: 15px;">📊 8가지 인지 영역 분석</div>
      <canvas id="radarChart" height="300"></canvas>
    </div>
    <button class="btn btn-primary" onclick="goToTraining()">🧠 뇌훈련 시작</button>
    <button class="btn btn-primary" style="background: #f0f0f0; color: #333;" onclick="goHome()">🏠 홈페이지</button>
  </div>
</div>

<script>
// 45개 검사 문항 - 도메인별 다양한 유형
const QUESTIONS = [
  // 기억 (Memory) - 10개
  { d: "기억", type: "diff", time: 10, choices: ["왼쪽 꽃 사라짐", "나비 위치 변경", "배경색 변경", "사람 표정 변경", "모두 같음"] },
  { d: "기억", type: "diff", time: 10, choices: ["새 한 마리 추가", "나무 개수 변경", "하늘색 변경", "구름 사라짐", "모두 같음"] },
  { d: "기억", type: "sequence", time: 12, choices: ["1-2-3-4-5", "1-3-2-5-4", "2-1-3-4-5", "1-2-4-3-5", "5-4-3-2-1"] },
  { d: "기억", type: "recall", time: 10, choices: ["🍎", "🍊", "🍌", "🍇", "🍓"] },
  { d: "기억", type: "diff", time: 10, choices: ["집 크기 변경", "문 위치 변경", "창문 개수 변경", "연기 방향 변경", "모두 같음"] },
  { d: "기억", type: "recall", time: 12, choices: ["4개", "5개", "6개", "7개", "8개"] },
  { d: "기억", type: "sequence", time: 10, choices: ["월→화→수→목→금", "월→수→금→토→일", "금→목→수→화→월", "월→수→목→토→일", "화→수→목→금→토"] },
  { d: "기억", type: "diff", time: 10, choices: ["색상 변경", "크기 변경", "위치 변경", "개수 변경", "모두 같음"] },
  { d: "기억", type: "pattern", time: 12, choices: ["2-4-6-8", "2-4-6-8-10", "2-3-5-8", "1-2-4-8", "3-6-9-12"] },
  { d: "기억", type: "recall", time: 10, choices: ["15:30", "14:45", "16:15", "13:20", "17:00"] },
  
  // 집중 (Attention) - 10개
  { d: "집중", type: "spot", time: 8, choices: ["좌상단", "우상단", "좌하단", "우하단", "중앙"] },
  { d: "집중", type: "count", time: 8, choices: ["3개", "4개", "5개", "6개", "7개"] },
  { d: "집중", type: "spot", time: 8, choices: ["①번", "②번", "③번", "④번", "⑤번"] },
  { d: "집중", type: "detail", time: 8, choices: ["하나 다름", "둘 다름", "셋 다름", "모두 같음", "찾을 수 없음"] },
  { d: "집중", type: "count", time: 8, choices: ["10개", "11개", "12개", "13개", "14개"] },
  { d: "집중", type: "spot", time: 8, choices: ["빨강", "파랑", "초록", "노랑", "보라"] },
  { d: "집중", type: "detail", time: 8, choices: ["1개 차이", "2개 차이", "3개 차이", "차이 없음", "4개 차이"] },
  { d: "집중", type: "count", time: 8, choices: ["8개", "9개", "10개", "11개", "12개"] },
  { d: "집중", type: "spot", time: 8, choices: ["①", "②", "③", "④", "⑤"] },
  { d: "집중", type: "detail", time: 8, choices: ["다름", "다름", "다름", "다름", "모두 같음"] },
  
  // 감정 (Emotion) - 10개
  { d: "감정", type: "emotion", time: 5, choices: ["매우 행복", "행복", "보통", "슬픔", "매우 슬픔"] },
  { d: "감정", type: "emotion", time: 5, choices: ["매우 화남", "화남", "보통", "차분함", "매우 차분함"] },
  { d: "감정", type: "emotion", time: 5, choices: ["놀람", "두려움", "혐오", "중립", "기쁨"] },
  { d: "감정", type: "emotion", time: 5, choices: ["신뢰", "의심", "중립", "두려움", "분노"] },
  { d: "감정", type: "emotion", time: 5, choices: ["기대함", "실망", "만족", "불안", "흥미"] },
  { d: "감정", type: "emotion", time: 5, choices: ["사랑", "질린", "관심없음", "존경", "질투"] },
  { d: "감정", type: "emotion", time: 5, choices: ["자신감", "자책", "자랑", "부끄러움", "절망"] },
  { d: "감정", type: "emotion", time: 5, choices: ["공감", "무관심", "동정", "연민", "분노"] },
  { d: "감정", type: "emotion", time: 5, choices: ["희망", "절망", "불안", "기대", "만족"] },
  { d: "감정", type: "emotion", time: 5, choices: ["긍정", "부정", "중립", "주의", "기쁨"] },
  
  // 판단 (Judgment) - 10개
  { d: "판단", type: "pattern", time: 10, choices: ["보라", "주황", "노랑", "분홍", "갈색"] },

  { d: "판단", type: "pattern", time: 10, choices: ["삼각형", "원", "정사각형", "육각형", "별"] },
  { d: "판단", type: "logic", time: 10, choices: ["10초", "20초", "30초", "40초", "50초"] },
  { d: "판단", type: "pattern", time: 10, choices: ["토", "일", "월", "화", "수"] },
  { d: "판단", type: "rule", time: 10, choices: ["①", "②", "③", "④", "⑤"] },
  { d: "판단", type: "logic", time: 10, choices: ["100", "81", "64", "49", "36"] },
  { d: "판단", type: "pattern", time: 10, choices: ["G", "H", "I", "J", "K"] },
  { d: "판단", type: "rule", time: 10, choices: ["맞음", "틀림", "불확실", "관련없음", "불가능"] },
  { d: "판단", type: "logic", time: 10, choices: ["A", "B", "C", "D", "E"] },
  
  // 실행 (Execution) - 5개
  { d: "실행", type: "sequence", time: 8, choices: ["①→②→③", "①→③→②", "②→①→③", "②→③→①", "③→②→①"] },
  { d: "실행", type: "sequence", time: 8, choices: ["첫번째", "두번째", "세번째", "네번째", "다섯번째"] },
  { d: "실행", type: "order", time: 8, choices: ["맞음", "틀림", "불확실", "가능", "불가능"] },
  { d: "실행", type: "sequence", time: 8, choices: ["1번", "2번", "3번", "4번", "5번"] },
  { d: "실행", type: "priority", time: 8, choices: ["①", "②", "③", "④", "⑤"] },
  
  // 조절 (Regulation) - 5개
  { d: "조절", type: "classify", time: 7, choices: ["①", "②", "③", "④", "⑤"] },
  { d: "조절", type: "match", time: 7, choices: ["①", "②", "③", "④", "⑤"] },
  { d: "조절", type: "sort", time: 7, choices: ["작음→중간→큼", "큼→중간→작음", "중간→작음→큼", "작음→큼→중간", "중간→큼→작음"] },
  { d: "조절", type: "group", time: 7, choices: ["①과②", "②와③", "①과③", "①②③", "없음"] },
  { d: "조절", type: "select", time: 7, choices: ["①", "②", "③", "④", "⑤"] },
  
  // 공간 (Spatial) - 5개
  { d: "공간", type: "rotation", time: 10, choices: ["①", "②", "③", "④", "⑤"] },
  { d: "공간", type: "3d", time: 10, choices: ["①", "②", "③", "④", "⑤"] },
  { d: "공간", type: "direction", time: 10, choices: ["북쪽", "동쪽", "남쪽", "서쪽", "중앙"] },
  { d: "공간", type: "composition", time: 10, choices: ["①", "②", "③", "④", "⑤"] },
  { d: "공간", type: "perspective", time: 10, choices: ["①", "②", "③", "④", "⑤"] }
];

const DOMAINS = ["기억", "집중", "감정", "판단", "실행", "조절", "공간", "속도"];
let currentQ = 0;
let answers = {};
let timeoutId = null;

function startTest() {
  currentQ = 0;
  answers = {};
  showScreen("testScreen");
  loadQuestion();
}

function loadQuestion() {
  const q = QUESTIONS[currentQ];
  const progress = ((currentQ + 1) / 45) * 100;

  document.getElementById("progressFill").style.width = progress + "%";
  document.getElementById("questionNum").textContent = `문항 ${currentQ + 1}/45`;
  document.getElementById("domainBadge").textContent = q.d;
  document.getElementById("timer").textContent = `⏱ ${q.time}초`;

  // 선택지 렌더링
  const choices = document.getElementById("choices");
  choices.innerHTML = "";
  q.choices.forEach((choice, idx) => {
    const card = document.createElement("div");
    card.className = "choice-card" + (answers[currentQ] === idx ? " selected" : "");
    card.onclick = () => selectAnswer(idx);
    
    // 이모지/아이콘으로 표현
    const iconMap = {
      "매우 행복": "😍", "행복": "😊", "보통": "😐", "슬픔": "😟", "매우 슬픔": "😭",
      "매우 화남": "😠", "화남": "😡", "차분함": "😌", "매우 차분함": "🥰",
      "놀람": "😲", "두려움": "😨", "혐오": "🤮", "중립": "😑", "기쁨": "😄",
      "신뢰": "🤝", "의심": "🤔", "분노": "😤",

      "공감": "🫂", "동정": "💔", "분노": "😡", "연민": "🙏",
      "희망": "🌈", "절망": "⛈️", "기대": "🎉", "만족": "✨",
      "긍정": "👍", "부정": "👎",
      "맞음": "✅", "틀림": "❌", "불확실": "❓", "관련없음": "〰️", "불가능": "🚫",
      "가능": "🎯", "①": "1️⃣", "②": "2️⃣", "③": "3️⃣", "④": "4️⃣", "⑤": "5️⃣",
      "①→②→③": "1→2→3", "①→③→②": "1→3→2", "②→①→③": "2→1→3", "②→③→①": "2→3→1", "③→②→①": "3→2→1",
      "첫번째": "🥇", "두번째": "🥈", "세번째": "🥉", "네번째": "4️⃣", "다섯번째": "5️⃣",
      "①과②": "1+2", "②와③": "2+3", "①과③": "1+3", "①②③": "1+2+3", "없음": "🚫",
      "작음→중간→큼": "📈", "큼→중간→작음": "📉", "중간→작음→큼": "🔄", "작음→큼→중간": "⚡", "중간→큼→작음": "↩️",
      "북쪽": "⬆️", "동쪽": "➡️", "남쪽": "⬇️", "서쪽": "⬅️", "중앙": "🎯",
      "왼쪽 꽃 사라짐": "🌸❌", "나비 위치 변경": "🦋↔️", "배경색 변경": "🎨", "사람 표정 변경": "😊→😂", "모두 같음": "✓",
      "새 한 마리 추가": "🐦➕", "나무 개수 변경": "🌳", "하늘색 변경": "🌌", "구름 사라짐": "☁️❌"
    };
    
    const icon = iconMap[choice] || choice.charAt(0);
    card.innerHTML = `<div class="choice-image">${icon}</div><div class="choice-label">${choice}</div>`;
    choices.appendChild(card);
  });

  document.getElementById("prevBtn").disabled = currentQ === 0;
  document.getElementById("nextBtn").disabled = !answers[currentQ];
}

function selectAnswer(idx) {
  answers[currentQ] = idx;
  loadQuestion();
}

function prevQuestion() {
  if (currentQ > 0) {
    currentQ--;
    loadQuestion();
  }
}

function nextQuestion() {
  if (currentQ < 44) {
    currentQ++;
    loadQuestion();
  } else if (currentQ === 44) {
    completeTest();
  }
}

function completeTest() {
  calculateResults();
  showScreen("resultScreen");
}

function calculateResults() {
  const scores = {};
  DOMAINS.forEach(d => { scores[d] = 0; });
  
  QUESTIONS.forEach((q, i) => {
    if (answers[i] !== undefined) {
      scores[q.d]++;
    }
  });

  const avgScores = {};
  DOMAINS.forEach(d => {
    const count = QUESTIONS.filter(q => q.d === d).length;
    avgScores[d] = Math.round((scores[d] / count) * 100);
  });

  const avg = Object.values(avgScores).reduce((a, b) => a + b) / 8;
  let brainAge = 100 - Math.round(avg * 0.3);
  if (brainAge < 5) brainAge = 5;
  if (brainAge > 100) brainAge = 100;

  document.getElementById("brainAge").textContent = brainAge + "세";

  // 레이더 차트
  if (window.radarChart) window.radarChart.destroy();
  const radarCtx = document.getElementById("radarChart").getContext("2d");
  window.radarChart = new Chart(radarCtx, {
    type: "radar",
    data: {
      labels: DOMAINS,
      datasets: [{ label: "점수", data: DOMAINS.map(d => avgScores[d]), borderColor: "#667EEA", backgroundColor: "rgba(102, 126, 234, 0.15)", borderWidth: 3, pointRadius: 5 }]
    },
    options: { responsive: true, scales: { r: { min: 0, max: 100, ticks: { color: "#999" } } }, plugins: { legend: { display: false } } }
  });
}

function showScreen(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

function goToTraining() { window.location.href = "/brain_training.html"; }
function goHome() { window.location.href = "/"; }

console.log("✅ BHC 2.0 임상 검사 시스템 로드 완료");
</script>
