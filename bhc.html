<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>뇌건강체크 BHC 2.0 - 임상 검사</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: linear-gradient(135deg, #667EEA 0%, #764BA2 100%); font-family: 'Segoe UI', 'Noto Sans KR', sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
.container { width: 100%; max-width: 720px; background: white; border-radius: 20px; padding: 30px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
.screen { display: none; }
.screen.active { display: block; animation: slideIn 0.5s; }
@keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

.start-screen { text-align: center; }
.brain-icon { font-size: 60px; margin-bottom: 20px; }
h1 { color: #667EEA; font-size: 32px; margin-bottom: 10px; font-weight: 700; }
.subtitle { color: #888; font-size: 14px; margin-bottom: 20px; }
.info-box { background: #F5F5F5; border-left: 4px solid #667EEA; padding: 15px; border-radius: 8px; text-align: left; font-size: 13px; color: #555; margin-bottom: 20px; line-height: 1.8; }
.btn { width: 100%; padding: 15px; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.3s; margin-top: 15px; }
.btn-primary { background: #667EEA; color: white; }
.btn-primary:hover { background: #764BA2; transform: translateY(-2px); }

.test-screen { display: flex; flex-direction: column; min-height: 700px; }
.progress-bar { width: 100%; height: 8px; background: #e0e0e0; border-radius: 10px; margin-bottom: 20px; overflow: hidden; }
.progress-fill { height: 100%; background: linear-gradient(90deg, #667EEA, #764BA2); width: 0%; transition: width 0.5s; }
.question-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px; }
.question-num { font-weight: 600; color: #667EEA; font-size: 16px; }
.domain-badge { background: #667EEA; color: white; padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 600; }
.timer { font-weight: 600; color: #FF6B6B; font-size: 16px; }

/* 문제 이미지 */
.problem-image { 
  width: 100%; 
  height: 300px; 
  background: linear-gradient(135deg, #f5f5f5, #e8e8e8); 
  border-radius: 15px; 
  display: flex; 
  align-items: center; 
  justify-content: center; 
  margin-bottom: 20px;
  border: 2px solid #667EEA;
  position: relative;
  overflow: hidden;
}
.problem-image img { max-width: 95%; max-height: 95%; object-fit: contain; }
.problem-image-placeholder { font-size: 14px; color: #999; text-align: center; padding: 20px; }

/* 선택지 */
.choices { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 25px; }
.choice-card { 
  border: 2px solid #ddd; 
  border-radius: 10px; 
  padding: 15px; 
  cursor: pointer; 
  transition: all 0.3s; 
  text-align: center;
  min-height: 90px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: white;
  font-weight: 600;
  color: #333;
  font-size: 13px;
}
.choice-card:hover { border-color: #667EEA; background: #F0F4FF; transform: scale(1.05); }
.choice-card.selected { border-color: #667EEA; background: #E8EAFF; border-width: 3px; }

.nav-buttons { display: flex; gap: 10px; margin-top: auto; }
.btn-nav { flex: 1; padding: 12px; border: 2px solid #667EEA; background: white; color: #667EEA; border-radius: 8px; font-weight: 600; cursor: pointer; transition: all 0.3s; }
.btn-nav:hover { background: #667EEA; color: white; }
.btn-nav:disabled { opacity: 0.5; cursor: not-allowed; }

.result-screen { text-align: center; }
.result-title { font-size: 28px; color: #667EEA; margin-bottom: 20px; font-weight: 700; }
.brain-age-box { background: linear-gradient(135deg, #667EEA, #764BA2); color: white; padding: 30px; border-radius: 15px; margin-bottom: 20px; cursor: pointer; transition: all 0.3s; }
.brain-age-box:hover { transform: scale(1.05); }
.brain-age-label { font-size: 14px; opacity: 0.9; margin-bottom: 10px; }
.brain-age-num { font-size: 56px; font-weight: 700; margin-bottom: 10px; }
.chart-box { background: #f9f9f9; padding: 20px; border-radius: 15px; margin-bottom: 20px; }

@media (max-width: 600px) { 
  .container { padding: 20px; } 
  h1 { font-size: 24px; } 
  .problem-image { height: 220px; }
  .choices { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<div class="container">
  <!-- 시작 화면 -->
  <div id="startScreen" class="screen active">
    <div class="brain-icon">🧠</div>
    <h1>뇌건강체크 BHC 2.0</h1>
    <p class="subtitle">Brain Health Check - 임상 인지 검사</p>
    <div class="info-box">
      <p>💡 <strong>8가지 인지 영역</strong>을 45개 임상 검사로 측정합니다.</p>
      <p style="margin-top: 10px;">✅ 기억 | 집중 | 감정 | 판단 | 실행 | 조절 | 공간 | 속도</p>
      <p style="margin-top: 10px;">⏱️ 소요 시간: 약 15~20분</p>
      <p style="margin-top: 10px;">📊 당신의 뇌 나이와 인지 강점을 알아보세요!</p>
    </div>
    <button class="btn btn-primary" onclick="startTest()">🚀 검사 시작하기</button>
  </div>

  <!-- 검사 화면 -->
  <div id="testScreen" class="screen test-screen">
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="question-header">
      <span class="question-num" id="questionNum">문항 1/45</span>
      <span class="domain-badge" id="domainBadge">기억</span>
      <span class="timer" id="timer">⏱ 12초</span>
    </div>
    
    <!-- 문제 이미지 -->
    <div class="problem-image" id="problemImage">
      <div class="problem-image-placeholder">이미지 로딩 중...</div>
    </div>

    <!-- 선택지 -->
    <div class="choices" id="choices"></div>

    <div class="nav-buttons">
      <button class="btn-nav" onclick="prevQuestion()" id="prevBtn" disabled>← 이전</button>
      <button class="btn-nav" onclick="nextQuestion()" id="nextBtn" disabled>다음 →</button>
    </div>
  </div>

  <!-- 결과 화면 -->
  <div id="resultScreen" class="screen result-screen">
    <div class="result-title">🎉 검사 완료!</div>
    <div class="brain-age-box" onclick="goToTraining()">
      <div class="brain-age-label">당신의 뇌 나이</div>
      <div class="brain-age-num" id="brainAge">--</div>
      <div style="font-size: 14px; margin-top: 10px;">👉 뇌훈련 프로그램 시작</div>
    </div>
    <div class="chart-box">
      <div style="font-size: 14px; font-weight: 600; color: #666; margin-bottom: 15px;">📊 8가지 인지 영역 분석</div>
      <canvas id="radarChart" height="300"></canvas>
    </div>
    <button class="btn btn-primary" onclick="goToTraining()">🧠 뇌훈련 시작</button>
    <button class="btn btn-primary" style="background: #f0f0f0; color: #333;" onclick="goHome()">🏠 홈페이지</button>
  </div>
</div>

  "실행": [

    { q: "목표를 달성했나요?", img: "1000050380.png", choices: ["완전히 달성", "대부분 달성", "절반 달성", "거의 못함", "실패"], ans: 0, time: 8 },
    { q: "과제를 완수했나요?", img: "1000050379.png", choices: ["완전히", "거의", "절반", "거의 못함", "전혀 못함"], ans: 0, time: 8 },
    { q: "계획대로 실행했나요?", img: "1000050378.png", choices: ["완벽히", "거의", "보통", "거의 못함", "전혀 못함"], ans: 1, time: 8 },
    { q: "어려운 과제를 극복했나요?", img: "1000050372.png", choices: ["매우 잘함", "잘함", "보통", "어려움", "포기함"], ans: 1, time: 8 }
  ],
  "조절": [
    { q: "충동을 억제할 수 있나요?", img: "1000050141.png", choices: ["매우 잘함", "잘함", "보통", "어려움", "할 수 없음"], ans: 1, time: 7 },

const DOMAINS = ["기억", "집중", "감정", "판단", "실행", "조절", "공간", "속도"];
let questionPool = [];
let currentQ = 0;
let answers = {};
let domainMap = {};

// 문제 풀 생성
function createQuestionPool() {
  questionPool = [];
  DOMAINS.forEach((domain, idx) => {
    const questions = QUESTIONS_DATA[domain];
    questions.forEach((q, qidx) => {
      questionPool.push({
        domain: domain,
        domainIndex: idx,
        qIndex: qidx,
        ...q
      });
      domainMap[questionPool.length - 1] = domain;
    });
  });
}

function startTest() {
  createQuestionPool();
  currentQ = 0;
  answers = {};
  showScreen("testScreen");
  loadQuestion();
}

function loadQuestion() {
  const q = questionPool[currentQ];
  const progress = ((currentQ + 1) / 45) * 100;

  document.getElementById("progressFill").style.width = progress + "%";
  document.getElementById("questionNum").textContent = `문항 ${currentQ + 1}/45`;
  document.getElementById("domainBadge").textContent = q.domain;
  document.getElementById("timer").textContent = `⏱ ${q.time}초`;

  // 문제 이미지 로드
  const imgDiv = document.getElementById("problemImage");
  imgDiv.innerHTML = `<img src="/assets/img/${q.img}" alt="문제이미지" onerror="this.parentElement.innerHTML='<div class=problem-image-placeholder>이미지를 불러올 수 없습니다</div>'">`;

  // 선택지 렌더링
  const choices = document.getElementById("choices");
  choices.innerHTML = "";
  q.choices.forEach((choice, idx) => {
    const card = document.createElement("div");
    card.className = "choice-card" + (answers[currentQ] === idx ? " selected" : "");
    card.onclick = () => selectAnswer(idx);
    card.textContent = choice;
    choices.appendChild(card);
  });

  document.getElementById("prevBtn").disabled = currentQ === 0;
  document.getElementById("nextBtn").disabled = !answers[currentQ];
}

function selectAnswer(idx) {
  answers[currentQ] = idx;
  loadQuestion();
}

function prevQuestion() {
  if (currentQ > 0) {
    currentQ--;
    loadQuestion();
  }
}

function nextQuestion() {
  if (currentQ < 44) {
    currentQ++;
    loadQuestion();
  } else if (currentQ === 44) {
    completeTest();
  }
}

function completeTest() {
  calculateResults();
  showScreen("resultScreen");
}

function calculateResults() {
  const scores = {};
  DOMAINS.forEach(d => { scores[d] = 0; });
  
  questionPool.forEach((q, i) => {
    if (answers[i] === q.ans) {
      scores[q.domain]++;
    }
  });

  const avgScores = {};
  DOMAINS.forEach(d => {
    const count = questionPool.filter(q => q.domain === d).length;
    avgScores[d] = Math.round((scores[d] / count) * 100);
  });

  const avg = Object.values(avgScores).reduce((a, b) => a + b) / 8;
  let brainAge = 100 - Math.round(avg * 0.3);
  if (brainAge < 5) brainAge = 5;
  if (brainAge > 100) brainAge = 100;

  document.getElementById("brainAge").textContent = brainAge + "세";

  // 레이더 차트
  if (window.radarChart) window.radarChart.destroy();
  const radarCtx = document.getElementById("radarChart").getContext("2d");
  window.radarChart = new Chart(radarCtx, {
    type: "radar",
    data: {
      labels: DOMAINS,
      datasets: [{ label: "점수", data: DOMAINS.map(d => avgScores[d]), borderColor: "#667EEA", backgroundColor: "rgba(102, 126, 234, 0.15)", borderWidth: 3, pointRadius: 5 }]
    },
    options: { responsive: true, scales: { r: { min: 0, max: 100 } }, plugins: { legend: { display: false } } }
  });
}

function showScreen(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

function goToTraining() { window.location.href = "/brain_training.html"; }
function goHome() { window.location.href = "/"; }

console.log("✅ BHC 2.0 임상 검사 완성 로드됨");
</script>
