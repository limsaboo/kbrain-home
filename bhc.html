<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>뇌건강체크 BHC 2.0</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: linear-gradient(135deg, #667EEA 0%, #764BA2 100%); font-family: 'Segoe UI', 'Noto Sans KR', sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
.container { width: 100%; max-width: 650px; background: white; border-radius: 20px; padding: 30px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
.screen { display: none; }
.screen.active { display: block; animation: slideIn 0.5s; }
@keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

.start-screen { text-align: center; }
.brain-icon { font-size: 60px; margin-bottom: 20px; }
h1 { color: #667EEA; font-size: 32px; margin-bottom: 10px; font-weight: 700; }
.subtitle { color: #888; font-size: 14px; margin-bottom: 20px; }
.info-box { background: #F5F5F5; border-left: 4px solid #667EEA; padding: 15px; border-radius: 8px; text-align: left; font-size: 14px; color: #555; margin-bottom: 20px; line-height: 1.8; }
.btn { width: 100%; padding: 15px; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.3s; margin-top: 15px; }
.btn-primary { background: #667EEA; color: white; }
.btn-primary:hover { background: #764BA2; transform: translateY(-2px); }

.test-screen { display: flex; flex-direction: column; min-height: 650px; }
.progress-bar { width: 100%; height: 8px; background: #e0e0e0; border-radius: 10px; margin-bottom: 20px; overflow: hidden; }
.progress-fill { height: 100%; background: linear-gradient(90deg, #667EEA, #764BA2); width: 0%; transition: width 0.5s; }
.question-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
.question-num { font-weight: 600; color: #667EEA; font-size: 16px; }
.domain-badge { background: #667EEA; color: white; padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 600; }

/* 상황이미지 */
.situation-image { 
  width: 100%; 
  height: 280px; 
  background: linear-gradient(135deg, #f5f5f5, #e8e8e8); 
  border-radius: 15px; 
  display: flex; 
  align-items: center; 
  justify-content: center; 
  margin-bottom: 20px;
  border: 3px solid #667EEA;
  position: relative;
}
.situation-svg { width: 100%; height: 100%; }

/* 컴팩트 이모지 선택 */
.emoji-scale { 
  display: flex; 
  justify-content: space-between; 
  gap: 8px; 
  margin-bottom: 25px; 
  flex-wrap: wrap;
}
.emoji-card { 
  display: flex; 
  flex-direction: column; 
  align-items: center; 
  cursor: pointer; 
  transition: all 0.3s; 
  padding: 8px; 
  border-radius: 10px; 
  flex: 1; 
  min-width: 60px;
  max-width: 75px;
}
.emoji-card:hover { background: #F0F4FF; transform: scale(1.05); }
.emoji-card.selected { background: #E8EAFF; border: 2px solid #667EEA; }
.emoji-icon { font-size: 32px; margin-bottom: 4px; }
.emoji-label { font-size: 10px; font-weight: 700; color: #333; text-align: center; line-height: 1.2; }
.emoji-score { font-size: 9px; color: #667EEA; margin-top: 2px; font-weight: 600; }

.nav-buttons { display: flex; gap: 10px; margin-top: auto; }
.btn-nav { flex: 1; padding: 12px; border: 2px solid #667EEA; background: white; color: #667EEA; border-radius: 8px; font-weight: 600; cursor: pointer; }
.btn-nav:hover { background: #667EEA; color: white; }
.btn-nav:disabled { opacity: 0.5; cursor: not-allowed; }

.result-screen { text-align: center; }
.result-title { font-size: 28px; color: #667EEA; margin-bottom: 20px; font-weight: 700; }
.brain-age-box { background: linear-gradient(135deg, #667EEA, #764BA2); color: white; padding: 30px; border-radius: 15px; margin-bottom: 20px; cursor: pointer; transition: all 0.3s; }
.brain-age-box:hover { transform: scale(1.05); }
.brain-age-label { font-size: 14px; opacity: 0.9; margin-bottom: 10px; }
.brain-age-num { font-size: 56px; font-weight: 700; margin-bottom: 10px; }
.chart-box { background: #f9f9f9; padding: 20px; border-radius: 15px; margin-bottom: 20px; }
.score-box { background: #f5f5f5; padding: 15px; border-radius: 10px; text-align: left; font-size: 14px; }
.score-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #ddd; }
.score-item:last-child { border-bottom: none; }
.score-value { color: #667EEA; font-weight: 600; }

@media (max-width: 600px) { 
  .container { padding: 20px; } 
  h1 { font-size: 24px; } 
  .situation-image { height: 220px; } 
  .emoji-icon { font-size: 28px; }
  .brain-age-num { font-size: 48px; } 
}
</style>
</head>
<body>

<div class="container">
  <!-- 시작 화면 -->
  <div id="startScreen" class="screen active">
    <div class="brain-icon">🧠</div>
    <h1>뇌건강체크 BHC 2.0</h1>
    <p class="subtitle">Brain Health Check - 한국뇌심리연구소</p>
    <div class="info-box">
      <p>💡 45개 상황이미지로 8가지 뇌 인지 영역을 측정합니다.</p>
      <p style="margin-top: 10px;">⏱️ 소요 시간: 약 15~20분</p>
      <p style="margin-top: 10px;">📊 당신의 뇌 나이를 알아보고 무료 뇌훈련 프로그램에 참여하세요!</p>
    </div>
    <button class="btn btn-primary" onclick="startTest()">🚀 검사 시작하기</button>
  </div>

  <!-- 검사 화면 -->
  <div id="testScreen" class="screen test-screen">
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="question-header">
      <span class="question-num" id="questionNum">문항 1/45</span>
      <span class="domain-badge" id="domainBadge">기억</span>
    </div>
    
    <!-- 상황이미지 -->
    <div class="situation-image" id="situationImage">
      <svg class="situation-svg" viewBox="0 0 400 280"></svg>
    </div>

    <!-- 컴팩트 이모지 선택 -->
    <div class="emoji-scale" id="emojiScale"></div>

    <div class="nav-buttons">
      <button class="btn-nav" onclick="prevQuestion()" id="prevBtn" disabled>← 이전</button>
      <button class="btn-nav" onclick="nextQuestion()" id="nextBtn" disabled>다음 →</button>
    </div>
  </div>

  <!-- 결과 화면 -->
  <div id="resultScreen" class="screen result-screen">
    <div class="result-title">🎉 검사 완료!</div>
    <div class="brain-age-box" onclick="goToTraining()">
      <div class="brain-age-label">당신의 뇌 나이</div>
      <div class="brain-age-num" id="brainAge">--</div>
      <div style="font-size: 14px; margin-top: 10px;">👉 클릭하여 무료 뇌훈련 시작!</div>
    </div>
    <div class="chart-box">
      <div style="font-size: 14px; font-weight: 600; color: #666; margin-bottom: 15px; text-align: left;">📊 8가지 뇌 인지 영역</div>
      <canvas id="radarChart" height="300"></canvas>
    </div>
    <div class="chart-box">
      <div style="font-size: 14px; font-weight: 600; color: #666; margin-bottom: 15px; text-align: left;">📈 연령층 비교</div>
      <canvas id="barChart" height="300"></canvas>
    </div>
    <div class="score-box">
      <div style="font-weight: 600; color: #667EEA; margin-bottom: 10px;">영역별 점수</div>
      <div id="scoreDetails"></div>
    </div>
    <button class="btn btn-primary" onclick="goToTraining()">🧠 뇌훈련 시작</button>
    <button class="btn btn-primary" style="background: #f0f0f0; color: #333;" onclick="goHome()">🏠 홈페이지</button>
  </div>
</div>

<script>
// 45개 문항 - 상황이미지 타입 정의
const QUESTIONS = [
  // 기억 10개
  { d: "기억", type: "remembering_article" },
  { d: "기억", type: "remembering_birthday" },
  { d: "기억", type: "remembering_phone" },
  { d: "기억", type: "remembering_order" },
  { d: "기억", type: "remembering_reading" },
  { d: "기억", type: "remembering_name" },
  { d: "기억", type: "remembering_location" },
  { d: "기억", type: "remembering_day" },
  { d: "기억", type: "remembering_place" },
  { d: "기억", type: "remembering_conversation" },
  // 집중 5개
  { d: "집중", type: "focusing_one_task" },
  { d: "집중", type: "ignoring_noise" },
  { d: "집중", type: "complex_problem" },
  { d: "집중", type: "reading_focus" },
  { d: "집중", type: "multitasking" },
  // 감정 5개
  { d: "감정", type: "controlling_stress" },
  { d: "감정", type: "controlling_anger" },
  { d: "감정", type: "recovering_sadness" },
  { d: "감정", type: "resilience_criticism" },
  { d: "감정", type: "expressing_joy" },
  // 판단 5개
  { d: "판단", type: "thoughtful_decision" },
  { d: "판단", type: "comparing_choices" },
  { d: "판단", type: "danger_judgment" },
  { d: "판단", type: "reading_intention" },
  { d: "판단", type: "avoiding_bias" },
  // 실행 5개
  { d: "실행", type: "completing_plan" },
  { d: "실행", type: "meeting_deadline" },
  { d: "실행", type: "persisting_difficulty" },
  { d: "실행", type: "setting_priority" },
  { d: "실행", type: "voluntary_action" },
  // 조절 5개
  { d: "조절", type: "controlling_desire" },
  { d: "조절", type: "regular_routine" },
  { d: "조절", type: "healthy_habits" },
  { d: "조절", type: "restraint" },
  { d: "조절", type: "screen_control" },
  // 공간 5개
  { d: "공간", type: "3d_rotation" },
  { d: "공간", type: "reading_map" },
  { d: "공간", type: "location_memory" },
  { d: "공간", type: "direction_sense" },
  { d: "공간", type: "understanding_chart" },
  // 속도 10개
  { d: "속도", type: "speaking_speed" },
  { d: "속도", type: "reaction_speed" },
  { d: "속도", type: "typing_speed" },
  { d: "속도", type: "reading_speed" },
  { d: "속도", type: "game_reaction" },
  { d: "속도", type: "information_processing" },
  { d: "속도", type: "movement_agility" },
  { d: "속도", type: "danger_detection" },
  { d: "속도", type: "scanning_speed" },
  { d: "속도", type: "calculation_speed" }
];

const EMOJI_SCALE = [
  { icon: '😍', label: '매우\n그렇다', value: 5 },
  { icon: '😊', label: '그렇다', value: 4 },
  { icon: '😐', label: '보통', value: 3 },
  { icon: '😟', label: '아니다', value: 2 },
  { icon: '😭', label: '아니다', value: 1 }
];

const DOMAINS = ["기억", "집중", "감정", "판단", "실행", "조절", "공간", "속도"];

let currentQ = 0;
let answers = {};

// 상황이미지 생성 함수
function generateSituationImage(type) {
  const situations = {
    // 기억
    remembering_article: '<g><rect x="30" y="30" width="200" height="200" fill="#f0f0f0" stroke="#667EEA" stroke-width="3" rx="5"/><line x1="45" y1="60" x2="215" y2="60" stroke="#667EEA" stroke-width="2"/><line x1="45" y1="90" x2="215" y2="90" stroke="#667EEA" stroke-width="2"/><line x1="45" y1="120" x2="215" y2="120" stroke="#667EEA" stroke-width="2"/><line x1="45" y1="150" x2="180" y2="150" stroke="#667EEA" stroke-width="2"/><line x1="45" y1="180" x2="210" y2="180" stroke="#667EEA" stroke-width="2"/><circle cx="260" cy="130" r="40" fill="none" stroke="#FF6B9D" stroke-width="3"/><text x="260" y="140" text-anchor="middle" font-size="16" fill="#FF6B9D" font-weight="bold">?</text><text x="200" y="270" text-anchor="middle" font-size="14" fill="#667EEA" font-weight="bold">기사 내용이 기억나나요?</text></g>',
    
    remembering_birthday: '<g><circle cx="130" cy="100" r="50" fill="#FFD700" stroke="#667EEA" stroke-width="3"/><path d="M 110 70 L 130 50 L 150 70" fill="#FF6B9D"/><path d="M 110 70 L 130 50 L 150 70 L 130 80 Z" fill="#FF6B9D" stroke="#667EEA" stroke-width="2"/><text x="130" y="110" text-anchor="middle" font-size="20" fill="#333" font-weight="bold">🎂</text><circle cx="260" cy="100" r="35" fill="none" stroke="#FF6B9D" stroke-width="3"/><text x="260" y="110" text-anchor="middle" font-size="14" fill="#FF6B9D" font-weight="bold">?</text><text x="200" y="270" text-anchor="middle" font-size="14" fill="#667EEA" font-weight="bold">생일을 기억하나요?</text></g>',
    
    remembering_phone: '<g><rect x="70" y="60" width="60" height="100" fill="none" stroke="#667EEA" stroke-width="3" rx="5"/><circle cx="100" cy="95" r="4" fill="#667EEA"/><text x="100" y="135" text-anchor="middle" font-size="10" fill="#667EEA" font-weight="bold">📞</text><text x="120" y="80" font-size="24">1 2 3</text><text x="120" y="105" font-size="24">4 5 6</text><circle cx="260" cy="110" r="40" fill="none" stroke="#FF6B9D" stroke-width="3"/><text x="260" y="120" text-anchor="middle" font-size="16" fill="#FF6B9D" font-weight="bold">?</text><text x="200" y="270" text-anchor="middle" font-size="14" fill="#667EEA" font-weight="bold">전화번호를 기억하나요?</text></g>',
    
    focusing_one_task: '<g><rect x="60" y="50" width="140" height="140" fill="#E8EAFF" stroke="#667EEA" stroke-width="3" rx="8"/><circle cx="130" cy="120" r="60" fill="none" stroke="#667EEA" stroke-width="3"/><text x="130" y="130" text-anchor="middle" font-size="24" fill="#667EEA" font-weight="bold">→</text><line x1="20" y1="70" x2="40" y2="70" stroke="#FF6B9D" stroke-width="3" opacity="0.3"/><line x1="20" y1="110" x2="40" y2="110" stroke="#FF6B9D" stroke-width="3" opacity="0.3"/><line x1="270" y1="90" x2="290" y2="90" stroke="#FF6B9D" stroke-width="3" opacity="0.3"/><line x1="270" y1="150" x2="290" y2="150" stroke="#FF6B9D" stroke-width="3" opacity="0.3"/><text x="200" y="270" text-anchor="middle" font-size="14" fill="#667EEA" font-weight="bold">한 일에 집중할 수 있나요?</text></g>',
    
    controlling_stress: '<g><ellipse cx="130" cy="110" rx="60" ry="70" fill="none" stroke="#667EEA" stroke-width="3"/><path d="M 100 80 Q 95 95 100 100" fill="none" stroke="#FF6B9D" stroke-width="2" opacity="0.6"/><path d="M 160 80 Q 165 95 160 100" fill="none" stroke="#FF6B9D" stroke-width="2" opacity="0.6"/><path d="M 110 130 L 150 130" stroke="#667EEA" stroke-width="2"/><path d="M 80 60 L 100 40 L 120 60" fill="#FFD700" stroke="#FF6B9D" stroke-width="2"/><text x="200" y="270" text-anchor="middle" font-size="14" fill="#667EEA" font-weight="bold">스트레스를 조절하나요?</text></g>',
    
    thoughtful_decision: '<g><circle cx="100" cy="110" r="35" fill="none" stroke="#667EEA" stroke-width="3"/><text x="100" y="120" text-anchor="middle" font-size="16" fill="#667EEA" font-weight="bold">A</text><circle cx="160" cy="110" r="35" fill="none" stroke="#667EEA" stroke-width="3"/><text x="160" y="120" text-anchor="middle" font-size="16" fill="#667EEA" font-weight="bold">B</text><path d="M 130 90 L 130 70" stroke="#FF6B9D" stroke-width="3"/><circle cx="130" cy="60" r="8" fill="#FF6B9D"/><text x="200" y="270" text-anchor="middle" font-size="14" fill="#667EEA" font-weight="bold">결정을 신중하게 하나요?</text></g>',
    
    completing_plan: '<g><rect x="50" y="60" width="160" height="30" fill="none" stroke="#667EEA" stroke-width="2" rx="5"/><text x="130" y="82" text-anchor="middle" font-size="12" fill="#667EEA" font-weight="bold">STEP 1</text><path d="M 130 95 L 130 105" stroke="#667EEA" stroke-width="2" marker-end="url(#arrowhead)"/><rect x="50" y="110" width="160" height="30" fill="none" stroke="#667EEA" stroke-width="2" rx="5"/><text x="130" y="132" text-anchor="middle" font-size="12" fill="#667EEA" font-weight="bold">STEP 2</text><path d="M 130 145 L 130 155" stroke="#667EEA" stroke-width="2" marker-end="url(#arrowhead)"/><rect x="50" y="160" width="160" height="30" fill="#00AA00" stroke="#667EEA" stroke-width="2" rx="5"/><text x="130" y="182" text-anchor="middle" font-size="12" fill="white" font-weight="bold">DONE!</text><text x="200" y="270" text-anchor="middle" font-size="14" fill="#667EEA" font-weight="bold">계획을 완수하나요?</text></g>',
    
    reading_map: '<g><path d="M 60 100 Q 100 40 140 80 T 200 120" fill="none" stroke="#667EEA" stroke-width="3"/><circle cx="60" cy="100" r="6" fill="#00FF00"/><circle cx="200" cy="120" r="6" fill="#FF0000"/><circle cx="100" cy="80" r="3" fill="#667EEA" opacity="0.5"/><circle cx="150" cy="110" r="3" fill="#667EEA" opacity="0.5"/><text x="130" y="170" text-anchor="middle" font-size="12" fill="#FF6B9D" font-weight="bold">출발</text><text x="200" y="170" text-anchor="middle" font-size="12" fill="#FF6B9D" font-weight="bold">도착</text><text x="200" y="270" text-anchor="middle" font-size="14" fill="#667EEA" font-weight="bold">지도를 보고 길을 찾나요?</text></g>',
    
    speaking_speed: '<g><circle cx="100" cy="110" r="40" fill="none" stroke="#667EEA" stroke-width="3"/><circle cx="100" cy="110" r="6" fill="#667EEA"/><path d="M 140 90 Q 160 80 170 90" fill="none" stroke="#FF6B9D" stroke-width="3"/><path d="M 140 110 Q 160 110 170 110" fill="none" stroke="#FF6B9D" stroke-width="3"/><path d="M 140 130 Q 160 140 170 130" fill="none" stroke="#FF6B9D" stroke-width="3"/><text x="200" y="270" text-anchor="middle" font-size="14" fill="#667EEA" font-weight="bold">질문에 빠르게 답하나요?</text></g>',

    default: '<g><circle cx="130" cy="110" r="50" fill="none" stroke="#667EEA" stroke-width="3"/><text x="130" y="120" text-anchor="middle" font-size="28" fill="#667EEA" font-weight="bold">?</text><text x="200" y="270" text-anchor="middle" font-size="14" fill="#667EEA" font-weight="bold">뇌 검사 상황</text></g>'
  };
  return situations[type] || situations.default;
}

function startTest() {
  currentQ = 0;
  answers = {};
  showScreen("testScreen");
  loadQuestion();
}

function loadQuestion() {
  const q = QUESTIONS[currentQ];
  const progress = ((currentQ + 1) / 45) * 100;

  document.getElementById("progressFill").style.width = progress + "%";
  document.getElementById("questionNum").textContent = `문항 ${currentQ + 1}/45`;
  document.getElementById("domainBadge").textContent = q.d;

  // 상황이미지 SVG 그리기
  const svg = document.querySelector(".situation-svg");
  svg.innerHTML = generateSituationImage(q.type);

  // 컴팩트 이모지 카드 렌더링
  const scale = document.getElementById("emojiScale");
  scale.innerHTML = "";
  EMOJI_SCALE.forEach((opt) => {
    const card = document.createElement("div");
    card.className = "emoji-card" + (answers[currentQ] === opt.value ? " selected" : "");
    card.onclick = () => selectAnswer(opt.value);
    card.innerHTML = `
      <div class="emoji-icon">${opt.icon}</div>
      <div class="emoji-label">${opt.label}</div>
      <div class="emoji-score">${opt.value}</div>
    `;
    scale.appendChild(card);
  });

  document.getElementById("prevBtn").disabled = currentQ === 0;
  document.getElementById("nextBtn").disabled = !answers[currentQ];
}

function selectAnswer(value) {
  answers[currentQ] = value;
  loadQuestion();
}

function prevQuestion() {
  if (currentQ > 0) {
    currentQ--;
    loadQuestion();
  }
}

function nextQuestion() {
  if (currentQ < 44) {
    currentQ++;
    loadQuestion();
  } else if (currentQ === 44) {
    completeTest();
  }
}

function completeTest() {
  calculateResults();
  showScreen("resultScreen");
}

function calculateResults() {
  const scores = {};
  DOMAINS.forEach(d => { scores[d] = 0; });
  
  QUESTIONS.forEach((q, i) => {
    scores[q.d] += answers[i] || 0;
  });

  const avgScores = {};
  DOMAINS.forEach(d => {
    const count = QUESTIONS.filter(q => q.d === d).length;
    avgScores[d] = Math.round((scores[d] / count) * 20);
  });

  const avg = Object.values(avgScores).reduce((a, b) => a + b) / 8;
  let brainAge = 100 - Math.round(avg * 0.3);
  if (brainAge < 5) brainAge = 5;
  if (brainAge > 100) brainAge = 100;

  document.getElementById("brainAge").textContent = brainAge + "세";

  // 레이더 차트
  if (window.radarChart) window.radarChart.destroy();
  const radarCtx = document.getElementById("radarChart").getContext("2d");
  window.radarChart = new Chart(radarCtx, {
    type: "radar",
    data: {
      labels: DOMAINS,
      datasets: [{ label: "점수", data: DOMAINS.map(d => avgScores[d]), borderColor: "#667EEA", backgroundColor: "rgba(102, 126, 234, 0.15)", borderWidth: 3, pointRadius: 5 }]
    },
    options: { responsive: true, scales: { r: { min: 0, max: 100 } }, plugins: { legend: { display: false } } }
  });

  // 막대 차트
  if (window.barChart) window.barChart.destroy();
  const barCtx = document.getElementById("barChart").getContext("2d");
  const ageGroups = ["유치", "10대", "20대", "30대", "40대", "50대", "60대", "70대", "80대", "90대"];
  const avgAges = [85, 90, 88, 85, 80, 75, 70, 65, 60, 55];
  window.barChart = new Chart(barCtx, {
    type: "bar",
    data: {
      labels: ageGroups,
      datasets: [
        { label: "연령층 평균", data: avgAges, backgroundColor: "rgba(102, 126, 234, 0.6)" },
        { label: "당신의 점수", data: ageGroups.map(() => avg), backgroundColor: "rgba(244, 67, 54, 0.7)" }
      ]
    },
    options: { responsive: true, scales: { y: { min: 0, max: 100 } }, plugins: { legend: { display: true } } }
  });

  document.getElementById("scoreDetails").innerHTML = DOMAINS.map(d => `<div class="score-item"><span>${d}</span><span class="score-value">${avgScores[d]}</span></div>`).join("");
}

function showScreen(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

function goToTraining() { window.location.href = "/brain_training.html"; }
function goHome() { window.location.href = "/"; }

console.log("✅ BHC 상황이미지 완성버전 로드됨");
