<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>뇌건강체크 BHC 2.0</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: linear-gradient(135deg, #667EEA 0%, #764BA2 100%); font-family: 'Segoe UI', 'Noto Sans KR', sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
.container { width: 100%; max-width: 650px; background: white; border-radius: 20px; padding: 30px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
.screen { display: none; }
.screen.active { display: block; animation: slideIn 0.5s; }
@keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

.start-screen { text-align: center; }
.brain-icon { font-size: 60px; margin-bottom: 20px; }
h1 { color: #667EEA; font-size: 32px; margin-bottom: 10px; font-weight: 700; }
.subtitle { color: #888; font-size: 14px; margin-bottom: 20px; }
.info-box { background: #F5F5F5; border-left: 4px solid #667EEA; padding: 15px; border-radius: 8px; text-align: left; font-size: 14px; color: #555; margin-bottom: 20px; line-height: 1.8; }
.btn { width: 100%; padding: 15px; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.3s; margin-top: 15px; }
.btn-primary { background: #667EEA; color: white; }
.btn-primary:hover { background: #764BA2; transform: translateY(-2px); }

.test-screen { display: flex; flex-direction: column; min-height: 600px; }
.progress-bar { width: 100%; height: 8px; background: #e0e0e0; border-radius: 10px; margin-bottom: 20px; overflow: hidden; }
.progress-fill { height: 100%; background: linear-gradient(90deg, #667EEA, #764BA2); width: 0%; transition: width 0.5s; }
.question-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
.question-num { font-weight: 600; color: #667EEA; font-size: 16px; }
.domain-badge { background: #667EEA; color: white; padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 600; }

/* 그림 프롬프트 */
.image-prompt { 
  width: 100%; 
  height: 250px; 
  background: linear-gradient(135deg, #f5f5f5, #e8e8e8); 
  border-radius: 15px; 
  display: flex; 
  align-items: center; 
  justify-content: center; 
  margin-bottom: 30px;
  flex-shrink: 0;
}
.prompt-svg { width: 100%; height: 100%; }

/* 이모지 선택 */
.emoji-scale { display: flex; justify-content: space-around; gap: 10px; margin-bottom: 30px; flex-wrap: wrap; }
.emoji-card { display: flex; flex-direction: column; align-items: center; cursor: pointer; transition: all 0.3s; padding: 12px; border-radius: 12px; flex: 1; min-width: 70px; }
.emoji-card:hover { background: #F0F4FF; transform: scale(1.1); }
.emoji-card.selected { background: #E8EAFF; border: 3px solid #667EEA; }
.emoji-icon { font-size: 48px; margin-bottom: 8px; }
.emoji-label { font-size: 11px; font-weight: 700; color: #333; text-align: center; letter-spacing: -0.5px; line-height: 1.3; }
.emoji-score { font-size: 10px; color: #667EEA; margin-top: 4px; font-weight: 600; }

.nav-buttons { display: flex; gap: 10px; margin-top: auto; }
.btn-nav { flex: 1; padding: 14px; border: 2px solid #667EEA; background: white; color: #667EEA; border-radius: 8px; font-weight: 600; cursor: pointer; }
.btn-nav:hover { background: #667EEA; color: white; }
.btn-nav:disabled { opacity: 0.5; cursor: not-allowed; }

.result-screen { text-align: center; }
.result-title { font-size: 28px; color: #667EEA; margin-bottom: 20px; font-weight: 700; }
.brain-age-box { background: linear-gradient(135deg, #667EEA, #764BA2); color: white; padding: 30px; border-radius: 15px; margin-bottom: 20px; cursor: pointer; transition: all 0.3s; }
.brain-age-box:hover { transform: scale(1.05); }
.brain-age-label { font-size: 14px; opacity: 0.9; margin-bottom: 10px; }
.brain-age-num { font-size: 56px; font-weight: 700; margin-bottom: 10px; }
.chart-box { background: #f9f9f9; padding: 20px; border-radius: 15px; margin-bottom: 20px; }
.score-box { background: #f5f5f5; padding: 15px; border-radius: 10px; text-align: left; font-size: 14px; }
.score-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #ddd; }
.score-item:last-child { border-bottom: none; }
.score-value { color: #667EEA; font-weight: 600; }

@media (max-width: 600px) { 
  .container { padding: 20px; } 
  h1 { font-size: 24px; } 
  .image-prompt { height: 200px; } 
  .emoji-icon { font-size: 40px; }
  .brain-age-num { font-size: 48px; } 
}
</style>
</head>
<body>

<div class="container">
  <!-- 시작 화면 -->
  <div id="startScreen" class="screen active">
    <div class="brain-icon">🧠</div>
    <h1>뇌건강체크 BHC 2.0</h1>
    <p class="subtitle">Brain Health Check - 한국뇌심리연구소</p>
    <div class="info-box">
      <p>💡 45개 그림 프롬프트로 8가지 뇌 인지 영역을 측정합니다.</p>
      <p style="margin-top: 10px;">⏱️ 소요 시간: 약 15~20분</p>
      <p style="margin-top: 10px;">📊 당신의 뇌 나이를 알아보고 무료 뇌훈련 프로그램에 참여하세요!</p>
    </div>
    <button class="btn btn-primary" onclick="startTest()">🚀 검사 시작하기</button>
  </div>

  <!-- 검사 화면 -->
  <div id="testScreen" class="screen test-screen">
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="question-header">
      <span class="question-num" id="questionNum">문항 1/45</span>
      <span class="domain-badge" id="domainBadge">기억</span>
    </div>
    
    <!-- 그림 프롬프트 (SVG) -->
    <div class="image-prompt" id="imagePrompt">
      <svg class="prompt-svg" viewBox="0 0 400 250"></svg>
    </div>

    <!-- 이모지 선택 -->
    <div class="emoji-scale" id="emojiScale"></div>

    <div class="nav-buttons">
      <button class="btn-nav" onclick="prevQuestion()" id="prevBtn" disabled>← 이전</button>
      <button class="btn-nav" onclick="nextQuestion()" id="nextBtn" disabled>다음 →</button>
    </div>
  </div>

  <!-- 결과 화면 -->
  <div id="resultScreen" class="screen result-screen">
    <div class="result-title">🎉 검사 완료!</div>
    <div class="brain-age-box" onclick="goToTraining()">
      <div class="brain-age-label">당신의 뇌 나이</div>
      <div class="brain-age-num" id="brainAge">--</div>
      <div style="font-size: 14px; margin-top: 10px;">👉 클릭하여 무료 뇌훈련 시작!</div>
    </div>
    <div class="chart-box">
      <div style="font-size: 14px; font-weight: 600; color: #666; margin-bottom: 15px; text-align: left;">📊 8가지 뇌 인지 영역 분석</div>
      <canvas id="radarChart" height="300"></canvas>
    </div>
    <div class="chart-box">
      <div style="font-size: 14px; font-weight: 600; color: #666; margin-bottom: 15px; text-align: left;">📈 연령층 비교 분석</div>
      <canvas id="barChart" height="300"></canvas>
    </div>
    <div class="score-box">
      <div style="font-weight: 600; color: #667EEA; margin-bottom: 10px;">영역별 점수</div>
      <div id="scoreDetails"></div>
    </div>
    <div style="background: #E3F2FD; border-left: 4px solid #667EEA; padding: 15px; border-radius: 8px; margin: 20px 0; text-align: left; font-size: 13px; color: #1565C0;">
      ℹ️ 이 검사는 의료 진단이 아닙니다. 개인의 뇌 건강을 이해하기 위한 교육용 도구입니다.
    </div>
    <button class="btn btn-primary" onclick="goToTraining()">🧠 뇌훈련 프로그램 참여</button>
    <button class="btn btn-primary" style="background: #f0f0f0; color: #333;" onclick="goHome()">🏠 홈페이지로</button>
  </div>
</div>

<script>
// 45개 문항 (도메인 + SVG 프롬프트)
const QUESTIONS = [
  { d: "기억", q: 1, prompt: "book" },    // 기억 10개
  { d: "기억", q: 2, prompt: "calendar" },
  { d: "기억", q: 3, prompt: "phone" },
  { d: "기억", q: 4, prompt: "list" },
  { d: "기억", q: 5, prompt: "book" },
  { d: "기억", q: 6, prompt: "face" },
  { d: "기억", q: 7, prompt: "box" },
  { d: "기억", q: 8, prompt: "clock" },
  { d: "기억", q: 9, prompt: "place" },
  { d: "기억", q: 10, prompt: "conversation" },
  { d: "집중", q: 11, prompt: "target" },  // 집중 5개
  { d: "집중", q: 12, prompt: "sound" },
  { d: "집중", q: 13, prompt: "puzzle" },
  { d: "집중", q: 14, prompt: "reading" },
  { d: "집중", q: 15, prompt: "multitask" },
  { d: "감정", q: 16, prompt: "stress" },  // 감정 5개
  { d: "감정", q: 17, prompt: "anger" },
  { d: "감정", q: 18, prompt: "sad" },
  { d: "감정", q: 19, prompt: "criticism" },
  { d: "감정", q: 20, prompt: "happy" },
  { d: "판단", q: 21, prompt: "decision" }, // 판단 5개
  { d: "판단", q: 22, prompt: "compare" },
  { d: "판단", q: 23, prompt: "danger" },
  { d: "판단", q: 24, prompt: "intention" },
  { d: "판단", q: 25, prompt: "bias" },
  { d: "실행", q: 26, prompt: "plan" },    // 실행 5개
  { d: "실행", q: 27, prompt: "deadline" },
  { d: "실행", q: 28, prompt: "difficult" },
  { d: "실행", q: 29, prompt: "priority" },
  { d: "실행", q: 30, prompt: "voluntary" },
  { d: "조절", q: 31, prompt: "control" }, // 조절 5개
  { d: "조절", q: 32, prompt: "routine" },
  { d: "조절", q: 33, prompt: "health" },
  { d: "조절", q: 34, prompt: "restrain" },
  { d: "조절", q: 35, prompt: "screen" },
  { d: "공간", q: 36, prompt: "3d" },     // 공간 5개
  { d: "공간", q: 37, prompt: "map" },
  { d: "공간", q: 38, prompt: "location" },
  { d: "공간", q: 39, prompt: "direction" },
  { d: "공간", q: 40, prompt: "shape" },
  { d: "속도", q: 41, prompt: "speed" },  // 속도 10개
  { d: "속도", q: 42, prompt: "reaction" },
  { d: "속도", q: 43, prompt: "typing" },
  { d: "속도", q: 44, prompt: "reading_speed" },
  { d: "속도", q: 45, prompt: "game" }
];

const EMOJI_SCALE = [
  { icon: '😍', label: '매우\n그렇다', value: 5 },
  { icon: '😊', label: '그렇다', value: 4 },
  { icon: '😐', label: '보통', value: 3 },
  { icon: '😟', label: '아니다', value: 2 },
  { icon: '😭', label: '전혀\n아니다', value: 1 }
];

const DOMAINS = ["기억", "집중", "감정", "판단", "실행", "조절", "공간", "속도"];

let currentQ = 0;
let answers = {};

// SVG 프롬프트 생성
function generatePromptSVG(type) {
  const svgTemplates = {
    book: '<rect x="50" y="40" width="150" height="170" fill="none" stroke="#667EEA" stroke-width="3" rx="5"/><path d="M130 40 L130 210" stroke="#667EEA" stroke-width="2"/><line x1="60" y1="70" x2="200" y2="70" stroke="#667EEA" stroke-width="2"/><line x1="60" y1="100" x2="200" y2="100" stroke="#667EEA" stroke-width="2"/><line x1="60" y1="130" x2="200" y2="130" stroke="#667EEA" stroke-width="2"/><text x="200" y="240" font-size="16" font-weight="bold" fill="#667EEA" text-anchor="middle">📚 기억력</text>',
    calendar: '<rect x="50" y="40" width="150" height="150" fill="none" stroke="#667EEA" stroke-width="3" rx="5"/><line x1="60" y1="80" x2="190" y2="80" stroke="#667EEA" stroke-width="2"/><circle cx="75" cy="120" r="8" fill="#667EEA"/><circle cx="130" cy="120" r="8" fill="#667EEA"/><circle cx="185" cy="120" r="8" fill="#667EEA"/><circle cx="75" cy="160" r="8" fill="#667EEA"/><circle cx="130" cy="160" r="8" fill="#667EEA"/><text x="200" y="240" font-size="16" font-weight="bold" fill="#667EEA" text-anchor="middle">📅 시간 관리</text>',
    phone: '<rect x="80" y="20" width="80" height="140" fill="none" stroke="#667EEA" stroke-width="3" rx="8"/><circle cx="120" cy="140" r="8" fill="#667EEA"/><circle cx="120" cy="50" r="5" fill="#667EEA" opacity="0.5"/><circle cx="110" cy="50" r="5" fill="#667EEA" opacity="0.5"/><circle cx="130" cy="50" r="5" fill="#667EEA" opacity="0.5"/><text x="200" y="240" font-size="16" font-weight="bold" fill="#667EEA" text-anchor="middle">📞 번호 기억</text>',
    target: '<circle cx="120" cy="80" r="60" fill="none" stroke="#667EEA" stroke-width="3"/><circle cx="120" cy="80" r="40" fill="none" stroke="#667EEA" stroke-width="2"/><circle cx="120" cy="80" r="20" fill="#667EEA"/><path d="M 120 50 L 140 80 L 120 110 L 100 80 Z" fill="#FF6B9D" opacity="0.7"/><text x="200" y="240" font-size="16" font-weight="bold" fill="#667EEA" text-anchor="middle">🎯 집중력</text>',
    stress: '<ellipse cx="120" cy="80" rx="50" ry="60" fill="none" stroke="#FF6B9D" stroke-width="3"/><path d="M 90 70 Q 85 80 90 85" fill="none" stroke="#FF6B9D" stroke-width="2"/><path d="M 150 70 Q 155 80 150 85" fill="none" stroke="#FF6B9D" stroke-width="2"/><path d="M 100 100 L 140 100" stroke="#FF6B9D" stroke-width="2"/><path d="M 80 50 Q 100 30 140 50" fill="none" stroke="#FF6B9D" stroke-width="2"/><text x="200" y="240" font-size="16" font-weight="bold" fill="#FF6B9D" text-anchor="middle">😰 감정 조절</text>',
    decision: '<path d="M 120 30 L 180 100 L 140 100 L 140 170 L 100 170 L 100 100 L 60 100 Z" fill="none" stroke="#667EEA" stroke-width="3"/><circle cx="120" cy="80" r="8" fill="#667EEA"/><text x="200" y="240" font-size="16" font-weight="bold" fill="#667EEA" text-anchor="middle">🤔 판단력</text>',
    plan: '<rect x="60" y="50" width="120" height="30" fill="none" stroke="#667EEA" stroke-width="2" rx="5"/><text x="120" y="72" text-anchor="middle" font-size="12" fill="#667EEA" font-weight="bold">Step 1</text><path d="M 120 85 L 120 95" stroke="#667EEA" stroke-width="2" marker-end="url(#arrowhead)"/><rect x="60" y="100" width="120" height="30" fill="none" stroke="#667EEA" stroke-width="2" rx="5"/><text x="120" y="122" text-anchor="middle" font-size="12" fill="#667EEA" font-weight="bold">Step 2</text><path d="M 120 135 L 120 145" stroke="#667EEA" stroke-width="2" marker-end="url(#arrowhead)"/><rect x="60" y="150" width="120" height="30" fill="none" stroke="#667EEA" stroke-width="2" rx="5"/><text x="120" y="172" text-anchor="middle" font-size="12" fill="#667EEA" font-weight="bold">Step 3</text><text x="200" y="240" font-size="16" font-weight="bold" fill="#667EEA" text-anchor="middle">📋 실행력</text>',
    control: '<circle cx="120" cy="80" r="50" fill="none" stroke="#667EEA" stroke-width="3"/><path d="M 120 30 L 120 80" stroke="#667EEA" stroke-width="3"/><circle cx="120" cy="30" r="8" fill="#667EEA"/><text x="200" y="240" font-size="16" font-weight="bold" fill="#667EEA" text-anchor="middle">⚙️ 자기조절</text>',
    map: '<path d="M 60 100 Q 100 40 140 80 T 200 120" fill="none" stroke="#667EEA" stroke-width="3"/><circle cx="60" cy="100" r="6" fill="#00FF00"/><circle cx="200" cy="120" r="6" fill="#FF0000"/><circle cx="100" cy="80" r="4" fill="#667EEA" opacity="0.5"/><text x="200" y="240" font-size="16" font-weight="bold" fill="#667EEA" text-anchor="middle">🗺️ 공간지각</text>',
    speed: '<path d="M 50 80 L 150 80" stroke="#667EEA" stroke-width="3" marker-end="url(#arrowhead)"/><polygon points="150,80 140,70 140,90" fill="#667EEA"/><circle cx="80" cy="80" r="5" fill="#FF6B9D" opacity="0.6"/><circle cx="110" cy="80" r="5" fill="#FF6B9D" opacity="0.4"/><text x="200" y="240" font-size="16" font-weight="bold" fill="#667EEA" text-anchor="middle">⚡ 반응속도</text>',
    default: '<circle cx="120" cy="80" r="50" fill="none" stroke="#667EEA" stroke-width="3"/><text x="120" y="90" text-anchor="middle" font-size="20" font-weight="bold" fill="#667EEA">?</text><text x="200" y="240" font-size="16" font-weight="bold" fill="#667EEA" text-anchor="middle">🧠 뇌 검사</text>'
  };
  return svgTemplates[type] || svgTemplates.default;
}

function startTest() {
  currentQ = 0;
  answers = {};
  showScreen("testScreen");
  loadQuestion();
}

function loadQuestion() {
  const q = QUESTIONS[currentQ];
  const progress = ((currentQ + 1) / 45) * 100;

  document.getElementById("progressFill").style.width = progress + "%";
  document.getElementById("questionNum").textContent = `문항 ${currentQ + 1}/45`;
  document.getElementById("domainBadge").textContent = q.d;

  // SVG 프롬프트 그리기
  const svg = document.querySelector(".prompt-svg");
  svg.innerHTML = generatePromptSVG(q.prompt);

  // 이모지 카드 렌더링
  const scale = document.getElementById("emojiScale");
  scale.innerHTML = "";
  EMOJI_SCALE.forEach((opt) => {
    const card = document.createElement("div");
    card.className = "emoji-card" + (answers[currentQ] === opt.value ? " selected" : "");
    card.onclick = () => selectAnswer(opt.value);
    card.innerHTML = `
      <div class="emoji-icon">${opt.icon}</div>
      <div class="emoji-label">${opt.label}</div>
      <div class="emoji-score">${opt.value}점</div>
    `;
    scale.appendChild(card);
  });

  document.getElementById("prevBtn").disabled = currentQ === 0;
  document.getElementById("nextBtn").disabled = !answers[currentQ];
}

function selectAnswer(value) {
  answers[currentQ] = value;
  loadQuestion();
}

function prevQuestion() {
  if (currentQ > 0) {
    currentQ--;
    loadQuestion();
  }
}

function nextQuestion() {
  console.log("nextQuestion 실행:", currentQ, "/ 45");
  
  if (currentQ < 44) {
    currentQ++;
    loadQuestion();
  } else if (currentQ === 44) {
    console.log("✅ 45번째 문항 완료 - 결과 화면으로 전환");
    completeTest();
  }
}

function completeTest() {
  console.log("✅ completeTest() 실행됨");
  try {
    calculateResults();
    showScreen("resultScreen");
    console.log("✅ 결과 화면 표시 완료");
  } catch (error) {
    console.error("❌ 오류 발생:", error);
  }
}

function calculateResults() {
  const scores = {};
  DOMAINS.forEach(d => { scores[d] = 0; });
  
  QUESTIONS.forEach((q, i) => {
    scores[q.d] += answers[i] || 0;
  });

  const avgScores = {};
  DOMAINS.forEach(d => {
    const count = QUESTIONS.filter(q => q.d === d).length;
    avgScores[d] = Math.round((scores[d] / count) * 20);
  });

  const avg = Object.values(avgScores).reduce((a, b) => a + b) / 8;
  let brainAge = 100 - Math.round(avg * 0.3);
  if (brainAge < 5) brainAge = 5;
  if (brainAge > 100) brainAge = 100;

  document.getElementById("brainAge").textContent = brainAge + "세";

  // 레이더 차트
  if (window.radarChart) window.radarChart.destroy();
  const radarCtx = document.getElementById("radarChart").getContext("2d");
  window.radarChart = new Chart(radarCtx, {
    type: "radar",
    data: {
      labels: DOMAINS,
      datasets: [{ label: "점수", data: DOMAINS.map(d => avgScores[d]), borderColor: "#667EEA", backgroundColor: "rgba(102, 126, 234, 0.15)", borderWidth: 3, pointRadius: 5 }]
    },
    options: { responsive: true, scales: { r: { min: 0, max: 100, ticks: { color: "#999" } } }, plugins: { legend: { display: false } } }
  });

  // 막대 차트
  if (window.barChart) window.barChart.destroy();
  const barCtx = document.getElementById("barChart").getContext("2d");
  const ageGroups = ["유치", "10대", "20대", "30대", "40대", "50대", "60대", "70대", "80대", "90대"];
  const avgAges = [85, 90, 88, 85, 80, 75, 70, 65, 60, 55];
  window.barChart = new Chart(barCtx, {
    type: "bar",
    data: {
      labels: ageGroups,
      datasets: [
        { label: "연령층 평균", data: avgAges, backgroundColor: "rgba(102, 126, 234, 0.6)", borderColor: "#667EEA", borderWidth: 2 },
        { label: "당신의 점수", data: ageGroups.map(() => avg), backgroundColor: "rgba(244, 67, 54, 0.7)", borderColor: "#F44336", borderWidth: 2 }
      ]
    },
    options: { responsive: true, scales: { y: { min: 0, max: 100 } }, plugins: { legend: { display: true } } }
  });

  // 점수 상세
  document.getElementById("scoreDetails").innerHTML = DOMAINS.map(d => `<div class="score-item"><span>${d}</span><span class="score-value">${avgScores[d]}</span></div>`).join("");
}

function showScreen(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  const screen = document.getElementById(id);
  if (screen) {
    screen.classList.add("active");
  } else {
    console.error("❌ 화면을 찾을 수 없음:", id);
  }
}

function goToTraining() { window.location.href = "/brain_training.html"; }
function goHome() { window.location.href = "/"; }
