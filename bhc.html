<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>뇌건강체크 BHC 2.0</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: linear-gradient(135deg, #667EEA 0%, #764BA2 100%); font-family: 'Segoe UI', 'Noto Sans KR', sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
.container { width: 100%; max-width: 600px; background: white; border-radius: 20px; padding: 30px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
.screen { display: none; }
.screen.active { display: block; animation: slideIn 0.5s; }
@keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
.start-screen { text-align: center; }
.brain-icon { font-size: 60px; margin-bottom: 20px; }
h1 { color: #667EEA; font-size: 32px; margin-bottom: 10px; font-weight: 700; }
.subtitle { color: #888; font-size: 14px; margin-bottom: 20px; }
.info-box { background: #F5F5F5; border-left: 4px solid #667EEA; padding: 15px; border-radius: 8px; text-align: left; font-size: 14px; color: #555; margin-bottom: 20px; line-height: 1.8; }
.btn { width: 100%; padding: 15px; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.3s; margin-top: 15px; }
.btn-primary { background: #667EEA; color: white; }
.btn-primary:hover { background: #764BA2; transform: translateY(-2px); }
.btn-secondary { background: #f0f0f0; color: #333; }
.test-screen { display: flex; flex-direction: column; }
.progress-bar { width: 100%; height: 8px; background: #e0e0e0; border-radius: 10px; margin-bottom: 20px; overflow: hidden; }
.progress-fill { height: 100%; background: linear-gradient(90deg, #667EEA, #764BA2); width: 0%; transition: width 0.5s; }
.question-header { display: flex; justify-content: space-between; margin-bottom: 20px; font-size: 14px; color: #666; }
.question-num { font-weight: 600; color: #667EEA; }
.domain-badge { background: #667EEA; color: white; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; }
.question-text { font-size: 18px; font-weight: 600; color: #333; margin-bottom: 30px; text-align: center; line-height: 1.6; }
.likert-options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 30px; }
.likert-btn { display: flex; align-items: center; padding: 12px; border: 2px solid #ddd; border-radius: 10px; cursor: pointer; transition: all 0.3s; background: white; }
.likert-btn:hover { border-color: #667EEA; background: #f9f9f9; transform: translateX(5px); }
.likert-btn.selected { border-color: #667EEA; background: #E8EAFF; font-weight: 600; }
.likert-radio { width: 20px; height: 20px; border: 2px solid #ddd; border-radius: 50%; margin-right: 12px; flex-shrink: 0; }
.likert-btn.selected .likert-radio { border-color: #667EEA; background: #667EEA; }
.likert-text { flex: 1; font-size: 15px; }
.nav-buttons { display: flex; gap: 10px; margin-top: auto; }
.btn-nav { flex: 1; padding: 12px; border: 2px solid #667EEA; background: white; color: #667EEA; border-radius: 8px; font-weight: 600; cursor: pointer; }
.btn-nav:hover { background: #667EEA; color: white; }
.btn-nav:disabled { opacity: 0.5; cursor: not-allowed; }
.result-screen { text-align: center; }
.result-title { font-size: 28px; color: #667EEA; margin-bottom: 20px; font-weight: 700; }
.brain-age-box { background: linear-gradient(135deg, #667EEA, #764BA2); color: white; padding: 30px; border-radius: 15px; margin-bottom: 20px; cursor: pointer; transition: all 0.3s; }
.brain-age-box:hover { transform: scale(1.05); }
.brain-age-label { font-size: 14px; opacity: 0.9; margin-bottom: 10px; }
.brain-age-num { font-size: 56px; font-weight: 700; margin-bottom: 10px; }
.brain-age-tier { font-size: 16px; background: rgba(255,255,255,0.2); padding: 8px 16px; border-radius: 20px; display: inline-block; }
.chart-box { background: #f9f9f9; padding: 20px; border-radius: 15px; margin-bottom: 20px; }
.chart-title { font-size: 14px; font-weight: 600; color: #666; margin-bottom: 15px; text-align: left; }
.score-box { background: #f5f5f5; padding: 15px; border-radius: 10px; margin: 15px 0; text-align: left; font-size: 14px; }
.score-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #ddd; }
.score-item:last-child { border-bottom: none; }
.score-label { font-weight: 500; }
.score-value { color: #667EEA; font-weight: 600; }
.alert-box { background: #E3F2FD; border-left: 4px solid #667EEA; padding: 15px; border-radius: 8px; margin-bottom: 20px; text-align: left; font-size: 13px; color: #1565C0; }
@media (max-width: 600px) { .container { padding: 20px; } h1 { font-size: 24px; } .question-text { font-size: 16px; } .brain-age-num { font-size: 48px; } }
</style>
</head>
<body>

<div class="container">
  <!-- 시작 화면 -->
  <div id="startScreen" class="screen active">
    <div class="brain-icon">🧠</div>
    <h1>뇌건강체크 BHC 2.0</h1>
    <p class="subtitle">Brain Health Check</p>
    <div class="info-box">
      <p>💡 45개 문항으로 8가지 뇌 인지 영역을 측정합니다.</p>
      <p style="margin-top: 10px;">⏱️ 소요 시간: 약 15~20분</p>
      <p style="margin-top: 10px;">📊 당신의 뇌 나이를 알아보고 무료 뇌훈련 프로그램에 참여하세요!</p>
    </div>
    <button class="btn btn-primary" onclick="startTest()">🚀 검사 시작하기</button>
  </div>

  <!-- 검사 화면 -->
  <div id="testScreen" class="screen test-screen">
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="question-header">
      <span class="question-num" id="questionNum">문항 1/45</span>
      <span class="domain-badge" id="domainBadge">기억</span>
    </div>
    <div class="question-text" id="questionText">로드 중...</div>
    <div class="likert-options" id="likertOptions"></div>
    <div class="nav-buttons">
      <button class="btn-nav" onclick="prevQuestion()" id="prevBtn" disabled>이전</button>
      <button class="btn-nav" onclick="nextQuestion()" id="nextBtn" disabled>다음</button>
    </div>
  </div>

  <!-- 결과 화면 -->
  <div id="resultScreen" class="screen result-screen">
    <div class="result-title">🎉 검사 완료!</div>
    <div class="brain-age-box" onclick="goToTraining()">
      <div class="brain-age-label">당신의 뇌 나이</div>
      <div class="brain-age-num" id="brainAge">--</div>
      <div class="brain-age-tier" id="brainTier">로드 중...</div>
    </div>
    <div class="chart-box">
      <div class="chart-title">📊 8가지 뇌 인지 영역 분석</div>
      <canvas id="radarChart"></canvas>
    </div>
    <div class="chart-box">
      <div class="chart-title">📈 연령층 비교 분석</div>
      <canvas id="barChart"></canvas>
    </div>
    <div class="score-box">
      <div style="font-weight: 600; color: #667EEA; margin-bottom: 10px;">영역별 점수</div>
      <div id="scoreDetails"></div>
    </div>
    <div class="alert-box">ℹ️ 이 검사는 의료 진단이 아닙니다. 개인의 뇌 건강을 이해하기 위한 교육용 도구입니다.</div>
    <button class="btn btn-primary" onclick="goToTraining()">🧠 뇌훈련 프로그램 참여</button>
    <button class="btn btn-secondary" onclick="goHome()">🏠 홈페이지로</button>
  </div>
</div>

<script>
// 데이터 정의 (인라인 - 외부 로드 안함)
const Q_DATA = [
  "어제 읽은 기사의 주요 내용이 잘 기억되나요?|기억",
  "친구의 생일이나 중요한 날짜들을 잘 기억하나요?|기억",
  "전화번호나 숫자를 기억하는 것이 쉬운가요?|기억",
  "지난주에 한 일들의 순서를 잘 기억하나요?|기억",
  "책을 읽을 때 앞에서 읽은 내용을 잘 기억하나요?|기억",
  "새로운 사람을 만날 때 이름을 잘 기억하나요?|기억",
  "물건을 어디에 뒀는지 기억하나요?|기억",
  "하루 중에 한 일들을 상세히 기억할 수 있나요?|기억",
  "여행에서 보았던 장소들이 생생하게 떠오르나요?|기억",
  "과거의 대화 내용을 정확히 기억하나요?|기억",
  "한 가지 일에 오래 집중할 수 있나요?|집중",
  "주변의 소음이나 방해를 무시하고 일할 수 있나요?|집중",
  "복잡한 문제를 풀 때 집중력이 유지되나요?|집중",
  "읽고 있는 내용에 온전히 집중하나요?|집중",
  "여러 일을 동시에 처리할 때 집중력이 흐트러지나요?|집중",
  "스트레스를 받았을 때 감정을 잘 조절하나요?|감정",
  "화가 날 때 침착함을 유지할 수 있나요?|감정",
  "슬프거나 실망할 때 빨리 회복하나요?|감정",
  "타인의 의견에 쉽게 상처받지 않나요?|감정",
  "기쁜 감정을 적절히 표현할 수 있나요?|감정",
  "중요한 결정을 내릴 때 신중하게 생각하나요?|판단",
  "여러 정보를 비교하여 최선의 선택을 하나요?|판단",
  "위험한 상황에서 올바른 판단을 할 수 있나요?|판단",
  "타인의 의도를 잘 파악하나요?|판단",
  "합리적으로 생각하여 편견을 피하나요?|판단",
  "계획한 일을 끝까지 완수하나요?|실행",
  "마감일을 지키려고 노력하나요?|실행",
  "어려운 작업도 끝까지 포기하지 않나요?|실행",
  "일의 우선순위를 잘 정하나요?|실행",
  "주어진 일을 자발적으로 하나요?|실행",
  "욕구를 적절히 조절할 수 있나요?|조절",
  "일정한 시간에 규칙적으로 생활하나요?|조절",
  "건강한 생활 습관을 유지하나요?|조절",
  "금지된 것을 피할 수 있나요?|조절",
  "화면 시간을 적절히 조절하나요?|조절",
  "3차원 도형을 머릿속으로 회전시킬 수 있나요?|공간",
  "지도를 보고 길을 찾는 것이 쉬운가요?|공간",
  "물건을 어디에 뒀는지 위치를 기억하나요?|공간",
  "좌우를 빠르게 구분하나요?|공간",
  "그림이나 도표를 잘 이해하나요?|공간",
  "질문을 듣고 빠르게 대답하나요?|속도",
  "예상치 못한 상황에 빠르게 반응하나요?|속도",
  "타이핑이나 필기 속도가 빠른가요?|속도",
  "텍스트를 빠르게 읽고 이해하나요?|속도",
  "게임이나 스포츠에서 빠른 반응이 필요한가요?|속도"
];

const LIKERT = [
  { label: "매우 그렇다", value: 5 },
  { label: "그렇다", value: 4 },
  { label: "보통이다", value: 3 },
  { label: "그렇지 않다", value: 2 },
  { label: "전혀 그렇지 않다", value: 1 }
];

const DOMAINS = ["기억", "집중", "감정", "판단", "실행", "조절", "공간", "속도"];

let currentQ = 0;
let answers = {};

function startTest() {
  currentQ = 0;
  answers = {};
  showScreen("testScreen");
  loadQuestion();
}

function loadQuestion() {
  const parts = Q_DATA[currentQ].split("|");
  const q = parts[0];
  const domain = parts[1];
  const progress = ((currentQ + 1) / 45) * 100;

  document.getElementById("progressFill").style.width = progress + "%";
  document.getElementById("questionNum").textContent = `문항 ${currentQ + 1}/45`;
  document.getElementById("domainBadge").textContent = domain;
  document.getElementById("questionText").textContent = q;

  const opts = document.getElementById("likertOptions");
  opts.innerHTML = "";
  LIKERT.forEach((opt) => {
    const btn = document.createElement("div");
    btn.className = "likert-btn" + (answers[currentQ] === opt.value ? " selected" : "");
    btn.onclick = () => selectAnswer(opt.value);
    btn.innerHTML = `<div class="likert-radio"></div><span class="likert-text">${opt.label}</span><span style="color: #667EEA; font-weight: 600; margin-left: auto;">${opt.value}점</span>`;
    opts.appendChild(btn);
  });

  document.getElementById("prevBtn").disabled = currentQ === 0;
  document.getElementById("nextBtn").disabled = !answers[currentQ];
}

function selectAnswer(value) {
  answers[currentQ] = value;
  loadQuestion();
}

function prevQuestion() {
  if (currentQ > 0) { currentQ--; loadQuestion(); }
}

function nextQuestion() {
  if (currentQ < 44) { currentQ++; loadQuestion(); } else { completeTest(); }
}

function completeTest() {
  calculateResults();
  showScreen("resultScreen");
}

function calculateResults() {
  const scores = {};
  DOMAINS.forEach(d => { scores[d] = 0; });
  
  Q_DATA.forEach((q, i) => {
    const domain = q.split("|")[1];
    scores[domain] += answers[i] || 0;
  });

  const avgScores = {};
  DOMAINS.forEach(d => {
    const count = Q_DATA.filter(q => q.includes("|" + d)).length;
    avgScores[d] = Math.round((scores[d] / count) * 20);
  });

  const avg = Object.values(avgScores).reduce((a, b) => a + b) / 8;
  let brainAge = 100 - Math.round(avg * 0.3);
  if (brainAge < 5) brainAge = 5;
  if (brainAge > 100) brainAge = 100;

  document.getElementById("brainAge").textContent = brainAge + "세";
  document.getElementById("brainTier").textContent = avg >= 80 ? "🥇 Gold" : avg >= 70 ? "🥈 Silver" : "🥉 Bronze";

  if (window.radarChart) window.radarChart.destroy();
  const radarCtx = document.getElementById("radarChart").getContext("2d");
  window.radarChart = new Chart(radarCtx, {
    type: "radar",
    data: {
      labels: DOMAINS,
      datasets: [{ label: "점수", data: DOMAINS.map(d => avgScores[d]), borderColor: "#667EEA", backgroundColor: "rgba(102, 126, 234, 0.15)", borderWidth: 3, pointRadius: 5 }]
    },
    options: { responsive: true, scales: { r: { min: 0, max: 100 } }, plugins: { legend: { display: false } } }
  });

  if (window.barChart) window.barChart.destroy();
  const barCtx = document.getElementById("barChart").getContext("2d");
  const ageGroups = ["유치", "10대", "20대", "30대", "40대", "50대", "60대", "70대", "80대", "90대"];
  const avgAges = [85, 90, 88, 85, 80, 75, 70, 65, 60, 55];
  window.barChart = new Chart(barCtx, {
    type: "bar",
    data: {
      labels: ageGroups,
      datasets: [
        { label: "연령층 평균", data: avgAges, backgroundColor: "rgba(102, 126, 234, 0.6)", borderColor: "#667EEA", borderWidth: 2 },
        { label: "당신의 점수", data: ageGroups.map(() => avg), backgroundColor: "rgba(244, 67, 54, 0.7)", borderColor: "#F44336", borderWidth: 2 }
      ]
    },
    options: { responsive: true, scales: { y: { min: 0, max: 100 } }, plugins: { legend: { display: true } } }
  });

  document.getElementById("scoreDetails").innerHTML = DOMAINS.map(d => `<div class="score-item"><span class="score-label">${d}</span><span class="score-value">${avgScores[d]}</span></div>`).join("");
}

function showScreen(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

function goToTraining() { window.location.href = "/brain_training.html"; }
function goHome() { window.location.href = "/"; }

console.log("✅ BHC 2.0 정상 로드됨");
</script>

</body>
</html>
