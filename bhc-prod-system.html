<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BHC 2.0 - 뇌 건강 체크 시스템</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(180deg, #1a472a 0%, #2d5a3d 100%);
      color: #333;
      min-height: 100vh;
      padding: 16px;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
      background: white;
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(0, 188, 212, 0.15);
      overflow: hidden;
    }

    .screen {
      display: none;
      padding: 32px 24px;
      min-height: 600px;
      animation: slideIn 0.3s ease-out;
    }

    .screen.active {
      display: block;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* 시작 화면 */
    .header-title {
      text-align: center;
      margin-bottom: 32px;
    }

    .header-title h1 {
      font-size: 36px;
      font-weight: 900;
      color: #00BCD4;
      margin-bottom: 8px;
    }

    .header-title p {
      font-size: 14px;
      color: #666;
      font-weight: 600;
    }

    .input-group {
      margin-bottom: 20px;
    }

    .input-group label {
      display: block;
      font-size: 14px;
      font-weight: 800;
      color: #00BCD4;
      margin-bottom: 8px;
    }

    .input-group input,
    .input-group select {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid #00BCD4;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      color: #333;
    }

    .input-group input::placeholder {
      color: #999;
    }

    .info-box {
      background: linear-gradient(135deg, #E0F7FA 0%, #B2EBF2 100%);
      border-left: 6px solid #00BCD4;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 24px;
      font-size: 13px;
      color: #00695C;
      font-weight: 600;
      line-height: 1.6;
    }

    /* 문제 화면 */
    .progress-bar {
      width: 100%;
      height: 6px;
      background: #E0E0E0;
      border-radius: 3px;
      margin-bottom: 24px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #00BCD4 0%, #00897B 100%);
      transition: width 0.3s ease;
    }

    .question-header {
      background: linear-gradient(135deg, #E0F7FA 0%, #B2EBF2 100%);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 24px;
      text-align: center;
    }

    .question-header .question-num {
      font-size: 12px;
      font-weight: 800;
      color: #00695C;
      margin-bottom: 8px;
    }

    .question-header .domain-tag {
      display: inline-block;
      background: #00BCD4;
      color: white;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 800;
    }

    .stimulus-container {
      width: 100%;
      height: 280px;
      border: 3px solid #00BCD4;
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 24px;
      background: #f5f5f5;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .stimulus-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }

    .question-text {
      font-size: 16px;
      font-weight: 800;
      color: #00695C;
      text-align: center;
      margin-bottom: 20px;
      line-height: 1.5;
    }

    .choices {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 24px;
    }

    .choice-btn {
      aspect-ratio: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: 3px solid #DDD;
      border-radius: 12px;
      background: white;
      cursor: pointer;
      transition: all 0.2s;
      padding: 12px;
    }

    .choice-btn:hover {
      border-color: #00BCD4;
      transform: scale(1.05);
    }

    .choice-btn.selected {
      border-color: #00BCD4;
      background: linear-gradient(135deg, #E0F7FA 0%, #B2EBF2 100%);
      box-shadow: 0 8px 16px rgba(0, 188, 212, 0.2);
    }

    .choice-img {
      width: 70%;
      height: 70%;
      object-fit: contain;
      margin-bottom: 4px;
    }

    .choice-text {
      font-size: 11px;
      font-weight: 700;
      color: #333;
      text-align: center;
      word-break: keep-all;
    }

    /* 결과 화면 */
    .result-hero {
      text-align: center;
      margin-bottom: 32px;
    }

    .result-title {
      font-size: 32px;
      font-weight: 900;
      color: #00BCD4;
      margin-bottom: 8px;
    }

    .result-subtitle {
      font-size: 14px;
      color: #666;
      font-weight: 600;
    }

    .brain-age-card {
      background: linear-gradient(135deg, #00BCD4 0%, #0097A7 100%);
      color: white;
      border-radius: 20px;
      padding: 40px 24px;
      text-align: center;
      margin-bottom: 24px;
      box-shadow: 0 12px 32px rgba(0, 188, 212, 0.2);
    }

    .brain-age-label {
      font-size: 14px;
      opacity: 0.9;
      margin-bottom: 8px;
      font-weight: 800;
    }

    .brain-age-number {
      font-size: 64px;
      font-weight: 900;
      margin-bottom: 12px;
    }

    .brain-age-desc {
      font-size: 13px;
      opacity: 0.85;
      font-weight: 600;
    }

    .real-age-box {
      background: linear-gradient(135deg, #E8F5E9 0%, #F1F8E9 100%);
      border-left: 6px solid #4CAF50;
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 24px;
      display: flex;
      justify-content: space-around;
      align-items: center;
    }

    .age-item {
      text-align: center;
    }

    .age-label {
      font-size: 12px;
      font-weight: 800;
      color: #2E7D32;
      margin-bottom: 8px;
    }

    .age-value {
      font-size: 48px;
      font-weight: 900;
      color: #2E7D32;
    }

    .separator {
      width: 2px;
      height: 60px;
      background: #4CAF50;
      opacity: 0.3;
    }

    .birth-value {
      font-size: 16px;
      font-weight: 700;
      color: #333;
    }

    .analysis-card {
      background: #f9f9f9;
      border: 2px solid #E0E0E0;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .card-title {
      font-size: 16px;
      font-weight: 900;
      color: #00BCD4;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 3px solid #00BCD4;
    }

    .domain-bar {
      display: flex;
      align-items: center;
      margin-bottom: 12px;
      gap: 12px;
    }

    .domain-name {
      font-size: 13px;
      font-weight: 800;
      color: #333;
      min-width: 80px;
    }

    .bar-container {
      flex: 1;
      height: 24px;
      background: #E0E0E0;
      border-radius: 6px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #00BCD4 0%, #00897B 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 800;
      color: white;
    }

    .strength-item,
    .weakness-item {
      padding: 12px 0;
      border-bottom: 1px solid #E0E0E0;
      font-size: 13px;
      font-weight: 700;
      color: #333;
    }

    .strength-item:before {
      content: "✓ ";
      color: #4CAF50;
      font-weight: 900;
    }

    .weakness-item:before {
      content: "⚠ ";
      color: #FF9800;
      font-weight: 900;
    }

    /* 버튼 */
    .btn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 12px;
      text-align: center;
    }

    .btn-primary {
      background: linear-gradient(135deg, #00BCD4 0%, #00897B 100%);
      color: white;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 24px rgba(0, 188, 212, 0.3);
    }

    .btn-secondary {
      background: #f5f5f5;
      color: #333;
      border: 2px solid #E0E0E0;
    }

    .btn-secondary:hover {
      background: #E0E0E0;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- 시작 화면 -->
    <div id="startScreen" class="screen active">
      <div class="header-title">
        <h1>BHC</h1>
        <p>뇌 건강 체크 시스템</p>
      </div>

      <div class="info-box">
        이 검사는 당신의 인지 건강 수준을 체계적으로 분석합니다. 8가지 영역에서 45개의 문항을 통해 뇌의 여러 능력을 측정합니다.
      </div>

      <div class="input-group">
        <label>이름</label>
        <input type="text" id="userName" placeholder="이름을 입력하세요">
      </div>

      <div class="input-group">
        <label>생년월일</label>
        <input type="date" id="userBirth" required>
      </div>

      <div class="input-group">
        <label>성별</label>
        <select id="userGender">
          <option value="">선택하세요</option>
          <option value="M">남성</option>
          <option value="F">여성</option>
        </select>
      </div>

      <button class="btn btn-primary" onclick="startTest()">검사 시작</button>
    </div>

    <!-- 문제 화면 -->
    <div id="questionScreen" class="screen">
      <div class="progress-bar">
        <div class="progress-fill" id="progressBar"></div>
      </div>

      <div class="question-header">
        <div class="question-num" id="questionNum">Q. 1 / 45</div>
        <div class="domain-tag" id="domainTag">기억</div>
      </div>

      <div class="stimulus-container">
        <img id="stimulusImg" class="stimulus-image" alt="자극 이미지">
      </div>

      <div class="question-text" id="questionText">질문이 여기 표시됩니다</div>

      <div class="choices" id="choicesContainer"></div>

      <button class="btn btn-primary" onclick="nextQuestion()" id="nextBtn" disabled>다음</button>
    </div>

    <!-- 결과 화면 -->
    <div id="resultScreen" class="screen">
      <div class="result-hero">
        <div class="result-title">검사 완료</div>
        <div class="result-subtitle">당신의 뇌 건강 분석 결과입니다</div>
      </div>

      <div class="brain-age-card">
        <div class="brain-age-label">당신의 뇌 나이는</div>
        <div class="brain-age-number" id="brainAge">00세</div>
        <div class="brain-age-desc">시니어 평균과 비교한 인지 건강 수준입니다</div>
      </div>

      <div class="real-age-box">
        <div class="age-item">
          <div class="age-label">실제 나이</div>
          <div class="age-value" id="realAge">만 00세</div>
        </div>
        <div class="separator"></div>
        <div class="age-item">
          <div class="age-label">생년월일</div>
          <div class="birth-value" id="birthInfo">YYYY년 MM월 DD일</div>
        </div>
      </div>

      <div class="analysis-card">
        <div class="card-title">인지 영역별 점수</div>
        <div id="barChartContainer"></div>
      </div>

      <div class="analysis-card">
        <div class="card-title">당신의 강점</div>
        <div id="strengthAnalysis"></div>
      </div>

      <div class="analysis-card">
        <div class="card-title">개선 필요 영역</div>
        <div id="weaknessAnalysis"></div>
      </div>

      <button class="btn btn-primary" onclick="restartTest()" style="margin-bottom: 12px;">다시 검사하기</button>
      <button class="btn btn-secondary" onclick="goToStart()">처음으로</button>
    </div>
  </div>

  <script>
    // ========== 전역 변수 ==========
    let currentIdx = 0;
    let answers = [];
    let userData = {};

    // 8개 인지 영역
    const DOMAINS = ['기억', '속도', '집중', '감정', '판단', '실행', '조절', '공간'];

    // 이미지 기본 경로
    const IMG_BASE = 'https://k-brain.co.kr/assets/img/bhc-brain-cards/';

    // ========== 45개 문항 데이터 ==========
    const QUESTIONS_DATA = [
      // 기억 (6문항) - 좌뇌 언어력 L1
      { stimulus: IMG_BASE + '좌뇌군언어력L1-1카드_copy_707x1060.jpg', q: '이 이미지를 기억하세요', choices: [{img: IMG_BASE + '좌뇌군언어력L1-1카드_copy_707x1060.jpg', text: '정확'}, {img: IMG_BASE + '좌뇌군언어력L1-2카드_copy_707x1060.jpg', text: '다름'}, {img: IMG_BASE + '좌뇌군언어력L1-3카드_copy_707x1060.jpg', text: '비슷'}, {img: IMG_BASE + '좌뇌군언어력L1-4카드_copy_707x1060.jpg', text: '다름'}], ans: 0, domain: '기억' },
      { stimulus: IMG_BASE + '좌뇌군언어력L1-2카드_copy_707x1060.jpg', q: '이전에 본 이미지와 같은가요?', choices: [{img: IMG_BASE + '좌뇌군언어력L1-1카드_copy_707x1060.jpg', text: '다름'}, {img: IMG_BASE + '좌뇌군언어력L1-2카드_copy_707x1060.jpg', text: '같음'}, {img: IMG_BASE + '좌뇌군언어력L1-3카드_copy_707x1060.jpg', text: '비슷'}, {img: IMG_BASE + '좌뇌군언어력L1-4카드_copy_707x1060.jpg', text: '다름'}], ans: 1, domain: '기억' },
      { stimulus: IMG_BASE + '좌뇌군언어력L1-3카드_copy_707x1060.jpg', q: '어떤 이미지를 먼저 봤나요?', choices: [{img: IMG_BASE + '좌뇌군언어력L1-1카드_copy_707x1060.jpg', text: '첫번째'}, {img: IMG_BASE + '좌뇌군언어력L1-2카드_copy_707x1060.jpg', text: '두번째'}, {img: IMG_BASE + '좌뇌군언어력L1-3카드_copy_707x1060.jpg', text: '세번째'}, {img: IMG_BASE + '좌뇌군언어력L1-4카드_copy_707x1060.jpg', text: '네번째'}], ans: 2, domain: '기억' },
      { stimulus: IMG_BASE + '좌뇌군언어력L1-4카드_copy_707x1060.jpg', q: '보인 이미지의 순서는?', choices: [{img: IMG_BASE + '좌뇌군언어력L1-1카드_copy_707x1060.jpg', text: '①'}, {img: IMG_BASE + '좌뇌군언어력L1-2카드_copy_707x1060.jpg', text: '②'}, {img: IMG_BASE + '좌뇌군언어력L1-3카드_copy_707x1060.jpg', text: '③'}, {img: IMG_BASE + '좌뇌군언어력L1-4카드_copy_707x1060.jpg', text: '④'}], ans: 3, domain: '기억' },
      { stimulus: IMG_BASE + '좌뇌군이해력L2-1_copy_707x1060.jpg', q: '어느 이미지가 맞나요?', choices: [{img: IMG_BASE + '좌뇌군이해력L2-1_copy_707x1060.jpg', text: '정확'}, {img: IMG_BASE + '좌뇌군이해력L2-2_copy_707x1060.jpg', text: '다름'}, {img: IMG_BASE + '좌뇌군이해력L2-3_copy_707x1060.jpg', text: '다름'}, {img: IMG_BASE + '좌뇌군이해력L2-4_copy_707x1060.jpg', text: '다름'}], ans: 0, domain: '기억' },
      { stimulus: IMG_BASE + '좌뇌군이해력L2-2_copy_707x1060.jpg', q: '기억하신 이미지는?', choices: [{img: IMG_BASE + '좌뇌군이해력L2-1_copy_707x1060.jpg', text: '①'}, {img: IMG_BASE + '좌뇌군이해력L2-2_copy_707x1060.jpg', text: '②'}, {img: IMG_BASE + '좌뇌군이해력L2-3_copy_707x1060.jpg', text: '③'}, {img: IMG_BASE + '좌뇌군이해력L2-4_copy_707x1060.jpg', text: '④'}], ans: 1, domain: '기억' },

      // 속도 (6문항) - 좌뇌 추리력 L4
      { stimulus: IMG_BASE + '좌뇌군추리력L4-1_copy_256x384.png', q: '가장 빨리 선택하세요', choices: [{img: IMG_BASE + '좌뇌군추리력L4-1_copy_256x384.png', text: '①'}, {img: IMG_BASE + '좌뇌군추리력L4-2_copy_256x384.png', text: '②'}, {img: IMG_BASE + '좌뇌군추리력L4-3_copy_256x384.png', text: '③'}, {img: IMG_BASE + '우뇌주의력 R2 상.png', text: '④'}], ans: 0, domain: '속도' },
      { stimulus: IMG_BASE + '좌뇌군추리력L4-2_copy_256x384.png', q: '빠르게 고르세요', choices: [{img: IMG_BASE + '좌뇌군추리력L4-1_copy_256x384.png', text: '①'}, {img: IMG_BASE + '좌뇌군추리력L4-2_copy_256x384.png', text: '②'}, {img: IMG_BASE + '좌뇌군추리력L4-3_copy_256x384.png', text: '③'}, {img: IMG_BASE + '우뇌주의력 R2 상.png', text: '④'}], ans: 1, domain: '속도' },
      { stimulus: IMG_BASE + '좌뇌군추리력L4-3_copy_256x384.png', q: '신속하게 선택하세요', choices: [{img: IMG_BASE + '좌뇌군추리력L4-1_copy_256x384.png', text: '①'}, {img: IMG_BASE + '좌뇌군추리력L4-2_copy_256x384.png', text: '②'}, {img: IMG_BASE + '좌뇌군추리력L4-3_copy_256x384.png', text: '③'}, {img: IMG_BASE + '우뇌주의력 R2 상.png', text: '④'}], ans: 2, domain: '속도' },
      { stimulus: IMG_BASE + '우뇌주의력 R2 상.png', q: '빠르게 판단하세요', choices: [{img: IMG_BASE + '좌뇌군추리력L4-1_copy_256x384.png', text: '①'}, {img: IMG_BASE + '좌뇌군추리력L4-2_copy_256x384.png', text: '②'}, {img: IMG_BASE + '좌뇌군추리력L4-3_copy_256x384.png', text: '③'}, {img: IMG_BASE + '우뇌주의력 R2 상.png', text: '④'}], ans: 3, domain: '속도' },

    // ========== 함수 ==========
    function showScreen(screenName) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(screenName + 'Screen').classList.add('active');
    }

    function startTest() {
      const name = document.getElementById('userName').value.trim();
      const birth = document.getElementById('userBirth').value;
      const gender = document.getElementById('userGender').value;

      if (!name || !birth || !gender) {
        alert('모든 정보를 입력해주세요');
        return;
      }

      const [year, month, day] = birth.split('-');
      const birthDate = new Date(parseInt(year), parseInt(month) - 1, parseInt(day));
      const today = new Date();
      let age = today.getFullYear() - birthDate.getFullYear();
      if (today.getMonth() < birthDate.getMonth() || 
          (today.getMonth() === birthDate.getMonth() && today.getDate() < birthDate.getDate())) {
        age--;
      }

      userData = { name, birth, gender, age };
      answers = [];
      currentIdx = 0;
      showScreen('question');
      displayQuestion();
    }

    function displayQuestion() {
      const q = QUESTIONS_DATA[currentIdx];
      const progress = ((currentIdx + 1) / QUESTIONS_DATA.length) * 100;
      
      document.getElementById('progressBar').style.width = progress + '%';
      document.getElementById('questionNum').textContent = `Q. ${currentIdx + 1} / ${QUESTIONS_DATA.length}`;
      document.getElementById('domainTag').textContent = q.domain;
      document.getElementById('stimulusImg').src = q.stimulus;
      document.getElementById('questionText').textContent = q.q;

      const choicesHtml = q.choices.map((c, i) => `
        <button class="choice-btn" onclick="selectChoice(${i})">
          <img class="choice-img" src="${c.img}" alt="선택지">
          <div class="choice-text">${c.text}</div>
        </button>
      `).join('');
      
      document.getElementById('choicesContainer').innerHTML = choicesHtml;
      document.getElementById('nextBtn').disabled = true;
    }

    function selectChoice(idx) {
      answers[currentIdx] = idx;
      document.querySelectorAll('.choice-btn').forEach(b => b.classList.remove('selected'));
      document.querySelectorAll('.choice-btn')[idx].classList.add('selected');
      document.getElementById('nextBtn').disabled = false;
    }

    function nextQuestion() {
      if (answers[currentIdx] === undefined) return;
      
      if (currentIdx < QUESTIONS_DATA.length - 1) {
        currentIdx++;
        displayQuestion();
      } else {
        finishTest();
      }
    }

    function finishTest() {
      showScreen('result');

      const scores = {};
      const domainCounts = {};
      DOMAINS.forEach(d => {
        scores[d] = 0;
        domainCounts[d] = 0;
      });

      QUESTIONS_DATA.forEach((q, i) => {
        if (q.domain) {
          domainCounts[q.domain]++;
          if (answers[i] === q.ans) {
            scores[q.domain]++;
          }
        }
      });

      const avgScores = {};
      DOMAINS.forEach(d => {
        avgScores[d] = Math.round((scores[d] / domainCounts[d]) * 100);
      });

      const avg = Object.values(avgScores).reduce((a, b) => a + b) / DOMAINS.length;
      let brainAge = 100 - Math.round(avg * 0.35);
      brainAge = Math.max(5, Math.min(100, brainAge));

      document.getElementById('brainAge').textContent = brainAge + '세';
      document.getElementById('realAge').textContent = '만 ' + userData.age + '세';
      document.getElementById('birthInfo').textContent = userData.birth.replace(/(\d{4})-(\d{2})-(\d{2})/, '$1년 $2월 $3일');

      // 바차트
      let barHtml = '';
      DOMAINS.forEach(d => {
        barHtml += `
          <div class="domain-bar">
            <div class="domain-name">${d}</div>
            <div class="bar-container">
              <div class="bar-fill" style="width: ${avgScores[d]}%">
                <span>${avgScores[d]}%</span>
              </div>
            </div>
          </div>
        `;
      });
      document.getElementById('barChartContainer').innerHTML = barHtml;

      // 강점/약점
      const sorted = DOMAINS.map(d => ({domain: d, score: avgScores[d]}))
        .sort((a, b) => b.score - a.score);

      let strengthHtml = sorted.slice(0, 3).map(s => 
        `<div class="strength-item">${s.domain} (${s.score}%)</div>`
      ).join('');
      document.getElementById('strengthAnalysis').innerHTML = strengthHtml;

      let weaknessHtml = sorted.slice(-3).reverse().map(s =>
        `<div class="weakness-item">${s.domain} (${s.score}%)</div>`
      ).join('');
      document.getElementById('weaknessAnalysis').innerHTML = weaknessHtml;
    }

    function restartTest() {
      showScreen('question');
      answers = [];
      currentIdx = 0;
      displayQuestion();
    }

    function goToStart() {
      showScreen('start');
      document.getElementById('userName').value = '';
      document.getElementById('userBirth').value = '';
      document.getElementById('userGender').value = '';
    }
  </script>
</body>
</html>
