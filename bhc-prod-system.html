<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BHC 3.0 - 뇌 건강 체크 시스템</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(180deg, #1a472a 0%, #2d5a3d 100%);
      color: #333;
      min-height: 100vh;
      padding: 16px;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
      background: white;
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(0, 188, 212, 0.15);
      overflow: hidden;
    }

    .screen {
      display: none;
      padding: 32px 24px;
      min-height: 600px;
      animation: slideIn 0.3s ease-out;
    }

    .screen.active {
      display: block;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .header-title {
      text-align: center;
      margin-bottom: 32px;
    }

    .header-title h1 {
      font-size: 36px;
      font-weight: 900;
      color: #00BCD4;
      margin-bottom: 8px;
    }

    .header-title p {
      font-size: 14px;
      color: #666;
      font-weight: 600;
    }

    .input-group {
      margin-bottom: 20px;
    }

    .input-group label {
      display: block;
      font-size: 14px;
      font-weight: 800;
      color: #00BCD4;
      margin-bottom: 8px;
    }

    .input-group input,
    .input-group select {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid #00BCD4;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      color: #333;
    }

    .info-box {
      background: linear-gradient(135deg, #E0F7FA 0%, #B2EBF2 100%);
      border-left: 6px solid #00BCD4;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 24px;
      font-size: 13px;
      color: #00695C;
      font-weight: 600;
      line-height: 1.6;
    }

    .progress-bar {
      width: 100%;
      height: 6px;
      background: #E0E0E0;
      border-radius: 3px;
      margin-bottom: 24px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #00BCD4 0%, #00897B 100%);
      transition: width 0.3s ease;
    }

    .question-header {
      background: linear-gradient(135deg, #E0F7FA 0%, #B2EBF2 100%);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 24px;
      text-align: center;
    }

    .question-header .question-num {
      font-size: 12px;
      font-weight: 800;
      color: #00695C;
      margin-bottom: 8px;
    }

    .question-header .domain-tag {
      display: inline-block;
      background: #00BCD4;
      color: white;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 800;
    }

    .stimulus-container {
      width: 100%;
      height: 240px;
      border: 3px solid #00BCD4;
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 24px;
      background: linear-gradient(135deg, #f5f5f5 0%, #eeeeee 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
    }

    .stimulus-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }

    .stimulus-text {
      font-size: 18px;
      font-weight: 900;
      color: #00695C;
      word-break: keep-all;
      line-height: 1.6;
    }

    .question-text {
      font-size: 16px;
      font-weight: 800;
      color: #00695C;
      text-align: center;
      margin-bottom: 20px;
      line-height: 1.5;
    }

    .choices {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 24px;
    }

    .choice-btn {
      padding: 16px 12px;
      border: 2px solid #DDD;
      border-radius: 12px;
      background: white;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 14px;
      font-weight: 700;
      color: #333;
      text-align: center;
      word-break: keep-all;
      min-height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .choice-btn:hover {
      border-color: #00BCD4;
      transform: scale(1.05);
    }

    .choice-btn.selected {
      border-color: #00BCD4;
      background: linear-gradient(135deg, #E0F7FA 0%, #B2EBF2 100%);
      box-shadow: 0 8px 16px rgba(0, 188, 212, 0.2);
    }

    .result-hero {
      text-align: center;
      margin-bottom: 32px;
    }

    .result-title {
      font-size: 32px;
      font-weight: 900;
      color: #00BCD4;
      margin-bottom: 8px;
    }

    .result-subtitle {
      font-size: 14px;
      color: #666;
      font-weight: 600;
    }

    .brain-age-card {
      background: linear-gradient(135deg, #00BCD4 0%, #0097A7 100%);
      color: white;
      border-radius: 20px;
      padding: 40px 24px;
      text-align: center;
      margin-bottom: 24px;
      box-shadow: 0 12px 32px rgba(0, 188, 212, 0.2);
    }

    .brain-age-label {
      font-size: 14px;
      opacity: 0.9;
      margin-bottom: 8px;
      font-weight: 800;
    }

    .brain-age-number {
      font-size: 64px;
      font-weight: 900;
      margin-bottom: 12px;
    }

    .brain-age-desc {
      font-size: 13px;
      opacity: 0.85;
      font-weight: 600;
    }

    .real-age-box {
      background: linear-gradient(135deg, #E8F5E9 0%, #F1F8E9 100%);
      border-left: 6px solid #4CAF50;
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 24px;
      display: flex;
      justify-content: space-around;
      align-items: center;
    }

    .age-item {
      text-align: center;
    }

    .age-label {
      font-size: 12px;
      font-weight: 800;
      color: #2E7D32;
      margin-bottom: 8px;
    }

    .age-value {
      font-size: 48px;
      font-weight: 900;
      color: #2E7D32;
    }

    .separator {
      width: 2px;
      height: 60px;
      background: #4CAF50;
      opacity: 0.3;
    }

    .birth-value {
      font-size: 16px;
      font-weight: 700;
      color: #333;
    }

    .analysis-card {
      background: #f9f9f9;
      border: 2px solid #E0E0E0;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .card-title {
      font-size: 16px;
      font-weight: 900;
      color: #00BCD4;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 3px solid #00BCD4;
    }

    .domain-bar {
      display: flex;
      align-items: center;
      margin-bottom: 12px;
      gap: 12px;
    }

    .domain-name {
      font-size: 13px;
      font-weight: 800;
      color: #333;
      min-width: 80px;
    }

    .bar-container {
      flex: 1;
      height: 24px;
      background: #E0E0E0;
      border-radius: 6px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #00BCD4 0%, #00897B 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 800;
      color: white;
    }

    .strength-item,
    .weakness-item {
      padding: 12px 0;
      border-bottom: 1px solid #E0E0E0;
      font-size: 13px;
      font-weight: 700;
      color: #333;
    }

    .strength-item:before {
      content: "✓ ";
      color: #4CAF50;
      font-weight: 900;
    }

    .weakness-item:before {
      content: "⚠ ";
      color: #FF9800;
      font-weight: 900;
    }

    .btn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 12px;
      text-align: center;
    }

    .btn-primary {
      background: linear-gradient(135deg, #00BCD4 0%, #00897B 100%);
      color: white;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 24px rgba(0, 188, 212, 0.3);
    }

    .btn-secondary {
      background: #f5f5f5;
      color: #333;
      border: 2px solid #E0E0E0;
    }

    .btn-secondary:hover {
      background: #E0E0E0;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- 시작 화면 -->
    <div id="startScreen" class="screen active">
      <div class="header-title">
        <h1>BHC 3.0</h1>
        <p>뇌 건강 체크 시스템</p>
      </div>

      <div class="info-box">
        이 검사는 당신의 인지 건강 수준을 과학적으로 분석합니다. 45개의 문항을 통해 8가지 인지 영역을 측정합니다.
      </div>

      <div class="input-group">
        <label>이름</label>
        <input type="text" id="userName" placeholder="이름을 입력하세요">
      </div>

      <div class="input-group">
        <label>생년월일</label>
        <input type="date" id="userBirth" required>
      </div>

      <div class="input-group">
        <label>성별</label>
        <select id="userGender">
          <option value="">선택하세요</option>
          <option value="M">남성</option>
          <option value="F">여성</option>
        </select>
      </div>

      <button class="btn btn-primary" onclick="startTest()">검사 시작</button>
    </div>

    <!-- 문제 화면 -->
    <div id="questionScreen" class="screen">
      <div class="progress-bar">
        <div class="progress-fill" id="progressBar"></div>
      </div>

      <div class="question-header">
        <div class="question-num" id="questionNum">Q. 1 / 45</div>
        <div class="domain-tag" id="domainTag">기억</div>
      </div>

      <div class="stimulus-container" id="stimulusContainer">
        <div class="stimulus-text" id="stimulusText">자극이 표시됩니다</div>
      </div>

      <div class="question-text" id="questionText">질문이 여기 표시됩니다</div>

      <div class="choices" id="choicesContainer"></div>

      <button class="btn btn-primary" onclick="nextQuestion()" id="nextBtn" disabled>다음</button>
    </div>

    <!-- 결과 화면 -->
    <div id="resultScreen" class="screen">
      <div class="result-hero">
        <div class="result-title">검사 완료</div>
        <div class="result-subtitle">당신의 뇌 건강 분석 결과입니다</div>
      </div>

      <div class="brain-age-card">
        <div class="brain-age-label">당신의 뇌 나이는</div>
        <div class="brain-age-number" id="brainAge">00세</div>
        <div class="brain-age-desc">시니어 평균과 비교한 인지 건강 수준입니다</div>
      </div>

      <div class="real-age-box">
        <div class="age-item">
          <div class="age-label">실제 나이</div>
          <div class="age-value" id="realAge">만 00세</div>
        </div>
        <div class="separator"></div>
        <div class="age-item">
          <div class="age-label">생년월일</div>
          <div class="birth-value" id="birthInfo">YYYY년 MM월 DD일</div>
        </div>
      </div>

      <div class="analysis-card">
        <div class="card-title">인지 영역별 점수</div>
        <div id="barChartContainer"></div>
      </div>

      <div class="analysis-card">
        <div class="card-title">당신의 강점</div>
        <div id="strengthAnalysis"></div>
      </div>

      <div class="analysis-card">
        <div class="card-title">개선 필요 영역</div>
        <div id="weaknessAnalysis"></div>
      </div>

      <button class="btn btn-primary" onclick="restartTest()" style="margin-bottom: 12px;">다시 검사하기</button>
      <button class="btn btn-secondary" onclick="goToStart()">처음으로</button>
    </div>
  </div>

  <script>
    let currentIdx = 0;
    let answers = [];
    let userData = {};

    const DOMAINS = ['기억', '속도', '집중', '감정', '판단', '실행', '조절', '공간'];

    // 45개 명확한 문항 데이터 (기존 시스템 기반)
    const QUESTIONS_DATA = [
      // 기억 (6)
      { stimulus: '🌲', q: '이 이미지의 특징은?', choices: ['튼튼해 보임', '약해 보임', '불명확함', '변동이 있음'], ans: 0, domain: '기억' },
      { stimulus: '🌲', q: '이전 이미지와 같은가?', choices: ['정확히 같음', '유사함', '다름', '구별 불가'], ans: 0, domain: '기억' },
      { stimulus: '🏠', q: '어떤 느낌인가?', choices: ['안전함', '답답함', '어둠', '불안정'], ans: 0, domain: '기억' },
      { stimulus: '🏠', q: '이전에 본 이미지는?', choices: ['나무', '오두막', '선인장', '호수'], ans: 0, domain: '기억' },
      { stimulus: '🏞️', q: '순서대로 본 이미지는?', choices: ['호수→나무→오두막', '나무→오두막→호수', '오두막→호수→나무', '호수→오두막→나무'], ans: 1, domain: '기억' },
      { stimulus: '🌵', q: '지금까지 본 모든 이미지의 개수는?', choices: ['3개', '4개', '5개', '6개'], ans: 2, domain: '기억' },

      // 속도 (6)
      { stimulus: '◇ ■ △', q: '이 패턴의 다음 형태는?', choices: ['사각형', '삼각형', '원형', '별형'], ans: 0, domain: '속도' },
      { stimulus: '2, 4, 6, ?', q: '빠르게 계산하세요. 다음 숫자는?', choices: ['8', '10', '12', '14'], ans: 0, domain: '속도' },
      { stimulus: '★ ♥ ★ ♣', q: '같은 기호는?', choices: ['★', '♥', '♣', '◆'], ans: 0, domain: '속도' },
      { stimulus: '빨강 파랑 노랑', q: '순발력으로 답하세요. 많은 색은?', choices: ['빨강', '파랑', '노랑', '같음'], ans: 3, domain: '속도' },
      { stimulus: '고양이 개 새', q: '가장 긴 단어는?', choices: ['고양이', '개', '새', '물고기'], ans: 0, domain: '속도' },
      { stimulus: '247  352  189', q: '가장 큰 숫자는?', choices: ['247', '352', '189', '426'], ans: 1, domain: '속도' },

      // 집중 (6)
      { stimulus: '●●●●●', q: '세심하게 보세요. 정확한 것은?', choices: ['완벽함', '작은 결함', '큰 결함', '전체 결함'], ans: 0, domain: '집중' },
      { stimulus: '[◯◯●◯]', q: '다른 것은?', choices: ['첫 번째', '두 번째', '세 번째', '네 번째'], ans: 2, domain: '집중' },
      { stimulus: '● ● ● ● ●', q: '주의 깊게 보세요. 총 개수는?', choices: ['4개', '5개', '6개', '7개'], ans: 1, domain: '집중' },
      { stimulus: '●●● ●○●', q: '숨겨진 패턴을 찾으세요. 맞는 것은?', choices: ['●●●', '●○●', '○●●', '●●○'], ans: 1, domain: '집중' },
      { stimulus: '[●  ●  ●]', q: '정확한 위치는?', choices: ['왼쪽 위', '오른쪽 위', '중앙', '오른쪽 아래'], ans: 2, domain: '집중' },
      { stimulus: '🔵🔴🔵', q: '정확한 색 순서는?', choices: ['파랑-빨강-파랑', '빨강-파랑-빨강', '파랑-파랑-빨강', '빨강-빨강-파랑'], ans: 0, domain: '집중' },

      // 감정 (6)
      { stimulus: '😊', q: '이 표정의 감정은?', choices: ['행복함', '슬픔', '불안', '중립'], ans: 0, domain: '감정' },
      { stimulus: '😢', q: '인물의 기분은?', choices: ['만족', '불만족', '무관심', '혼란'], ans: 1, domain: '감정' },
      { stimulus: '☀️', q: '전체 분위기는?', choices: ['밝음', '어두움', '혼합', '모호'], ans: 0, domain: '감정' },
      { stimulus: '👥', q: '두 인물의 관계는?', choices: ['친밀함', '거리감', '갈등', '중립'], ans: 0, domain: '감정' },
      { stimulus: '⬆️', q: '흐름의 방향은?', choices: ['상향', '하향', '정체', '혼란'], ans: 0, domain: '감정' },
      { stimulus: '🔥', q: '전체 톤은?', choices: ['따뜻함', '차가움', '중립', '혼합'], ans: 0, domain: '감정' },

      // 판단 (6)
      { stimulus: '💧', q: '원인은?', choices: ['자연 현상', '인위적 행동', '우연', '불명'], ans: 0, domain: '판단' },
      { stimulus: '❌ 문제', q: '가장 논리적 해결책은?', choices: ['A 방법', 'B 방법', 'C 방법', '해결 불가'], ans: 0, domain: '판단' },
      { stimulus: '●  ◯', q: '더 큰 것은?', choices: ['좌측', '우측', '같음', '불명'], ans: 0, domain: '판단' },
      { stimulus: '🌲🏠🚗', q: '어느 카테고리인가?', choices: ['자연물', '인공물', '추상물', '혼합'], ans: 0, domain: '판단' },
      { stimulus: '1→2→3', q: '논리적 순서는?', choices: ['1→2→3', '1→3→2', '2→1→3', '3→2→1'], ans: 0, domain: '판단' },
      { stimulus: '모든 새는 날 수 있다', q: '결론은?', choices: ['참', '거짓', '불명', '상황의존'], ans: 1, domain: '판단' },

      // 실행 (6)
      { stimulus: '📋', q: '첫 단계는?', choices: ['준비', '시작', '중단', '완료'], ans: 0, domain: '실행' },
      { stimulus: '⏳', q: '다음 단계는?', choices: ['진행', '조정', '보류', '종료'], ans: 0, domain: '실행' },
      { stimulus: '🎯', q: '예상 결과는?', choices: ['성공', '실패', '지속', '불명'], ans: 0, domain: '실행' },
      { stimulus: '🚧', q: '장애물은?', choices: ['명확함', '불명확', '없음', '극복 가능'], ans: 0, domain: '실행' },
      { stimulus: '💪', q: '필요 자원은?', choices: ['충분', '부족', '적당', '미정'], ans: 2, domain: '실행' },
      { stimulus: '✅', q: '완성도는?', choices: ['높음', '낮음', '중간', '진행중'], ans: 0, domain: '실행' },

      // 조절 (6)
      { stimulus: '⚡', q: '조절이 가능한가?', choices: ['가능', '어려움', '불가능', '미정'], ans: 0, domain: '조절' },
      { stimulus: '😤', q: '충동적인 반응은?', choices: ['높음', '낮음', '중간', '변동'], ans: 0, domain: '조절' },
      { stimulus: '🧘', q: '침착함은?', choices: ['우수', '저하', '중간', '불안정'], ans: 0, domain: '조절' },
      { stimulus: '😰', q: '스트레스 관리는?', choices: ['우수', '어려움', '중간', '미정'], ans: 1, domain: '조절' },
      { stimulus: '💭', q: '감정 표현은?', choices: ['적절', '과함', '억제', '혼란'], ans: 0, domain: '조절' },
      { stimulus: '🤔', q: '의사결정은?', choices: ['신중', '충동적', '우유부단', '미정'], ans: 0, domain: '조절' },

      // 공간 (3)
      { stimulus: '●   ●   ●', q: '위치는?', choices: ['중앙', '좌측', '우측', '모서리'], ans: 1, domain: '공간' },
      { stimulus: '⬆️', q: '방향은?', choices: ['상향', '하향', '좌향', '우향'], ans: 0, domain: '공간' },
      { stimulus: '🔭', q: '거리감은?', choices: ['가까움', '중간', '멀음', '불명'], ans: 2, domain: '공간' }
    ];

    function showScreen(screenName) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(screenName + 'Screen').classList.add('active');
    }

    function startTest() {
      const name = document.getElementById('userName').value.trim();
      const birth = document.getElementById('userBirth').value;
      const gender = document.getElementById('userGender').value;

      if (!name || !birth || !gender) {
        alert('모든 정보를 입력해주세요');
        return;
      }

      const [year, month, day] = birth.split('-');
      const birthDate = new Date(parseInt(year), parseInt(month) - 1, parseInt(day));
      const today = new Date();
      let age = today.getFullYear() - birthDate.getFullYear();
      if (today.getMonth() < birthDate.getMonth() || 
          (today.getMonth() === birthDate.getMonth() && today.getDate() < birthDate.getDate())) {
        age--;
      }

      userData = { name, birth, gender, age };
      answers = [];
      currentIdx = 0;
      showScreen('question');
      displayQuestion();
    }

    function displayQuestion() {
      const q = QUESTIONS_DATA[currentIdx];
      const progress = ((currentIdx + 1) / QUESTIONS_DATA.length) * 100;
      
      document.getElementById('progressBar').style.width = progress + '%';
      document.getElementById('questionNum').textContent = `Q. ${currentIdx + 1} / 45`;
      document.getElementById('domainTag').textContent = q.domain;
      document.getElementById('stimulusText').textContent = q.stimulus;
      document.getElementById('questionText').textContent = q.q;

      const choicesHtml = q.choices.map((c, i) => `
        <button class="choice-btn" onclick="selectChoice(${i})">
          ${c}
        </button>
      `).join('');
      
      document.getElementById('choicesContainer').innerHTML = choicesHtml;
      document.getElementById('nextBtn').disabled = true;
    }

    function selectChoice(idx) {
      answers[currentIdx] = idx;
      document.querySelectorAll('.choice-btn').forEach(b => b.classList.remove('selected'));
      document.querySelectorAll('.choice-btn')[idx].classList.add('selected');
      document.getElementById('nextBtn').disabled = false;
    }

    function nextQuestion() {
      if (answers[currentIdx] === undefined) return;
      
      if (currentIdx < QUESTIONS_DATA.length - 1) {
        currentIdx++;
        displayQuestion();
      } else {
        finishTest();
      }
    }

    function finishTest() {
      showScreen('result');

      const scores = {};
      const domainCounts = {};
      DOMAINS.forEach(d => {
        scores[d] = 0;
        domainCounts[d] = 0;
      });

      QUESTIONS_DATA.forEach((q, i) => {
        if (q.domain) {
          domainCounts[q.domain]++;
          if (answers[i] === q.ans) {
            scores[q.domain]++;
          }
        }
      });

      const avgScores = {};
      DOMAINS.forEach(d => {
        avgScores[d] = Math.round((scores[d] / domainCounts[d]) * 100);
      });

      const avg = Object.values(avgScores).reduce((a, b) => a + b) / DOMAINS.length;
      let brainAge = 100 - Math.round(avg * 0.35);
      brainAge = Math.max(5, Math.min(100, brainAge));

      document.getElementById('brainAge').textContent = brainAge + '세';
      document.getElementById('realAge').textContent = '만 ' + userData.age + '세';
      document.getElementById('birthInfo').textContent = userData.birth.replace(/(\d{4})-(\d{2})-(\d{2})/, '$1년 $2월 $3일');

      let barHtml = '';
      DOMAINS.forEach(d => {
        barHtml += `
          <div class="domain-bar">
            <div class="domain-name">${d}</div>
            <div class="bar-container">
              <div class="bar-fill" style="width: ${avgScores[d]}%">
                <span>${avgScores[d]}%</span>
              </div>
            </div>
          </div>
        `;
      });
      document.getElementById('barChartContainer').innerHTML = barHtml;

      const sorted = DOMAINS.map(d => ({domain: d, score: avgScores[d]}))
        .sort((a, b) => b.score - a.score);

      let strengthHtml = sorted.slice(0, 3).map(s => 
        `<div class="strength-item">${s.domain} (${s.score}%)</div>`
      ).join('');
      document.getElementById('strengthAnalysis').innerHTML = strengthHtml;

      let weaknessHtml = sorted.slice(-3).reverse().map(s =>
        `<div class="weakness-item">${s.domain} (${s.score}%)</div>`
      ).join('');
      document.getElementById('weaknessAnalysis').innerHTML = weaknessHtml;
    }

    function restartTest() {
      showScreen('question');
      answers = [];
      currentIdx = 0;
      displayQuestion();
    }

    function goToStart() {
      showScreen('start');
      document.getElementById('userName').value = '';
      document.getElementById('userBirth').value = '';
      document.getElementById('userGender').value = '';
    }
  </script>
</body>
</html>
