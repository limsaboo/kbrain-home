<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BHC 3.0 - 뇌 건강 체크 시스템 (채박사 자문)</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(180deg, #1a472a 0%, #2d5a3d 100%);
      color: #333;
      min-height: 100vh;
      padding: 16px;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
      background: white;
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(0, 188, 212, 0.15);
      overflow: hidden;
    }

    .screen {
      display: none;
      padding: 32px 24px;
      min-height: 600px;
      animation: slideIn 0.3s ease-out;
    }

    .screen.active {
      display: block;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .header-title {
      text-align: center;
      margin-bottom: 32px;
    }

    .header-title h1 {
      font-size: 36px;
      font-weight: 900;
      color: #00BCD4;
      margin-bottom: 8px;
    }

    .header-title p {
      font-size: 14px;
      color: #666;
      font-weight: 600;
    }

    .input-group {
      margin-bottom: 20px;
    }

    .input-group label {
      display: block;
      font-size: 14px;
      font-weight: 800;
      color: #00BCD4;
      margin-bottom: 8px;
    }

    .input-group input,
    .input-group select {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid #00BCD4;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      color: #333;
    }

    .info-box {
      background: linear-gradient(135deg, #E0F7FA 0%, #B2EBF2 100%);
      border-left: 6px solid #00BCD4;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 24px;
      font-size: 13px;
      color: #00695C;
      font-weight: 600;
      line-height: 1.6;
    }

    .progress-bar {
      width: 100%;
      height: 6px;
      background: #E0E0E0;
      border-radius: 3px;
      margin-bottom: 24px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #00BCD4 0%, #00897B 100%);
      transition: width 0.3s ease;
    }

    .question-header {
      background: linear-gradient(135deg, #E0F7FA 0%, #B2EBF2 100%);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 24px;
      text-align: center;
    }

    .question-header .question-num {
      font-size: 12px;
      font-weight: 800;
      color: #00695C;
      margin-bottom: 8px;
    }

    .question-header .domain-tag {
      display: inline-block;
      background: #00BCD4;
      color: white;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 800;
    }

    .stimulus-container {
      width: 100%;
      height: 280px;
      border: 3px solid #00BCD4;
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 24px;
      background: #f5f5f5;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .stimulus-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }

    .question-text {
      font-size: 16px;
      font-weight: 800;
      color: #00695C;
      text-align: center;
      margin-bottom: 20px;
      line-height: 1.5;
    }

    .choices {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 24px;
    }

    .choice-btn {
      aspect-ratio: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: 3px solid #DDD;
      border-radius: 12px;
      background: white;
      cursor: pointer;
      transition: all 0.2s;
      padding: 12px;
    }

    .choice-btn:hover {
      border-color: #00BCD4;
      transform: scale(1.05);
    }

    .choice-btn.selected {
      border-color: #00BCD4;
      background: linear-gradient(135deg, #E0F7FA 0%, #B2EBF2 100%);
      box-shadow: 0 8px 16px rgba(0, 188, 212, 0.2);
    }

    .choice-img {
      width: 70%;
      height: 70%;
      object-fit: contain;
      margin-bottom: 4px;
    }

    .choice-text {
      font-size: 11px;
      font-weight: 700;
      color: #333;
      text-align: center;
      word-break: keep-all;
    }

    .result-hero {
      text-align: center;
      margin-bottom: 32px;
    }

    .result-title {
      font-size: 32px;
      font-weight: 900;
      color: #00BCD4;
      margin-bottom: 8px;
    }

    .result-subtitle {
      font-size: 14px;
      color: #666;
      font-weight: 600;
    }

    .brain-age-card {
      background: linear-gradient(135deg, #00BCD4 0%, #0097A7 100%);
      color: white;
      border-radius: 20px;
      padding: 40px 24px;
      text-align: center;
      margin-bottom: 24px;
      box-shadow: 0 12px 32px rgba(0, 188, 212, 0.2);
    }

    .brain-age-label {
      font-size: 14px;
      opacity: 0.9;
      margin-bottom: 8px;
      font-weight: 800;
    }

    .brain-age-number {
      font-size: 64px;
      font-weight: 900;
      margin-bottom: 12px;
    }

    .brain-age-desc {
      font-size: 13px;
      opacity: 0.85;
      font-weight: 600;
    }

    .real-age-box {
      background: linear-gradient(135deg, #E8F5E9 0%, #F1F8E9 100%);
      border-left: 6px solid #4CAF50;
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 24px;
      display: flex;
      justify-content: space-around;
      align-items: center;
    }

    .age-item {
      text-align: center;
    }

    .age-label {
      font-size: 12px;
      font-weight: 800;
      color: #2E7D32;
      margin-bottom: 8px;
    }

    .age-value {
      font-size: 48px;
      font-weight: 900;
      color: #2E7D32;
    }

    .separator {
      width: 2px;
      height: 60px;
      background: #4CAF50;
      opacity: 0.3;
    }

    .birth-value {
      font-size: 16px;
      font-weight: 700;
      color: #333;
    }

    .analysis-card {
      background: #f9f9f9;
      border: 2px solid #E0E0E0;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .card-title {
      font-size: 16px;
      font-weight: 900;
      color: #00BCD4;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 3px solid #00BCD4;
    }

    .domain-bar {
      display: flex;
      align-items: center;
      margin-bottom: 12px;
      gap: 12px;
    }

    .domain-name {
      font-size: 13px;
      font-weight: 800;
      color: #333;
      min-width: 80px;
    }

    .bar-container {
      flex: 1;
      height: 24px;
      background: #E0E0E0;
      border-radius: 6px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #00BCD4 0%, #00897B 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 800;
      color: white;
    }

    .strength-item,
    .weakness-item {
      padding: 12px 0;
      border-bottom: 1px solid #E0E0E0;
      font-size: 13px;
      font-weight: 700;
      color: #333;
    }

    .strength-item:before {
      content: "✓ ";
      color: #4CAF50;
      font-weight: 900;
    }

    .weakness-item:before {
      content: "⚠ ";
      color: #FF9800;
      font-weight: 900;
    }

    .btn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 12px;
      text-align: center;
    }

    .btn-primary {
      background: linear-gradient(135deg, #00BCD4 0%, #00897B 100%);
      color: white;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 24px rgba(0, 188, 212, 0.3);
    }

    .btn-secondary {
      background: #f5f5f5;
      color: #333;
      border: 2px solid #E0E0E0;
    }

    .btn-secondary:hover {
      background: #E0E0E0;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- 시작 화면 -->
    <div id="startScreen" class="screen active">
      <div class="header-title">
        <h1>BHC 3.0</h1>
        <p>뇌 건강 체크 시스템 (채박사 자문)</p>
      </div>

      <div class="info-box">
        이 검사는 당신의 인지 건강 수준을 뇌과학 기반으로 분석합니다. 40개의 투사 이미지와 45개의 문항을 통해 8가지 인지 영역을 측정합니다.
      </div>

      <div class="input-group">
        <label>이름</label>
        <input type="text" id="userName" placeholder="이름을 입력하세요">
      </div>

      <div class="input-group">
        <label>생년월일</label>
        <input type="date" id="userBirth" required>
      </div>

      <div class="input-group">
        <label>성별</label>
        <select id="userGender">
          <option value="">선택하세요</option>
          <option value="M">남성</option>
          <option value="F">여성</option>
        </select>
      </div>

      <button class="btn btn-primary" onclick="startTest()">검사 시작</button>
    </div>

    <!-- 문제 화면 -->
    <div id="questionScreen" class="screen">
      <div class="progress-bar">
        <div class="progress-fill" id="progressBar"></div>
      </div>

      <div class="question-header">
        <div class="question-num" id="questionNum">Q. 1 / 45</div>
        <div class="domain-tag" id="domainTag">기억</div>
      </div>

      <div class="stimulus-container">
        <img id="stimulusImg" class="stimulus-image" alt="자극 이미지">
      </div>

      <div class="question-text" id="questionText">질문이 여기 표시됩니다</div>

      <div class="choices" id="choicesContainer"></div>

      <button class="btn btn-primary" onclick="nextQuestion()" id="nextBtn" disabled>다음</button>
    </div>

    <!-- 결과 화면 -->
    <div id="resultScreen" class="screen">
      <div class="result-hero">
        <div class="result-title">검사 완료</div>
        <div class="result-subtitle">당신의 뇌 건강 분석 결과입니다</div>
      </div>

      <div class="brain-age-card">
        <div class="brain-age-label">당신의 뇌 나이는</div>
        <div class="brain-age-number" id="brainAge">00세</div>
        <div class="brain-age-desc">시니어 평균과 비교한 인지 건강 수준입니다</div>
      </div>

      <div class="real-age-box">
        <div class="age-item">
          <div class="age-label">실제 나이</div>
          <div class="age-value" id="realAge">만 00세</div>
        </div>
        <div class="separator"></div>
        <div class="age-item">
          <div class="age-label">생년월일</div>
          <div class="birth-value" id="birthInfo">YYYY년 MM월 DD일</div>
        </div>
      </div>

      <div class="analysis-card">
        <div class="card-title">인지 영역별 점수</div>
        <div id="barChartContainer"></div>
      </div>

      <div class="analysis-card">
        <div class="card-title">당신의 강점</div>
        <div id="strengthAnalysis"></div>
      </div>

      <div class="analysis-card">
        <div class="card-title">개선 필요 영역</div>
        <div id="weaknessAnalysis"></div>
      </div>

      <button class="btn btn-primary" onclick="restartTest()" style="margin-bottom: 12px;">다시 검사하기</button>
      <button class="btn btn-secondary" onclick="goToStart()">처음으로</button>
    </div>
  </div>

  <script>
    let currentIdx = 0;
    let answers = [];
    let userData = {};

    const DOMAINS = ['기억', '속도', '집중', '감정', '판단', '실행', '조절', '공간'];

    // 채박사 자문 기반 40개 투사 이미지 (Unsplash + 텍스트 설명)
    const PROJECTION_IMAGES = {
      // 영역 1: 자연물/상징 (자아상, 기본 안정감)
      'strong-oak': { url: 'https://images.unsplash.com/photo-1511497584788-876760111969?w=500', desc: '튼튼한 고목' },
      'swaying-tree': { url: 'https://images.unsplash.com/photo-1426604342444-e9535461da97?w=500', desc: '폭풍 속 나무' },
      'warm-cabin': { url: 'https://images.unsplash.com/photo-1469022563149-aa64dbd37dae?w=500', desc: '온화한 오두막' },
      'dark-fortress': { url: 'https://images.unsplash.com/photo-1495521821757-a1efb6729352?w=500', desc: '닫힌 요새' },
      'desert-cactus': { url: 'https://images.unsplash.com/photo-1596603744099-c3b56d0c64a2?w=500', desc: '사막의 선인장' },
      'peaceful-clearing': { url: 'https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=500', desc: '평화로운 공터' },
      'cracked-earth': { url: 'https://images.unsplash.com/photo-1559827260-dc66d52bef19?w=500', desc: '메마른 대지' },
      'granite-cliff': { url: 'https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=500', desc: '거대 절벽' },
      'wilted-flowers': { url: 'https://images.unsplash.com/photo-1520763185298-1b434c919abe?w=500', desc: '시드는 꽃밭' },
      'calm-lake': { url: 'https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=500', desc: '맑은 호수' },
      
      // 영역 2: 관계/상황 (대인관계, 애착)
      'back-turned': { url: 'https://images.unsplash.com/photo-1529066029614-cdc4ba120308?w=500', desc: '등 돌린 두 인물' },
      'intense-argument': { url: 'https://images.unsplash.com/photo-1531482615713-2afd69097998?w=500', desc: '격렬한 대립' },
      'knocking-door': { url: 'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=500', desc: '문 두드리기' },
      'window-gazing': { url: 'https://images.unsplash.com/photo-1503235930437-8c6293ba41f5?w=500', desc: '창밖 바라보기' },
      'crowded-isolation': { url: 'https://images.unsplash.com/photo-1517457373614-b7152f00fc81?w=500', desc: '무리 속 소외' },
      'holding-hands': { url: 'https://images.unsplash.com/photo-1523438097911-512782516f69?w=500', desc: '손 맞잡기' },
      'mother-child': { url: 'https://images.unsplash.com/photo-1493228246481-11150540663c?w=500', desc: '아이 보살피기' },
      'looming-shadow': { url: 'https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=500', desc: '거대한 그림자' },
      'group-unity': { url: 'https://images.unsplash.com/photo-1529156069898-49953e39b3ac?w=500', desc: '무리와 유대감' },
      'masked-conversation': { url: 'https://images.unsplash.com/photo-1497618666937-586cb221d5d7?w=500', desc: '가면 쓴 대화' },
      
      // 영역 3: 추상/비구조 (사고 체계, 불안)
      'symmetry-ink': { url: 'https://images.unsplash.com/photo-1579783902614-e3fb5141b0cb?w=500', desc: '대칭 잉크' },
      'fragmented': { url: 'https://images.unsplash.com/photo-1578589519167-0ecb848f0f6f?w=500', desc: '파편화' },
      'chaos-ink': { url: 'https://images.unsplash.com/photo-1552961048-cf051f9def56?w=500', desc: '혼란 잉크' },
      'clashing-colors': { url: 'https://images.unsplash.com/photo-1561070791-2526d30994b5?w=500', desc: '충돌하는 색' },
      'spiral-void': { url: 'https://images.unsplash.com/photo-1557672172-298e090d0f80?w=500', desc: '나선형 소용돌이' },
      'sharp-spikes': { url: 'https://images.unsplash.com/photo-1561070791-2526d30994b5?w=500', desc: '날카로운 가시' },
      'flowing-curves': { url: 'https://images.unsplash.com/photo-1577720565980-c9ffa7f0b1d0?w=500', desc: '유동적 곡선' },
      'tangled-lines': { url: 'https://images.unsplash.com/photo-1550355291-bbee04a92027?w=500', desc: '엉킨 선들' },
      'maze-structure': { url: 'https://images.unsplash.com/photo-1549887534-7ef5dcc1c5c7?w=500', desc: '미로 구조' },
      'observing-eyes': { url: 'https://images.unsplash.com/photo-1551986782-d244ca7b76a0?w=500', desc: '관찰하는 눈' },
      
      // 영역 4: 색채/감정 (자율신경계, 정서)
      'explosive-red': { url: 'https://images.unsplash.com/photo-1578987328093-aab922e688ce?w=500', desc: '폭발하는 붉은색' },
      'calm-blue': { url: 'https://images.unsplash.com/photo-1494288207205-a81342ee5160?w=500', desc: '고요한 블루' },
      'black-grey': { url: 'https://images.unsplash.com/photo-1559027615-cd0628902d4a?w=500', desc: '검은/회색' },
      'green-warm': { url: 'https://images.unsplash.com/photo-1517622900660-2f98a0a20fd8?w=500', desc: '초록/따뜻함' },
      'purple-fantasy': { url: 'https://images.unsplash.com/photo-1557821552-17105176677c?w=500', desc: '보라색 판타지' },
      'stark-contrast': { url: 'https://images.unsplash.com/photo-1581822261290-991b38693d1b?w=500', desc: '명암 대비' },
      'muted-pastel': { url: 'https://images.unsplash.com/photo-1549887534-7ef5dcc1c5c7?w=500', desc: '낮은 채도' },
      'soft-pastel': { url: 'https://images.unsplash.com/photo-1558618666-fcd25c85cd64?w=500', desc: '부드러운 파스텔' },
      'golden-light': { url: 'https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=500', desc: '골드 빛' },
      'red-blue-collision': { url: 'https://images.unsplash.com/photo-1578587328093-aab922e688ce?w=500', desc: '붉은/파란 충돌' }
    };

    // 45개 문항 데이터 (채박사 프롬프트 기반)
    const QUESTIONS_DATA = [
      // 기억 (6) - 자연물 영역
      { stimulus: 'strong-oak', q: '이 이미지가 주는 느낌은?', choices: ['안정적', '불안정', '혼란', '막연'], ans: 0, domain: '기억' },
      { stimulus: 'swaying-tree', q: '현재 당신의 자아 상태는?', choices: ['약함', '강함', '중립', '불명'], ans: 0, domain: '기억' },
      { stimulus: 'warm-cabin', q: '이것이 상징하는 것은?', choices: ['안전', '고립', '경계', '미정'], ans: 0, domain: '기억' },
      { stimulus: 'dark-fortress', q: '대인관계 태도는?', choices: ['방어적', '개방적', '중도', '불안'], ans: 0, domain: '기억' },
      { stimulus: 'desert-cactus', q: '스트레스 대응 방식은?', choices: ['공격적', '회피적', '대처', '무감각'], ans: 0, domain: '기억' },
      { stimulus: 'calm-lake', q: '정서 조절 능력은?', choices: ['우수', '저하', '불균형', '변동'], ans: 0, domain: '기억' },

      // 속도 (6) - 추상 영역
      { stimulus: 'symmetry-ink', q: '이것이 의미하는 것은?', choices: ['정상', '비정상', '혼합', '알수없'], ans: 0, domain: '속도' },

      { stimulus: 'stark-contrast', q: '이분법적 사고는?', choices: ['높음', '낮음', '중간', '상황의존'], ans: 0, domain: '집중' },

      // 감정 (6) - 관계 영역

      { stimulus: 'intense-argument', q: '분노 조절은?', choices: ['어려움', '가능', '부분', '미정'], ans: 0, domain: '감정' },
      { stimulus: 'knocking-door', q: '수용 갈망은?', choices: ['높음', '낮음', '중간', '미정'], ans: 0, domain: '감정' },
      { stimulus: 'window-gazing', q: '탈출 욕구는?', choices: ['높음', '낮음', '중간', '변동'], ans: 0, domain: '감정' },
      { stimulus: 'group-unity', q: '소속감은?', choices: ['높음', '낮음', '중간', '불안정'], ans: 0, domain: '감정' },
      { stimulus: 'mother-child', q: '돌봄 욕구는?', choices: ['높음', '낮음', '중간', '미정'], ans: 0, domain: '감정' },

      // 판단 (6) - 관계 영역
      { stimulus: 'holding-hands', q: '친밀감 능력은?', choices: ['우수', '저하', '중간', '불안정'], ans: 0, domain: '판단' },
      { stimulus: 'looming-shadow', q: '권위 불안은?', choices: ['높음', '낮음', '중간', '미정'], ans: 0, domain: '판단' },
      { stimulus: 'crowded-isolation', q: '정서적 지지 필요는?', choices: ['높음', '낮음', '중간', '불명'], ans: 0, domain: '판단' },
      { stimulus: 'masked-conversation', q: '진정성은?', choices: ['낮음', '높음', '선택적', '미정'], ans: 0, domain: '판단' },
      { stimulus: 'peaceful-clearing', q: '회복 자원은?', choices: ['풍부', '부족', '중간', '변동'], ans: 0, domain: '판단' },
      { stimulus: 'wilted-flowers', q: '자존감은?', choices: ['낮음', '높음', '중간', '불안정'], ans: 0, domain: '판단' },

      // 실행 (6) - 추상 영역
      { stimulus: 'tangled-lines', q: '인지 블로킹은?', choices: ['높음', '낮음', '중간', '미정'], ans: 0, domain: '실행' },
      { stimulus: 'flowing-curves', q: '유연성은?', choices: ['높음', '낮음', '중간', '상황의존'], ans: 0, domain: '실행' },
      { stimulus: 'sharp-spikes', q: '과각성은?', choices: ['높음', '낮음', '중간', '미정'], ans: 0, domain: '실행' },

      { stimulus: 'muted-pastel', q: '감정 표현은?', choices: ['억제', '개방', '선택', '미정'], ans: 0, domain: '조절' },
      { stimulus: 'soft-pastel', q: '안전감은?', choices: ['높음', '낮음', '중간', '불안정'], ans: 0, domain: '조절' },

      { stimulus: 'calm-blue', q: '자율신경 균형은?', choices: ['우수', '저하', '중간', '불균형'], ans: 0, domain: '조절' },

      { stimulus: 'peaceful-clearing', q: '방향감각은?', choices: ['좋음', '나쁨', '중간', '상황의존'], ans: 0, domain: '공간' },
      { stimulus: 'granite-cliff', q: '구조 인식은?', choices: ['우수', '저하', '중간', '불명'], ans: 0, domain: '공간' }
    ];

    function showScreen(screenName) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(screenName + 'Screen').classList.add('active');
    }

    function startTest() {
      const name = document.getElementById('userName').value.trim();
      const birth = document.getElementById('userBirth').value;
      const gender = document.getElementById('userGender').value;

      if (!name || !birth || !gender) {
        alert('모든 정보를 입력해주세요');
        return;
      }

      const [year, month, day] = birth.split('-');
      const birthDate = new Date(parseInt(year), parseInt(month) - 1, parseInt(day));
      const today = new Date();
      let age = today.getFullYear() - birthDate.getFullYear();
      if (today.getMonth() < birthDate.getMonth() || 
          (today.getMonth() === birthDate.getMonth() && today.getDate() < birthDate.getDate())) {
        age--;
      }

      userData = { name, birth, gender, age };
      answers = [];
      currentIdx = 0;
      showScreen('question');
      displayQuestion();
    }

    function displayQuestion() {
      const q = QUESTIONS_DATA[currentIdx];
      const imgData = PROJECTION_IMAGES[q.stimulus];
      const progress = ((currentIdx + 1) / QUESTIONS_DATA.length) * 100;
      
      document.getElementById('progressBar').style.width = progress + '%';
      document.getElementById('questionNum').textContent = `Q. ${currentIdx + 1} / 45`;
      document.getElementById('domainTag').textContent = q.domain;
      document.getElementById('stimulusImg').src = imgData.url;
      document.getElementById('questionText').textContent = q.q;

      const choicesHtml = q.choices.map((c, i) => `
        <button class="choice-btn" onclick="selectChoice(${i})">
          <div class="choice-text">${c}</div>
        </button>
      `).join('');
      
      document.getElementById('choicesContainer').innerHTML = choicesHtml;
      document.getElementById('nextBtn').disabled = true;
    }

    function selectChoice(idx) {
      answers[currentIdx] = idx;
      document.querySelectorAll('.choice-btn').forEach(b => b.classList.remove('selected'));
      document.querySelectorAll('.choice-btn')[idx].classList.add('selected');
      document.getElementById('nextBtn').disabled = false;
    }

    function nextQuestion() {
      if (answers[currentIdx] === undefined) return;
      
      if (currentIdx < QUESTIONS_DATA.length - 1) {
        currentIdx++;
        displayQuestion();
      } else {
        finishTest();
      }
    }

    function finishTest() {
      showScreen('result');

      const scores = {};
      const domainCounts = {};
      DOMAINS.forEach(d => {
        scores[d] = 0;
        domainCounts[d] = 0;
      });

      QUESTIONS_DATA.forEach((q, i) => {
        if (q.domain) {
          domainCounts[q.domain]++;
          if (answers[i] === q.ans) {
            scores[q.domain]++;
          }
        }
      });

      const avgScores = {};
      DOMAINS.forEach(d => {
        avgScores[d] = Math.round((scores[d] / domainCounts[d]) * 100);
      });

      const avg = Object.values(avgScores).reduce((a, b) => a + b) / DOMAINS.length;
      let brainAge = 100 - Math.round(avg * 0.35);
      brainAge = Math.max(5, Math.min(100, brainAge));

      document.getElementById('brainAge').textContent = brainAge + '세';
      document.getElementById('realAge').textContent = '만 ' + userData.age + '세';
      document.getElementById('birthInfo').textContent = userData.birth.replace(/(\d{4})-(\d{2})-(\d{2})/, '$1년 $2월 $3일');

      let barHtml = '';
      DOMAINS.forEach(d => {
        barHtml += `
          <div class="domain-bar">
            <div class="domain-name">${d}</div>
            <div class="bar-container">
              <div class="bar-fill" style="width: ${avgScores[d]}%">
                <span>${avgScores[d]}%</span>
              </div>
            </div>
          </div>
        `;
      });
      document.getElementById('barChartContainer').innerHTML = barHtml;

      const sorted = DOMAINS.map(d => ({domain: d, score: avgScores[d]}))
        .sort((a, b) => b.score - a.score);

      let strengthHtml = sorted.slice(0, 3).map(s => 
        `<div class="strength-item">${s.domain} (${s.score}%)</div>`
      ).join('');
      document.getElementById('strengthAnalysis').innerHTML = strengthHtml;

      let weaknessHtml = sorted.slice(-3).reverse().map(s =>
        `<div class="weakness-item">${s.domain} (${s.score}%)</div>`
      ).join('');
      document.getElementById('weaknessAnalysis').innerHTML = weaknessHtml;
    }

    function restartTest() {
      showScreen('question');
      answers = [];
      currentIdx = 0;
      displayQuestion();
    }

    function goToStart() {
      showScreen('start');
      document.getElementById('userName').value = '';
      document.getElementById('userBirth').value = '';
      document.getElementById('userGender').value = '';
    }
  </script>
