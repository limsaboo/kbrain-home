<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BHC 5.0 - 뇌 건강 체크 시스템</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(180deg, #1a472a 0%, #2d5a3d 100%);
      color: #333;
      min-height: 100vh;
      padding: 16px;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
      background: white;
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(0, 188, 212, 0.15);
      overflow: hidden;
    }

    .screen {
      display: none;
      padding: 32px 24px;
      min-height: 600px;
      animation: slideIn 0.3s ease-out;
    }

    .screen.active {
      display: block;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .header-title {
      text-align: center;
      margin-bottom: 32px;
    }

    .header-title h1 {
      font-size: 36px;
      font-weight: 900;
      color: #00BCD4;
      margin-bottom: 8px;
    }

    .header-title p {
      font-size: 14px;
      color: #666;
      font-weight: 600;
    }

    .input-group {
      margin-bottom: 20px;
    }

    .input-group label {
      display: block;
      font-size: 14px;
      font-weight: 800;
      color: #00BCD4;
      margin-bottom: 8px;
    }

    .input-group input,
    .input-group select {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid #00BCD4;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      color: #333;
    }

    .info-box {
      background: linear-gradient(135deg, #E0F7FA 0%, #B2EBF2 100%);
      border-left: 6px solid #00BCD4;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 24px;
      font-size: 13px;
      color: #00695C;
      font-weight: 600;
      line-height: 1.6;
    }

    .progress-bar {
      width: 100%;
      height: 6px;
      background: #E0E0E0;
      border-radius: 3px;
      margin-bottom: 24px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #00BCD4 0%, #00897B 100%);
      transition: width 0.3s ease;
    }

    .question-header {
      background: linear-gradient(135deg, #E0F7FA 0%, #B2EBF2 100%);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
      text-align: center;
    }

    .question-num {
      font-size: 12px;
      font-weight: 800;
      color: #00695C;
      margin-bottom: 6px;
    }

    .domain-tag {
      display: inline-block;
      background: #00BCD4;
      color: white;
      padding: 4px 10px;
      border-radius: 16px;
      font-size: 12px;
      font-weight: 800;
    }

    .mechanism-label {
      font-size: 10px;
      font-weight: 700;
      color: #00897B;
      margin-top: 6px;
    }

    .timer-section {
      display: flex;
      justify-content: center;
      margin-bottom: 16px;
    }

    .timer-circle {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: linear-gradient(135deg, #E0F7FA 0%, #B2EBF2 100%);
      border: 3px solid #00BCD4;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: 900;
      color: #00BCD4;
    }

    .timer-circle.warning {
      background: linear-gradient(135deg, #FFF9C4 0%, #FFEE58 100%);
      border-color: #FBC02D;
      color: #F57F17;
    }

    .timer-circle.danger {
      background: linear-gradient(135deg, #FFCDD2 0%, #EF5350 100%);
      border-color: #D32F2F;
      color: #B71C1C;
      animation: pulse 0.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }

    .stimulus-container {
      width: 100%;
      height: 250px;
      border: 3px solid #00BCD4;
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 16px;
      background: linear-gradient(135deg, #f5f5f5 0%, #eeeeee 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
    }

    .stimulus-svg {
      width: 100%;
      height: 100%;
      max-width: 240px;
      max-height: 240px;
    }

    .question-text {
      font-size: 14px;
      font-weight: 800;
      color: #00695C;
      text-align: center;
      margin-bottom: 16px;
      line-height: 1.4;
      background: #f9f9f9;
      padding: 12px;
      border-radius: 12px;
      border-left: 4px solid #00BCD4;
    }

    .choices {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 20px;
    }

    .choice-btn {
      padding: 12px 8px;
      border: 2px solid #DDD;
      border-radius: 12px;
      background: white;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 13px;
      font-weight: 700;
      color: #333;
      text-align: center;
      word-break: keep-all;
      min-height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .choice-btn:hover {
      border-color: #00BCD4;
      transform: scale(1.05);
    }

    .choice-btn.selected {
      border-color: #00BCD4;
      background: linear-gradient(135deg, #E0F7FA 0%, #B2EBF2 100%);
      box-shadow: 0 8px 16px rgba(0, 188, 212, 0.2);
    }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 10px;
    }

    .btn-primary {
      background: linear-gradient(135deg, #00BCD4 0%, #00897B 100%);
      color: white;
    }

    .btn-primary:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 12px 24px rgba(0, 188, 212, 0.3);
    }

    .btn-secondary {
      background: #f5f5f5;
      color: #333;
      border: 2px solid #E0E0E0;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* 결과 화면 */
    .result-container {
      padding: 0;
    }

    .result-header {
      background: linear-gradient(135deg, #00BCD4 0%, #0097A7 100%);
      color: white;
      padding: 36px 24px;
      text-align: center;
    }

    .result-title {
      font-size: 28px;
      font-weight: 900;
      margin-bottom: 6px;
    }

    .result-content {
      padding: 28px 24px;
    }

    .brain-age-box {
      background: linear-gradient(135deg, #E0F7FA 0%, #B2EBF2 100%);
      border-radius: 16px;
      padding: 28px 20px;
      text-align: center;
      margin-bottom: 24px;
      border: 3px solid #00BCD4;
      transition: all 0.3s ease;
    }

    .brain-age-box.normal { background: linear-gradient(135deg, #E8F5E9 0%, #C8E6C9 100%); border-color: #4CAF50; }
    .brain-age-box.caution { background: linear-gradient(135deg, #FFF9C4 0%, #FFEE58 100%); border-color: #FBC02D; }
    .brain-age-box.warning { background: linear-gradient(135deg, #FFE0B2 0%, #FFB74D 100%); border-color: #F57C00; }
    .brain-age-box.danger { background: linear-gradient(135deg, #FFCDD2 0%, #EF5350 100%); border-color: #D32F2F; }
    .brain-age-box.severe { background: linear-gradient(135deg, #FFCDD2 0%, #C62828 100%); border-color: #B71C1C; }

    .brain-age-label {
      font-size: 13px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .brain-age-number {
      font-size: 56px;
      font-weight: 900;
      margin-bottom: 8px;
    }

    .brain-age-desc {
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 10px;
    }

    .status-badge {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 16px;
      font-size: 12px;
      font-weight: 800;
      margin: 8px 0;
    }

    .status-badge.normal { background: #4CAF50; color: white; }
    .status-badge.caution { background: #FBC02D; color: #333; }
    .status-badge.warning { background: #F57C00; color: white; }
    .status-badge.danger { background: #D32F2F; color: white; }
    .status-badge.severe { background: #B71C1C; color: white; }

    .age-info {
      background: #f9f9f9;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 20px;
      border-left: 4px solid #4CAF50;
      font-size: 12px;
    }

    .age-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #E0E0E0;
      font-weight: 700;
    }

    .age-row:last-child { border-bottom: none; }

    .age-label { color: #666; }
    .age-value { color: #00BCD4; font-weight: 900; }

    .chart-section {
      background: #f9f9f9;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      border: 2px solid #E0E0E0;
    }

    .section-title {
      font-size: 14px;
      font-weight: 900;
      color: #00BCD4;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 2px solid #00BCD4;
    }

    .domain-bar {
      display: flex;
      align-items: center;
      margin-bottom: 8px;
      gap: 8px;
      font-size: 12px;
    }

    .domain-name {
      font-weight: 800;
      min-width: 50px;
    }

    .bar-container {
      flex: 1;
      height: 20px;
      background: #E0E0E0;
      border-radius: 4px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #00BCD4 0%, #00897B 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 800;
      color: white;
    }

    .insight-item {
      padding: 8px 0;
      border-bottom: 1px solid #E0E0E0;
      font-size: 12px;
      font-weight: 700;
    }

    .insight-item:last-child { border-bottom: none; }
    .insight-item.strength:before { content: "✓ "; color: #4CAF50; margin-right: 4px; }
    .insight-item.weakness:before { content: "⚠ "; color: #FF9800; margin-right: 4px; }

    .button-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 20px;
    }

    .button-group .btn { margin-bottom: 0; }

    @media print {
      body { background: white; padding: 0; }
      .container { box-shadow: none; max-width: 100%; border-radius: 0; }
      .screen { display: none !important; }
      .print-section { display: block !important; padding: 30px; }
      .btn { display: none !important; }
    }

    .print-section { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <!-- 시작 화면 -->
    <div id="startScreen" class="screen active">
      <div class="header-title">
        <h1>BHC 5.0</h1>
        <p>뇌 건강 체크 시스템</p>
      </div>

      <div class="info-box">
        51개의 명확한 문항을 제한시간 내에 선택합니다. 빠르고 직관적인 응답을 기반으로 뇌 건강을 분석합니다.
      </div>

      <div class="input-group">
        <label>이름</label>
        <input type="text" id="userName" placeholder="이름">
      </div>

      <div class="input-group">
        <label>생년월일</label>
        <input type="date" id="userBirth" required>
      </div>

      <div class="input-group">
        <label>성별</label>
        <select id="userGender">
          <option value="">선택</option>
          <option value="M">남성</option>
          <option value="F">여성</option>
        </select>
      </div>

      <button class="btn btn-primary" onclick="startTest()">시작</button>
    </div>

    <!-- 문제 화면 -->
    <div id="questionScreen" class="screen">
      <div class="progress-bar">
        <div class="progress-fill" id="progressBar"></div>
      </div>

      <div class="question-header">
        <div class="question-num" id="questionNum">Q. 1/51</div>
        <div class="domain-tag" id="domainTag">기억</div>
        <div class="mechanism-label" id="mechanismLabel">DMN</div>
      </div>

      <div class="timer-section">
        <div class="timer-circle" id="timerCircle">3</div>
      </div>

      <div class="stimulus-container">
        <svg class="stimulus-svg" id="stimulusSvg" viewBox="0 0 240 240"></svg>
      </div>

      <div class="question-text" id="questionText">질문</div>
      <div class="choices" id="choicesContainer"></div>

      <button class="btn btn-primary" onclick="nextQuestion()" id="nextBtn" disabled>다음</button>
    </div>

    <!-- 결과 화면 -->
    <div id="resultScreen" class="screen result-container">
      <div class="result-header">
        <div class="result-title">결과</div>
      </div>

      <div class="result-content">
        <div class="brain-age-box" id="brainAgeBox">
          <div class="brain-age-label">뇌 나이</div>
          <div class="brain-age-number" id="brainAge">00</div>
          <div class="brain-age-desc">세</div>
          <div class="status-badge" id="statusBadge">정상</div>
          <div id="statusMessage" style="font-size: 11px; font-weight: 700; margin-top: 6px;"></div>
        </div>

        <div class="age-info">
          <div class="age-row">
            <div class="age-label">실제 나이</div>
            <div class="age-value" id="realAge">00</div>
          </div>
          <div class="age-row">
            <div class="age-label">생년월일</div>
            <div class="age-value" id="birthInfo">YYYY년</div>
          </div>
          <div class="age-row">
            <div class="age-label">이름</div>
            <div class="age-value" id="userName2">-</div>
          </div>
        </div>

        <div class="chart-section">
          <div class="section-title">점수</div>
          <div id="barChartContainer"></div>
        </div>

        <div class="chart-section">
          <div class="section-title">강점</div>
          <div id="strengthAnalysis"></div>
        </div>

        <div class="chart-section">
          <div class="section-title">개선</div>
          <div id="weaknessAnalysis"></div>
        </div>

        <div class="button-group">
          <button class="btn btn-primary" onclick="printReport()">📄 인쇄/PDF</button>
          <button class="btn btn-secondary" onclick="restartTest()">다시</button>
          <button class="btn btn-secondary" onclick="goToStart()">처음</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    let currentIdx = 0;
    let answers = [];
    let userData = {};
    let timerInterval = null;

    const DOMAINS = ['기억', '속도', '집중', '감정', '판단', '실행', '조절', '공간'];

    // SVG 생성 함수들
    function createCircles() {
      return '<circle cx="60" cy="60" r="40" fill="#0D7A6B"/><circle cx="180" cy="60" r="40" fill="#0D7A6B"/><circle cx="120" cy="150" r="40" fill="#0D7A6B"/>';
    }

    function createSquares() {
      return '<rect x="30" y="30" width="60" height="60" fill="#0D7A6B"/><rect x="150" y="30" width="60" height="60" fill="#0D7A6B"/><rect x="90" y="130" width="60" height="60" fill="#0D7A6B"/>';
    }

    function createDiamonds() {
      return '<polygon points="120,40 160,120 120,200 80,120" fill="#0D7A6B"/><polygon points="120,80 140,120 120,160 100,120" fill="#0D7A6B"/>';
    }

    function createWaves() {
      return '<path d="M 30 120 Q 60 80 90 120 T 150 120 T 210 120" stroke="#0D7A6B" stroke-width="8" fill="none"/><path d="M 30 160 Q 60 120 90 160 T 150 160 T 210 160" stroke="#0D7A6B" stroke-width="8" fill="none"/>';
    }

    function createGradient() {
      return '<rect x="20" y="20" width="200" height="200" fill="none" stroke="#0D7A6B" stroke-width="3"/><line x1="40" y1="30" x2="160" y2="30" stroke="#0D7A6B" stroke-width="2"/><line x1="40" y1="60" x2="150" y2="60" stroke="#0D7A6B" stroke-width="2"/>';
    }

    const QUESTIONS_DATA = [
      // 기억 6개
      { svg: createCircles, q: '위에 몇 개의 원이 있나요?', choices: ['2개', '3개', '4개', '5개'], ans: 1, domain: '기억', mechanism: 'DMN - 회상' },
      { svg: createSquares, q: '사각형의 개수는?', choices: ['2개', '3개', '4개', '5개'], ans: 1, domain: '기억', mechanism: 'DMN - 회상' },
      { svg: createDiamonds, q: '마름모는 몇 개?', choices: ['1개', '2개', '3개', '4개'], ans: 1, domain: '기억', mechanism: 'DMN - 형태' },
      { svg: createWaves, q: '파도선 개수는?', choices: ['1개', '2개', '3개', '4개'], ans: 1, domain: '기억', mechanism: 'DMN - 패턴' },
      { svg: createGradient, q: '가로선 개수는?', choices: ['1개', '2개', '3개', '4개'], ans: 1, domain: '기억', mechanism: 'DMN - 세기' },
      { svg: () => '<circle cx="120" cy="120" r="50" fill="none" stroke="#0D7A6B" stroke-width="3"/>', q: '원이 있나요?', choices: ['예', '아니오', '불명', '둘다'], ans: 0, domain: '기억', mechanism: 'DMN - 인식' },

      // 속도 6개  
      { svg: () => '<text x="120" y="130" font-size="80" font-weight="bold" fill="#0D7A6B" text-anchor="middle">2+2=?</text>', q: '계산 빠르게: 답은?', choices: ['3', '4', '5', '6'], ans: 1, domain: '속도', mechanism: 'DLPFC - 연산' },
      { svg: () => '<circle cx="80" cy="80" r="35" fill="#0D7A6B"/><circle cx="160" cy="160" r="35" fill="#0D7A6B"/>', q: '원의 위치 순서는?', choices: ['좌상우하', '우상좌하', '중앙', '모서리'], ans: 0, domain: '속도', mechanism: 'DLPFC - 위치' },
      { svg: () => '<text x="120" y="120" font-size="60" fill="#0D7A6B" text-anchor="middle">A B A C</text>', q: '반복된 문자는?', choices: ['A', 'B', 'C', '없음'], ans: 0, domain: '속도', mechanism: 'DLPFC - 패턴' },
      { svg: () => '<rect x="40" y="40" width="80" height="80" fill="#0D7A6B"/><rect x="120" y="120" width="80" height="80" fill="none" stroke="#0D7A6B" stroke-width="3"/>', q: '채워진 것은?', choices: ['첫번째', '두번째', '같음', '없음'], ans: 0, domain: '속도', mechanism: 'DLPFC - 구분' },
      { svg: () => '<line x1="40" y1="40" x2="200" y2="200" stroke="#0D7A6B" stroke-width="4"/><line x1="200" y1="40" x2="40" y2="200" stroke="#0D7A6B" stroke-width="4"/>', q: '교차점 개수는?', choices: ['0개', '1개', '2개', '3개'], ans: 1, domain: '속도', mechanism: 'DLPFC - 교차' },
      { svg: () => '<circle cx="60" cy="60" r="30" fill="#0D7A6B"/><circle cx="180" cy="180" r="30" fill="#0D7A6B"/><rect x="100" y="100" width="40" height="40" fill="#0D7A6B"/>', q: '모양의 종류는?', choices: ['1가지', '2가지', '3가지', '4가지'], ans: 2, domain: '속도', mechanism: 'DLPFC - 분류' },

      // 집중 6개
      { svg: () => '<line x1="30" y1="30" x2="210" y2="210" stroke="#0D7A6B" stroke-width="2"/><circle cx="120" cy="120" r="3" fill="#0D7A6B"/>', q: '선 위 점이 있나?', choices: ['예', '아니오', '불명', '여러개'], ans: 0, domain: '집중', mechanism: 'DLPFC - 세밀' },
      { svg: () => '<rect x="50" y="50" width="140" height="140" fill="none" stroke="#0D7A6B" stroke-width="2"/><line x1="70" y1="100" x2="170" y2="100" stroke="#0D7A6B" stroke-width="1"/>', q: '가로선이 중앙인가?', choices: ['예', '아니오', '불명', '여러개'], ans: 0, domain: '집중', mechanism: 'DLPFC - 위치' },

      { svg: () => '<circle cx="50" cy="50" r="20" fill="#0D7A6B"/><circle cx="120" cy="120" r="25" fill="#0D7A6B"/><circle cx="190" cy="190" r="22" fill="#0D7A6B"/>', q: '가장 큰 원은?', choices: ['첫번째', '두번째', '세번째', '같음'], ans: 1, domain: '집중', mechanism: 'DLPFC - 크기' },

    function showScreen(screenName) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(screenName + 'Screen').classList.add('active');
    }

    function renderSvg() {
      const q = QUESTIONS_DATA[currentIdx];
      const svg = document.getElementById('stimulusSvg');
      svg.innerHTML = q.svg();
    }

    function startTest() {
      const name = document.getElementById('userName').value.trim();
      const birth = document.getElementById('userBirth').value;
      const gender = document.getElementById('userGender').value;

      if (!name || !birth || !gender) {
        alert('모든 정보를 입력해주세요');
        return;
      }

      const [year, month, day] = birth.split('-');
      const birthDate = new Date(parseInt(year), parseInt(month) - 1, parseInt(day));
      const today = new Date();
      let age = today.getFullYear() - birthDate.getFullYear();
      if (today.getMonth() < birthDate.getMonth() || 
          (today.getMonth() === birthDate.getMonth() && today.getDate() < birthDate.getDate())) {
        age--;
      }

      userData = { name, birth, gender, age };
      answers = [];
      currentIdx = 0;
      showScreen('question');
      displayQuestion();
    }

    function displayQuestion() {
      const q = QUESTIONS_DATA[currentIdx];
      const progress = ((currentIdx + 1) / QUESTIONS_DATA.length) * 100;
      
      document.getElementById('progressBar').style.width = progress + '%';
      document.getElementById('questionNum').textContent = `Q. ${currentIdx + 1}/51`;
      document.getElementById('domainTag').textContent = q.domain;
      document.getElementById('mechanismLabel').textContent = q.mechanism;
      document.getElementById('questionText').textContent = q.q;

      renderSvg();

      const choicesHtml = q.choices.map((c, i) => `
        <button class="choice-btn" onclick="selectChoice(${i})" id="choice-${i}">
          ${c}
        </button>
      `).join('');
      
      document.getElementById('choicesContainer').innerHTML = choicesHtml;
      document.getElementById('nextBtn').disabled = true;

      startTimer();
    }

    function startTimer() {
      clearInterval(timerInterval);
      const randomTime = Math.random() < 0.5 ? 3 : 5;
      let remaining = randomTime;
      
      const update = () => {
        document.getElementById('timerCircle').textContent = remaining;
        const circle = document.getElementById('timerCircle');
        circle.classList.remove('warning', 'danger');
        if (remaining <= 1) circle.classList.add('danger');
        else if (remaining <= 2) circle.classList.add('warning');
        
        remaining--;
        if (remaining < 0) {
          clearInterval(timerInterval);
          if (answers[currentIdx] === undefined) {
            selectChoice(0);
            setTimeout(() => nextQuestion(), 500);
          }
        }
      };
      
      update();
      timerInterval = setInterval(update, 1000);
    }

    function selectChoice(idx) {
      clearInterval(timerInterval);
      answers[currentIdx] = idx;
      document.querySelectorAll('.choice-btn').forEach(b => b.classList.remove('selected'));
      document.getElementById('choice-' + idx).classList.add('selected');
      document.getElementById('nextBtn').disabled = false;
    }

    function nextQuestion() {
      if (answers[currentIdx] === undefined) return;
      clearInterval(timerInterval);
      
      if (currentIdx < QUESTIONS_DATA.length - 1) {
        currentIdx++;
        displayQuestion();
      } else {
        finishTest();
      }
    }

    function finishTest() {
      clearInterval(timerInterval);
      showScreen('result');

      const scores = {};
      const domainCounts = {};
      DOMAINS.forEach(d => { scores[d] = 0; domainCounts[d] = 0; });

      QUESTIONS_DATA.forEach((q, i) => {
        if (q.domain) {
          domainCounts[q.domain]++;
          if (answers[i] === q.ans) scores[q.domain]++;
        }
      });

      const avgScores = {};
      DOMAINS.forEach(d => {
        avgScores[d] = Math.round((scores[d] / domainCounts[d]) * 100);
      });

      const avg = Object.values(avgScores).reduce((a, b) => a + b) / DOMAINS.length;
      let brainAge = 100 - Math.round(avg * 0.35);
      brainAge = Math.max(5, Math.min(100, brainAge));

      const ageDifference = brainAge - userData.age;
      let statusClass = 'normal', statusText = '✅ 정상', messageText = '';

      if (ageDifference >= 20) {
        statusClass = 'severe'; statusText = '🔴 매우 위험'; messageText = '전문의 진료';
      } else if (ageDifference >= 15) {
        statusClass = 'danger'; statusText = '🔴 위험'; messageText = '건강 관리 필요';
      } else if (ageDifference >= 10) {
        statusClass = 'warning'; statusText = '⚠️ 경고'; messageText = '정기 검사';
      } else if (ageDifference >= 5) {
        statusClass = 'caution'; statusText = '⚠️ 주의'; messageText = '훈련 권장';
      }

      document.getElementById('brainAge').textContent = brainAge;
      document.getElementById('brainAgeBox').className = 'brain-age-box ' + statusClass;
      document.getElementById('statusBadge').className = 'status-badge ' + statusClass;
      document.getElementById('statusBadge').textContent = statusText;
      document.getElementById('statusMessage').textContent = messageText;
      document.getElementById('realAge').textContent = '만 ' + userData.age + '세';
      document.getElementById('birthInfo').textContent = userData.birth.split('-')[0] + '년';
      document.getElementById('userName2').textContent = userData.name;

      let barHtml = '';
      DOMAINS.forEach(d => {
        barHtml += `<div class="domain-bar"><div class="domain-name">${d}</div><div class="bar-container"><div class="bar-fill" style="width: ${avgScores[d]}%">${avgScores[d]}%</div></div></div>`;
      });
      document.getElementById('barChartContainer').innerHTML = barHtml;

      const sorted = DOMAINS.map(d => ({domain: d, score: avgScores[d]})).sort((a, b) => b.score - a.score);

      let strengthHtml = sorted.slice(0, 3).map(s => `<div class="insight-item strength">${s.domain} (${s.score}%)</div>`).join('');
      document.getElementById('strengthAnalysis').innerHTML = strengthHtml;

      let weaknessHtml = sorted.slice(-3).reverse().map(s => `<div class="insight-item weakness">${s.domain} (${s.score}%)</div>`).join('');
      document.getElementById('weaknessAnalysis').innerHTML = weaknessHtml;
    }

    function printReport() {
      window.print();
    }

    function restartTest() {
      showScreen('question');
      answers = [];
      currentIdx = 0;
      displayQuestion();
    }

    function goToStart() {
      showScreen('start');
      document.getElementById('userName').value = '';
      document.getElementById('userBirth').value = '';
      document.getElementById('userGender').value = '';
    }
