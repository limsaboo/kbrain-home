<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>뇌건강클럽 - BHC 뇌나이측정</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
html { height: 100%; width: 100%; -webkit-text-size-adjust: 100%; }
body { background: linear-gradient(180deg, #1a472a 0%, #2d5a3d 100%); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif; height: 100vh; display: flex; align-items: center; justify-content: center; color: #333; }
.container { width: 100%; height: 100vh; background: white; display: flex; flex-direction: column; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.screen { display: none; width: 100%; min-height: 100vh; padding: 20px; flex-direction: column; animation: fadeIn 0.3s; }
.screen.active { display: flex; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.logo-box { background: linear-gradient(135deg, #00BCD4 0%, #0097A7 100%); border-radius: 24px; padding: 35px 20px; text-align: center; color: white; margin: 30px 0; box-shadow: 0 8px 20px rgba(0,188,212,0.3); }
.logo-emoji { font-size: 70px; display: block; margin-bottom: 15px; }
.logo-title { font-size: 36px; font-weight: 900; margin-bottom: 5px; }
.logo-subtitle { font-size: 14px; opacity: 0.9; font-weight: 600; }

.info-box { background: #f0f8fa; border-left: 5px solid #00BCD4; border-radius: 12px; padding: 18px; font-size: 14px; line-height: 1.8; margin-bottom: 10px; }
.info-box strong { color: #00BCD4; font-weight: 700; }

.form-group { margin-bottom: 18px; }
.form-label { font-size: 14px; font-weight: 700; color: #333; margin-bottom: 8px; display: block; }
.form-input, .form-select { width: 100%; padding: 14px; border: 2px solid #ddd; border-radius: 10px; font-size: 14px; font-weight: 600; }
.form-input:focus, .form-select:focus { outline: none; border-color: #00BCD4; }

.btn { width: 100%; padding: 16px; border: none; border-radius: 14px; font-size: 16px; font-weight: 700; cursor: pointer; transition: all 0.2s; margin-top: 10px; touch-action: manipulation; }
.btn-primary { background: linear-gradient(135deg, #00BCD4 0%, #0097A7 100%); color: white; box-shadow: 0 6px 16px rgba(0,188,212,0.3); }
.btn-primary:active { transform: scale(0.98); }
.btn-secondary { background: #f5f5f5; color: #333; border: 2px solid #ddd; }

.progress-bar-container { background: #e8e8e8; height: 8px; border-radius: 20px; overflow: hidden; margin-bottom: 10px; }
.progress-bar { height: 100%; background: linear-gradient(90deg, #00BCD4 0%, #0097A7 100%); width: 0%; transition: width 0.3s; }
.progress-text { display: flex; justify-content: space-between; font-size: 13px; font-weight: 600; color: #666; margin-bottom: 15px; }
.question-info { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 16px; background: #f5f5f5; border-radius: 12px; margin-bottom: 15px; }
.q-num { font-weight: 800; color: #00BCD4; }
.q-domain { background: linear-gradient(135deg, #00BCD4 0%, #0097A7 100%); color: white; padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 700; }
.question-text { font-size: 15px; font-weight: 700; color: #222; margin-bottom: 16px; }
.choices { display: grid; grid-template-columns: 1fr; gap: 12px; margin-bottom: 20px; }
.choice-btn { border: 3px solid #ddd; border-radius: 12px; padding: 16px; background: white; color: #333; font-size: 15px; font-weight: 700; cursor: pointer; transition: all 0.2s; text-align: center; min-height: 60px; display: flex; align-items: center; justify-content: center; }
.choice-btn:active { transform: scale(0.96); }
.choice-btn.selected { border-color: #00BCD4; background: linear-gradient(135deg, #B2EBF2 0%, #80DEEA 100%); }

.nav-buttons { display: flex; gap: 10px; margin-top: auto; padding-top: 15px; }
.btn-nav { flex: 1; padding: 14px; border: 3px solid #00BCD4; background: white; color: #00BCD4; border-radius: 10px; font-weight: 700; font-size: 14px; cursor: pointer; }
.btn-nav:active:not(:disabled) { background: #00BCD4; color: white; }
.btn-nav:disabled { opacity: 0.3; }

.result-title { font-size: 32px; color: #00BCD4; text-align: center; font-weight: 900; margin: 30px 0; }
.brain-age-card { background: linear-gradient(135deg, #00BCD4 0%, #0097A7 100%); color: white; border-radius: 20px; padding: 35px 20px; text-align: center; margin-bottom: 15px; }
.brain-age-number { font-size: 56px; font-weight: 900; margin-bottom: 12px; }
.analysis-section { background: #f5f5f5; border-radius: 14px; padding: 20px; margin-bottom: 15px; }
.section-title { font-size: 15px; font-weight: 800; color: #00BCD4; margin-bottom: 15px; }

.info-title { font-size: 24px; font-weight: 900; color: #00BCD4; margin-bottom: 20px; text-align: center; }
</style>
</head>
<body>

<div class="container">
  <!-- 시작 화면 -->
  <div id="startScreen" class="screen active">
    <div class="logo-box">
      <span class="logo-emoji">🧠</span>
      <div class="logo-title">뇌건강클럽</div>
      <div class="logo-subtitle">Brain Age Measurement (BAM) 2.0</div>
    </div>
    <div class="info-box">
      <p><strong>📊 8가지 인지 영역</strong> 측정</p>
      <p>기억 · 집중 · 감정 · 판단 · 실행 · 조절 · 공간 · 속도</p>
      <p><strong>⏱️ 약 10분</strong> 소요</p>
      <p>당신의 뇌 나이를 측정해보세요! 💡</p>
    </div>
    <button class="btn btn-primary" onclick="goToUserInfo()">🚀 검사 시작</button>
  </div>

  <!-- 사용자 정보 입력 -->
  <div id="userInfoScreen" class="screen">
    <div class="info-title">📋 기본 정보 입력</div>
    <div class="info-box">
      <p>검사 결과를 저장하기 위해 기본 정보를 입력해주세요.</p>
    </div>

    <div class="form-group">
      <label class="form-label">이름 (필수)</label>
      <input type="text" id="userName" class="form-input" placeholder="홍길동" maxlength="30">
    </div>

    <div class="form-group">
      <label class="form-label">생년월일 (필수, 예: 1960)</label>
      <input type="number" id="userBirth" class="form-input" placeholder="1960" min="1900" max="2024">
    </div>

    <div class="form-group">
      <label class="form-label">성별</label>
      <select id="userGender" class="form-select">
        <option value="">선택하기</option>
        <option value="M">남성</option>
        <option value="F">여성</option>
      </select>
    </div>

    <button class="btn btn-primary" onclick="startTest()">✅ 검사 시작</button>
    <button class="btn btn-secondary" onclick="goToStart()">← 뒤로</button>
  </div>

  <!-- 검사 화면 -->
  <div id="testScreen" class="screen">
    <div class="progress-bar-container">
      <div class="progress-bar" id="progressBar"></div>
    </div>
    <div class="progress-text">
      <span id="progressNum">1/45</span>
      <span id="progressPct">2%</span>
    </div>
    <div class="question-info">
      <span class="q-num" id="qNum">Q. 1</span>
      <span class="q-domain" id="qDomain">기억</span>
    </div>
    <div class="question-text" id="questionText">로딩 중...</div>
    <div class="choices" id="choices"></div>
    <div class="nav-buttons">
      <button class="btn-nav" onclick="prevQ()" id="prevBtn">← 이전</button>
      <button class="btn-nav" onclick="nextQ()" id="nextBtn">다음 →</button>
    </div>
  </div>

  <!-- 결과 화면 -->
  <div id="resultScreen" class="screen">
    <div class="result-title">🎉 검사 완료!</div>
    <div class="brain-age-card">
      <div style="font-size: 14px; opacity: 0.9; margin-bottom: 10px; font-weight: 700;">당신의 뇌 나이는</div>
      <div class="brain-age-number" id="brainAge">000세</div>
      <div style="font-size: 13px; opacity: 0.85; font-weight: 600;">시니어 평균과 비교한 인지 수준입니다</div>
    </div>
    <div class="analysis-section">
      <div class="section-title">📊 인지 영역별 점수</div>
      <div id="barChartContainer" style="font-size: 13px;"></div>
    </div>
    <div class="analysis-section">
      <div class="section-title">💪 당신의 강점</div>
      <div id="strengthAnalysis" style="font-size: 13px;"></div>
    </div>
    <div class="analysis-section">
      <div class="section-title">🎯 개선 필요 영역</div>
      <div id="weaknessAnalysis" style="font-size: 13px;"></div>
    </div>
    <button class="btn btn-primary" onclick="restartTest()">🔄 다시 검사하기</button>
    <button class="btn btn-secondary" onclick="goToStart()">🏠 처음으로</button>
  </div>
</div>

<script>
// ========== 전역 변수 ==========
let currentIdx = 0;
let answers = [];
let userData = {};

// 45개 문항
const QUESTIONS_DATA = [
  { q: "숫자를 기억하세요: 7-3-9-2-5", ans: 0, domain: "기억" },
  { q: "이전 숫자 중 '9'가 있었나요?", ans: 0, domain: "기억" },
  { q: "가장 빠르게 반응하세요", ans: 0, domain: "속도" },
  { q: "패턴 찾기: 2-4-6-8-?", ans: 1, domain: "집중" },
  { q: "색상을 맞춰보세요", ans: 0, domain: "집중" },
  { q: "행복한 표정은?", ans: 0, domain: "감정" },
  { q: "슬픈 표정을 선택하세요", ans: 1, domain: "감정" },
  { q: "이 상황에서 최고의 선택은?", ans: 0, domain: "판단" },
  { q: "순서대로 정렬하면?", ans: 1, domain: "실행" },
  { q: "공간에서 위치는?", ans: 0, domain: "공간" },
  { q: "반복되는 패턴 찾기", ans: 0, domain: "속도" },
  { q: "기억력 테스트 1", ans: 1, domain: "기억" },
  { q: "집중력 유지하기", ans: 0, domain: "집중" },
  { q: "감정 인식하기", ans: 0, domain: "감정" },
  { q: "판단 능력 테스트", ans: 0, domain: "판단" },
  { q: "실행 순서 정하기", ans: 0, domain: "실행" },
  { q: "공간 회전 이해", ans: 1, domain: "공간" },
  { q: "반응 속도 테스트", ans: 0, domain: "속도" },
  { q: "기억력 테스트 2", ans: 0, domain: "기억" },
  { q: "지속적인 집중력", ans: 1, domain: "집중" },
  { q: "감정 변화 감지", ans: 0, domain: "감정" },
  { q: "의사결정 능력", ans: 0, domain: "판단" },
  { q: "계획 세우기", ans: 1, domain: "실행" },
  { q: "조절 능력 테스트", ans: 0, domain: "조절" },
  { q: "공간 지각력", ans: 0, domain: "공간" },
  { q: "속도 반응성", ans: 1, domain: "속도" },
  { q: "기억력 테스트 3", ans: 0, domain: "기억" },
  { q: "주의 집중", ans: 0, domain: "집중" },
  { q: "감정 이해", ans: 1, domain: "감정" },
  { q: "판단력 향상", ans: 0, domain: "판단" },
  { q: "실행 계획", ans: 0, domain: "실행" },
  { q: "자기 조절", ans: 1, domain: "조절" },
  { q: "공간 인식", ans: 0, domain: "공간" },
  { q: "빠른 반응", ans: 0, domain: "속도" },
  { q: "기억 재현", ans: 1, domain: "기억" },
  { q: "선택적 주의", ans: 0, domain: "집중" },
  { q: "감정 표현", ans: 0, domain: "감정" },
  { q: "문제해결", ans: 0, domain: "판단" },
  { q: "순서 실행", ans: 1, domain: "실행" },
  { q: "충동 조절", ans: 0, domain: "조절" },
  { q: "방향 감지", ans: 0, domain: "공간" },
  { q: "신속한 처리", ans: 1, domain: "속도" },
  { q: "최종 기억 테스트", ans: 0, domain: "기억" },
  { q: "마지막 집중력 문제", ans: 0, domain: "집중" },
  { q: "최종 판단 능력", ans: 0, domain: "판단" }
];

const DOMAINS = ["기억", "집중", "감정", "판단", "실행", "조절", "공간", "속도"];
const SENIOR_AVERAGE = {
  "기억": 65, "집중": 62, "감정": 68, "판단": 64,
  "실행": 63, "조절": 66, "공간": 60, "속도": 58
};

// ========== 함수 ==========
function showScreen(name) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById(name + "Screen").classList.add("active");
  window.scrollTo(0, 0);
}

function goToStart() { showScreen("start"); }
function goToUserInfo() { showScreen("userInfo"); }

function startTest() {
  const name = document.getElementById("userName").value.trim();
  const birth = parseInt(document.getElementById("userBirth").value);

  if (!name || !birth || birth < 1900 || birth > 2024) {
    alert("이름과 올바른 생년을 입력해주세요");
    return;
  }

  userData = { 
    name, 
    birth, 
    gender: document.getElementById("userGender").value 
  };
  currentIdx = 0;
  answers = [];
  
  showScreen("test");
  loadQuestion();
}

function loadQuestion() {
  if (currentIdx >= 45) return;
  
  const q = QUESTIONS_DATA[currentIdx];
  const pct = Math.round(((currentIdx + 1) / 45) * 100);
  
  document.getElementById("progressBar").style.width = pct + "%";
  document.getElementById("progressNum").textContent = (currentIdx + 1) + "/45";
  document.getElementById("progressPct").textContent = pct + "%";
  document.getElementById("qNum").textContent = "Q. " + (currentIdx + 1);
  document.getElementById("qDomain").textContent = q.domain;
  document.getElementById("questionText").textContent = q.q;

  const choicesDiv = document.getElementById("choices");
  choicesDiv.innerHTML = "";
  
  const choices = ["①", "②", "③", "④"];
  choices.forEach((choice, idx) => {
    const btn = document.createElement("button");
    btn.className = "choice-btn" + (answers[currentIdx] === idx ? " selected" : "");
    btn.textContent = choice;
    btn.onclick = () => selectChoice(idx);
    choicesDiv.appendChild(btn);
  });

  document.getElementById("prevBtn").disabled = (currentIdx === 0);
  document.getElementById("nextBtn").textContent = (currentIdx === 44) ? "✅ 완료" : "다음 →";
}

function selectChoice(idx) {
  answers[currentIdx] = idx;
  loadQuestion();
}

function prevQ() {
  if (currentIdx > 0) {
    currentIdx--;
    loadQuestion();
  }
}

function nextQ() {
  if (currentIdx < 44) {
    currentIdx++;
    loadQuestion();
  } else {
    finishTest();
  }
}

function finishTest() {
  showScreen("result");
  
  const scores = {};
  const domainCounts = {};
  DOMAINS.forEach(d => {
    scores[d] = 0;
    domainCounts[d] = 0;
  });

  QUESTIONS_DATA.forEach((q, i) => {
    if (q.domain) {
      domainCounts[q.domain]++;
      if (answers[i] === q.ans) {
        scores[q.domain]++;
      }
    }
  });

  const avgScores = {};
  DOMAINS.forEach(d => {
    avgScores[d] = Math.round((scores[d] / domainCounts[d]) * 100);
  });

  const avg = Object.values(avgScores).reduce((a, b) => a + b) / 8;
  let brainAge = 100 - Math.round(avg * 0.35);
  brainAge = Math.max(5, Math.min(100, brainAge));

  document.getElementById("brainAge").textContent = brainAge + "세";

  // 막대 그래프
  const barChartHTML = DOMAINS.map(d => {
    const personalScore = avgScores[d];
    const averageScore = SENIOR_AVERAGE[d];
    return `
      <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 14px;">
        <div style="width: 50px; text-align: right; font-weight: 700; color: #333;">${d}</div>
        <div style="flex: 1; position: relative; height: 24px; background: #e8e8e8; border-radius: 4px; overflow: hidden;">
          <div style="position: absolute; height: 100%; background: linear-gradient(90deg, #00BCD4 0%, #0097A7 100%); width: ${personalScore}%; border-radius: 4px;"></div>
        </div>
        <div style="width: 40px; text-align: center; font-weight: 800; color: #00BCD4;">${personalScore}점</div>
      </div>
    `;
  }).join("");

  document.getElementById("barChartContainer").innerHTML = barChartHTML;

  // 강점/약점
  const sortedDomains = DOMAINS.map(d => ({
    domain: d,
    score: avgScores[d],
    diff: avgScores[d] - SENIOR_AVERAGE[d]
  })).sort((a, b) => b.diff - a.diff);

  const strengthHTML = sortedDomains.slice(0, 2).map(d => `
    <div style="background: #E8F5E9; border-left: 4px solid #4CAF50; padding: 12px; margin-bottom: 10px; border-radius: 8px;">
      <strong style="color: #2E7D32;">✓ ${d.domain} (${d.score}점)</strong><br>
      <span style="color: #558B2F;">평균보다 +${d.diff}점 높습니다!</span>
    </div>
  `).join("");

  const weaknessHTML = sortedDomains.slice(-2).map(d => `
    <div style="background: #FFEBEE; border-left: 4px solid #F44336; padding: 12px; margin-bottom: 10px; border-radius: 8px;">
      <strong style="color: #C62828;">⚠ ${d.domain} (${d.score}점)</strong><br>
      <span style="color: #D32F2F;">개선이 필요합니다. 꾸준한 훈련으로 향상 가능!</span>
    </div>
  `).join("");

  document.getElementById("strengthAnalysis").innerHTML = strengthHTML;
  document.getElementById("weaknessAnalysis").innerHTML = weaknessHTML;

  // 로컬스토리지에 저장
  const result = {
    name: userData.name,
    birth: userData.birth,
    gender: userData.gender,
    brainAge: brainAge,
    avgScores: avgScores,
    timestamp: new Date().toLocaleString('ko-KR')
  };
  localStorage.setItem('bhcLatestResult', JSON.stringify(result));
  console.log("✅ 검사 결과 저장 완료:", result);
}

function restartTest() { goToUserInfo(); }

console.log("✅ BHC 시스템 로드 완료! 모든 CDN 제거됨 - 순수 HTML/CSS/JavaScript");
</script>

</body>
</html>
