<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>뇌건강체크 - BHC (Brain Health Check)</title>
<style>
html, body {
  margin: 0;
  padding: 0;
  background: linear-gradient(135deg, #667EEA 0%, #764BA2 100%);
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

.container {
  width: 100%;
  max-width: 500px;
  padding: 20px;
  box-sizing: border-box;
}

.start-screen, .test-screen {
  background: white;
  border-radius: 20px;
  padding: 30px;
  box-shadow: 0 10px 40px rgba(0,0,0,0.2);
  text-align: center;
}

.test-screen {
  display: none;
}

h1 {
  color: #333;
  margin: 0 0 10px 0;
  font-size: 28px;
}

.subtitle {
  color: #666;
  margin-bottom: 20px;
  font-size: 14px;
}

.button {
  background: #4CAF50;
  color: white;
  padding: 15px 30px;
  border: none;
  border-radius: 10px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  width: 100%;
  margin-top: 20px;
  transition: all 0.3s;
}

.button:hover {
  background: #45a049;
  transform: scale(1.02);
}

.button:active {
  transform: scale(0.98);
}

.question {
  text-align: left;
  margin-bottom: 20px;
}

.question-text {
  font-size: 18px;
  font-weight: bold;
  margin-bottom: 15px;
  color: #333;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.option {
  padding: 12px;
  background: #f0f0f0;
  border: 2px solid #ddd;
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.3s;
  text-align: center;
}

.option:hover {
  background: #667EEA;
  color: white;
  border-color: #667EEA;
}

.result-screen {
  display: none;
}

.result-score {
  font-size: 48px;
  font-weight: bold;
  color: #667EEA;
  margin: 20px 0;
}

.result-message {
  font-size: 16px;
  color: #666;
  line-height: 1.6;
  margin-bottom: 20px;
}

.nav-buttons {
  display: flex;
  gap: 10px;
  margin-top: 20px;
}

.nav-buttons button {
  flex: 1;
  padding: 10px;
  background: #667EEA;
  color: white;
  border: none;
  border-radius: 8px;
  cursor: pointer;
}
</style>
</head>
<body>

<div class="container">
  <!-- 시작 화면 -->
  <div id="startScreen" class="start-screen">
    <h1>🧠 뇌건강체크</h1>
    <p class="subtitle">BHC (Brain Health Check)</p>
    
    <p style="color: #666; line-height: 1.6;">
      간단한 20초 검사로 당신의 뇌 건강을 알아보세요!
    </p>
    
    <button class="button" onclick="startTest()">🚀 검사 시작하기</button>
    
    <p style="font-size: 12px; color: #999; margin-top: 20px;">
      ℹ️ 이 검사는 의료 진단이 아닙니다.
    </p>
  </div>

  <!-- 검사 화면 -->
  <div id="testScreen" class="test-screen">
    <div class="question">
      <h2 style="color: #667EEA; margin: 0 0 20px 0;" id="questionNum">질문 1/5</h2>
      <p class="question-text" id="questionText">질문이 로드됩니다...</p>
      
      <div class="options" id="options"></div>
      
      <div class="nav-buttons">
        <button onclick="prevQuestion()">← 이전</button>
        <button onclick="nextQuestion()">다음 →</button>
      </div>
    </div>
  </div>

  <!-- 결과 화면 -->
  <div id="resultScreen" class="result-screen">
    <h1>검사 완료!</h1>
    <div class="result-score" id="resultScore">85점</div>
    <div class="result-message" id="resultMessage">당신의 뇌 건강은 양호합니다!</div>
    
    <button class="button" onclick="location.href='/'">🏠 홈으로</button>
  </div>
</div>

<script>
// 간단한 테스트 데이터
const questions = [
  { text: "최근 1주일 동안 기억력이 좋았나요?", answers: ["매우 좋음", "좋음", "보통", "나쁨", "매우 나쁨"] },
  { text: "집중력이 필요한 일을 잘 할 수 있나요?", answers: ["매우 잘함", "잘함", "보통", "못함", "매우 못함"] },
  { text: "최근 스트레스가 많나요?", answers: ["전혀 없음", "적음", "보통", "많음", "매우 많음"] },
  { text: "충분한 수면을 취하고 있나요?", answers: ["항상", "자주", "가끔", "거의 안함", "전혀 안함"] },
  { text: "전반적인 뇌 건강 상태는?", answers: ["매우 건강", "건강", "보통", "걱정됨", "매우 걱정됨"] }
];

let currentQuestion = 0;
let answers = [];

function startTest() {
  console.log('🚀🚀🚀 검사 시작!!!');
  
  // 화면 전환
  document.getElementById('startScreen').style.display = 'none';
  document.getElementById('testScreen').style.display = 'block';
  document.getElementById('resultScreen').style.display = 'none';
  
  // 초기화
  currentQuestion = 0;
  answers = [];
  
  loadQuestion();
}

function loadQuestion() {
  const q = questions[currentQuestion];
  document.getElementById('questionNum').textContent = `질문 ${currentQuestion + 1}/${questions.length}`;
  document.getElementById('questionText').textContent = q.text;
  
  const optionsDiv = document.getElementById('options');
  optionsDiv.innerHTML = '';
  
  q.answers.forEach((answer, idx) => {
    const div = document.createElement('div');
    div.className = 'option';
    div.textContent = answer;
    div.onclick = () => selectAnswer(idx);
    optionsDiv.appendChild(div);
  });
}

function selectAnswer(idx) {
  answers[currentQuestion] = idx;
  nextQuestion();
}

function nextQuestion() {
  if (currentQuestion < questions.length - 1) {
    currentQuestion++;
    loadQuestion();
  } else {
    showResult();
  }
}

function prevQuestion() {
  if (currentQuestion > 0) {
    currentQuestion--;
    loadQuestion();
  }
}

function showResult() {
  // 점수 계산 (간단한 방식)
  let score = 0;
  answers.forEach(answer => {
    score += (5 - answer) * 20;
  });
  score = Math.min(100, Math.max(0, score));
  
  document.getElementById('startScreen').style.display = 'none';
  document.getElementById('testScreen').style.display = 'none';
  document.getElementById('resultScreen').style.display = 'block';
  
  document.getElementById('resultScore').textContent = score + '점';
  
  if (score >= 80) {
    document.getElementById('resultMessage').textContent = '당신의 뇌 건강은 매우 양호합니다! 현재의 생활 습관을 유지하세요.';
  } else if (score >= 60) {
    document.getElementById('resultMessage').textContent = '뇌 건강이 양호합니다. 규칙적인 운동과 충분한 수면을 권장합니다.';
  } else {
    document.getElementById('resultMessage').textContent = '뇌 건강을 위해 생활 습관 개선이 필요합니다. 전문가 상담을 권장합니다.';
  }
}

console.log('✅ 페이지 로드 완료!');
</script>

</body>
</html>
