html,body{height:100%;}
body{

@keyframes bhtcShimmer{0%{background-position:0% 50%;}100%{background-position:200% 50%;}}
@keyframes bhtcGlow{
  0%,100%{box-shadow:0 0 0 1px rgba(201,168,76,.25) inset,0 18px 40px -18px rgba(0,0,0,.7),0 0 30px -6px rgba(201,168,76,.35);}

@keyframes bhcLiftR{0%,100%{transform:rotate(-18deg)}50%{transform:rotate(48deg)}}
@keyframes bhcSpark{0%{opacity:0;transform:scale(.3) rotate(0)}25%{opacity:1}70%{opacity:.8}100%{opacity:0;transform:scale(1.35) rotate(45deg)}}
.bhtc-title{background-size:200% auto;animation:bhtcShimmer 3.4s linear infinite;}
.bhtc-plaque{animation:bhtcGlow 3.2s ease-in-out infinite;}
.bhtc-spark{animation:bhtcSparkle 2.6s ease-in-out infinite;}
.bhtc-bulb{position:absolute;width:7px;height:7px;border-radius:50%;animation:bhtcBulb 1.6s ease-in-out infinite;}
.bhc-brain-mascot{animation:bhcBrainBob 1.45s ease-in-out infinite}
.bhc-arm-left{transform-origin:66px 116px;animation:bhcLiftL 1.25s ease-in-out infinite}
.bhc-arm-right{transform-origin:134px 116px;animation:bhcLiftR 1.25s ease-in-out infinite}
.bhc-db-left{transform-origin:48px 74px;animation:bhcLiftL 1.25s ease-in-out infinite}
.bhc-db-right{transform-origin:152px 74px;animation:bhcLiftR 1.25s ease-in-out infinite}
.bhc-spark{transform-box:fill-box;transform-origin:center;animation:bhcSpark 1.8s ease-out infinite}
.bhtc-outer{max-width:440px;width:100%;position:relative;}
.bhtc-flex{display:flex;flex-direction:column;align-items:center;}
.bhtc-icon-col{flex:0 0 auto;}
.bhtc-text-col{width:100%;text-align:center;}
.bhtc-mascot-svg{display:block;margin:0 auto 4px;width:clamp(72px,26vw,132px);height:auto;overflow:visible;}
.bhtc-pills{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-bottom:20px;}

<script>
// PWA 설치 프롬프트 (BHC뇌건강헬스클럽 전용)
let bhtcDeferredPrompt;
var installBtn = document.getElementById('bhtcInstallBtn');
var manualHint = document.getElementById('bhtcManualHint');

window.addEventListener('beforeinstallprompt', function(e){
  e.preventDefault();
  bhtcDeferredPrompt = e;
  if (installBtn) installBtn.style.display = 'inline-flex';
});

if (installBtn) {
  installBtn.addEventListener('click', function () {
    if (!bhtcDeferredPrompt) return;
    bhtcDeferredPrompt.prompt();
    bhtcDeferredPrompt.userChoice.then(function(choice){
      bhtcDeferredPrompt = null;
      installBtn.style.display = 'none';
    });
  });
}

window.addEventListener('appinstalled', function(){
  if (installBtn) installBtn.style.display = 'none';
  if (manualHint) manualHint.textContent = '설치가 완료되었습니다. 홈 화면에서 뇌헬스클럽 아이콘을 확인하세요.';
});

// 이미 standalone(설치된 앱)으로 실행 중이면 안내 문구 숨김
if (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true) {
  if (manualHint) manualHint.style.display = 'none';
}
</script>
