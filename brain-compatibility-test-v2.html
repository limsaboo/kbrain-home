.scale{display:flex;justify-content:space-between;font-size:12px;color:#000;line-height:1.5;margin-top:2px}

.kk{background:#FEE500;color:#000;border:3px solid #000}

세요. 별명에 실명이 들어가지 않도록 보호자가 안내해 주세요.": "People under 18 may use it with a parent's or legal guardian's consent, together with that guardian. Please make sure real names are not used as nicknames.", "뇌를 직접 측정하나요?": "Does it measure my brain directly?", "아닙니다. 그림 선택 경향을 뇌 기능 설명에 빗대어 보여 주는 도구이며, 뇌 활동을 측정하지 않습니다.": "No. It uses your picture ratings and explains them with brain-function ideas. It does not measure brain activity.", "서비스 원칙": "Our principles", "누가 맞고 틀렸는지 판정하지 않습니다. 사람을 낙인찍거나 우열을 가리지 않고, 서로 다른 성향을 발견하고 대화하도록 돕습니다.": "We never judge who is right or wrong. We do not label people or rank them. We help you notice different tendencies and talk about them.", "님이 초대했어요": " invited you", "그림 30장에 점수를 주면 두 사람의 뇌 성향을 겹쳐 볼 수 있어요. 회원가입은 필요 없어요.": "Rate 30 pictures and you can overlay your two brain-tendency profiles. No sign-up needed.", "나도 해보기 · 그림 30장": "Try it too · 30 pictures", "그림 30장, 마음에 드는 정도를 눌러 주세요": "30 pictures: tap how much you like each one", "정답은 없어요. 그림을 한 장씩 보고 1점(전혀)부터 5점(최고)까지, 지금 느낌대로 누르면 됩니다.": "There are no right answers. Look at each picture and tap from 1 (Not at all) to 5 (Love it), just as you feel right now.", "별명(선택)": "Nickname (optional)", "예: 민수 (비워도 됩니다)": "e.g. Alex (can be left blank)", "연령대(선택)": "Age group (optional)", "고르면 같은 연령대 평균 선과 함께 비교해 보여 드려요.": "If you pick one, we show the average line for your age group to compare.", "별명 칸에는 실명 등 개인정보를 쓰지 마세요. 결과로 가족을 평가하거나 비교하지 말고, 대화의 계기로만 사용해 주세요.": "Please do not enter your real name or other personal information as a nickname. Do not use the result to judge or compare family members; use it only to start a conversation.", "이 서비스는 자기이해·오락용 콘텐츠입니다. 만 18세 미만은 보호자(법정대리인) 동의가 필요합니다. 본 검사는 의학적 진단이 아니며, 중요한 결정의 근거로 쓰지 마세요. (총 30장)": "This service is self-understanding and entertainment content. Under 18 requires a parent's or guardian's consent. It is not a medical diagnosis; do not use it as the basis for important decisions. (30 pictures in total)", "만 18세 이상이거나, 보호자(법정대리인) 동의를 받았습니다": "I r is good or bad.", " · 강함": " · Strong", " · 보통": " · Moderate", " · 약함": " · Light", "강함 · ": "Strong · ", "보통 · ": "Moderate · ", "약함 · ": "Light · ", "평균과 비교하면": "Compared with the average", "평균보다 가장 높음": "Highest above average", "평균보다 가장 낮음": "Lowest vs. average", "점수가 평균보다 낮다는 것은 못한다는 뜻이 아니라, 이번 그림들이 덜 마음에 들었다는 뜻일 뿐입니다. 능력이나 수준의 높낮이가 아닙니다.": "A score below the average does not mean you are worse at something. It only means you liked these pictures a little less. It says nothing about ability or level.", "가장 높은 영역과 가장 낮은 영역": "Highest and lowest areas", "가장 높음": "Highest", "가장 낮음": "Lowest", "뇌 이야기 · ": "Brain story · ", "작은 실천: ": "Small action: ", " 영역 카드": " area card", " 관련 뇌 부위 개략도": " related brain region (sketch)", "끌리기 쉬운 상대": "Someone you may click with", "부딪히기 쉬운 상황": "Situations that may cause friction", "상대에게 이렇게 말해 보세요": "Try saying this to them", "근거와 한계": "Evidence and limits", "영역 이름과 뇌 이야기는 아래 문헌에서 일반적으로 알려진 내용을 빌려 쉽게 풀었습니다. 점수는 그림 30장에 준 평점(1~5점)을 영역별로 더해 0~100점으로 바꾼 값이며 뇌 활동을 측정한 값이 아닙니다. 비교 기준은 ": "Area names and brain stories borrow generally known findings from the references below and explain them simply. Scores are your 1–5 ratings of the 30 pictures added up per area and converted to 0–100; they are not measurements of brain activity. The comparison baseline is ", "입니다. 영역 구성과 그림-영역 연결은 연구소의 설계안이며, 표준화 검증을 거친 척도가 아닙니다. 좌뇌형·우뇌형 같은 단순 구분은 쓰지 않았습니다 ": ". The area structure and the picture-to-area links are the institute's design and are not a standardized, validated scale. Simple left-brain/right-brain types are not used ", "그 사람에게 보내서 두 사람의 레이더를 겹쳐 보세요": "Send it to them and overlay your two radars", "링크를 받은 사람이 그림 30장에 점수를 주면 둘의 결과가 나옵니다.": "When the person who gets the link rates 30 pictures, your combined result appears.", "초대 링크 복사": "Copy invite link", "공유하기": "Share", "다시 해보기": "Try again", "링크를 복사했어요": "Link copied", "링크를 길게 눌러 복사해 주세요": "Long-press the link to copy it", "나는 「": "I'm \"", "」 유형! 우리 둘의 뇌 성향도 그림으로 겹쳐 볼래?": "\"! Want to overlay our brain tendencies with pictures too?", "두 사람의 뇌 성향 레이더": "Brain-tendency radar of you two", "(숫자는 ": "(Numbers: ", " 순서)": " in this order)", "닮은꼴 조합": "Look-alike pair", "닮고 다른 균형 조합": "Balanced mix of alike and different", "서로 다른 매력 조합": "Pair with different charms", "정반대 보완 조합": "Opposite, complementary pair", "점수 패턴 겹침률. 정답이나 궁합 점수가 아니라 두 사람의 그림 선택이 얼마나 겹치는지입니다.": "Score-pattern overlap. This is not a right answer or a compatibility score; it only shows how much your picture ratings overlap.", "점수 패턴 겹침 ": "Score pattern overlap ", "점수 패턴이 크게 겹칩니다. 편안한 대신 둘 다 약한 영역을 함께 챙기면 좋습니다.": "Your score patterns overlap a lot. It feels easy together, so it helps to look after the areas that are light for both of you.", "닮은 영역과 다른 영역이 고르게 섞였습니다. 다른 영역의 대화법이 관계의 열쇠입니다.": "Alike and different areas are evenly mixed. How you talk about the different areas is the key.", "서로 다른 영역이 뚜렷합니다. 오해도 쉽지만 서로에게서 배울 점이 많은 조합입니다.": "The differences are clear. Misunderstandings are easy, but you have a lot to learn from each other.", "점수 패턴이 거의 반대입니다. 서로의 방식을 번역해 주면 가장 큰 보완이 됩니다.": "Your score patterns are nearly opposite. Translating each other's style gives the biggest complement.", "두 사람의 케미": "Your chemistry", "함께 불붙는 영역": "Area that lights up together", "서로 채워 주는 영역": "Area you fill in for each other", "함께 챙길 영역": "Area to look after together", "서로에게 이렇게 말해 보세요": "Try saying this to each other", "이번 주 둘이 해 볼 미션": "This week's mission for two", "겹침률은 두 사람의 영역별 점수 차이의 평균을 100에서 뺀 값(100 − 점수 차이 합 ÷ 5)이며, 관계의 좋고 나쁨이나 미래를 예측하지 않습니다. 영역 설명의 근거 문헌은 개인 보고서의 문헌 목록과 같습니다.": "The overlap rate is 100 minus the average score difference across the five areas (100 − sum of differences ÷ 5). It does not say whether a relationship is good or bad and does not predict the future. The references for the area descriptions are the same as in the personal report.", "이 결과 공유하기": "Share this result", "점수 패턴 겹침률": "Score pattern overlap", "사고·계획": "Planning", "감정·공감": "Empathy", "보상·도전": "Challenge", "습관·안정": "Habit", "상상·창의": "Imagination", "전전두엽": "Prefrontal lobe", "섬엽·전측 대상피질": "Insula · anterior cingulate cortex", "보상회로(도파민계·선조체)": "Reward circuit (dopamine system · striatum)", "기저핵": "Basal ganglia", "디폴트 모드 네트워크": "Default mode network", "계획 세우기·판단·충동 조절 같은 실행기능": "Executive functions such as planning, judgment and impulse control", "감정 신호를 처리하고 타인의 감정을 헤아리는 일": "Processing emotional signals and understanding other people's feelings", "새로움과 보상 기대에 반응하는 일": "Responding to novelty and the expectation of reward", "반복한 행동을 습관으로 묶어 자동화하는 일": "Bundling repeated behavior into automatic habits", "상상과 아이디어 연결(실행 네트워크와 함께 작동)": "Linking imagination and ideas (working together with the executive network)", "결정 전에 상황을 정리하고 순서를 세울 때 마음이 편합니다. 약속과 계획이 곧 신뢰입니다.": "You feel at ease when you sort out the situation and set an order before deciding. For you, promises and plans are trust.", "필요할 때는 계획하고, 때로는 흐름에 맡기는 균형이 있습니다.": "You plan when needed and sometimes go with the flow. You keep a balance.", "계획보다 그때그때의 느낌과 흐름을 따릅니다. 즉흥적인 순간에서 힘이 납니다.": "You follow the feeling and flow of the moment more than a plan. Spontaneous moments give you energy.", "중요한 대화 전에 하고 싶은 말을 세 줄로 정리해 보세요.": "Before an important conversation, write what you want to say in three lines.", "전전두엽은 계획 세우기, 판단, 충동 조절 같은 실행기능에 중요한 역할을 하는 것으로 알려져 있습니다.": "The prefrontal lobe is known to play an important role in executive functions such as planning, judgment and impulse control.", "둘 다 계획과 판단이 단단합니다. 믿음직하지만 결정이 길어질 수 있어요. \"언제까지 정할지\" 기한을 함께 정해 보세요.": "Both of you are solid at planning and judging. That is dependable, but decisions can take long. Agree together on a deadline for deciding.", "둘 다 흐름에 맡기는 편입니다. 자유롭지만 중요한 일정이 비기 쉬워요. 꼭 지킬 일 세 가지만 함께 적어 두세요.": "Both of you tend to go with the flow. It is free, but important plans can slip. Write down just three things you will definitely keep.", "계획과 즉흥의 비율이 비슷합니다. 상황에 맞춰 서로 속도를 맞추기 쉬운 조합입니다.": "Your mix of planning and improvising is similar. It is an easy pair for matching each other's pace to the situation.", "한 사람은 계획으로, 한 사람은 흐름으로 움직입니다. \"답답하다/즉흥적이다\"로 오해하기 쉬워요. 큰 틀은 계획하고 나머지는 자유롭게 맡겨 보세요.": "One of you moves by plan, the other by flow. It is easy to misread this as \"stuffy\" or \"impulsive\". Plan the big frame and leave the rest free.", "상대의 표정과 분위기를 빠르게 읽고, 마음을 나누는 시간에서 힘을 얻습니다.": "You quickly read people's expressions and the mood, and you gain energy from time spent sharing feelings.", "마음을 나누는 것도, 혼자 정리하는 것도 상황에 따라 고릅니다.": "You choose between sharing feelings and sorting them out alone, depending on the situation.", "감정보다 사실과 해결에 먼저 집중합니다. 마음을 말로 꺼내는 데 시간이 걸릴 수 있어요.": "You focus on facts and solutions before feelings. Putting feelings into words may take you some time.", "하루 한 번, 오늘 가장 좋았던 일을 상대에게 한 문장으로 말해 보세요.": "Once a day, tell the other person the best thing that happened today in one sentence.", "섬엽과 전측 대상피질은 타인의 감정을 함께 느끼고 헤아리는 공감 연구에서 자주 활성이 보고되는 영역입니다.": "The insula and anterior cingulate cortex are regions often reported as active in empathy research on sharing and understanding other people's feelings.", "둘 다 감정을 잘 읽고 나눕니다. 따뜻하지만 감정이 겹쳐 커질 수 있어요. 힘든 날에는 먼저 5분 쉬고 이야기해 보세요.": "Both of you read and share feelings well. It is warm, but feelings can pile up together. On hard days, rest for 5 minutes first and then talk.", "둘 다 사실과 해결에 집중합니다. 담백하지만 마음 표현이 부족할 수 있어요. 하루 한 번 고마운 일 한 문장을 나눠 보세요.": "Both of you focus on facts and solutions. It is plain and clear, but expressing feelings can be short. Share one sentence about something you are thankful for once a day.", "마음 나누기의 온도가 비슷합니다. 서로의 표현 방식을 존중하기 쉬운 조합입니다.": "Your warmth in sharing feelings is similar. It is an easy pair for respecting each other's way of expressing.", "한 사람은 마음부터, 한 사람은 해결부터 챙깁니다. \"공감을 안 해 준다/감정적이다\"로 오해하기 쉬워요. 먼저 \"공감이 필요해, 해결이 필요해?\"라고 물어보세요.": "One of you starts with feelings, the other with solutions. It is easy to misread this as \"not empathetic\" or \"too emotional\". First ask, \"Do you need empathy or a solution?\"", "새로운 곳, 처음 해 보는 일에서 설렘과 에너지를 얻습니다.": "New places and first-time experiences give you excitement and energy.", "새로움도 좋아하지만 안정도 필요한 균형형입니다.": "You like novelty but also need stability. You are the balanced type.", "낯선 도전보다 검증된 선택에서 마음이 놓입니다.": "You feel more at ease with proven choices than with unfamiliar challenges.", "이번 주에 둘이 처음 가 보는 곳 한 군데를 정해 보세요.": "Pick one place the two of you have never been, to visit this week.", "중뇌 도파민계와 선조체 등 보상회로는 새로운 자극과 보상 기대에 반응하는 것으로 알려져 있습니다.": "Reward circuits such as the midbrain dopamine system and the striatum are known to respond to new stimuli and the expectation of reward.", "둘 다 새로움을 즐깁니다. 늘 설레지만 생활의 기본이 흔들릴 수 있어요. 지킬 것 몇 가지는 정해 두세요.": "Both of you enjoy novelty. It is always exciting, but the basics of daily life can wobble. Decide on a few things you will keep.", "둘 다 안정적인 선택을 좋아합니다. 평화롭지만 자극이 줄 수 있어요. 한 달에 한 번 작은 새로움을 넣어 보세요.": "Both of you like stable choices. It is peaceful, but stimulation can fade. Add one small new thing once a month.", "도전과 안정의 균형이 비슷해 새로운 시도도 무리 없이 맞춰 갈 수 있습니다.": "Your balance of challenge and stability is similar, so you can try new things together without strain.", "한 사람은 새로움에서, 한 사람은 익숙함에서 힘을 얻습니다. \"무모하다/재미없다\"로 오해하기 쉬워요. 익숙한 것 둘, 새로운 것 하나로 균형을 맞춰 보세요.": "One of you gains energy from novelty, the other from the familiar. It is easy to misread this as \"reckless\" or \"boring\". Balance with two familiar things and one new thing.", "익숙한 루틴과 약속된 흐름에서 안정을 느끼고, 한번 맺은 관계를 오래 지킵니다.": "You feel secure in familiar routines and agreed-upon flow, and you keep a relationship for a long time once made.", "루틴도 지키고 변화도 받아들이는 유연함이 있습니다.": "You keep routines and also accept change. You are flexible.", "반복보다 변화를 선호합니다. 같은 일이 계속되면 답답함을 느낄 수 있어요.": "You prefer change to repetition. You may feel stuck if the same thing goes on and on.", "매일 같은 시간에 5분, 둘만의 작은 루틴(인사·산책 등)을 정해 보세요.": "Set a small routine for the two of you, 5 minutes at the same time every day (a greeting, a walk, and so on).", "기저핵은 반복한 행동을 하나의 덩어리(습관)로 묶어 자동화하는 데 관여하는 것으로 알려져 있습니다.": "The basal ganglia are known to be involved in bundling repeated behavior into one chunk (a habit) and making it automatic.", "둘 다 루틴과 약속을 소중히 합니다. 편안하고 단단하지만 변화가 필요할 때 대응이 늦을 수 있어요. 작은 변화를 미리 연습해 보세요.": "Both of you value routines and promises. It is comfortable and solid, but you may respond slowly when change is needed. Practice small changes in advance.", "둘 다 변화를 즐깁니다. 신선하지만 생활 리듬이 흔들릴 수 있어요. 식사·수면처럼 꼭 지킬 리듬을 함께 정하세요.": "Both of you enjoy change. It is fresh, but your daily rhythm can wobble. Agree on rhythms you will keep, such as meals and sleep.", "루틴에 대한 태도가 비슷해 생활 리듬을 맞추기 쉬운 조합입니다.": "Your attitude to routines is similar, so it is an easy pair for matching daily rhythm.", "한 사람은 루틴이, 한 사람은 변화가 편합니다. \"고집스럽다/변덕스럽다\"로 오해하기 쉬워요. 평일은 루틴, 주말은 변화로 나눠 보세요.": "One of you is comfortable with routine, the other with change. It is easy to misread this as \"stubborn\" or \"fickle\". Try routine on weekdays and change on weekends.", "상상하고 새로운 조합을 떠올리는 일에서 즐거움을 느낍니다. 엉뚱한 생각이 대화를 풍성하게 합니다.": "You enjoy imagining and thinking up new combinations. Quirky ideas enrich the conversation.", "현실적인 생각과 상상을 오가며 균형을 잡습니다.": "You move between realistic thinking and imagination and keep a balance.", "상상보다 눈앞의 현실과 구체적인 사실에 집중합니다.": "You focus on the reality in front of you and concrete facts more than on imagination.", "10분 동안 \"우리가 함께 해 보고 싶은 일\" 다섯 가지를 자유롭게 적어 보세요.": "For 10 minutes, freely write down five things you would like to try together.", "디폴트 모드 네트워크는 쉬는 동안 활발하며, 창의적 사고 때 실행 네트워크와 함께 작동한다는 연구가 있습니다.": "Research suggests the default mode network is active during rest and works together with the executive network during creative thinking.", "둘 다 상상과 아이디어가 풍부합니다. 대화가 즐겁지만 실행이 미뤄질 수 있어요. 아이디어 중 하나만 이번 주에 실행해 보세요.": "Both of you are rich in imagination and ideas. Conversation is fun, but action can get postponed. Try just one idea this week.", "둘 다 현실적이고 구체적입니다. 믿음직하지만 새로운 발상이 부족할 수 있어요. 함께 \"만약에\" 놀이를 해 보세요.": "Both of you are realistic and concrete. It is dependable, but fresh ideas can be scarce. Play a \"what if\" game together.", "상상과 현실의 균형이 비슷해 서로의 이야기를 이해하기 쉬운 조합입니다.": "Your balance of imagination and reality is similar, so it is an easy pair for understanding each other's stories.", "한 사람은 상상으로, 한 사람은 현실로 이야기합니다. \"뜬구름 잡는다/꽉 막혔다\"로 오해하기 쉬워요. 상상은 끝까지 들어주고, 현실 확인은 한 번만 하세요.": "One of you talks through imagination, the other through reality. It is easy to misread this as \"head in the clouds\" or \"closed-minded\". Hear the imagination out, and do the reality check only once.", "전전두피질": "Prefrontal cortex", "섬엽": "Insula", "전측 대상피질": "Anterior cingulate cortex", "복측 피개영역": "Ventral tegmental area", "측좌핵(복측 선조체)": "Nucleus accumbens (ventral striatum)", "미상핵·피각·담창구": "Caudate · putamen · globus pallidus", "내측 전전두피질·후측 대상피질·각회·해마": "Medial prefrontal cortex · posterior cingulate cortex · angular gyrus · hippocampus", "관련 기능: ": "Related function: ", "실행기능": "Executive function", "공감·감정 처리": "Empathy · emotion processing", "보상·새로움 반응(도파민계)": "Reward · novelty response (dopamine system)", "습관 형성": "Habit formation", "상상·창의적 사고": "Imagination · creative thinking", "속 깊은 설계자": "Thoughtful Planner", "마음을 챙기면서도 차분히 계획하는 사람": "Someone who cares about feelings and still plans calmly", "약속을 지키고 감정도 솔직히 나누는 사람": "Someone who keeps promises and shares feelings honestly", "계획이 갑자기 바뀌는데 설명이 없을 때": "When plans change suddenly without explanation", "네 마음도 중요해. 우리 같이 순서를 정리해 보자.": "Your feelings matter too. Let's sort out the order together.", "계산된 모험가": "Calculated Adventurer", "따져 본 뒤 과감하게 도전하는 사람": "Someone who weighs things up and then boldly takes on challenges", "새로운 계획을 함께 세우고 실행해 주는 사람": "Someone who makes new plans with you and carries them out", "준비 없이 밀어붙이거나 도전 자체를 막을 때": "When someone pushes ahead unprepared or blocks the challenge itself", "도전은 좋아. 필요한 준비만 같이 확인하고 가자.": "I like the challenge. Let's just check the needed preparation together and go.", "신중한 지킴이": "Careful Keeper", "검증된 방식을 계획대로 꾸준히 지키는 사람": "Someone who steadily keeps proven ways, as planned", "약속과 루틴을 존중하는 사람": "Someone who respects promises and routines", "일정이 갑자기 뒤집히고 규칙이 자주 바뀔 때": "When schedules flip suddenly and rules change often", "바꿔야 한다면 미리 알려 줘. 그러면 나도 준비할 수 있어.": "If we need to change it, tell me in advance. Then I can prepare too.", "아이디어 전략가": "Idea Strategist", "상상을 계획으로 바꾸는 사람": "Someone who turns imagination into plans", "내 아이디어를 들어주고 현실로 옮기도록 돕는 사람": "Someone who listens to my ideas and helps make them real", "아이디어를 바로 무시하거나 이야기만 길어질 때": "When ideas are dismissed right away or the talking just drags on", "아이디어 세 가지만 고르고, 이번 주에 한 가지부터 해 보자.": "Let's pick just three ideas and start with one this week.", "열정 공감러": "Passionate Empath", "마음이 움직이면 바로 달려가는 따뜻한 사람": "A warm person who runs straight to action when moved", "감정을 솔직히 나누고 함께 신나게 움직이는 사람": "Someone who shares feelings honestly and moves excitedly together", "감정 표현이 차갑거나 새로운 시도를 늘 거절당할 때": "When emotional expression feels cold or new attempts are always turned down", "지금 기분을 먼저 말할게. 그다음에 같이 해 볼 걸 정하자.": "Let me say how I feel first. Then let's decide what to try together.", "포근한 보호자": "Cozy Caretaker", "편안한 루틴 안에서 사람을 세심히 돌보는 사람": "Someone who carefully looks after people within comfortable routines", "꾸준히 곁을 지켜 주고 안정감을 주는 사람": "Someone who stays by your side and gives you a sense of security", "변화가 잦은데 마음을 말로 안 해 줄 때": "When change is frequent and feelings are not put into words", "요즘 나는 이런 마음이야. 변화가 필요하면 천천히 같이 해 보자.": "This is how I've been feeling lately. If change is needed, let's do it slowly together.", "감성 몽상가": "Sentimental Dreamer", "감정과 상상이 풍부한 사람": "Someone rich in feeling and imagination", "마음 이야기와 엉뚱한 생각을 함께 즐겨 주는 사람": "Someone who enjoys heart-to-heart talk and quirky thoughts with you", "현실 이야기만 하며 감정을 건너뛸 때": "When only practical talk is allowed and feelings are skipped", "내 마음이 이런데, 이런 상상도 해 봤어. 같이 들어줄래?": "This is how I feel, and I imagined something like this too. Will you listen with me?", "균형 개척자": "Balanced Pioneer", "새로움과 익숙함 사이에서 균형을 잡는 사람": "Someone who balances novelty and familiarity", "도전도 하고 일상도 지켜 주는 사람": "Someone who takes on challenges and also protects daily life", "둘 중 하나만 강요받을 때": "When forced to choose only one of the two", "익숙한 것 둘, 새로운 것 하나로 이번 주를 채워 보자.": "Let's fill this week with two familiar things and one new thing.", "자유로운 발명가": "Free-spirited Inventor", "새로운 경험과 아이디어에서 힘을 얻는 사람": "Someone who gains energy from new experiences and ideas", "같이 엉뚱한 일을 벌여 주는 사람": "Someone who gets up to quirky things with you", "정해진 틀과 반복이 계속될 때": "When fixed frames and repetition go on and on", "이번 주는 처음 해 보는 것 하나를 같이 정하자.": "Let's pick one first-time thing to do together this week.", "차분한 예술가": "Calm Artist", "조용한 일상 속에서 나만의 상상을 키우는 사람": "Someone who grows their own imagination in quiet daily life", "나의 속도와 취향을 존중하는 사람": "Someone who respects my pace and taste", "재촉하다가 갑자기 낯선 환경으로 데려갈 때": "When rushing me and then suddenly taking me to an unfamiliar setting", "나만의 시간을 조금 줘. 그다음에 이야기 나눌게.": "Give me a little time of my own. Then I'll talk with you.", "고른 조화형": "Even Harmonizer", "다섯 영역을 고르게 쓰는 유연한 사람": "A flexible person who uses all five areas evenly", "상황에 맞춰 함께 균형을 잡아 주는 사람": "Someone who keeps balance together as the situation requires", "한쪽 방식만 강요받을 때": "When only one way is forced on you", "이번엔 네 방식으로, 다음엔 내 방식으로 해 보자.": "This time your way, next time mine.", "준비 중입니다": "Coming soon", "관심을 눌러 주셔서 감사합니다 (테스트판은 저장되지 않아요)": "Thank you for your interest", "점선 · ": "Dashed · ", " 평균": " average", "5가지 뇌 기능 영역 레이더차트": "Radar chart of five brain-function areas", "뇌 기능 5영역 그림": "Picture of the five brain-function areas", "2인": "Duo", "한국뇌심리연구소": "Korea Brain Psychology Institute", "바깥쪽일수록 점수가 높아요.": "The farther out, the higher the score.", "강함·약함은 성향의 세기이며 좋고 나쁨이 아닙니다.": "Strong or light shows how pronounced a tendency is, not good or bad.", "평균보다 낮아도 못한다는 뜻이 아니에요. 능력의 높낮이가 아닙니다.": "Being below average does not mean you are worse. It is not a measure of ability.",  아니며, 중요한 결정의 근거로 쓰지 마세요. (총 30장)": "Сервис — материал для самопознания и развлечения. Лицам младше 18 лет нужно согласие родителя или законного представителя. Тест не является медицинским диагнозом, не используйте его как основание для важных решений. (Всего 30 картинок)", "만 18세 이상이거나, 보호자(법정대리인) 동의를 받았습니다": "Мне есть 18 лет или у меня есть согласие родителя/законного представителя", "시작하기": "Начать", "처음으로": "В начало", "점수 주기": "Оценить", "이 그림이 얼마나 마음에 드세요?": "Насколько вам нравится эта картинка?", "이전 그림으로": "К предыдущей картинке", "그림 카드 ": "Картинка ", "만 18세 미만은 보호자 동의가 필요해요. 확인 칸을 눌러 주세요": "Лицам младше 18 лет нужно согласие родителя или опекуна. Отметьте галочку подтверждения", "의 뇌 성향 분석": "— анализ профиля мозга", "다섯 영역 점수가 비슷함": "Баллы по пяти областям почти одинаковы", "1순위 ": "№1 ", "2순위 ": "№2 ", "연령대 ": "Возрастная группа ", "뇌 성향 점수 레이더": "Радар баллов профиля мозга", "그림 30장에 준 점수를 영역별로 더해 0~100점으로 바꾼 값입니다. 바깥쪽일수록 점수가 높습니다.": "Оценки 30 картинок суммируются по областям и переводятся в шкалу 0–100. Чем дальше от центра, тем выше балл.", "실선 · 나": "Сплошная · я", "연령 평균": "Среднее по возрасту", "전체 기준(50점)": "Общая база (50)", "전체 기준": "Общая база", " 임시 규준(성격 발달 연구의 일반 경향 기반 가정값 [7][8])": "временная норма (предполагаемые значения на основе общих тенденций исследований развития личности [7][8])", "(이 서비스 참여자 ": "(", "은 실측 표본이 아닌 성격 발달 연구의 일반 경향에 기반한 임시 규준이며, 참여 결과가 쌓이면 실제 데이터로 다시 계산합니다.": "— временная норма на основе общих тенденций исследований развития личности, а не измеренная выборка. Когда накопятся результаты, мы пересчитаем её по реальным данным.", "연령대를 고르면 연령대 평균 선이 함께 표시됩니다. 지금은 전체 기준(50점)입니다.": "Выберите возрастную группу — появится и её средняя линия. Сейчас показана общая база (50).", "뇌 지도 (개략도)": "Карта мозга (схема)", "뇌 지도 개략도": "Схема карты мозга", "앞(이마쪽)": "Перед (лоб)", "뒤(뒤통수쪽)": "Зад (затылок)", "원의 크기와 숫자는 레이더와 같은 점수입니다. 위치는 이해를 돕는 그림이며 실제 뇌 해부도가 아닙니다.": "Размер кружков и цифры — те же баллы, что на радаре. Положение услов ": "Отправьте ссылку человеку и наложите два радара", "링크를 받은 사람이 그림 30장에 점수를 주면 둘의 결과가 나옵니다.": "Когда получивший ссылку оценит 30 картинок, появится ваш общий результат.", "초대 링크 복사": "Скопировать ссылку-приглашение", "공유하기": "Поделиться", "다시 해보기": "Пройти ещё раз", "링크를 복사했어요": "Ссылка скопирована", "링크를 길게 눌러 복사해 주세요": "Нажмите на ссылку и удерживайте, чтобы скопировать", "나는 「": "Мой тип — «", "」 유형! 우리 둘의 뇌 성향도 그림으로 겹쳐 볼래?": "»! Хочешь наложить наши профили мозга по картинкам?", "두 사람의 뇌 성향 레이더": "Радар профилей мозга вас двоих", "(숫자는 ": "(Цифры: ", " 순서)": " — в этом порядке)", "닮은꼴 조합": "Похожая пара", "닮고 다른 균형 조합": "Баланс сходства и различий", "서로 다른 매력 조합": "Пара с разными достоинствами", "정반대 보완 조합": "Противоположная, дополняющая пара", "점수 패턴 겹침률. 정답이나 궁합 점수가 아니라 두 사람의 그림 선택이 얼마나 겹치는지입니다.": "Совпадение профилей. Это не «правильный ответ» и не оценка совместимости, а лишь то, насколько совпал ваш выбор картинок.", "점수 패턴 겹침 ": "Совпадение профилей ", "점수 패턴이 크게 겹칩니다. 편안한 대신 둘 다 약한 영역을 함께 챙기면 좋습니다.": "Профили сильно совпадают. Вместе вам легко; полезно вместе уделять внимание областям, слабым у обоих.", "닮은 영역과 다른 영역이 고르게 섞였습니다. 다른 영역의 대화법이 관계의 열쇠입니다.": "Сходные и различные области смешаны поровну. Ключ к отношениям — как вы говорите об областях, где различаетесь.", "서로 다른 영역이 뚜렷합니다. 오해도 쉽지만 서로에게서 배울 점이 많은 조합입니다.": "Различия заметны. Недопонимания возможны, но вам есть чему учиться друг у друга.", "점수 패턴이 거의 반대입니다. 서로의 방식을 번역해 주면 가장 큰 보완이 됩니다.": "Профили почти противоположны. Если вы «переводите» стиль друг друга, получится самое сильное дополнение.", "두 사람의 케미": "Химия между вами", "함께 불붙는 영역": "Область, где вы загораетесь вместе", "서로 채워 주는 영역": "Область, где вы дополняете друг друга", "함께 챙길 영역": "Область, о которой стоит позаботиться вместе", "서로에게 이렇게 말해 보세요": "Попробуйте сказать друг другу так", "이번 주 둘이 해 볼 미션": "Задание для вас двоих на эту неделю", "겹침률은 두 사람의 영역별 점수 차이의 평균을 100에서 뺀 값(100 − 점수 차이 합 ÷ 5)이며, 관계의 좋고 나쁨이나 미래를 예측하지 않습니다. 영역 설명의 근거 문헌은 개인 보고서의 문헌 목록과 같습니다.": "Совпадение — это 100 минус средняя разница баллов по пяти областям (100 − сумма разниц ÷ 5). Оно не говорит, хорошие ли у вас отношения, и не предсказывает будущее. Источники описаний областей те же, что в личном отчёте.", "이 결과 공유하기": "Поделиться результатом", "점수 패턴 겹침률": "Совпадение профилей", "사고·계획": "Планирование", "감정·공감": "Эмпатия", "보상·도전": "Азарт", "습관·안정": "Привычки", "상상·창의": "Воображение", "전전두엽": "Префронтальная доля", "섬엽·전측 대상피질": "Островок · передняя поясная кора", "보상회로(도파민계·선조체)": "Система вознаграждения (дофамин · полосатое тело)", "기저핵": "Базальные ганглии", "디폴트 모드 네트워크": "Сеть пассивного режима работы мозга", "계획 세우기·판단·충동 조절 같은 실행기능": "Исполнительные функции: планирование, суждение, контроль импульсов", "감정 신호를 처리하고 타인의 감정을 헤아리는 일": "Обработка эмоциональных сигналов и понимание чувств других", "새로움과 보상 기대에 반응하는 일": "Реакция на новизну и ожидание награды", "반복한 행동을 습관으로 묶어 자동화하는 일": "Закрепление повторяемых действий в автоматические привычки", "상상과 아이디어 연결(실행 네트워크와 함께 작동)": "Связь воображения и идей (вместе с исполнительной сетью)", "결정 전에 상황을 정리하고 순서를 세울 때 마음이 편합니다. 약속과 계획이 곧 신뢰입니다.": "Вам спокойно, когда перед решением вы разбираете ситуацию и выстраиваете порядок. Для вас обещания и планы — это доверие.", "필요할 때는 계획하고, 때로는 흐름에 맡기는 균형이 있습니다.": "Вы планируете, когда нужно, и порой отдаётесь течению. У вас есть баланс.", "계획보다 그때그때의 느낌과 흐름을 따릅니다. 즉흥적인 순간에서 힘이 납니다.": "Вы следуете настроению и моменту, а не плану. Спонтанные мгновения придают вам сил.", "중요한 대화 전에 하고 싶은 말을 세 줄로 정리해 보세요.": "Перед важным разговором запишите то, что хотите сказать, в трёх строках.", "전전두엽은 계획 세우기, 판단, 충동 조절 같은 실행기능에 중요한 역할을 하는 것으로 알려져 있습니다.": "Известно, что префронтальная доля играет важную роль в исполнительных функциях: планировании, суждении и контроле импульсов.", "둘 다 계획과 판단이 단단합니다. 믿음직하지만 결정이 길어질 수 있어요. \"언제까지 정할지\" 기한을 함께 정해 보세요.": "Оба крепки в планировании и суждениях. Надёжно, но решения могут затягиваться. Вместе установите срок: «до когда решаем».", "둘 다 흐름에 맡기는 편입니다. 자유롭지만 중요한 일정이 비기 쉬워요. 꼭 지킬 일 세 가지만 함께 적어 두세요.": "Оба склонны отдаваться течению. Свободно, но важные планы легко теряются. Вместе запишите всего три обязательные вещи.", "계획과 즉흥의 비율이 비슷합니다. 상황에 맞춰 서로 속도를 맞추기 쉬운 조합입니다.": "Доли планирования и импровизации у вас похожи. Вам легко подстраиваться друг под друга по ситуации.", "한 사람은 계획으로, 한 사람은 흐름으로 움직입니다. \"답답하다/즉흥적이다\"로 오해하기 쉬워요. 큰 틀은 계획하고 나머지는 자유롭게 맡겨 보세요.": "Один действует по плану, другой — по течению. Легко ошибочно решить, что «скучно» или «несерьёзно». Спланируйте общие рамки, остальное оставьте свободным.", "상대의 표정과 분위기를 빠르게 읽고, 마음을 나누는 시간에서 힘을 얻습니다.": "Вы быстро читаете выражение лиц и атмосферу и черпаете силы во времени, когда делитесь чувствами.", "마음을 나누는 것도, 혼자 정리하는 것도 상황에 따라 고릅니다.": "Вы выбираете — поделиться чувствами или разобраться в одиночку — по ситуации.", "감정보다 사실과 해결에 먼저 집중합니다. 마음을 말로 꺼내는 데 시간이 걸릴 수 있어요.": "Вы сначала сосредотачиваетесь на фактах и решении, а не на чувствах. Чувства может быть нелегко выразить словами.", "하루 한 번, 오늘 가장 좋았던 일을 상대에게 한 문장으로 말해 보세요.": "Раз в день скажите другому одним предложением, что сегодня было лучшим.", "섬엽과 전측 대상피질은 타인의 감정을 함께 느끼고 헤아리는 공감 연구에서 자주 활성이 보고되는 영역입니다.": "Островок и передняя поясная кора — области, активность которых часто отмечают в исследованиях эмпатии, когда мы вместе чувствуем и понимаем чужие эмоции.", "둘 다 감정을 잘 읽고 나눕니다. 따뜻하지만 감정이 겹쳐 커질 수 있어요. 힘든 날에는 먼저 5분 쉬고 이야기해 보세요.": "Оба хорошо читают и разделяют чувства. Тепло, но эмоции могут накладываться и нарастать. В тяжёлый день сначала отдохните 5 минут, потом поговорите.", "둘 다 사실과 해결에 집중합니다. 담백하지만 마음 표현이 부족할 수 있어요. 하루 한 번 고마운 일 한 문장을 나눠 보세요.": "Оба сосредоточены на фактах и решении. Просто и ясно, но чувств может не хватать. Раз в день делитесь одним предложением о том, за что благодарны.", "마음 나누기의 온도가 비슷합니다. 서로의 표현 방식을 존중하기 쉬운 조합입니다.": "Тепло в обмене чувствами у вас похоже. Вам легко уважать способы выражения друг друга.", "한 사람은 마음부터, 한 사람은 해결부터 챙깁니다. \"공감을 안 해 준다/감정적이다\"로 오해하기 쉬워요. 먼저 \"공감이 필요해, 해결이 필요해?\"라고 물어보세요.": "Один начинает с чувств, другой — с решения. Легко ошибочно решить: «не сочувствует» или «слишком эмоциональный». Сначала спросите: «Тебе нужно сочувствие или решение?»", "새로운 곳, 처음 해 보는 일에서 설렘과 에너지를 얻습니다.": "Новые места и первый опыт приносят вам волнение и энергию.", "새로움도 좋아하지만 안정도 필요한 균형형입니다.": "Вам нравится новизна, но нужна и стабильность. Вы — тип баланса.", "낯선 도전보다 검증된 선택에서 마음이 놓입니다.": "Вам спокойнее с проверенным выбором, чем с незнакомыми вызовами.", "이번 주에 둘이 처음 가 보는 곳 한 군데를 정해 보세요.": "Выберите одно место, где вы вдвоём ещё не были, и сходите туда на этой неделе.", "중뇌 도파민계와 선조체 등 보상회로는 새로운 자극과 보상 기대에 반응하는 것으로 알려져 있습니다.": "Известно, что системы вознаграждения, такие как дофаминовая система среднего мозга и полосатое тело, реагируют на новые стимулы и ожидание награды.", "둘 다 새로움을 즐깁니다. 늘 설레지만 생활의 기본이 흔들릴 수 있어요. 지킬 것 몇 가지는 정해 두세요.": "Оба любят новизну. Всегда увлекательно, но основы быта могут пошатнуться. Решите несколько вещей, которые нужно соблюдать.", "둘 다 안정적인 선택을 좋아합니다. 평화롭지만 자극이 줄 수 있어요. 한 달에 한 번 작은 새로움을 넣어 보세요.": "Оба любят стабильный выбор. Спокойно, но стимулов может стать меньше. Раз в месяц добавляйте небольшую новизну.", "도전과 안정의 균형이 비슷해 새로운 시도도 무리 없이 맞춰 갈 수 있습니다.": "Баланс вызова и стабильности у вас похож, поэтому новое вы можете пробовать без напряжения.", "한 사람은 새로움에서, 한 사람은 익숙함에서 힘을 얻습니다. \"무모하다/재미없다\"로 오해하기 쉬워요. 익숙한 것 둘, 새로운 것 하나로 균형을 맞춰 보세요.": "Один черпает силы в новизне, другой — в привычном. Легко ошибочно решить: «безрассудно» или «скучно». Уравновесьте: две привычные вещи и одна новая.", "익숙한 루틴과 약속된 흐름에서 안정을 느끼고, 한번 맺은 관계를 오래 지킵니다.": "Вы чувствуете надёжность в привычной рутине и заведённом порядке и долго бережёте однажды сложившиеся отношения.", "루틴도 지키고 변화도 받아들이는 유연함이 있습니다.": "Вы соблюдаете рутину и принимаете перемены. В вас есть гибкость.", "반복보다 변화를 선호합니다. 같은 일이 계속되면 답답함을 느낄 수 있어요.": "Вы предпочитаете перемены повторению. Если одно и то же тянется долго, вам может стать тесно.", "매일 같은 시간에 5분, 둘만의 작은 루틴(인사·산책 등)을 정해 보세요.": "Придумайте для вас двоих маленький ритуал на 5 минут в одно и то же время каждый день (приветствие, прогулка и т. п.).", "기저핵은 반복한 행동을 하나의 덩어리(습관)로 묶어 자동화하는 데 관여하는 것으로 알려져 있습니다.": "Известно, что базальные ганглии участвуют в объединении повторяемых действий в единый блок (привычку) и их автоматизации.", "둘 다 루틴과 약속을 소중히 합니다. 편안하고 단단하지만 변화가 필요할 때 대응이 늦을 수 있어요. 작은 변화를 미리 연습해 보세요.": "Оба дорожат рутиной и обещаниями. Спокойно и крепко, но при необходимости перемен реакция может запаздывать. Заранее потренируйте небольшие перемены.", "둘 다 변화를 즐깁니다. 신선하지만 생활 리듬이 흔들릴 수 있어요. 식사·수면처럼 꼭 지킬 리듬을 함께 정하세요.": "Оба любят перемены. Свежо, но ритм жизни может сбиться. Вместе определите ритмы, которые нужно соблюдать, — например питание и сон.", "루틴에 대한 태도가 비슷해 생활 리듬을 맞추기 쉬운 조합입니다.": "Отношение к рутине у вас похоже, поэтому вам легко согласовать ритм жизни.", "한 사람은 루틴이, 한 사람은 변화가 편합니다. \"고집스럽다/변덕스럽다\"로 오해하기 쉬워요. 평일은 루틴, 주말은 변화로 나눠 보세요.": "Одному удобна рутина, другому — перемены. Легко ошибочно решить: «упрямый» или «непостоянный». Разделите: будни — рутина, выходные — перемены.", "상상하고 새로운 조합을 떠올리는 일에서 즐거움을 느낍니다. 엉뚱한 생각이 대화를 풍성하게 합니다.": "Вы получаете удовольствие, воображая и придумывая новые сочетания. Причудливые мысли обогащают разговор.", "현실적인 생각과 상상을 오가며 균형을 잡습니다.": "Вы переходите от реалистичных мыслей к воображению и обратно и держите баланс.", "상상보다 눈앞의 현실과 구체적인 사실에 집중합니다.": "Вы сосредоточены на реальности перед глазами и конкретных фактах больше, чем на воображении.", "10분 동안 \"우리가 함께 해 보고 싶은 일\" 다섯 가지를 자유롭게 적어 보세요.": "Десять минут свободно записывайте пять вещей, которые вы хотели бы попробовать вместе.", "디폴트 모드 네트워크는 쉬는 동안 활발하며, 창의적 사고 때 실행 네트워크와 함께 작동한다는 연구가 있습니다.": "Есть исследования, согласно которым сеть пассивного режима работы мозга активна в покое и работает вместе с исполнительной сетью при творческом мышлении.", "둘 다 상상과 아이디어가 풍부합니다. 대화가 즐겁지만 실행이 미뤄질 수 있어요. 아이디어 중 하나만 이번 주에 실행해 보세요.": "Оба богаты воображением и идеями. Разговоры в радость, но реализация может откладываться. Выберите одну идею и воплотите её на этой неделе.", "둘 다 현실적이고 구체적입니다. 믿음직하지만 새로운 발상이 부족할 수 있어요. 함께 \"만약에\" 놀이를 해 보세요.": "Оба реалистичны и конкретны. Надёжно, но свежих идей может не хватать. Вместе поиграйте в «а что, если…».", "상상과 현실의 균형이 비슷해 서로의 이야기를 이해하기 쉬운 조합입니다.": "Баланс воображения и реальности у вас похож, поэтому вам легко понимать друг друга.", "한 사람은 상상으로, 한 사람은 현실로 이야기합니다. \"뜬구름 잡는다/꽉 막혔다\"로 오해하기 쉬워요. 상상은 끝까지 들어주고, 현실 확인은 한 번만 하세요.": "Один говорит через воображение, другой — через реальность. Легко ошибочно решить: «витает в облаках» или «непробиваемый». Воображение дослушивайте до конца, а проверку реальностью делайте один раз.", "전전두피질": "Префронтальная кора", "섬엽": "Островок", "전측 대상피질": "Передняя поясная кора", "복측 피개영역": "Вентральная область покрышки", "측좌핵(복측 선조체)": "Прилежащее ядро (вентральное полосатое тело)", "미상핵·피각·담창구": "Хвостатое ядро · скорлупа · бледный шар", "내측 전전두피질·후측 대상피질·각회·해마": "Медиальная префронтальная кора · задняя поясная кора · угловая извилина · гиппокамп", "관련 기능: ": "Связанная функция: ", "실행기능": "Исполнительные функции", "공감·감정 처리": "Эмпатия · обработка эмоций", "보상·새로움 반응(도파민계)": "Реакция на награду и новизну (дофаминовая система)", "습관 형성": "Формирование привычек", "상상·창의적 사고": "Воображение · творческое мышление", "속 깊은 설계자": "Вдумчивый планировщик", "마음을 챙기면서도 차분히 계획하는 사람": "Человек, который заботится о чувствах и спокойно планирует", "약속을 지키고 감정도 솔직히 나누는 사람": "Человек, который держит слово и честно делится чувствами", "계획이 갑자기 바뀌는데 설명이 없을 때": "Когда планы внезапно меняются без объяснений", "네 마음도 중요해. 우리 같이 순서를 정리해 보자.": "Твои чувства тоже важны. Давай вместе наведём порядок.", "계산된 모험가": "Расчётливый авантюрист", "따져 본 뒤 과감하게 도전하는 사람": "Человек, который всё взвесит, а потом смело берётся за вызов", "새로운 계획을 함께 세우고 실행해 주는 사람": "Человек, который вместе с вами строит новые планы и воплощает их", "준비 없이 밀어붙이거나 도전 자체를 막을 때": "Когда да  "한국뇌심리연구소": "Корейский институт психологии мозга", "바깥쪽일수록 점수가 높아요.": "Чем дальше от центра, тем выше балл.", "강함·약함은 성향의 세기이며 좋고 나쁨이 아닙니다.": "Сильная и слабая — это выраженность склонности, а не хорошо или плохо.", "평균보다 낮아도 못한다는 뜻이 아니에요. 능력의 높낮이가 아닙니다.": "Ниже среднего не значит «хуже». Это не оценка способностей.", "자료 보기 (참고 문헌)": "Источники", "점수는 그림 30장에 준 평점(1~5점)을 영역별로 더해 0~100점으로 바꾼 값이며 뇌 활동을 측정한 값이 아닙니다. ": "Балл — это ваши оценки (1–5) 30 картинок, просуммированные по областям и переведённые в шкалу 0–100; это не измерение активности мозга. ", "연령대 평균은 성격 발달 연구의 일반 경향을 바탕으로 계산한 시뮬레이션 추정값입니다. ": "Среднее по возрастной группе — смоделированная оценка на основе общих тенденций исследований развития личности. ", "영역 이름과 뇌 이야기는 아래 문헌의 일반적인 내용을 빌려 쉽게 풀었습니다. 영역 구성과 그림-영역 연결은 연구소의 설계안이며 표준화 검증을 거친 척도가 아닙니다 [6].": "Названия областей и рассказы о мозге простыми словами пересказывают общие сведения из источников ниже. Структура областей и связи «картинка — область» — разработка института, а не стандартизированная шкала [6].", "재미로 즐기는 자기이해 오락 콘텐츠이며 의학적 진단이 아닙니다.": "Нет. Это развлекательный материал для самопознания, а не медицинский диагноз.", "성격 발달 연구의 일반 경향을 바탕으로 계산한 시뮬레이션 추정값입니다.": "Смоделированная оценка на основе общих тенденций исследований развития личности.", "실선은 나, 점선은 연령대 평균입니다.": "Сплошная линия — вы, пунктир — среднее по возрастной группе.", "나이대를 고르면 또래 평균과 비교해요.": "Выберите возрастную группу, чтобы сравнить со средним по сверстникам.", "재미로 보는 자기이해·오락 콘텐츠입니다. 의학적 진단이 아닙니다.": "Развлекательный материал для самопознания. Не медицинский диагноз.", "본 서비스는 의학적 진단이 아니며, 재미로 즐기는 자기이해·오락 콘텐츠입니다.": "Сервис не является медицинским диагнозом. Это развлекательный материал для самопознания.", "(예상)": " (оценка)", "전체 평균": "Общее среднее", "그림 30장으로 보는": "По 30 картинкам:", "글은 필요 없어요. 그림 30장에 끌리는 만큼만 눌러 주세요. 5가지 뇌 기능 레이더와 분석 리포트가 열립니다.": "Читать не нужно. Нажимайте, насколько вам нравится каждая из 30 картинок, — откроются радар по пяти областям мозга и отчёт.", yarim shaffof va nuqtali chiziq bilan ko‘rsatilgan.", "결과 보고서 미리보기": "Hisobot namunasi", "예시 화면입니다. 실제 결과는 내가 고른 그림으로 만들어집니다.": "Bu namuna. Haqiqiy natija sizning baholaringiz asosida tuziladi.", "나의 뇌 성향 점수 레이더 (예시)": "Mening miya moyilligi ball radarim (namuna)", "실선은 나, 점선은 연령대 평균입니다. 각 영역 아래 숫자는 나의 점수와 평균 점수입니다.": "Yaxlit chiziq — siz, nuqtali chiziq — yosh guruhi o‘rtachasi. Sohalar ostidagi raqamlar — sizning ballingiz va o‘rtacha ball.", "자주 묻는 질문": "Ko‘p so‘raladigan savollar", "의학적 검사인가요?": "Bu tibbiy testmi?", "아닙니다. 의학적 진단이 아니며, 자기이해와 실천의 동기를 돕는 교육용 도구입니다.": "Yo‘q. Bu tibbiy tashxis emas, o‘zini anglash va harakatga undashga yordam beradigan o‘quv vositasi.", "연령대 평균은 어떻게 나오나요?": "Yosh guruhi o‘rtachasi qayerdan olinadi?", "현재는 성격 발달 연구의 일반 경향을 바탕으로 한 임시 규준을 보여 드립니다. 참여 결과가 연령대별로 쌓이면 실제 평균으로 다시 계산합니다.": "Hozircha shaxs rivojlanishi tadqiqotlarining umumiy tendentsiyalariga asoslangan vaqtinchalik me’yor ko‘rsatiladi. Yosh guruhlari bo‘yicha natijalar to‘planganda, haqiqiy o‘rtachadan qayta hisoblaymiz.", "회원가입이 필요한가요?": "Ro‘yxatdan o‘tish kerakmi?", "필요 없습니다. 별명도 선택 사항입니다.": "Yo‘q. Taxallus ham majburiy emas.", "내 답변은 저장되나요?": "Javoblarim saqlanadimi?", "기본적으로 서버로 보내거나 저장하지 않습니다. ‘익명 통계 참여’에 동의한 경우에만 점수·연령대·접속 환경·유입 경로를 이름 없이 보냅니다(별명은 보내지 않고, 만 18세 미만이 포함되면 보내지 않습니다). 이 기기에는 그림 중복 방지 기록, 언어 선택, 통계 참여 선택만 남습니다. 초대 링크를 만들면 링크에 내 점수·연령대·별명이 담깁니다.": "Odatda hech narsa serverga yuborilmaydi va saqlanmaydi. Faqat “anonim statistika”ga rozilik bersangiz, ball, yosh guruhi, qurilma turi va kelgan manba ismsiz yuboriladi (taxallus yuborilmaydi, 18 yoshdan kichik ishtirokchi bo‘lsa hech narsa yuborilmaydi). Bu qurilmada faqat rasmlar takrorlanmasligi uchun yozuv, til va statistika tanlovi qoladi. Taklif havolasini yaratsangiz, unda ballaringiz, yosh guruhingiz va taxallusingiz bo‘ladi.", "만 18세 미만도 할 수 있나요?": "18 yoshdan kichiklar foydalana oladimi?", "만 18세 미만은 보호자(법정대리인)의 동의를 받고, 보호자와 함께 이용해 주세요. 별명에 실명이 들어가지 않도록 보호자가 안내해 주세요.": "18 yoshdan kichiklar ota-ona yoki qonuniy vakilning roziligi bilan va u bilan birga foydalanishi mumkin. Taxallusga haqiqiy ism yozilmasligiga e’tibor bering.", "뇌를 직접 측정하나요?": "U miyani bevosita o‘lchaydimi?", "아닙니다. 그림 선택 경향을 뇌 기능 설명에 빗대어 보여 주는 도구이며, 뇌 활동을 측정하지 않습니다.": "Yo‘q. U rasm tanlash moyilligingizni miya faoliyati g‘oyalari bilan tushuntiradi va miya faolligini o‘lchamaydi.", "서비스 원칙": "Tamoyillarimiz", "누가 맞고 틀렸는지 판정하지 않습니다. 사람을 낙인찍거나 우열을 가리지 않고, 서로 다른 성향을 발견하고 대화하도록 돕습니다.": "Kim to‘g‘ri, kim noto‘g‘ri ekanini hukm qilmaymiz. Odamlarga tamg‘a yopmaymiz va ularni saralamaymiz — turli moyilliklarni payqash va ular haqida gaplashishga yordam beramiz.", "님이 초대했어요": "sizni taklif qildi", "그림 30장에 점수를 주면 두 사람의 뇌 성향을 겹쳐 볼 수 있어요. 회원가입은 필요 없어요.": "30 ta rasmga baho bering — ikkalangizning miya moyilligini ustma-ust ko‘ramiz. Ro‘yxatdan o‘tish shart emas.", "나도 해보기 · 그림 30장": "Men ham sinab ko‘ray · 30 ta rasm", "그림 30장, 마음에 드는 정도를 눌러 주세요": "30 ta rasm: qanchalik yoqishini bosing", "정답은 없어요. 그림을 한 장씩 보고 1점(전혀)부터 5점(최고)까지, 지금 느낌대로 누르면 됩니다.": "To‘g‘ri javob yo‘q. Har bir rasmga qarab, hozirgi his-tuyg‘ungizga qarab 1 (umuman yo‘q) dan 5 (juda yoqdi) gacha bosing.", "별명(선택)": "Taxallus (ixtiyoriy)", "예: 민수 (비워도 됩니다)": "masalan: Alisher (bo‘sh qoldirsa ham bo‘ladi)", "연령대(선택)": "Yosh guruhi (ixtiyoriy)", "고르면 같은 연령대 평균 선과 함께 비교해 보여 드려요.": "Tanlasangiz, solishtirish uchun shu yosh guruhining o‘rtacha chizig‘i ko‘rsatiladi.", "별명 칸에는 실명 등 개인정보를 쓰지 마세요. 결과로 가족을 평가하거나 비교하지 말고, 대화의 계기로만 사용해 주세요.": "Taxallus maydoniga haqiqiy ism va boshqa shaxsiy ma’lumotlarni yozmang. Natijani oila a’zolarini baholash yoki solishtirish uchun emas, faqat suhbat boshlash uchun ishlating.", "이 서비스는 자기이해·오락용 콘텐츠입니다. 만 18세 미만은 보호자(법정대리인) 동의가 필요합니다. 본 검사는 의학적 진단이 아니며, 중요한 결정의 근거로 쓰지 마세요. (총 30장)": "Bu xizmat o‘zini anglash va ko‘ngil ochish kontentidir. 18 yoshdan kichiklar uchun ota-ona yoki qonuniy vakil roziligi kerak. Test tibbiy tashxis emas, muhim qarorlar uchun asos qilib olmang. (Jami 30 ta rasm)", "만 18세 이상이거나, 보호자(법정대리 i aytmaydi va kelajakni bashorat qilmaydi. Soha tavsiflari manbalari shaxsiy hisobotdagi bilan bir xil.", "이 결과 공유하기": "Natijani ulashish", "점수 패턴 겹침률": "Profil o‘xshashligi", "사고·계획": "Rejalashtirish", "감정·공감": "Hamdardlik", "보상·도전": "Tavakkal", "습관·안정": "Odatlar", "상상·창의": "Tasavvur", "전전두엽": "Peshona oldi bo‘lagi", "섬엽·전측 대상피질": "Orolcha · oldingi belbog‘ po‘stlog‘i", "보상회로(도파민계·선조체)": "Mukofot tizimi (dofamin · yo‘l-yo‘l tana)", "기저핵": "Bazal gangliylar", "디폴트 모드 네트워크": "Miyaning passiv rejim tarmog‘i", "계획 세우기·판단·충동 조절 같은 실행기능": "Ijro funksiyalari: rejalashtirish, baholash, impulsni nazorat qilish", "감정 신호를 처리하고 타인의 감정을 헤아리는 일": "Hissiy signallarni qayta ishlash va boshqalarning his-tuyg‘usini tushunish", "새로움과 보상 기대에 반응하는 일": "Yangilikka va mukofot kutishiga javob berish", "반복한 행동을 습관으로 묶어 자동화하는 일": "Takrorlangan harakatlarni avtomatik odatga birlashtirish", "상상과 아이디어 연결(실행 네트워크와 함께 작동)": "Tasavvur va g‘oyalarni bog‘lash (ijro tarmog‘i bilan birga ishlaydi)", "결정 전에 상황을 정리하고 순서를 세울 때 마음이 편합니다. 약속과 계획이 곧 신뢰입니다.": "Qaror qilishdan oldin vaziyatni tartibga solib, ketma-ketlik tuzsangiz, ko‘ngliningiz tinch bo‘ladi. Siz uchun va’da va reja — bu ishonchdir.", "필요할 때는 계획하고, 때로는 흐름에 맡기는 균형이 있습니다.": "Kerak bo‘lganda rejalashtirasiz, ba’zan oqimga ham tashlaysiz. Sizda muvozanat bor.", "계획보다 그때그때의 느낌과 흐름을 따릅니다. 즉흥적인 순간에서 힘이 납니다.": "Rejadan ko‘ra o‘sha paytdagi his-tuyg‘u va oqimga ergashasiz. Spontan lahzalar sizga kuch beradi.", "중요한 대화 전에 하고 싶은 말을 세 줄로 정리해 보세요.": "Muhim suhbatdan oldin aytmoqchi bo‘lganlaringizni uch qatorga yozib chiqing.", "전전두엽은 계획 세우기, 판단, 충동 조절 같은 실행기능에 중요한 역할을 하는 것으로 알려져 있습니다.": "Peshona oldi bo‘lagi rejalashtirish, baholash va impulsni nazorat qilish kabi ijro funksiyalarida muhim rol o‘ynashi ma’lum.", "둘 다 계획과 판단이 단단합니다. 믿음직하지만 결정이 길어질 수 있어요. \"언제까지 정할지\" 기한을 함께 정해 보세요.": "Ikkalangiz ham reja va baholashda puxtasiz. Ishonchli, lekin qaror cho‘zilib ketishi mumkin. «Qachongacha hal qilamiz» muddatini birga belgilang.", "둘 다 흐름에 맡기는 편입니다. 자유롭지만 중요한 일정이 비기 쉬워요. 꼭 지킬 일 세 가지만 함께 적어 두세요.": "Ikkalangiz ham oqimga tashlaydigan turdasiz. Erkin, lekin muhim rejalar tushib qolishi oson. Albatta bajariladigan uchta narsani birga yozib qo‘ying.", "계획과 즉흥의 비율이 비슷합니다. 상황에 맞춰 서로 속도를 맞추기 쉬운 조합입니다.": "Reja va improvizatsiya ulushingiz o‘xshash. Vaziyatga qarab bir-biringizga moslashish oson.", "한 사람은 계획으로, 한 사람은 흐름으로 움직입니다. \"답답하다/즉흥적이다\"로 오해하기 쉬워요. 큰 틀은 계획하고 나머지는 자유롭게 맡겨 보세요.": "Biringiz reja bilan, ikkinchingiz oqim bilan harakat qilasiz. «Zerikarli» yoki «o‘ylamasdan» deb noto‘g‘ri tushunish oson. Umumiy doirani rejalab, qolganini erkin qoldiring.", "상대의 표정과 분위기를 빠르게 읽고, 마음을 나누는 시간에서 힘을 얻습니다.": "Siz boshqaning yuz ifodasi va muhitini tez o‘qiysiz va his-tuyg‘u bo‘lishgan paytdan kuch olasiz.", "마음을 나누는 것도, 혼자 정리하는 것도 상황에 따라 고릅니다.": "His-tuyg‘u bo‘lishish yoki yolg‘iz tartibga solishni vaziyatga qarab tanlaysiz.", "감정보다 사실과 해결에 먼저 집중합니다. 마음을 말로 꺼내는 데 시간이 걸릴 수 있어요.": "His-tuyg‘udan oldin fakt va yechimga e’tibor qaratasiz. His-tuyg‘uni so‘zga solish vaqt olishi mumkin.", "하루 한 번, 오늘 가장 좋았던 일을 상대에게 한 문장으로 말해 보세요.": "Kuniga bir marta bugungi eng yaxshi voqeani boshqaga bir gapda ayting.", "섬엽과 전측 대상피질은 타인의 감정을 함께 느끼고 헤아리는 공감 연구에서 자주 활성이 보고되는 영역입니다.": "Orolcha va oldingi belbog‘ po‘stlog‘i — boshqalarning his-tuyg‘usini birga his qilish va tushunish bo‘yicha hamdardlik tadqiqotlarida faolligi ko‘p qayd etiladigan sohalar.", "둘 다 감정을 잘 읽고 나눕니다. 따뜻하지만 감정이 겹쳐 커질 수 있어요. 힘든 날에는 먼저 5분 쉬고 이야기해 보세요.": "Ikkalangiz ham his-tuyg‘uni yaxshi o‘qiysiz va bo‘lishasiz. Iliq, lekin his-tuyg‘ular qo‘shilib kattalashishi mumkin. Og‘ir kunda avval 5 daqiqa dam olib, keyin gaplashing.", "둘 다 사실과 해결에 집중합니다. 담백하지만 마음 표현이 부족할 수 있어요. 하루 한 번 고마운 일 한 문장을 나눠 보세요.": "Ikkalangiz ham fakt va yechimga e’tibor berasiz. Sodda va aniq, lekin his-tuyg‘u ifodasi yetishmasligi mumkin. Kuniga bir marta minnatdor bo‘lgan narsangizni bir gapda ayting.", "마음 나누기의 온도가 비슷합니다. 서로의 표현 방식을 존중하기 쉬운 조합입니다.": "His-tuyg‘u bo‘lishish iliqligingiz o‘xshash. Bir-biringizning ifoda uslubini hurmat qilish oson.", "한 사람은 마음부터, 한 사람은 해결부터 챙깁니다. \"공감을 안 해 준다/감정적이다\"로 오해하기 쉬워요. 먼저 \"공감이 필요해, 해결이 필요해?\"라고 물어보세요.": "Biringiz his-tuyg‘udan, ikkinchingiz yechimdan boshlaysiz. «Hamdard emas» yoki «haddan ziyod hissiy» deb noto‘g‘ri tushunish oson. Avval so‘rang: «Senga hamdardlik kerakmi yoki yechim?»", "새로운 곳, 처음 해 보는 일에서 설렘과 에너지를 얻습니다.": "Yangi joylar va birinchi marta qilinadigan ishlar sizga hayajon va energiya beradi.", "새로움도 좋아하지만 안정도 필요한 균형형입니다.": "Yangilikni yoqtirasiz, lekin barqarorlik ham kerak. Siz muvozanatli turdasiz.", "낯선 도전보다 검증된 선택에서 마음이 놓입니다.": "Notanish sinovlardan ko‘ra sinalgan tanlov sizga xotirjamlik beradi.", "이번 주에 둘이 처음 가 보는 곳 한 군데를 정해 보세요.": "Shu hafta ikkalangiz hali bormagan bitta joyni tanlab, borib keling.", "중뇌 도파민계와 선조체 등 보상회로는 새로운 자극과 보상 기대에 반응하는 것으로 알려져 있습니다.": "O‘rta miya dofamin tizimi va yo‘l-yo‘l tana kabi mukofot tizimlari yangi ta’sirlarga va mukofot kutishiga javob berishi ma’lum.", "둘 다 새로움을 즐깁니다. 늘 설레지만 생활의 기본이 흔들릴 수 있어요. 지킬 것 몇 가지는 정해 두세요.": "Ikkalangiz ham yangilikni yoqtirasiz. Doim qiziqarli, lekin hayotning asoslari chayqalishi mumkin. Rioya qilinadigan bir necha narsani belgilab qo‘ying.", "둘 다 안정적인 선택을 좋아합니다. 평화롭지만 자극이 줄 수 있어요. 한 달에 한 번 작은 새로움을 넣어 보세요.": "Ikkalangiz ham barqaror tanlovni yoqtirasiz. Tinch, lekin ta’sirlar kamayishi mumkin. Oyda bir marta kichik yangilik qo‘shing.", "도전과 안정의 균형이 비슷해 새로운 시도도 무리 없이 맞춰 갈 수 있습니다.": "Sinov va barqarorlik muvozanatingiz o‘xshash, shuning uchun yangi urinishlarni zo‘riqmasdan birga qilishingiz mumkin.", "한 사람은 새로움에서, 한 사람은 익숙함에서 힘을 얻습니다. \"무모하다/재미없다\"로 오해하기 쉬워요. 익숙한 것 둘, 새로운 것 하나로 균형을 맞춰 보세요.": "Biringiz yangilikdan, ikkinchingiz tanish narsadan kuch olasiz. «O‘ylamasdan» yoki «zerikarli» deb noto‘g‘ri tushunish oson. Ikki tanish va bitta yangi narsa bilan muvozanatlang.", "익숙한 루틴과 약속된 흐름에서 안정을 느끼고, 한번 맺은 관계를 오래 지킵니다.": "Siz tanish tartib va kelishilgan oqimda xotirjam bo‘lasiz va bir bog‘langan munosabatni uzoq saqlaysiz.", "루틴도 지키고 변화도 받아들이는 유연함이 있습니다.": "Tartibni saqlaysiz va o‘zgarishni ham qabul qilasiz. Sizda moslashuvchanlik bor.", "반복보다 변화를 선호합니다. 같은 일이 계속되면 답답함을 느낄 수 있어요.": "Takrordan ko‘ra o‘zgarishni afzal ko‘rasiz. Bir xil narsa davom etsa, siqilishingiz mumkin.", "매일 같은 시간에 5분, 둘만의 작은 루틴(인사·산책 등)을 정해 보세요.": "Har kuni bir vaqtda 5 daqiqalik, faqat ikkalangizga xos kichik tartib (salomlashish, sayr va h.k.) belgilang.", "기저핵은 반복한 행동을 하나의 덩어리(습관)로 묶어 자동화하는 데 관여하는 것으로 알려져 있습니다.": "Bazal gangliylar takrorlangan harakatlarni bitta blokka (odatga) birlashtirish va avtomatlashtirishda ishtirok etishi ma’lum.", "둘 다 루틴과 약속을 소중히 합니다. 편안하고 단단하지만 변화가 필요할 때 대응이 늦을 수 있어요. 작은 변화를 미리 연습해 보세요.": "Ikkalangiz ham tartib va va’dani qadrlaysiz. Qulay va mustahkam, lekin o‘zgarish kerak bo‘lganda kech qolishingiz mumkin. Kichik o‘zgarishlarni oldindan mashq qiling.", "둘 다 변화를 즐깁니다. 신선하지만 생활 리듬이 흔들릴 수 있어요. 식사·수면처럼 꼭 지킬 리듬을 함께 정하세요.": "Ikkalangiz ham o‘zgarishni yoqtirasiz. Yangicha, lekin hayot ritmi buzilishi mumkin. Ovqatlanish va uyqu kabi albatta saqlanadigan ritmlarni birga belgilang.", "루틴에 대한 태도가 비슷해 생활 리듬을 맞추기 쉬운 조합입니다.": "Tartibga munosabatingiz o‘xshash, shuning uchun hayot ritmini moslashtirish oson.", "한 사람은 루틴이, 한 사람은 변화가 편합니다. \"고집스럽다/변덕스럽다\"로 오해하기 쉬워요. 평일은 루틴, 주말은 변화로 나눠 보세요.": "Biringizga tartib, ikkinchingizga o‘zgarish qulay. «O‘jar» yoki «o‘zgaruvchan» deb noto‘g‘ri tushunish oson. Ish kunlarida tartib, dam olish kunlarida o‘zgarish deb bo‘ling.", "상상하고 새로운 조합을 떠올리는 일에서 즐거움을 느낍니다. 엉뚱한 생각이 대화를 풍성하게 합니다.": "Siz tasavvur qilib, yangi uyg‘unliklar o‘ylab topishdan zavq olasiz. G‘alati fikrlar suhbatni boyitadi.", "현실적인 생각과 상상을 오가며 균형을 잡습니다.": "Siz real fikr va tasavvur o‘rtasida borib kelib, muvozanatni saqlaysiz.", "상상보다 눈앞의 현실과 구체적인 사실에 집중합니다.": "Tasavvurdan ko‘ra ko‘z oldingizdagi voqelik va aniq faktlarga e’tibor qaratasiz.", "10분 동안 \"우리가 함께 해 보고 싶은 일\" 다섯 가지를 자유롭게 적어 보세요.": "10 daqiqa davomida «birga qilib ko‘rmoqchi bo‘lgan» beshta ishni erkin yozib chiqing.", "디폴트 모드 네트워크는 쉬는 동안 활발하며, 창의적 사고 때 실행 네트워크와 함께 작동한다는 연구가 있습니다.": "Miyaning passiv rejim tarmog‘i dam olish paytida faol bo‘lishi va ijodiy fikrlashda ijro tarmog‘i bilan birga ishlashi haqida tadqiqotlar bor.", "둘 다 상상과 아이디어가 풍부합니다. 대화가 즐겁지만 실행이 미뤄질 수 있어요. 아이디어 중 하나만 이번 주에 실행해 보세요.": "Ikkalangiz ham tasavvur va g‘oyalarga boysiz. Suhbat qiziqarli, lekin amalga oshirish orqaga surilishi mumkin. G‘oyalardan bittasini shu hafta amalga oshiring.", "둘 다 현실적이고 구체적입니다. 믿음직하지만 새로운 발상이 부족할 수 있어요. 함께 \"만약에\" 놀이를 해 보세요.": "Ikkalangiz ham real va aniqsiz. Ishonchli, lekin yangi fikrlar yetishmasligi mumkin. Birga «agar shunday bo‘lsa…» o‘yinini o‘ynang.", "상상과 현실의 균형이 비슷해 서로의 이야기를 이해하기 쉬운 조합입니다.": "Tasavvur va voqelik muvozanatingiz o‘xshash, shuning uchun bir-biringizning gapini tushunish oson.", "한 사람은 상상으로, 한 사람은 현실로 이야기합니다. \"뜬구름 잡는다/꽉 막혔다\"로 오해하기 쉬워요. 상상은 끝까지 들어주고, 현실 확인은 한 번만 하세요.": "Biringiz tasavvur bilan, ikkinchingiz voqelik bilan gapirasiz. «Xayolparast» yoki «o‘jar» deb noto‘g‘ri tushunish oson. Tasavvurni oxirigacha tinglang, voqelikni tekshirishni bir marta qiling.", "전전두피질": "Peshona oldi po‘stlog‘i", "섬엽": "Orolcha", "전측 대상피질": "Oldingi belbog‘ po‘stlog‘i", "복측 피개영역": "Qorin qopqoq sohasi", "측좌핵(복측 선조체)": "Yadro akkumbens (qorin yo‘l-yo‘l tana)", "미상핵·피각·담창구": "Dumli yadro · po‘st · rangsiz shar", "내측 전전두피질·후측 대상피질·각회·해마": "Medial peshona oldi po‘stlog‘i · orqa belbog‘ po‘stlog‘i · burchak pushta · gippokamp", "관련 기능: ": "Aloqador funksiya: ", "실행기능": "Ijro funksiyalari", "공감·감정 처리": "Hamdardlik · hissiyotni qayta ishlash", "보상·새로움 반응(도파민계)": "Mukofot va yangilikka javob (dofamin tizimi)", "습관 형성": "Odat shakllanishi", "상상·창의적 사고": "Tasavvur · ijodiy fikrlash", "속 깊은 설계자": "Mulohazali rejalashtiruvchi", "마음을 챙기면서도 차분히 계획하는 사람": "His-tuyg‘uga e’tibor beradigan va shu bilan birga xotirjam rejalashtiradigan kishi", "약속을 지키고 감정도 솔직히 나누는 사람": "Va’dasiga sodiq va his-tuyg‘usini ochiq bo‘lishadigan kishi", "계획이 갑자기 바뀌는데 설명이 없을 때": "Reja tushuntirishsiz birdan o‘zgarganda", "네 마음도 중요해. 우리 같이 순서를 정리해 보자.": "Sening his-tuyg‘ularing ham muhim. Keling, tartibni birga belgilaymiz.", "계산된 모험가": "Hisob-kitobli sarguzashtchi", "따져 본 뒤 과감하게 도전하는 사람": "Hamma narsani o‘lchab ko‘rib, keyin dadil sinovga kirishadigan kishi", "새로운 계획을 함께 세우고 실행해 주는 사람": "Siz bilan yangi reja tuzib, uni amalga oshiradigan kishi", "준비 없이 밀어붙이거나 도전 자체를 막을 때": "Tayyorgarliksiz bosim o‘tkazilganda yoki sinovning o‘ziga to‘sqinlik qilinganda", "도전은 좋아. 필요한 준비만 같이 확인하고 가자.": "Sinov yaxshi. Keling, kerakli tayyorgarlikni birga tekshirib, ketaylik.", "신중한 지킴이": "Ehtiyotkor qo‘riqchi", "검증된 방식을 계획대로 꾸준히 지키는 사람": "Sinalgan usullarga reja bo‘yicha qat’iy amal qiladigan kishi", "약속과 루틴을 존중하는 사람": "Va’da va tartibni hurmat qiladigan kishi", "일정이 갑자기 뒤집히고 규칙이 자주 바뀔 때": "Jadval birdan o‘zgarib, qoidalar tez-tez almashganda", "바꿔야 한다면 미리 알려 줘. 그러면 나도 준비할 수 있어.": "O‘zgartirish kerak bo‘lsa, oldindan ayt. Shunda men ham tayyorlanaman.", "아이디어 전략가": "G‘oya strategi", "상상을 계획으로 바꾸는 사람": "Tasavvurni rejaga aylantiradigan kishi", "내 아이디어를 들어주고 현실로 옮기도록 돕는 사람": "G‘oyalarimni tinglab, ularni amalga oshirishga yordam beradigan kishi", "아이디어를 바로 무시하거나 이야기만 길어질 때": "G‘oyalar darhol rad etilganda yoki gap faqat cho‘zilib ketganda", "아이디어 세 가지만 고르고, 이번 주에 한 가지부터 해 보자.": "Keling, faqat uchta g‘oyani tanlab, shu hafta bittasidan boshlaymiz.", "열정 공감러": "Ishtiyoqli hamdard", "마음이 움직이면 바로 달려가는 따뜻한 사람": "Dili qo‘zg‘alsa, darhol harakatga o‘tadigan iliq kishi", "감정을 솔직히 나누고 함께 신나게 움직이는 사람": "His-tuyg‘usini ochiq bo‘lishib, siz bilan quvnoq harakat qiladigan kishi", "감정 표현이 차갑거나 새로운 시도를 늘 거절당할 때": "His-tuyg‘u ifodasi sovuq bo‘lganda yoki yangi urinishlar doim rad etilganda", "지금 기분을 먼저 말할게. 그다음에 같이 해 볼 걸 정하자.": "Avval hozirgi kayfiyatimni aytaman. Keyin birga nima qilishni hal qilamiz.", "포근한 보호자": "Mehribon himoyachi", "편안한 루틴 안에서 사람을 세심히 돌보는 사람": "Qulay tartib ichida odamlarga sinchkov g‘amxo‘rlik qiladigan kishi", "꾸준히 곁을 지켜 주고 안정감을 주는 사람": "Doim yoningizda bo‘lib, xotirjamlik beradigan kishi", "변화가 잦은데 마음을 말로 안 해 줄 때": "O‘zgarish ko‘p "リンクで招待", "둘의 겹침": "2人の重なり", "왜 글이 아니라 그림일까요?": "なぜ文章ではなく絵なのですか?", "① 글 읽기 부담이 줄어 ": "① 文章を読む負担が減るので、", "바로 떠오르는 느낌": "ぱっと浮かんだ印象", "대로 답하기 쉽도록 설계했습니다.": "のまま答えやすく設計しています。", "② 정답이 있는 문제처럼 보이지 않아 ": "② 正解がある問題に見えないので、", "편하게 점수": "気軽にスコア", "를 주도록 돕는 것을 목표로 합니다.": "をつけられるよう助けることを目指しています。", "③ 그림에 점수를 주는 방식이라 연령에 상관없이 같은 방식으로 해 볼 수 있습니다.": "③ 絵にスコアをつける方式なので、年齢に関係なく同じ方法で試せます。", "5가지 뇌 기능 영역": "5つの脳機能領域", "각 영역에 관여하는 것으로 알려진 뇌 부위를 빌려 성향을 설명합니다.": "各領域に関わるとされる脳の部位を借りて、傾向を説明します。", "전문용어 병기": "専門用語を併記", "에 관여하는 것으로 알려진 영역에서 이름을 빌렸습니다.": "に関わるとされる領域から名前を借りています。", "뇌 부위 그림은 이해를 돕는 개략도이며 정확한 해부도가 아닙니다. 뇌 안쪽에 있는 구조는 투시하듯 반투명·점선으로 표시했습니다.": "脳の部位の絵は理解を助ける簡略図で、正確な解剖図ではありません。脳の内側にある構造は、透視するように半透明・点線で表しています。", "결과 보고서 미리보기": "結果レポートのプレビュー", "예시 화면입니다. 실제 결과는 내가 고른 그림으로 만들어집니다.": "サンプル画面です。実際の結果は、あなたが選んだ絵から作られます。", "나의 뇌 성향 점수 레이더 (예시)": "私の脳傾向スコアレーダー(サンプル)", "실선은 나, 점선은 연령대 평균입니다. 각 영역 아래 숫자는 나의 점수와 평균 점수입니다.": "実線は私、点線は年代平均です。各領域の下の数字は、私のスコアと平均スコアです。", "자주 묻는 질문": "よくある質問", "의학적 검사인가요?": "医学的な検査ですか?", "아닙니다. 의학적 진단이 아니며, 자기이해와 실천의 동기를 돕는 교육용 도구입니다.": "いいえ。医学的な診断ではなく、自己理解と実践の動機づけを助ける教育用ツールです。", "연령대 평균은 어떻게 나오나요?": "年代平均はどのように出ますか?", "현재는 성격 발달 연구의 일반 경향을 바탕으로 한 임시 규준을 보여 드립니다. 참여 결과가 연령대별로 쌓이면 실제 평균으로 다시 계산합니다.": "現在は、性格発達研究の一般的な傾向に基づく暫定基準を表示しています。年代別に参加結果が集まったら、実際の平均で再計算します。", "회원가입이 필요한가요?": "会員登録は必要ですか?", "필요 없습니다. 별명도 선택 사항입니다.": "不要です。ニックネームも任意です。", "내 답변은 저장되나요?": "回答は保存されますか?", "기본적으로 서버로 보내거나 저장하지 않습니다. ‘익명 통계 참여’에 동의한 경우에만 점수·연령대·접속 환경·유입 경로를 이름 없이 보냅니다(별명은 보내지 않고, 만 18세 미만이 포함되면 보내지 않습니다). 이 기기에는 그림 중복 방지 기록, 언어 선택, 통계 참여 선택만 남습니다. 초대 링크를 만들면 링크에 내 점수·연령대·별명이 담깁니다.": "基本的にサーバーへ送信・保存しません。「匿名統計への参加」に同意した場合のみ、スコア・年代・端末の種類・流入元を名前なしで送ります(ニックネームは送らず、18歳未満が含まれる場合は何も送りません)。この端末には、絵の重複防止の記録・言語の選択・統計参加の選択だけが残ります。招待リンクを作ると、リンクにスコア・年代・ニックネームが含まれます。", "만 18세 미만도 할 수 있나요?": "18歳未満でも利用できますか?", "만 18세 미만은 보호자(법정대리인)의 동의를 받고, 보호자와 함께 이용해 주세요. 별명에 실명이 들어가지 않도록 보호자가 안내해 주세요.": "18歳未満の方は、保護者(法定代理人)の同意を得たうえで、保護者と一緒にご利用ください。ニックネームに実名を書かないようご案内ください。", "뇌를 직접 측정하나요?": "脳を直接測定しますか?", "아닙니다. 그림 선 わせ", "점수 패턴 겹침률. 정답이나 궁합 점수가 아니라 두 사람의 그림 선택이 얼마나 겹치는지입니다.": "スコアパターンの重なり率。正解や相性スコアではなく、2人の絵の選び方がどれだけ重なるかです。", "점수 패턴 겹침 ": "スコアパターンの重なり ", "점수 패턴이 크게 겹칩니다. 편안한 대신 둘 다 약한 영역을 함께 챙기면 좋습니다.": "スコアパターンが大きく重なります。心地よい反面、2人とも弱めの領域を一緒に気にかけるとよいでしょう。", "닮은 영역과 다른 영역이 고르게 섞였습니다. 다른 영역의 대화법이 관계의 열쇠입니다.": "似ている領域と違う領域がバランスよく混ざっています。違う領域での会話のしかたが、関係のカギです。", "서로 다른 영역이 뚜렷합니다. 오해도 쉽지만 서로에게서 배울 점이 많은 조합입니다.": "違いがはっきりしています。誤解も生まれやすい反面、お互いから学べる点が多い組み合わせです。", "점수 패턴이 거의 반대입니다. 서로의 방식을 번역해 주면 가장 큰 보완이 됩니다.": "スコアパターンがほぼ正反対です。お互いのやり方を「翻訳」し合うと、最も大きな補い合いになります。", "두 사람의 케미": "2人のケミストリー", "함께 불붙는 영역": "一緒に火がつく領域", "서로 채워 주는 영역": "お互いに補い合う領域", "함께 챙길 영역": "一緒に気にかけたい領域", "서로에게 이렇게 말해 보세요": "お互いにこう伝えてみましょう", "이번 주 둘이 해 볼 미션": "今週2人でやってみるミッション", "겹침률은 두 사람의 영역별 점수 차이의 평균을 100에서 뺀 값(100 − 점수 차이 합 ÷ 5)이며, 관계의 좋고 나쁨이나 미래를 예측하지 않습니다. 영역 설명의 근거 문헌은 개인 보고서의 문헌 목록과 같습니다.": "重なり率は、2人の領域別スコア差の平均を100から引いた値(100 − スコア差の合計 ÷ 5)で、関係の良し悪しや将来を予測するものではありません。領域説明の根拠文献は、個人レポートの文献リストと同じです。", "이 결과 공유하기": "この結果をシェアする", "점수 패턴 겹침률": "スコアパターンの重なり率", "사고·계획": "思考・計画", "감정·공감": "感情・共感", "보상·도전": "報酬・挑戦", "습관·안정": "習慣・安定", "상상·창의": "想像・創造", "전전두엽": "前頭前野", "섬엽·전측 대상피질": "島皮質・前部帯状皮質", "보상회로(도파민계·선조체)": "報酬系(ドーパミン系・線条体)", "기저핵": "大脳基底核", "디폴트 모드 네트워크": "デフォルトモードネットワーク", "계획 세우기·판단·충동 조절 같은 실행기능": "計画・判断・衝動のコントロールといった実行機能", "감정 신호를 처리하고 타인의 감정을 헤아리는 일": "感情のシグナルを処理し、他者の気持ちを推し量ること", "새로움과 보상 기대에 반응하는 일": "新しさや報酬への期待に反応すること", "반복한 행동을 습관으로 묶어 자동화하는 일": "繰り返した行動を習慣としてまとめ、自動化すること", "상상과 아이디어 연결(실행 네트워크와 함께 작동)": "想像とアイデアのつながり(実行ネットワークと一緒に働く)", "결정 전에 상황을 정리하고 순서를 세울 때 마음이 편합니다. 약속과 계획이 곧 신뢰입니다.": "決める前に状況を整理して順番を立てると、気持ちが落ち着きます。約束と計画が、そのまま信頼です。", "필요할 때는 계획하고, 때로는 흐름에 맡기는 균형이 있습니다.": "必要なときは計画し、ときには流れに任せるバランスがあります。", "계획보다 그때그때의 느낌과 흐름을 따릅니다. 즉흥적인 순간에서 힘이 납니다.": "計画よりも、その場の感覚と流れに従います。即興の瞬間に力が湧きます。", "중요한 대화 전에 하고 싶은 말을 세 줄로 정리해 보세요.": "大切な話の前に、言いたいことを3行にまとめてみましょう。", "전전두엽은 계획 세우기, 판단, 충동 조절 같은 실행기능에 중요한 역할을 하는 것으로 알려져 있습니다.": "前頭前野は、計画を立てる・判断する・衝動を抑えるといった実行機能に重要な役割を果たすことが知られています。", "둘 다 계획과 판단이 단단합니다. 믿음직하지만 결정이 길어질 수 있어요. \"언제까지 정할지\" 기한을 함께 정해 보세요.": "2人とも計画と判断がしっかりしています。頼もしい反面、決定が長引くことも。「いつまでに決めるか」期限を一緒に決めてみましょう。", "둘 다 흐름에 맡기는 편입니다. 자유롭지만 중요한 일정이 비기 쉬워요. 꼭 지킬 일 세 가지만 함께 적어 두세요.": "2人とも流れに任せるタイプです。自由ですが、大事な予定が抜けやすいかも。必ず守ることを3つだけ一緒に書いておきましょう。", "계획과 즉흥의 비율이 비슷합니다. 상황에 맞춰 서로 속도를 맞추기 쉬운 조합입니다.": "計画と即興の割合が似ています。状況に合わせて、お互いにペースを合わせやすい組み合わせです。", "한 사람은 계획으로, 한 사람은 흐름으로 움직입니다. \"답답하다/즉흥적이다\"로 오해하기 쉬워요. 큰 틀은 계획하고 나머지는 자유롭게 맡겨 보세요.": "1人は計画で、もう1人は流れで動きます。「堅苦しい/行き当たりばったり」と誤解しやすいです。大枠は計画し、あとは自由に任せてみましょう。", "상대의 표정과 분위기를 빠르게 읽고, 마음을 나누는 시간에서 힘을 얻습니다.": "相手の表情や雰囲気をすばやく読み取り、気持ちを分かち合う時間に力をもらいます。", "마음을 나누는 것도, 혼자 정리하는 것도 상황에 따라 고릅니다.": "気持ちを分かち合うのも、1人で整理するのも、状況に応じて選びます。", "감정보다 사실과 해결에 먼저 집중합니다. 마음을 말로 꺼내는 데 시간이 걸릴 수 있어요.": "感情より先に、事実と解決に集中します。気持ちを言葉にするのに時間がかかることがあります。", "하루 한 번, 오늘 가장 좋았던 일을 상대에게 한 문장으로 말해 보세요.": "1日1回、今日いちばん良かったことを相手に一文で話してみましょう。", "섬엽과 전측 대상피질은 타인의 감정을 함께 느끼고 헤아리는 공감 연구에서 자주 활성이 보고되는 영역입니다.": "島皮質と前部帯状皮質は、他者の感情を一緒に感じ取る共感の研究で、活動がよく報告される領域です。", "둘 다 감정을 잘 읽고 나눕니다. 따뜻하지만 감정이 겹쳐 커질 수 있어요. 힘든 날에는 먼저 5분 쉬고 이야기해 보세요.": "2人とも感情をよく読み取り分かち合います。温かい反面、感情が重なって大きくなることも。つらい日は、まず5分休んでから話してみましょう。", "둘 다 사실과 해결에 집중합니다. 담백하지만 마음 표현이 부족할 수 있어요. 하루 한 번 고마운 일 한 문장을 나눠 보세요.": "2人とも事実と解決に集中します。さっぱりしている反面、気持ちの表現が足りないことも。1日1回、ありがたかったことを一文ずつ伝え合いましょう。", "마음 나누기의 온도가 비슷합니다. 서로의 표현 방식을 존중하기 쉬운 조합입니다.": "気持ちを分かち合う温度が似ています。お互いの表現のしかたを尊重しやすい組み合わせです。", "한 사람은 마음부터, 한 사람은 해결부터 챙깁니다. \"공감을 안 해 준다/감정적이다\"로 오해하기 쉬워요. 먼저 \"공감이 필요해, 해결이 필요해?\"라고 물어보세요.": "1人は気持ちから、もう1人は解決から取りかかります。「共感してくれない/感情的」と誤解しやすいです。まず「共感がほしい?解決がほしい?」と聞いてみましょう。", "새로운 곳, 처음 해 보는 일에서 설렘과 에너지를 얻습니다.": "新しい場所、初めてのことにワクワクしてエネルギーをもらいます。", "새로움도 좋아하지만 안정도 필요한 균형형입니다.": "新しさも好きだけれど安定も必要な、バランス型です。", "낯선 도전보다 검증된 선택에서 마음이 놓입니다.": "見慣れない挑戦より、検証された選択のほうが安心します。", "이번 주에 둘이 처음 가 보는 곳 한 군데를 정해 보세요.": "今週、2人でまだ行ったことのない場所を1か所決めてみましょう。", "중뇌 도파민계와 선조체 등 보상회로는 새로운 자극과 보상 기대에 반응하는 것으로 알려져 있습니다.": "中脳のドーパミン系や線条体などの報酬系は、新しい刺激や報酬への期待に反応することが知られています。", "둘 다 새로움을 즐깁니다. 늘 설레지만 생활의 기본이 흔들릴 수 있어요. 지킬 것 몇 가지는 정해 두세요.": "2人とも新しさを楽しみます。いつもワクワクしますが、生活の基本が揺らぐことも。守ることをいくつか決めておきましょう。", "둘 다 안정적인 선택을 좋아합니다. 평화롭지만 자극이 줄 수 있어요. 한 달에 한 번 작은 새로움을 넣어 보세요.": "2人とも安定した選択が好きです。平和ですが、刺激が減ることも。月に1回、小さな新しさを取り入れてみましょう。", "도전과 안정의 균형이 비슷해 새로운 시도도 무리 없이 맞춰 갈 수 있습니다.": "挑戦と安定のバランスが似ているので、新しい試みも無理なく合わせていけます。", "한 사람은 새로움에서, 한 사람은 익숙함에서 힘을 얻습니다. \"무모하다/재미없다\"로 오해하기 쉬워요. 익숙한 것 둘, 새로운 것 하나로 균형을 맞춰 보세요.": "1人は新しさから、もう1人は慣れたものから力を得ます。「無謀/つまらない」と誤解しやすいです。慣れたこと2つ、新しいこと1つでバランスを取ってみましょう。", "익숙한 루틴과 약속된 흐름에서 안정을 느끼고, 한번 맺은 관계를 오래 지킵니다.": "慣れたルーティンと決まった流れに安心し、一度結んだ関係を長く大切にします。", "루틴도 지키고 변화도 받아들이는 유연함이 있습니다.": "ルーティンも守り、変化も受け入れる柔軟さがあります。", "반복보다 변화를 선호합니다. 같은 일이 계속되면 답답함을 느낄 수 있어요.": "繰り返しより変化を好みます。同じことが続くと、息苦しく感じることも。", "매일 같은 시간에 5분, 둘만의 작은 루틴(인사·산책 등)을 정해 보세요.": "毎日同じ時間に5分、2人だけの小さなルーティン(あいさつ・散歩など)を決めてみましょう。", "기저핵은 반복한 행동을 하나의 덩어리(습관)로 묶어 자동화하는 데 관여하는 것으로 알려져 있습니다.": "大脳基底核は、繰り返した行動をひとまとまり(習慣)にして自動化することに関わると知られています。", "둘 다 루틴과 약속을 소중히 합니다. 편안하고 단단하지만 변화가 필요할 때 대응이 늦을 수 있어요. 작은 변화를 미리 연습해 보세요.": "2人ともルーティンと約束を大切にします。心地よく堅実ですが、変化が必要なときの対応が遅れることも。小さな変化を前もって練習してみましょう。", "둘 다 변화를 즐깁니다. 신선하지만 생활 리듬이 흔들릴 수 있어요. 식사·수면처럼 꼭 지킬 리듬을 함께 정하세요.": "2人とも変化を楽しみます。新鮮ですが、生活リズムが乱れることも。食事・睡眠のように必ず守るリズムを一緒に決めましょう。", "루틴에 대한 태도가 비슷해 생활 리듬을 맞추기 쉬운 조합입니다.": "ルーティンへの姿勢が似ているので、生活リズムを合わせやすい組み合わせです。", "한 사람은 루틴이, 한 사람은 변화가 편합니다. \"고집스럽다/변덕스럽다\"로 오해하기 쉬워요. 평일은 루틴, 주말은 변화로 나눠 보세요.": "1人はルーティン、もう1人は変化が心地よいタイプです。「頑固/気まぐれ」と誤解しやすいです。平日はルーティン、週末は変化と分けてみましょう。", "상상하고 새로운 조합을 떠올리는 일에서 즐거움을 느낍니다. 엉뚱한 생각이 대화를 풍성하게 합니다.": "想像して新しい組み合わせを思いつくことに楽しさを感じます。突拍子もない発想が会話を豊かにします。", "현실적인 생각과 상상을 오가며 균형을 잡습니다.": "現実的な考えと想像を行き来してバランスを取ります。", "상상보다 눈앞의 현실과 구체적인 사실에 집중합니다.": "想像よりも、目の前の現実と具体的な事実に集中します。", "10분 동안 \"우리가 함께 해 보고 싶은 일\" 다섯 가지를 자유롭게 적어 보세요.": "10分間、「2人で一緒にやってみたいこと」を5つ自由に書いてみましょう。", "디폴트 모드 네트워크는 쉬는 동안 활발하며, 창의적 사고 때 실행 네트워크와 함께 작동한다는 연구가 있습니다.": "デフォルトモードネットワークは休息中に活発で、創造的な思考のときに実行ネットワークと一緒に働くという研究があります。", "둘 다 상상과 아이디어가 풍부합니다. 대화가 즐겁지만 실행이 미뤄질 수 있어요. 아이디어 중 하나만 이번 주에 실행해 보세요.": "2人とも想像とアイデアが豊富です。会話は楽しいですが、実行が後回しになることも。アイデアのうち1つだけ、今週実行してみましょう。", "둘 다 현실적이고 구체적입니다. 믿음직하지만 새로운 발상이 부족할 수 있어요. 함께 \"만약에\" 놀이를 해 보세요.": "2人とも現実的で具体的です。頼もしい反面、新しい発想が不足することも。一緒に「もしも」ゲームをしてみましょう。", "상상과 현실의 균형이 비슷해 서로의 이야기를 이해하기 쉬운 조합입니다.": "想像と現実のバランスが似ているので、お互いの話を理解しやすい組み合わせです。", "한 사람은 상상으로, 한 사람은 현실로 이야기합니다. \"뜬구름 잡는다/꽉 막혔다\"로 오해하기 쉬워요. 상상은 끝까지 들어주고, 현실 확인은 한 번만 하세요.": "1人は想像で、もう1人は現実で話します。「地に足がついていない/融通がきかない」と誤解しやすいです。想像は最後まで聞き、現実の確認は一度だけにしましょう。", "전전두피질": "前頭前皮質", "섬엽": "島皮質", "전측 대상피질": "前部帯状皮質", "복측 피개영역": "腹側被蓋野", "측좌핵(복측 선조체)": "側坐核(腹側線条体)", "미상핵·피각·담창구": "尾状核・被殻・淡蒼球", "내측 전전두피질·후측 대상피질·각회·해마": "内側前頭前皮質・後部帯状皮質・角回・海馬", "관련 기능: ": "関連する機能: ", "실행기능": "実行機能", "공감·감정 처리": "共感・感情処理", "보상·새로움 반응(도파민계)": "報酬・新しさへの反応(ドーパミン系)", "습관 형성": "習慣形成", "상상·창의적 사고": "想像・創造的思考", "속 깊은 설계자": "思慮深い設計者", "마음을 챙기면서도 차분히 계획하는 사람": "気持ちを大切にしながら落ち着いて計画する人", "약속을 지키고 감정도 솔직히 나누는 사람": "約束を守り、感情も正直に分かち合う人", "계획이 갑자기 바뀌는데 설명이 없을 때": "計画が突然変わるのに説明がないとき", "네 마음도 중요해. 우리 같이 순서를 정리해 보자.": "あなたの気持ちも大事。一緒に順番を整理しよう。", "계산된 모험가": "計算された冒険家", "따져 본 뒤 과감하게 도전하는 사람": "よく考えたうえで思い切って挑戦する人", "새로운 계획을 함께 세우고 실행해 주는 사람": "新しい計画を一緒に立てて実行してくれる人", "준비 없이 밀어붙이거나 도전 자체를 막을 때": "準備なしに押し切られたり、挑戦そのものを止められたりするとき", "도전은 좋아. 필요한 준비만 같이 확인하고 가자.": "挑戦はいいね。必要な準備だけ一緒に確認して進もう。", "신중한 지킴이": "慎重な守り手", "검증된 방식을 계획대로 꾸준히 지키는 사람": "検証された方法を計画どおりこつこつ守る人", "약속과 루틴을 존중하는 사람": "約束とルーティンを尊重する人", "일정이 갑자기 뒤집히고 규칙이 자주 바뀔 때": "予定が急にひっくり返り、ルールがたびたび変わるとき", "바꿔야 한다면 미리 알려 줘. 그러면 나도 준비할 수 있어.": "変えるなら前もって教えて。そうすれば私も準備できるから。", "아이디어 전략가": "アイデア戦略家", "상상을 계획으로 바꾸는 사람": "想像を計画に変える人", "내 아이디어를 들어주고 현실로 옮기도록 돕는 사람": "私のアイデアを聞いて、現実にするのを助けてくれる人", "아이디어를 바로 무시하거나 이야기만 길어질 때": "アイデアをすぐに無視されたり、話だけが長引いたりするとき", "아이디어 세 가지만 고르고, 이번 주에 한 가지부터 해 보자.": "アイデアを3つだけ選んで、今週は1つから始めよう。", "열정 공감러": "情熱の共感者", "마음이 움직이면 바로 달려가는 따뜻한 사람": "心が動くとすぐに駆け出す、温かい人", "감정을 솔직히 나누고 함께 신나게 움직이는 사람": "感情を正直に分かち合い、一緒に楽しく動く人", "감정 표현이 차갑거나 새로운 시도를 늘 거절당할 때": "感情表現が冷たいときや、新しい試みをいつも断られるとき", "지금 기분을 먼저 말할게. 그다음에 같이 해 볼 걸 정하자.": "まず今の気持ちを話すね。そのあと一緒にやることを決めよう。", "포근한 보호자": "ぬくもりの守り人", "편안한 루틴 안에서 사람을 세심히 돌보는 사람": "心地よいルーティンの中で、人をきめ細かく世話する人", "꾸준히 곁을 지켜 주고 안정감을 주는 사람": "ずっとそばにいて、安心感をくれる人", "변화가 잦은데 마음을 말로 안 해 줄 때": "変化が多いのに、気持ちを言葉にしてくれないとき", "요즘 나는 이런 마음이야. 변화가 필요하면 천천히 같이 해 보자.": "最近の私はこんな気持ち。変化が必要なら、ゆっくり一緒にやってみよう。", "감성 몽상가": "感性の夢想家", "감정과 상상이 풍부한 사람": "感情と想像が豊かな人", "마음 이야기와 엉뚱한 생각을 함께 즐겨 주는 사람": "気持ちの話と突飛な発想を一緒に楽しんでくれる人", "현실 이야기만 하며 감정을 건너뛸 때": "現実の話ばかりで、感情を飛ばされるとき", "내 마음이 이런데, 이런 상상도 해 봤어. 같이 들어줄래?": "私の気持ちはこうなんだけど、こんな想像もしてみたの。一緒に聞いてくれる?", "균형 개척자": "バランスの開拓者", "새로움과 익숙함 사이에서 균형을 잡는 사람": "新しさと慣れの間でバランスを取る人", "도전도 하고 일상도 지켜 주는 사람": "挑戦もしつつ、日常も守ってくれる人", "둘 중 하나만 강요받을 때": "どちらか一方だけを強いられるとき", "익숙한 것 둘, 새로운 것 하나로 이번 주를 채워 보자.": "慣れたこと2つ、新しいこと1つで今週を埋めてみよう。", "자유로운 발명가": "自由な発明家", "새로운 경험과 아이디어에서 힘을 얻는 사람": "新しい経験とアイデアから力を得る人", "같이 엉뚱한 일을 벌여 주는 사람": "一緒に突飛なことをしてくれる人", "정해진 틀과 반복이 계속될 때": "決まった枠と繰り返しが続くとき", "이번 주는 처음 해 보는 것 하나를 같이 정하자.": "今週は初めてやることを1つ、一緒に決めよう。", "차분한 예술가": "穏やかなアーティスト", "조용한 일상 속에서 나만의 상상을 키우는 사람": "静かな日常の中で、自分だけの想像を育てる人", "나의 속도와 취향을 존중하는 사람": "私のペースと好みを尊重してくれる人", "재촉하다가 갑자기 낯선 환경으로 데려갈 때": "せかしておいて、急に慣れない環境へ連れていかれるとき", "나만의 시간을 조금 줘. 그다음에 이야기 나눌게.": "自分だけの時間を少しちょうだい。そのあと話すね。", "고른 조화형": "バランスのとれた調和型", "다섯 영역을 고르게 쓰는 유연한 사람": "5つの領域を満遍なく使う柔軟な人", "상황에 맞춰 함께 균형을 잡아 주는 사람": "状況に合わせて一緒にバランスを取ってくれる人", "한쪽 방식만 강요받을 때": "一方のやり方だけを強いられるとき", "이번엔 네 방식으로, 다음엔 내 방식으로 해 보자.": "今回はあなたのやり方で、次は私のやり方でやってみよう。", "준비 중입니다": "準備中です", "관심을 눌러 주셔서 감사합니다 (테스트판은 저장되지 않아요)": "関心を押していただきありがとうございます(テスト版は保存されません)", "점선 · ": "点線 · ", " 평균": "平均", "5가지 뇌 기능 영역 레이더차트": "5つの脳機能領域のレーダーチャート", "뇌 기능 5영역 그림": "脳機能5領域の絵", "2인": "2人", "한국뇌심리연구소": "韓国脳心理研究所", "바깥쪽일수록 점수가 높아요.": "外側ほどスコアが高くなります。", "강함·약함은 성향의 세기이며 좋고 나쁨이 아닙니다.": "「強い」「弱め」は傾向の強さであり、良い悪いではありません。", "평균보다 낮아도 못한다는 뜻이 아니에요. 능력의 높낮이가 아닙니다.": "平均より低くても「苦手」という意味ではありません。能力の高低ではありません。", "자료 보기 (참고 문헌)": "資料を見る(参考文献)", "점수는 그림 30장에 준 평점(1~5점)을 영역별로 더해 0~100점으로 바꾼 값이며 뇌 활동을 측정한 값이 아닙니다. ": "スコアは、絵30枚につけた評点(1〜5点)を領域ごとに足して0〜100点に換算した値で、脳の活動を測定した値ではありません。 ", "연령대 평균은 성격 발달 연구의 일반 경향을 바탕으로 계산한 시뮬레이션 추정값입니다. ": "年代平均は、性格発達研究の一般的な傾向に基づいて計算したシミュレーションの推定値です。 ", "영역 이름과 뇌 이야기는 아래 문헌의 일반적인 내용을 빌려 쉽게 풀었습니다. 영역 구성과 그림-영역 연결은 연구소의 설계안이며 표준화 검증을 거친   <input id="bmsCode" type="text" inputmode="text" autocomplete="off" placeholder="쿠폰 번호">
  <button id="bmsCheck" type="button">쿠폰 확인</button>
  <div id="bmsMsg" class="msg" aria-live="polite"></div>
  <button id="bmsGo" class="go" type="button" style="display:none">검사 시작하기</button>
  <button id="bmsAdminOpen" class="alt" type="button">🔐 관리자 입장</button>
  <div id="bmsAdminBox" style="display:none"><input id="bmsPw" type="password" placeholder="관리자 비밀번호" style="letter-spacing:0;text-transform:none"><button id="bmsAdminGo" type="button">관리자 확인</button></div>
  <div class="help">쿠폰은 강의에서 안내해 드립니다.<br>문의: brain.saboo@gmail.com</div>
</div></div>
<div id="bmsBar"></div>
<script>
(function(){
  var URL_="https://grxqfaeznqqohnlltged.supabase.co", KEY="sb_publishable_Sgv6BVPo1dOnVICcX1tfzA_gf7T5Z4I", SYS="goonghap";
  var C=null, USED={}, ADMIN=false;
  function $(i){return document.getElementById(i);}
  function rpc(fn,body){return fetch(URL_+"/rest/v1/rpc/"+fn,{method:"POST",headers:{"apikey":KEY,"Authorization":"Bearer "+KEY,"Content-Type":"application/json"},body:JSON.stringify(body)}).then(function(r){return r.json();});}
  function msg(t,cls){var m=$("bmsMsg");m.textContent=t;m.className="msg "+(cls||"");}
  function bar(){var b=$("bmsBar");if(!b)return;
    if(ADMIN){b.textContent="관리자 모드 · 차감 없음";b.style.display="block";}
    else if(C){b.textContent="쿠폰 "+C.remain+"회 남음"+(C.expire?" · "+new Date(C.expire).toLocaleDateString("ko-KR",{month:"numeric",day:"numeric"})+"까지":"");b.style.display="block";}
    else{b.style.display="none";}}
  function open_(){$("bmsGate").style.display="none";bar();}
  function show_(){$("bmsGate").style.display="flex";}
  // 쿠폰 확인
  $("bmsCheck").addEventListener("click",function(){
    var code=$("bmsCode").value.trim().toUpperCase();
    if(!code){msg("쿠폰 번호를 입력해 주세요","err");return;}
    msg("확인 중...","");
    rpc("kbpi_coupon_check",{p_code:code,p_sys:SYS}).then(function(r){
      if(!r||!r.ok){msg(r&&r.reason==="used_up"?"❌ 사용 횟수가 모두 소진된 쿠폰입니다":(r&&r.reason==="expired"?"❌ 만료된 쿠폰입니다":"❌ 유효하지 않은 쿠폰입니다"),"err");$("bmsGo").style.display="none";return;}
      C={code:code,remain:r.remain,type:r.coupon_type,expire:r.expire_date};
      msg("✅ 유효한 쿠폰입니다 · "+r.remain+"회 남음","ok");$("bmsGo").style.display="block";
    }).catch(function(){msg("❌ 연결에 실패했습니다. 잠시 후 다시 해 주세요","err");});
  });
  $("bmsCode").addEventListener("keydown",function(e){if(e.key==="Enter"){$("bmsCheck").click();}});
  $("bmsGo").addEventListener("click",function(){if(C&&C.remain>0){open_();}else{msg("잔여 횟수가 없습니다","err");}});
  // 관리자 입장 (서버에서 비밀번호 확인)
  $("bmsAdminOpen").addEventListener("click",function(){var b=$("bmsAdminBox");b.style.display=(b.style.display==="none")?"block":"none";});
  $("bmsAdminGo").addEventListener("click",function(){
    var pw=$("bmsPw").value;if(!pw){msg("비밀번호를 입력해 주세요","err");return;}
    rpc("kbpi_admin_check",{p_pw:pw}).then(function(ok){
      $("bmsPw").value="";
      if(ok===true){ADMIN=true;C=null;open_();}else{msg("❌ 비밀번호가 올바르지 않습니다","err");}
    }).catch(function(){msg("❌ 연결에 실패했습니다","err");});
  });
  // 주소의 ?c=번호 로 자동 입력 (확인은 직접 눌러야 함)
  try{var m=/[?&](?:c|coupon)=([^&#]+)/.exec(location.search);if(m){$("bmsCode").value=decodeURIComponent(m[1]).toUpperCase().slice(0,40);
    if(history.replaceState){history.replaceState(null,"",location.pathname+location.hash);}}}catch(e){}
  // 결과가 처음 나올 때 1회 차감 (관리자는 차감 없음)
  window.__bmsOnRender=function(S){
    if(S.screen!=="result"&&S.screen!=="gres")return;
    var key=S.screen+":"+(S.group?JSON.stringify((S.group.res||[]).map(function(x){return x&&x.nick;})):(S.me&&S.me.nick||""))+":"+(S.hub||"");
    if(USED[key])return;USED[key]=1;
    if(ADMIN||!C)return;
    var names=S.group?(S.group.res||[]).map(function(x){return x&&x.nick||"";}).filter(Boolean).join("·"):(S.me&&S.me.nick||"");
    rpc("kbpi_coupon_use_ex",{p_code:C.code,p_sys:SYS,p_name:names||"-",p_display:names||"-",p_diag:null}).then(function(r){
      if(r&&r.ok){C.remain=r.remain_after;bar();
        if(C.remain<=0){var b=$("bmsBar");if(b){b.textContent="쿠폰을 모두 사용했습니다";}}}
    }).catch(function(){});
  };
  // 새로 시작하려는데 쿠폰이 없으면 관문으로 되돌림
  document.addEventListener("click",function(e){
    var el=e.target&&e.target.closest?e.target.closest("[data-act='start'],[data-act='gstart'],[data-act='retry']"):null;
    if(!el||ADMIN)return;
    if(!C||C.remain<=0){e.stopImmediatePropagation();e.preventDefault();$("bmsGo").style.display="none";msg(C?"쿠폰을 모두 사용했습니다. 새 쿠폰을 입력해 주세요":"쿠폰을 먼저 입력해 주세요","err");show_();}
  },true);
})();
</script>

</body>
</html>
