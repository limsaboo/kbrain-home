<!DOCTYPE html>
<html lang="ko"><head>
<link rel="manifest" href="/quiz/manifest.webmanifest">
<meta name="theme-color" content="#00868F">
<link rel="apple-touch-icon" href="/quiz/icon-192.png">
<link rel="icon" href="/quiz/icon-192.png"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>뇌 5분 퀴즈 · 한국뇌심리연구소</title>
<style>
:root{--teal:#00868F;--tealD:#00747E;--orange:#E8500A;--orangeD:#D84300;--purple:#6A1B9A;--red:#D0112B;--gold:#C9A227;--ink:#111;--bg:#F1F4F6}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;color:var(--ink);line-height:1.6}
body{max-width:480px;margin:0 auto;min-height:100vh;overflow-x:hidden;word-break:keep-all}
button{font-family:inherit;border:0;cursor:pointer}
.scr{display:none;padding:18px 16px 36px}
.scr.on{display:block}
#s-start.on,#s-quiz.on{display:flex;flex-direction:column;min-height:min(100vh,900px)}
#s-quiz .acard{flex:1;display:flex;flex-direction:column}
#s-quiz .opts{flex:1;align-content:space-evenly}
.nw{white-space:nowrap}
.center{text-align:center}

/* 시작 */
.chip{display:block;width:max-content;margin:6px auto 0;background:#fff;border:3px solid var(--gold);color:var(--ink);font-size:20px;font-weight:900;padding:2px 22px;border-radius:30px;white-space:nowrap}
.ttl{margin-top:14px;text-align:center;font-size:46px;font-weight:900;line-height:1.25;color:var(--tealD);white-space:nowrap}
.sub{margin-top:8px;text-align:center;font-size:21px;font-weight:900;color:var(--orangeD);white-space:nowrap}
.ask{margin-top:22px;text-align:center;font-size:21px;font-weight:900;white-space:nowrap}
.gender{margin-top:14px;display:grid;grid-template-columns:1fr 1fr;gap:12px;flex:1;min-height:250px;max-height:430px}
.gcard{position:relative;border-radius:26px;border:5px solid;padding:0;height:100%;min-height:250px;overflow:hidden;text-align:left}
.gcard.m{background:#D6ECFF;border-color:#7DBEF5}
.gcard.f{background:#FFDCEA;border-color:#F59BC2}
.gcard .gl{position:absolute;left:14px;top:10px;font-size:25px;font-weight:900;color:var(--ink);z-index:2}
.gcard svg{position:absolute;left:0;bottom:0;width:100%;height:88%}
.gcard:active{transform:scale(.97)}
.facts{margin-top:18px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fact{background:#fff;border:3px solid var(--teal);border-radius:18px;padding:8px 4px;text-align:center;font-size:17px;font-weight:900;line-height:1.35;white-space:nowrap}
.fact b{display:block;font-size:25px;color:var(--orangeD)}
.brand{margin-top:18px;background:#fff;border-top:5px solid var(--gold);border-radius:20px;padding:12px 14px;display:flex;align-items:center;gap:14px}
.brand img{width:62px;height:62px;border-radius:14px;flex:none}
.brand .b1{font-size:23px;font-weight:900;color:var(--tealD);white-space:nowrap}
.brand .b2{font-size:16px;font-weight:800;white-space:nowrap}

/* 문항 */
.bar{background:var(--teal);color:#fff;border-radius:22px;padding:12px 18px;display:flex;justify-content:space-between;align-items:center;font-size:23px;font-weight:900;white-space:nowrap}
.bar .tm{display:flex;align-items:center;gap:8px}
.bar svg{width:30px;height:30px}
.bar.low{background:var(--red)}
.card{background:#fff;border:3px solid #C9D3D9;border-radius:28px;box-shadow:0 8px 18px rgba(0,0,0,.08)}
.qcard{margin-top:14px;padding:16px 14px 18px}
.qt{text-align:center;font-size:22px;font-weight:900;color:var(--tealD);white-space:nowrap;margin-bottom:12px}
.mx{display:block;width:100%;max-width:340px;margin:0 auto}
.acard{margin-top:14px;padding:16px 14px 16px}
.at{font-size:21px;font-weight:900;color:var(--tealD);padding-bottom:8px;border-bottom:3px solid var(--teal);margin-bottom:12px;white-space:nowrap}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 8px}
.o{background:#fff;border:3px solid transparent;border-radius:18px;padding:6px 4px;display:flex;align-items:center;gap:4px;min-width:0}
.o .ol{font-size:21px;font-weight:900;color:#333;width:30px;flex:none;text-align:center}
.o svg{width:100%;flex:1;min-width:0;display:block}
.o.sel{border-color:var(--orange);background:#FFF1E8}
.o:active{transform:scale(.96)}
.btns{margin-top:14px;display:flex;gap:12px;justify-content:center}
.btns button{background:var(--orangeD);color:#fff;font-size:22px;font-weight:900;padding:12px 30px;border-radius:26px 26px 6px 26px;min-width:130px;white-space:nowrap}
.btns button.ghost{background:#fff;color:var(--orangeD);border:3px solid var(--orangeD)}
.nums{margin-top:16px;background:#33424B;border-radius:26px;padding:14px 10px;display:grid;grid-template-columns:repeat(5,1fr);gap:8px 4px}
.nb{background:transparent;color:#fff;font-size:24px;font-weight:900;height:52px;width:52px;margin:0 auto;border-radius:50%;position:relative}
.nb.done{color:#8EE6EC}
.nb.done::after{content:"";position:absolute;left:50%;bottom:4px;width:22px;height:5px;margin-left:-11px;border-radius:3px;background:#2BC4CF}
.nb.skip::after{content:"";position:absolute;left:50%;bottom:4px;width:22px;height:5px;margin-left:-11px;border-radius:3px;background:#FF8A4C}
.nb.cur{background:#fff;color:var(--tealD)}
.nb.cur::after{display:none}

/* 모달 */
.ov{position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:9;padding:20px}
.ov.on{display:flex}
.md{background:#fff;border-radius:28px;padding:22px 18px;width:100%;max-width:380px;text-align:center}
.md h3{font-size:26px;font-weight:900;color:var(--tealD);white-space:nowrap}
.md p{margin-top:8px;font-size:19px;font-weight:800;line-height:1.7}
.md .row{margin-top:16px;display:flex;flex-direction:column;gap:10px}
.btn{display:block;width:100%;background:var(--orangeD);color:#fff;font-size:22px;font-weight:900;padding:14px 10px;border-radius:24px;text-align:center;text-decoration:none;white-space:nowrap}
.btn.teal{background:var(--teal)}
.btn.ghost{background:#fff;color:var(--orangeD);border:3px solid var(--orangeD)}

/* 결과 */
.rhead{border-radius:30px;border:5px solid;padding:16px 12px 8px;text-align:center;position:relative;overflow:hidden}
.rhead.m{background:#D6ECFF;border-color:#7DBEF5}
.rhead.f{background:#FFDCEA;border-color:#F59BC2}
.rhead .r1{font-size:20px;font-weight:900;white-space:nowrap}
.rhead .rt{margin-top:2px;font-size:40px;font-weight:900;line-height:1.3;white-space:nowrap}
.rhead svg{display:block;margin:6px auto 0;width:150px;height:auto}
.rdesc{margin-top:14px;padding:16px 14px;text-align:center;font-size:20px;font-weight:800;line-height:1.75}
.kw{margin-top:12px;display:flex;gap:8px;justify-content:center}
.kw span{font-size:18px;font-weight:900;color:#fff;padding:5px 12px;border-radius:20px;white-space:nowrap}
.stats{margin-top:14px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.st{background:#fff;border:3px solid var(--teal);border-radius:20px;padding:10px 2px;text-align:center;font-size:16px;font-weight:900;white-space:nowrap}
.st b{display:block;font-size:30px;color:var(--orangeD);line-height:1.3}
.tip{margin-top:14px;background:#FFF6D9;border:3px solid var(--gold);border-radius:22px;padding:12px 14px;text-align:center;font-size:19px;font-weight:800;line-height:1.7}
.tip b{display:block;color:var(--tealD);font-size:20px}
.acts{margin-top:16px;display:flex;flex-direction:column;gap:10px}
.note{margin-top:12px;text-align:center;font-size:15px;font-weight:700;color:#444}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#111;color:#fff;font-size:18px;font-weight:800;padding:10px 20px;border-radius:24px;display:none;z-index:10;white-space:nowrap}
</style></head><body>

function rnd(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}
const pick=a=>a[Math.floor(rnd()*a.length)];

const FILL=['#00868F','#E8500A','#6A1B9A'];
const SHAPES=['circle','square','triangle','diamond'];
const ROTS=[0,90,180,270];
const sh=(shape,fill,size=.9,rot=0)=>({t:'s',shape,fill,size,rot,count:0});
const cnt=(n,fill)=>({t:'s',shape:'dots',fill,size:1,rot:0,count:n});
const bits=b=>({t:'b',b});
const key=c=>c.t==='b'?'b'+c.b.join(''):[c.shape,c.fill,c.size,c.rot,c.count].join('|');
function draw(c){
 if(c.t==='b'){const P=[[12,12],[54,12],[12,54],[54,54]];return P.map((p,i)=>c.b[i]?`<rect x="${p[0]}" y="${p[1]}" width="34" height="34" rx="6" fill="#00868F"/>`:`<rect x="${p[0]}" y="${p[1]}" width="34" height="34" rx="6" fill="#fff" stroke="#C9D3D9" stroke-width="2"/>`).join('')}
 const f=c.fill,s=36*c.size;
 if(c.shape==='dots'){const pos={1:[[50,50]],2:[[34,50],[66,50]],3:[[50,30],[32,66],[68,66]],4:[[33,33],[67,33],[33,67],[67,67]]}[c.count];return pos.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="12" fill="${f}"/>`).join('')}
 let body='';
 if(c.shape==='circle')body=`<circle r="${s}" fill="${f}"/>`;
 if(c.shape==='square')body=`<rect x="${-s*.9}" y="${-s*.9}" width="${s*1.8}" height="${s*1.8}" rx="5" fill="${f}"/>`;
 if(c.shape==='triangle')body=`<polygon points="0,${-s} ${s*.98},${s*.8} ${-s*.98},${s*.8}" fill="${f}"/>`;
 if(c.shape==='diamond')body=`<polygon points="0,${-s} ${s},0 0,${s} ${-s},0" fill="${f}"/>`;
 if(c.shape==='arrow')body=`<polygon points="0,${-s} ${s*.85},${-s*.05} ${s*.32},${-s*.05} ${s*.32},${s} ${-s*.32},${s} ${-s*.32},${-s*.05} ${-s*.85},${-s*.05}" fill="${f}"/>`;
 return `<g transform="translate(50 50) rotate(${c.rot})">${body}</g>`;
}
const DOM={shape:SHAPES,fill:FILL,size:[.55,.8,1.05],rot:ROTS,count:[1,2,3,4]};
function mutate(c,muts){
 const d=JSON.parse(JSON.stringify(c));
 if(d.t==='b'){const n=rnd()<.6?1:2;shuffle([0,1,2,3]).slice(0,n).forEach(i=>{d.b[i]^=1});return d}
 const k=rnd()<.6?1:2;
 shuffle(muts).slice(0,k).forEach(a=>{d[a]=pick(DOM[a].filter(v=>v!==d[a]))});
 return d;
}

/* ===== 퍼즐 10종 (쉬운 것 → 어려운 것) ===== */
const grid=f=>{const a=[];for(let r=0;r<3;r++)for(let c=0;c<3;c++)a.push(f(r,c));return a};
function randBits(){let b,n;do{b=[0,1,2,3].map(()=>rnd()<.5?1:0);n=b[0]+b[1]+b[2]+b[3]}while(n<1||n>2);return b}
function bitsPuzzle(op){
 for(;;){
  const cells=[];let overlap=false,ok=true;
  for(let r=0;r<3;r++){const a=randBits(),b=randBits(),c=a.map((x,i)=>op(x,b[i]));
   if(c.every(x=>!x)){ok=false;break}
   if(a.some((x,i)=>x&&b[i]))overlap=true;
   cells.push(bits(a),bits(b),bits(c));}
  if(ok&&overlap)return {cells,muts:[]};
 }
}
const BUILD=[
 ()=>{const s=shuffle(SHAPES).slice(0,3),f=pick(FILL);return {cells:grid((r,c)=>sh(s[(r+c)%3],f)),muts:['shape','fill']}},
 ()=>{const f=shuffle(FILL),s=pick(SHAPES);return {cells:grid((r,c)=>sh(s,f[(r+c)%3])),muts:['fill','shape']}},
 ()=>{const s=shuffle(SHAPES).slice(0,3),f=shuffle(FILL);return {cells:grid((r,c)=>sh(s[r],f[c])),muts:['shape','fill']}},
 ()=>{const s=shuffle(SHAPES).slice(0,3),f=shuffle(FILL),z=rnd()<.5?[.5,.78,1.05]:[1.05,.78,.5];return {cells:grid((r,c)=>sh(s[r],f[r],z[c])),muts:['size','shape','fill']}},
 ()=>{const f=shuffle(FILL),asc=rnd()<.5;return {cells:grid((r,c)=>cnt(asc?c+1:3-c,f[r])),muts:['count','fill']}},
 ()=>{const f=shuffle(FILL),st=[pick(ROTS),pick(ROTS),pick(ROTS)],d=rnd()<.5?90:270;return {cells:grid((r,c)=>sh('arrow',f[r],.9,(st[r]+d*c)%360)),muts:['rot','fill']}},
 ()=>bitsPuzzle((x,y)=>x|y),
 ()=>{const s=shuffle(SHAPES).slice(0,3),f=shuffle(FILL);return {cells:grid((r,c)=>sh(s[(r+c)%3],f[c])),muts:['shape','fill']}},
 ()=>bitsPuzzle((x,y)=>x^y),
 ()=>{const f=shuffle(FILL),st=[pick(ROTS),pick(ROTS),pick(ROTS)],d=rnd()<.5?90:270;return {cells:grid((r,c)=>sh('arrow',f[(r+c)%3],.9,(st[r]+d*c)%360)),muts:['rot','fill']}}
];
function makePuzzle(i){
 for(let tries=0;tries<50;tries++){
  const {cells,muts}=BUILD[i]();
  const ans=cells[8],seen=new Set([key(ans)]),dis=[];let g=0;
  while(dis.length<5&&g++<400){const d=mutate(ans,muts.length?muts:[]);const k=key(d);if(!seen.has(k)){seen.add(k);dis.push(d)}}
  if(dis.length<5)continue;
  const opts=shuffle([ans,...dis]);
  return {full:cells,cells:cells.slice(0,8),opts,ans:opts.findIndex(o=>key(o)===key(ans))};
 }
 throw new Error('puzzle '+i);
}
function selfTest(n=300){
 const res={ok:0,fail:[]};
 const same=(a,b)=>a===b;
 for(let i=0;i<BUILD.length;i++)for(let k=0;k<n;k++){
  try{
   const p=makePuzzle(i),f=p.full;
   const ks=p.opts.map(key); if(new Set(ks).size!==6)throw 'dup';
   if(key(p.opts[p.ans])!==key(f[8]))throw 'ans';
   const R=r=>[f[r*3],f[r*3+1],f[r*3+2]],C=c=>[f[c],f[c+3],f[c+6]];
   const allDistinct=(arr,a)=>new Set(arr.map(x=>x[a])).size===3;
   if(i===0){for(let t=0;t<3;t++){if(!allDistinct(R(t),'shape')||!allDistinct(C(t),'shape'))throw 'latin'}}
   if(i===1||i===9){/* 색 라틴 */ if(i===1)for(let t=0;t<3;t++){if(!allDistinct(R(t),'fill')||!allDistinct(C(t),'fill'))throw 'latinc'}}
   if(i===2){for(let t=0;t<3;t++){if(new Set(R(t).map(x=>x.shape)).size!==1||new Set(C(t).map(x=>x.fill)).size!==1)throw 'rc'}}
   if(i===3){for(let r=0;r<3;r++){const z=R(r).map(x=>x.size);if(!(z[0]<z[1]&&z[1]<z[2])&&!(z[0]>z[1]&&z[1]>z[2]))throw 'size'}}
   if(i===4){for(let r=0;r<3;r++){const z=R(r).map(x=>x.count);if(!((z[1]-z[0]===1&&z[2]-z[1]===1)||(z[0]-z[1]===1&&z[1]-z[2]===1)))throw 'cnt'}}
   if(i===5||i===9){for(let r=0;r<3;r++){const z=R(r).map(x=>x.rot);const d1=(z[1]-z[0]+360)%360,d2=(z[2]-z[1]+360)%360;if(d1!==d2||(d1!==90&&d1!==270))throw 'rot'}}
   if(i===9){for(let t=0;t<3;t++){if(!allDistinct(R(t),'fill')||!allDistinct(C(t),'fill'))throw 'latinc2'}}
   if(i===6||i===8){for(let r=0;r<3;r++){const a=f[r*3].b,b=f[r*3+1].b,c=f[r*3+2].b;for(let j=0;j<4;j++){const e=i===6?(a[j]|b[j]):(a[j]^b[j]);if(c[j]!==e)throw 'bits'}}}
   if(i===7){for(let t=0;t<3;t++){if(!allDistinct(R(t),'shape')||!allDistinct(C(t),'shape')||new Set(C(t).map(x=>x.fill)).size!==1)throw 'combo'}}
   res.ok++;
  }catch(e){res.fail.push([i,String(e)])}
 }
 return res;
}

 $('r-share').onclick=async()=>{
  const pub=QUIZ_URL||(/^https?:/.test(location.href)?location.href:'');
  const text='나는 「'+T.n+'」 나왔어! 😮\n너는 어떤 뇌일까? 5분이면 알 수 있어.\n한번 해봐 👇'+(pub?'\n'+pub:'');
  let file=null;
  try{const cv=await buildCard({T,correct,avg,skipN,faceSvg,G,pub});const bl=await new Promise(r=>cv.toBlob(r,'image/png'));file=new File([bl],'뇌성향카드.png',{type:'image/png'})}catch(e){}
  try{if(file&&navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],text});return}}catch(e){if(e&&e.name==='AbortError')return}
  try{if(navigator.share){await navigator.share({text});return}}catch(e){if(e&&e.name==='AbortError')return}
  try{await navigator.clipboard.writeText(text);toast('글을 복사했어요. 붙여넣어 공유하세요');return}catch(e){}
  toast('공유 기능을 쓸 수 없어요');
 };
}
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2200)}
window.QUIZ={buildCard,selfTest,makePuzzle,startQuiz,Q:()=>Q,finish};

if('serviceWorker' in navigator&&/^https:/.test(location.protocol)){try{navigator.serviceWorker.register('/quiz/sw.js',{scope:'/quiz/'}).catch(function(){})}catch(e){}}
</script></body></html>
