<style>

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{--bg:#07091a;--bg2:#0d1030;--bg3:#111535;--gold:#c9a84c;--gold2:#f0d080;--na:#4fc3f7;--nb:#f48fb1;--neon:#a78bfa;--tx:#e8eaf6;--tx2:#90939e;--border:rgba(201,168,76,.22);}
html,body{min-height:100%;background:var(--bg);font-family:'Apple SD Gothic Neo','Noto Sans KR',sans-serif;color:var(--tx);overflow-x:hidden;}
.screen{display:none;min-height:100vh;flex-direction:column;align-items:center;width:100%;overflow-x:hidden;}
.screen.active{display:flex;}
.topbar{width:100%;max-width:480px;display:flex;align-items:center;justify-content:space-between;padding:13px 18px;background:rgba(7,9,26,.92);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10;backdrop-filter:blur(8px);}
.tb-title{font-size:18px;font-weight:800;color:var(--gold);}

.intro-sub{text-align:center;font-size:13px;color:var(--tx2);line-height:1.6;margin-top:4px;}
.btn-primary{width:100%;padding:20px;background:linear-gradient(135deg,#1a2070,#0d0f3a);border:2px solid var(--gold);border-radius:16px;color:var(--gold2);font-size:19px;font-weight:900;cursor:pointer;letter-spacing:.5px;transition:all .2s;}

<body>
<div class="bloom-bg"></div>
<div class="wrap">
<div class="coupon-screen">
    <div style="text-align:center;margin-bottom:4px;">
      <div class="rose-badge">🧠</div>
      <div class="rose-title">시니어 인지기능 현황 체크</div>
      <div class="rose-org">한국뇌심리연구소 | 임찬우 소장</div>
    </div>
</div>

<script>
/* ================= 최소한의 필수 코드 ================= */

var _coupon = null;
var _adminUnlocked = false;
const _adminPass = 'brain2025!';

function showToast(msg) {
  alert(msg);
}

function checkCoupon() {
  var code = document.getElementById("couponInput").value.trim().toUpperCase();
  if(!code) { showToast("쿠폰 번호를 입력해주세요"); return; }
  
  // 간단한 더미 검증 (실제는 Supabase)
  if(code === "TEST123" || code === "ADMIN-FREE") {
    _coupon = {
      coupon_code: code,
      buyer_name: "테스트 사용자",
      remain_count: 10,
      expire_date: "2025-12-31"
    };
    
    document.getElementById("couponBuyerName").textContent = _coupon.buyer_name;
    document.getElementById("couponTypeBadge").textContent = "유효";
    document.getElementById("couponRemain").textContent = _coupon.remain_count + "회 남음";
    document.getElementById("couponExpire").textContent = "만료일: " + _coupon.expire_date;
    document.getElementById("couponInfo").classList.add("show");
    
    showToast("✅ 유효한 쿠폰입니다!");
  } else {
    showToast("❌ 유효하지 않은 쿠폰입니다");
  }
}

function startWithCoupon() {
  if(!_coupon) { showToast("쿠폰을 먼저 확인해주세요"); return; }
  if(_coupon.remain_count <= 0) { showToast("잔여 횟수가 없습니다"); return; }
  showToast("✅ 검사를 시작합니다!");
}

function adminLogin() {
  var pw = prompt("관리자 비밀번호:");
  if(!pw) return;
  if(pw === _adminPass) {
    _adminUnlocked = true;
    _coupon = {
      coupon_code: "ADMIN-FREE",
      coupon_type: "admin",
      buyer_name: "임찬우소장",
      remain_count: 9999
    };
    showToast("✅ 소장님 입장! 무제한 사용");
  } else {
    showToast("❌ 비밀번호가 틀렸습니다");
  }
}

// 이벤트 리스너
document.addEventListener("DOMContentLoaded", function() {
  var btnCheck = document.getElementById("btnCheckCoupon");
  if(btnCheck) btnCheck.addEventListener("click", checkCoupon);
  
  var btnConfirm = document.getElementById("btnCouponConfirm");
  if(btnConfirm) btnConfirm.addEventListener("click", startWithCoupon);
  
  var btnAdmin = document.getElementById("btnAdminLogin");
  if(btnAdmin) btnAdmin.addEventListener("click", adminLogin);
  
  var couponInput = document.getElementById("couponInput");
  if(couponInput) {
    couponInput.addEventListener("keypress", function(e) {
      if(e.key === "Enter") checkCoupon();
    });
  }
});

</script>
</body>
</html>
