<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#120709">
<title>사주풀이 · 이름·작명 · 속궁합 · 한국뇌궁합연구소</title>
<meta name="kbg-chapter" content="Lim's Brain Group / 뇌궁합센터 / 사주·작명">
<style>
:root{
  --bg:#120709; --card:#220F16; --line:#5A2A3A;
  --gold:#FFC83D; --pink:#FF3D7F; --white:#FFFFFF; --ink:#111111;
  --man:#38B6FF; --woman:#FF5FA2;
  --wood:#0B8F3A; --fire:#E8352B; --earth:#E6A100; --metal:#F4F1EA; --water:#1E6FE0;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{
  font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  background:radial-gradient(120% 60% at 50% 0%,#4A1426 0%,#120709 60%);
  color:var(--white); font-weight:700; line-height:1.85; letter-spacing:-.2px;
  word-break:keep-all; max-width:480px; margin:0 auto; padding:0 16px 40px;
}
.brand{display:flex;align-items:center;justify-content:center;gap:10px;padding:18px 0 6px}
.logo{width:34px;height:34px;border:3px solid var(--gold);border-radius:10px;position:relative;flex:none}
.logo i{position:absolute;border-radius:50%}
.logo i:nth-child(1){width:13px;height:13px;background:#12B5A6;left:3px;top:3px}
.logo i:nth-child(2){width:9px;height:9px;background:#FF8A1F;right:3px;top:4px}
.logo i:nth-child(3){width:9px;height:9px;background:#9B4DFF;left:5px;bottom:3px}
.logo i:nth-child(4){width:6px;height:6px;background:var(--gold);right:5px;bottom:5px}
.brand b{font-size:15px;color:var(--gold);font-weight:900;white-space:nowrap}
.hero{text-align:center;padding:12px 0 14px}
.tag{display:inline-block;background:var(--pink);color:#fff;font-size:13px;font-weight:900;padding:2px 14px;border-radius:99px;margin-bottom:10px}
h1{font-size:28px;line-height:1.5;font-weight:900;color:#fff}
h1 em{font-style:normal;color:var(--gold)}
.sub{margin-top:8px;font-size:15px;color:#FFE08A;font-weight:800;line-height:1.9}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0 16px}
.tab{height:56px;border-radius:16px;border:2px solid var(--line);background:var(--card);color:#FFD66E;font-size:18px;font-weight:900;font-family:inherit;cursor:pointer}
.tab.on{background:var(--gold);border-color:var(--gold);color:var(--ink)}
.card{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:18px 16px;margin-bottom:16px}
.who{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.who span{background:var(--gold);color:var(--ink);font-weight:900;font-size:15px;padding:1px 14px;border-radius:99px}
.who span.b{background:#fff}
.who small{font-size:13px;color:#FFB8CF;font-weight:800}
label{display:block;font-size:15px;color:#FFD66E;font-weight:900;margin:14px 0 6px}
select{
  width:100%;height:58px;border-radius:14px;border:2px solid var(--line);background:#fff;color:var(--ink);
  font-size:19px;font-weight:900;padding:0 8px;font-family:inherit
}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg button{height:60px;border-radius:14px;border:3px solid var(--line);background:#3a1b27;color:#FFE08A;font-size:20px;font-weight:900;font-family:inherit;cursor:pointer}
.seg button.on{border-color:#fff;color:var(--ink);background:var(--gold)}
.seg.sx button.m.on{background:var(--man);color:#04243A}
.seg.sx button.f.on{background:var(--woman);color:#3A0420}
.help{font-size:14px;color:#FFB8CF;font-weight:800;margin-top:6px;line-height:1.7}
.ymd{display:grid;grid-template-columns:1.35fr 1fr 1fr;gap:8px}
.conv{margin-top:10px;border-radius:14px;background:#3a1b27;border:2px dashed var(--gold);padding:8px 12px;font-size:15px;color:#fff;line-height:1.8;min-height:48px;text-align:center}
.conv b{color:var(--gold)}
.btn{
  display:block;width:100%;border:0;border-radius:16px;height:60px;font-size:20px;font-weight:900;
  font-family:inherit;cursor:pointer;text-align:center;text-decoration:none;line-height:60px
}
.btn.main{background:linear-gradient(90deg,#FF3D7F,#FF7A1F);color:#fff}
.btn.gold{background:var(--gold);color:var(--ink)}
.btn.line{background:transparent;border:2px solid var(--gold);color:var(--gold);line-height:56px;height:60px}
.btn+.btn{margin-top:10px}
.err{color:#FF8FA9;font-size:15px;font-weight:900;text-align:center;margin-top:10px;min-height:22px}
#result{display:none}
#result.on{display:block}
.scorebox{text-align:center;padding:22px 10px;background:linear-gradient(180deg,#3B1020,#220F16)}
.scorebox .lab{font-size:15px;color:#FFD66E;font-weight:900}
.scorebox .num{font-size:92px;line-height:1.1;font-weight:900;color:#fff}
.scorebox .num small{font-size:26px;color:#FFB8CF;margin-left:4px}
.scorebox .quip{font-size:21px;font-weight:900;color:var(--pink);margin-top:2px}
.scorebox .type{display:inline-block;margin-top:12px;background:var(--gold);color:var(--ink);font-weight:900;font-size:15px;padding:2px 16px;border-radius:99px}
.meter{height:14px;background:#3a1b27;border-radius:99px;margin:16px 8px 0;overflow:hidden}
.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pink),var(--gold));border-radius:99px;transition:width 1.2s ease}
.pil-head{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center;font-size:13px;color:#FFD66E;font-weight:900;margin-bottom:4px}
.pil{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.col{display:flex;flex-direction:column;gap:6px}
.box{border-radius:12px;height:70px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15}
.box b{font-size:30px;font-weight:900}
.box small{font-size:12px;font-weight:900;margin-top:3px}
.el0{background:var(--wood);color:#fff}
.el1{background:var(--fire);color:#fff}
.el2{background:var(--earth);color:var(--ink)}
.el3{background:var(--metal);color:var(--ink)}
.el4{background:var(--water);color:#fff}
.dayc .box{outline:3px solid var(--gold);outline-offset:1px}
.dayc .tagday{font-size:11px;color:var(--gold);text-align:center;font-weight:900}
.elrow{display:flex;gap:6px;margin-top:12px}
.elrow div{flex:1;border-radius:10px;text-align:center;padding:4px 0;font-size:13px;font-weight:900;line-height:1.5}
.note{font-size:12px;color:#FFB8CF;font-weight:800;margin-top:8px;text-align:center}
h2{font-size:19px;font-weight:900;color:var(--gold);margin-bottom:8px;line-height:1.5}
h2,.s{text-wrap:balance}
.s{display:block}
.card p{font-size:16px;color:#fff;line-height:1.95;font-weight:700}
.chip{display:inline-block;font-size:13px;font-weight:900;padding:0 10px;border-radius:99px;color:var(--ink);background:var(--gold);margin-right:6px;line-height:1.8}
.chip.p{background:var(--pink);color:#fff}
.chip.man{background:var(--man);color:#04243A}
.chip.woman{background:var(--woman);color:#3A0420}
.blk+.blk{margin-top:14px}
.blk .chip{margin:0 0 4px}
.teaser{font-size:17px;font-weight:900;color:var(--pink);margin:-2px 0 10px;line-height:1.6;text-wrap:balance}
.bars{margin-top:14px}
.br{display:grid;grid-template-columns:44px 1fr;gap:8px;align-items:center;margin-top:7px}
.br .bl{border-radius:8px;text-align:center;font-size:13px;font-weight:900;line-height:1.7}
.br .tr{display:flex;flex-direction:column;gap:3px}
.br .tr i{display:block;height:8px;border-radius:99px;min-width:4px}
.br .tr i.a{background:var(--gold)}.br .tr i.b{background:#fff}
.legend{display:flex;gap:14px;font-size:12px;color:#FFD66E;margin-top:10px;font-weight:900}
.legend u{text-decoration:none;display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}
.lock{position:relative;overflow:hidden}
.lk{position:relative}
.lk .blur{filter:blur(6px);user-select:none;pointer-events:none;color:#fff}
.lk .cover{position:absolute;left:0;right:0;bottom:0;top:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,rgba(34,15,22,.1),rgba(34,15,22,.75));font-size:16px;color:var(--gold);font-weight:900}
.foot{text-align:center;font-size:12px;color:#FFB8CF;font-weight:800;margin-top:18px;line-height:1.9}
.actions{display:block}
/* 대운 */
.dw{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.dw div{border-radius:12px;background:#3a1b27;border:2px solid var(--line);text-align:center;padding:6px 2px;line-height:1.5}
.dw div.now{border-color:var(--gold);background:#4d2230}
.dw b{display:block;font-size:22px;font-weight:900}
.dw small{font-size:12px;color:#FFD66E;font-weight:900}
/* ===== 태블릿·데스크톱 ===== */
@media(min-width:760px){
  body{max-width:860px;padding:0 28px 56px}
  .brand{padding:26px 0 8px}.brand b{font-size:18px}.logo{width:40px;height:40px}
  .hero{padding:22px 0 22px}
  h1{font-size:42px}.sub{font-size:18px}.tag{font-size:15px;padding:3px 18px}
  .card{padding:24px 22px;margin-bottom:0;border-radius:24px}
  .tabs{max-width:560px;margin:6px auto 22px}
  #form .pcs{display:grid;grid-template-columns:1fr 1fr;gap:20px}
  #form .pcs.one{grid-template-columns:minmax(0,560px);justify-content:center}
  #form .btn{max-width:520px;margin:20px auto 0}
  #result.on{display:grid;grid-template-columns:repeat(6,1fr);gap:20px}
  #result>.full{grid-column:span 6}
  #result>.half{grid-column:span 3}
  #result>.third{grid-column:span 3}
  .scorebox{padding:34px 20px}
  .scorebox .num{font-size:128px}.scorebox .num small{font-size:34px}
  .scorebox .quip{font-size:28px}.scorebox .type{font-size:17px}.scorebox .lab{font-size:17px}
  .meter{max-width:560px;margin:20px auto 0}
  .box{height:84px}.box b{font-size:36px}.box small{font-size:13px}
  .pil-head{font-size:14px}
  h2{font-size:21px}.card p{font-size:17px}
  .actions{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
  .actions .btn{margin:0!important}
  .actions .btn.gold,.actions #again{grid-column:span 2}
  .dw{grid-template-columns:repeat(5,1fr)}
}
@media(min-width:1100px){
  body{max-width:1180px;padding:0 40px 72px}
  h1{font-size:52px}.sub{font-size:20px}
  #result>.third{grid-column:span 2}
  .scorebox .num{font-size:150px}
  .actions{grid-template-columns:repeat(3,1fr)}
  .actions .btn.gold{grid-column:span 3}
  .actions #again{grid-column:span 1}
  .dw{grid-template-columns:repeat(9,1fr)}
}

.chap{text-align:center;margin:0 0 4px}
.chap span{display:inline-block;font-size:12px;font-weight:900;color:#FFE08A;border:2px solid var(--line);border-radius:99px;padding:0 12px;line-height:1.9;white-space:nowrap}
.tabs{grid-template-columns:1fr 1fr!important}
.tab{font-size:16px!important;white-space:nowrap;padding:0 2px}
.in{width:100%;height:58px;border-radius:14px;border:2px solid var(--line);background:#fff;color:var(--ink);font-size:20px;font-weight:900;padding:0 14px;font-family:inherit}
.blks .blk+.blk{margin-top:14px}
.nrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:8px;font-size:15px;line-height:1.7}
.sy{display:inline-block;min-width:40px;text-align:center;border-radius:10px;padding:0 8px;font-weight:900;font-size:20px;line-height:1.6}
.role{display:inline-block;font-size:13px;font-weight:900;border-radius:99px;padding:0 10px;line-height:1.8;white-space:nowrap}
.role.rg,.role.rn{background:#fff;color:var(--ink)}.role.rs{background:#3a1b27;color:#FFE08A;border:2px solid var(--line)}
.role.rb{background:var(--man);color:#04243A}.role.rg{background:var(--gold);color:var(--ink)}
.cands{display:grid;gap:12px}
.cand{border:2px solid var(--line);border-radius:16px;padding:12px 14px;background:#2c1420}
.cand .ct{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.cand .cn{font-size:26px;font-weight:900;color:#fff;white-space:nowrap}
.cand .cs{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:6px 0 4px}
.cand .cm{font-size:14px;color:#FFE08A;font-weight:800}
.cand p{font-size:15px!important;line-height:1.8!important}
.nboxes{display:grid;gap:8px;margin-top:6px;max-width:420px}
.plist{display:grid;gap:10px;margin-top:14px}
.prod{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;border:3px solid var(--line);border-radius:16px;padding:12px;background:#2c1420;cursor:pointer}
.prod.pkg{border-color:var(--gold);background:#3b1d12}
.prod.on{border-color:#fff;background:#4d2230}
.prod .ck{width:26px;height:26px;border-radius:8px;border:3px solid #FFE08A;background:transparent;display:block}
.prod.on .ck{background:var(--gold);border-color:#fff;box-shadow:inset 0 0 0 4px #4d2230}
.prod.open{border-color:#7CFFB2;cursor:default}
.prod.open .ck{background:#7CFFB2;border-color:#7CFFB2}
.prod .pt b{display:block;font-size:16px;font-weight:900;color:#fff;line-height:1.6}
.prod .pt small{display:block;font-size:13px;color:#FFB8CF;font-weight:800;line-height:1.7;text-wrap:balance}
.prod .pp{font-size:15px;font-weight:900;color:var(--gold);white-space:nowrap}
.total{display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding:10px 14px;border-radius:14px;border:2px dashed var(--gold);font-size:17px;color:#fff;font-weight:900}
.total #ttot{color:var(--gold);font-size:22px}
.coderow{display:grid;grid-template-columns:1fr 110px;gap:10px}
.coderow .btn{height:58px;line-height:58px}
.coderow .in{letter-spacing:2px;text-transform:uppercase}
.applytxt{width:100%;margin-top:12px;border-radius:14px;border:2px solid var(--gold);background:#fff;color:var(--ink);font-size:15px;font-weight:800;padding:10px 12px;font-family:inherit;line-height:1.7}
.paid{display:block}
.paid>.card{margin-bottom:16px}
.card.scorebox{text-align:center}
@media(min-width:760px){
  .tabs{max-width:640px!important}.tab{font-size:18px!important}
  .blks{display:grid;grid-template-columns:1fr 1fr;gap:18px 28px}
  .blks .blk+.blk{margin-top:0}.blks .blk.wide{grid-column:span 2}
  .cands{grid-template-columns:1fr 1fr}
  #result>.paid{grid-column:span 6;display:grid;grid-template-columns:1fr;gap:20px}
  .paid>.card{margin-bottom:0}
}

.card{background:linear-gradient(180deg,#2A1220,#220F16)}
.card>h2{padding-bottom:6px;border-bottom:3px solid transparent;border-image:linear-gradient(90deg,#FFC83D,#FF3D7F,rgba(255,61,127,0)) 1}
.card.scorebox>h2{border:0}
.legend{flex-wrap:wrap}
.nrow b{color:#FFE08A}

/* ===== 한자 고르기 ===== */
.hjhead{margin-top:16px;font-size:17px;font-weight:900;color:var(--gold)}.hjhead small{font-size:13px;color:#FFB8CF}
.hjrow{display:grid;grid-template-columns:48px 1fr auto;gap:10px;align-items:center;width:100%;min-height:58px;margin-top:8px;border:2px solid var(--line);border-radius:14px;background:#2c1420;color:#fff;font-family:inherit;padding:6px 10px;cursor:pointer;text-align:left}
.hjrow.open{border-color:var(--gold)}
.hjsy{font-size:24px;font-weight:900;color:var(--gold);text-align:center}
.hjcur{font-size:15px;font-weight:800;line-height:1.5}.hjcur b{font-size:22px;color:#fff}.hjcur em{font-style:normal;color:#FFB8CF}
.hjtg{font-size:13px;font-weight:900;color:#FFE08A;white-space:nowrap}
.hjgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.hjc{border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);font-family:inherit;padding:6px 2px;cursor:pointer;min-height:70px;line-height:1.3}
.hjc b{display:block;font-size:26px;font-weight:900}.hjc small{display:block;font-size:12px;font-weight:800;color:#5a2236;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hjc.on{background:var(--gold);border-color:#fff;box-shadow:0 0 0 3px #fff}
.hjc.none{background:#3a1b27;color:#FFE08A}.hjc.none small{color:#FFB8CF}.hjc.none.on{background:var(--gold);color:var(--ink)}.hjc.none.on small{color:#5a2236}
.hjmore{margin-top:8px;height:52px;line-height:48px;font-size:16px}
.elx{background:#6b5560;color:#fff}
/* ===== 4격 ===== */
.kk{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px}
.kkc{border:3px solid;border-radius:14px;text-align:center;padding:6px 2px;background:#2c1420;line-height:1.4}
.kkn{font-size:14px;font-weight:900;color:#fff}.kkv{font-size:28px;font-weight:900}.kkv small{font-size:13px}
.kkg{display:inline-block;font-size:13px;font-weight:900;color:#111;border-radius:99px;padding:0 10px;margin:2px 0}
.kka{font-size:11px;font-weight:800;color:#FFE08A;white-space:nowrap}
.kkmini{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:6px 0}
.kkmini span{border:2px solid;border-radius:99px;padding:0 2px;font-size:11px;font-weight:900;line-height:1.8;white-space:nowrap;text-align:center}
/* ===== 당사주 ===== */
.dsjs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px}
.dsj{border:2px solid var(--line);border-radius:14px;background:#2c1420;text-align:center;padding:6px 2px;line-height:1.4}
.dsj.me{border-color:var(--gold);background:#4d2230}
.dsj .dpos{font-size:13px;font-weight:900;color:#FFE08A}.dsj .dico{font-size:26px;line-height:1.3}
.dsj b{display:block;font-size:15px;font-weight:900;color:#fff;white-space:nowrap}.dsj small{display:block;font-size:12px;font-weight:800;color:#FFB8CF}
.dkg{display:inline-block;margin-top:3px;font-size:12px;font-weight:900;color:#111;border-radius:99px;padding:0 10px}
/* ===== 기문 ===== */
.qbig{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
.qbig>div{border:3px solid;border-radius:16px;text-align:center;padding:8px 4px;background:#2c1420;line-height:1.4}
.qbig small{display:block;font-size:13px;font-weight:900;color:#FFE08A}.qbig b{display:block;font-size:30px;font-weight:900}.qbig span{font-size:15px;font-weight:900;color:#fff}
.qboard{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px}
.qc{border:3px solid var(--line);border-radius:12px;background:#2c1420;text-align:center;padding:6px 2px;line-height:1.45}
.qc .qd{font-size:13px;font-weight:900;color:#FFE08A}.qc b{display:block;font-size:16px;font-weight:900;white-space:nowrap}
.qc small{display:block;font-size:12px;font-weight:800;color:#fff;white-space:nowrap}.qc small.qs{color:#FFB8CF}
.qc.mid{display:flex;flex-direction:column;justify-content:center;color:#FFE08A}
/* ===== 육효 ===== */
.yq{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:10px 0}
.yqb{min-height:48px;border:2px solid var(--line);border-radius:12px;background:#2c1420;color:#fff;font-family:inherit;font-size:15px;font-weight:900;cursor:pointer}
.yqb.on{background:var(--gold);color:var(--ink);border-color:#fff}
.yq.lock .yqb:not(.on){opacity:.45}
.ytoss{min-height:10px;margin:6px 0}
.yres{display:grid;grid-template-columns:120px 1fr;gap:10px;align-items:center;margin-top:6px}
.hxn{font-size:22px;font-weight:900;color:#fff}.hxm{font-size:16px;font-weight:800;color:#fff;line-height:1.7;margin-top:4px}.hxm b{color:#FFE08A}
.ykil{margin-top:12px;border-radius:14px;text-align:center;font-size:19px;font-weight:900;color:#111;line-height:2.2}
.ytbl{display:grid;gap:4px;margin-top:6px;font-size:14px}
.ytbl>div{display:grid;grid-template-columns:62px 46px 46px 1fr 74px;gap:4px;align-items:center;border-radius:10px;padding:4px 6px;background:#2c1420;line-height:1.6}

<script>
/*LUNAR*/
const LN0=2422375, LD=[3474, 3365, 47693, 2390, 693, 38317, 1748, 3497, 23954, 3730, 52518, 1319, 2647, 45750, 2778, 1748, 28329, 1865, 63123, 2707, 1323, 51803, 2413, 2922, 39764, 2980, 2889, 23187, 2709, 62763, 1325, 2733, 46442, 3506, 3492, 32073, 3402, 72341, 2710, 1366, 51893, 2773, 1746, 36517, 3749, 3658, 27798, 2715, 62806, 1386, 2905, 46930, 1874, 1829, 38475, 2635, 70315, 685, 1387, 52073, 3497, 3474, 39717, 3365, 88653, 2646, 694, 54701, 1748, 3497, 48530, 3730, 3366, 27222, 2647, 70326, 2906, 1748, 44745, 1865, 1683, 38183, 1323, 2651, 21850, 874, 64341, 2980, 2889, 47763, 2709, 1325, 27229, 2733, 79274, 1490, 3493, 48458, 3402, 2709, 38189, 1366, 2741, 21930, 1746, 52901, 3749, 3658, 44182, 3227, 1370, 27349, 2921, 96082, 1874, 2853, 54859, 2635, 1195, 42331, 1389, 2921, 23378, 3474, 64805, 3365, 2637, 46253, 694, 1461];
const LUN={};
(function(){let ny=LN0;for(let i=0;i<LD.length;i++){const y=1920+i,v=LD[i],leap=v>>13,bits=v&8191,n=leap?13:12,ms=[];
  for(let k=0;k<n;k++)ms.push((bits>>k)&1?30:29);
  LUN[y]={ny:ny,leap:leap,ms:ms,len:ms.reduce((a,b)=>a+b,0)};ny+=LUN[y].len;}})();
const LUN_MAX_JD=LUN[1920+LD.length-1].ny+LUN[1920+LD.length-1].len-1;
function jdn(y,m,d){const a=Math.floor((14-m)/12),yy=y+4800-a,mm=m+12*a-3;
  return d+Math.floor((153*mm+2)/5)+365*yy+Math.floor(yy/4)-Math.floor(yy/100)+Math.floor(yy/400)-32045;}
function jd2date(J){const a=J+32044,b=Math.floor((4*a+3)/146097),c=a-Math.floor(146097*b/4),d=Math.floor((4*c+3)/1461),e=c-Math.floor(1461*d/4),m=Math.floor((5*e+2)/153);
  return {d:e-Math.floor((153*m+2)/5)+1,m:m+3-12*Math.floor(m/10),y:100*b+d-4800+Math.floor(m/10)};}
/* 한 해의 음력 달 목록: [{m:월, leap:윤달여부, len:일수}] */
function lunarMonths(y){const L=LUN[y];if(!L)return null;const out=[];let m=0;
  for(let i=0;i<L.ms.length;i++){let isLeap=false;
    if(L.leap&&i===L.leap){isLeap=true;}else{m=(L.leap&&i>L.leap)?i:i+1;}
    out.push({m:isLeap?L.leap:m,leap:isLeap,len:L.ms[i]});}
  return out;}
function lunarToJD(y,m,leap,d){const L=LUN[y];if(!L)return null;const ms=lunarMonths(y);let off=0;
  for(const x of ms){if(x.m===m&&x.leap===!!leap){if(d<1||d>x.len)return null;return L.ny+off+d-1;}off+=x.len;}return null;}
function jdToLunar(J){if(J<LUN[1920].ny||J>LUN_MAX_JD)return null;let y=1920;while(y<1920+LD.length-1&&LUN[y+1].ny<=J)y++;
  let off=J-LUN[y].ny;for(const x of lunarMonths(y)){if(off<x.len)return {y:y,m:x.m,leap:x.leap,d:off+1};off-=x.len;}return null;}
/*END_LUNAR*/

/*ENGINE*/
const STEM_H="甲乙丙丁戊己庚辛壬癸", STEM_K=["갑","을","병","정","무","기","경","신","임","계"];
const BR_H="子丑寅卯辰巳午未申酉戌亥", BR_K=["자","축","인","묘","진","사","오","미","신","유","술","해"];
const EL=["목","화","토","금","수"];
const STEM_EL=[0,0,1,1,2,2,3,3,4,4];
const BR_EL=[4,2,0,0,2,1,1,2,3,3,2,4];
function sunLonJD(jd){
  const T=(jd-2451545)/36525, rad=Math.PI/180;
  const L0=280.46646+36000.76983*T+0.0003032*T*T;
  const M=(357.52911+35999.05029*T-0.0001537*T*T)*rad;
  const C=(1.914602-0.004817*T-0.000014*T*T)*Math.sin(M)+(0.019993-0.000101*T)*Math.sin(2*M)+0.000289*Math.sin(3*M);
  const om=(125.04-1934.136*T)*rad;
  return (((L0+C-0.00569-0.00478*Math.sin(om))%360)+360)%360;
}
function jdKST(y,m,d,h){return Date.UTC(y,m-1,d,h-9,0)/86400000+2440587.5;}
/* hIdx: 0자~11해 (만세력 기준 시진), null=모름 */
function pillars(y,m,d,hIdx){
  const lon=sunLonJD(jdKST(y,m,d,hIdx==null?12:hIdx*2));
  let yr=y; if(m<=2 && lon<315) yr-=1;
  const yS=(((yr-4)%10)+10)%10, yB=(((yr-4)%12)+12)%12;
  const mIdx=Math.floor((((lon-315)%360+360)%360)/30);
  const mB=(2+mIdx)%12, mS=([2,4,6,8,0][yS%5]+mIdx)%10;
  const di=(jdn(y,m,d)+49)%60, dS=di%10, dB=di%12;
  let h=null; if(hIdx!=null) h={s:((dS%5)*2+hIdx)%10,b:hIdx};
  const frac=(((lon-315)%360+360)%360)%30;
  return {year:{s:yS,b:yB},month:{s:mS,b:mB},day:{s:dS,b:dB},hour:h,edge:(frac<0.5||frac>29.5),yr:yr};
}
function idx60(s,b){for(let k=0;k<60;k++)if(k%10===s&&k%12===b)return k;return 0;}
function counts(p){const c=[0,0,0,0,0];
  ["year","month","day","hour"].forEach(k=>{if(p[k]){c[STEM_EL[p[k].s]]++;c[BR_EL[p[k].b]]++;}});return c;}
/* 대운: 양남음녀 순행 / 음남양녀 역행, 절기까지 일수÷3 = 시작 나이 */
function daewoon(P,sex,y,m,d,hIdx){
  const fwd=((P.year.s%2===0)&&sex==='m')||((P.year.s%2===1)&&sex==='f');
  const jd0=jdKST(y,m,d,hIdx==null?12:hIdx*2), lon0=sunLonJD(jd0);
  let target=fwd?(Math.floor((lon0-15)/30)+1)*30+15:Math.floor((lon0-15)/30)*30+15;
  target=((target%360)+360)%360;
  let t=jd0;for(let i=0;i<8;i++){const l=sunLonJD(t),e=((target-l+540)%360)-180;t+=e/0.9856;}
  const days=Math.abs(t-jd0), start=Math.max(1,Math.round(days/3));
  const base=idx60(P.month.s,P.month.b), list=[];
  for(let i=0;i<9;i++){const k=(base+(fwd?(i+1):-(i+1))+600)%60;list.push({s:k%10,b:k%12,age:start+10*i});}
  return {fwd:fwd,start:start,days:days,list:list};
}
function analyze(A,B){
  let sc=60, stemRel, brRel;
  const a=A.day.s,b=B.day.s,ea=STEM_EL[a],eb=STEM_EL[b];
  if(((a-b+10)%10)===5){sc+=16;stemRel="hap";}
  else if(ea===eb){sc+=5;stemRel="same";}
  else if((ea+1)%5===eb||(eb+1)%5===ea){sc+=9;stemRel="saeng";}
  else {stemRel="geuk";}
  const x=A.day.b,y=B.day.b;
  if((x+y)%12===1){sc+=14;brRel="yukhap";}
  else if(x!==y && x%4===y%4){sc+=10;brRel="samhap";}
  else if(x===y){sc+=4;brRel="same";}
  else if(((x-y+12)%12)===6){sc-=4;brRel="chung";}
  else {brRel="none";}
  const mx=A.month.b,my=B.month.b;
  if((mx+my)%12===1 || (mx!==my && mx%4===my%4)) sc+=4;
  if(A.year.b===B.year.b) sc+=3;
  const cA=counts(A),cB=counts(B);
  let fill=0, fillA=[], fillB=[];
  for(let i=0;i<5;i++){
    if(cA[i]===0&&cB[i]>0){fill+=3;fillA.push(i);}
    if(cB[i]===0&&cA[i]>0){fill+=3;fillB.push(i);}
  }
  sc+=Math.min(fill,9);
  sc=Math.max(55,Math.min(99,sc));
  return {score:sc,stemRel:stemRel,brRel:brRel,fillA:fillA,fillB:fillB,cA:cA,cB:cB};
}
/*END*/

/* ===== 입력 화면 ===== */
const $=id=>document.getElementById(id);
const SIJIN=[["자시 · 밤 11:30 ~ 새벽 1:29"],["축시 · 새벽 1:30 ~ 3:29"],["인시 · 새벽 3:30 ~ 5:29"],["묘시 · 새벽 5:30 ~ 7:29"],["진시 · 아침 7:30 ~ 9:29"],["사시 · 오전 9:30 ~ 11:29"],["오시 · 낮 11:30 ~ 오후 1:29"],["미시 · 오후 1:30 ~ 3:29"],["신시 · 오후 3:30 ~ 5:29"],["유시 · 오후 5:30 ~ 7:29"],["술시 · 저녁 7:30 ~ 9:29"],["해시 · 밤 9:30 ~ 11:29"]];
let MODE="read";
function personHTML(k,label,cls,hint){
  const years='<option value="">년</option>'+Array.from({length:96},(_,i)=>2025-i).map(y=>'<option value="'+y+'">'+y+'년</option>').join("");
  const tm='<option value="">시간 모름</option>'+SIJIN.map((s,i)=>'<option value="'+i+'">'+s[0]+'</option>').join("");
  return '<div class="card pc" id="pc_'+k+'" data-k="'+k+'">'
   +'<div class="who"><span class="'+cls+'">'+label+'</span><small>'+hint+'</small></div>'
   +'<label>성별</label><div class="seg sx"><button type="button" class="m" data-v="m">남자</button><button type="button" class="f" data-v="f">여자</button></div>'
   +'<label>생일 종류</label><div class="seg cal"><button type="button" class="on" data-v="solar">양력</button><button type="button" data-v="lunar">음력</button></div>'
   +'<div class="help" id="h_'+k+'">주민등록증·달력의 생일은 보통 양력이에요</div>'
   +'<label>생년월일</label><div class="ymd"><select class="y">'+years+'</select><select class="m"><option value="">월</option></select><select class="d"><option value="">일</option></select></div>'
   +'<div class="conv" id="cv_'+k+'">생년월일을 고르면 양력·음력이 함께 보여요</div>'
   +'<label>태어난 시간</label><select class="t">'+tm+'</select>'
   +'<div class="help">시간을 모르면 ‘시간 모름’으로 두세요</div></div>';
}
function wirePerson(k){
  const root=$("pc_"+k), st={sex:null,cal:"solar"};
  root._st=st;
  const sy=root.querySelector("select.y"),sm=root.querySelector("select.m"),sd=root.querySelector("select.d");
  root.querySelectorAll(".sx button").forEach(b=>b.onclick=()=>{st.sex=b.dataset.v;root.querySelectorAll(".sx button").forEach(x=>x.classList.toggle("on",x===b));});
  root.querySelectorAll(".cal button").forEach(b=>b.onclick=()=>{st.cal=b.dataset.v;root.querySelectorAll(".cal button").forEach(x=>x.classList.toggle("on",x===b));
    $("h_"+k).textContent=st.cal==="lunar"?"음력 생일 그대로 고르세요. 윤달은 ‘윤3월’처럼 보여요":"주민등록증·달력의 생일은 보통 양력이에요";
    fillMonths();fillDays();showConv();});
  function fillMonths(){
    const prev=sm.value,y=Number(sy.value);let html='<option value="">월</option>';
    if(st.cal==="lunar"&&LUN[y]){html+=lunarMonths(y).map(x=>'<option value="'+x.m+(x.leap?"L":"")+'">'+(x.leap?"윤":"")+x.m+'월</option>').join("");}
    else{for(let m=1;m<=12;m++)html+='<option value="'+m+'">'+m+'월</option>';}
    sm.innerHTML=html;if([...sm.options].some(o=>o.value===prev))sm.value=prev;
  }
  function dayCount(){
    const y=Number(sy.value),mv=sm.value;if(!y||!mv)return 31;
    if(st.cal==="lunar"){const leap=mv.endsWith("L"),m=parseInt(mv,10);const x=(lunarMonths(y)||[]).find(z=>z.m===m&&z.leap===leap);return x?x.len:30;}
    return new Date(y,parseInt(mv,10),0).getDate();
  }
  function fillDays(){
    const prev=sd.value,n=dayCount();let html='<option value="">일</option>';
    for(let d=1;d<=n;d++)html+='<option value="'+d+'">'+d+'일</option>';
    sd.innerHTML=html;if(prev&&Number(prev)<=n)sd.value=prev;
  }
  function showConv(){const r=readDate(root);
    $("cv_"+k).innerHTML=r.ok?r.text:"생년월일을 고르면 양력·음력이 함께 보여요";}
  sy.onchange=()=>{fillMonths();fillDays();showConv();};
  sm.onchange=()=>{fillDays();showConv();};
  sd.onchange=showConv;
}
/* 입력값 → 양력 날짜 + 확인 문구 */
function readDate(root){
  const st=root._st,y=Number(root.querySelector("select.y").value),mv=root.querySelector("select.m").value,d=Number(root.querySelector("select.d").value);
  if(!y||!mv||!d)return {ok:false};
  let J,lun,sol;
  if(st.cal==="lunar"){const leap=mv.endsWith("L"),m=parseInt(mv,10);J=lunarToJD(y,m,leap,d);
    if(J==null)return {ok:false,msg:"그 날짜는 음력에 없어요. 월·일을 다시 확인해 주세요"};
    sol=jd2date(J);lun={y:y,m:m,leap:leap,d:d};}
  else{const m=parseInt(mv,10);J=jdn(y,m,d);sol={y:y,m:m,d:d};lun=jdToLunar(J);}
  const solT='양력 <b>'+sol.y+'년 '+sol.m+'월 '+sol.d+'일</b>';
  const lunT=lun?'음력 <b>'+lun.y+'년 '+(lun.leap?"윤":"")+lun.m+'월 '+lun.d+'일</b>':'음력 계산 범위 밖';
  return {ok:true,sol:sol,lun:lun,jd:J,text:solT+'<br>'+lunT+(st.cal==="lunar"?'<br><span style="color:#FFE08A;white-space:nowrap">↑ 이 양력 날짜로 풀이해요</span>':"")};
}
function getPerson(k){
  const root=$("pc_"+k),st=root._st,label=k==="A"?(MODE==="read"?"":"나"):"그 사람";
  if(!st.sex)return {err:(MODE==="read"?"":label+" ")+"성별을 눌러 주세요"};
  const r=readDate(root);
  if(!r.ok)return {err:r.msg||((MODE==="read"?"":label+" ")+"생년월일을 모두 골라 주세요")};
  const tv=root.querySelector("select.t").value, hIdx=tv===""?null:Number(tv);
  const P=pillars(r.sol.y,r.sol.m,r.sol.d,hIdx);
  return {sex:st.sex,sol:r.sol,lun:r.lun,hIdx:hIdx,P:P};
}
function buildForm(){
  $("pcs").className="pcs"+(MODE!=="match"?" one":"");
  $("pcs").innerHTML=personHTML("A",MODE==="read"?"나":"나","","내 정보")+(MODE==="match"?personHTML("B","그 사람","b","썸·연인·부부 누구든 OK"):"")+(MODE==="name"?nameCardHTML():"");
  wirePerson("A");if(MODE==="match")wirePerson("B");if(MODE==="name"&&typeof hjWire==="function")hjWire();

function tenGod(d,o){
  const me=STEM_EL[d],ot=STEM_EL[o],same=(d%2)===(o%2);
  if(me===ot)return same?0:1;
  if((me+1)%5===ot)return same?2:3;
  if((me+2)%5===ot)return same?4:5;
  if((ot+2)%5===me)return same?6:7;
  return same?8:9;
}
function brRel(a,b){
  if(((a-b+12)%12)===6)return "chung";
  if((a+b)%12===1)return "yukhap";
  if(a!==b&&a%4===b%4)return "samhap";
  return "";
}
function analyzeOne(P,sex){
  const d=P.day.s,gs=[0,0,0,0,0],tc=Array(10).fill(0);
  const items=[[P.year.s,1],[P.month.s,1],[BR_MAIN[P.year.b],1],[BR_MAIN[P.month.b],2],[BR_MAIN[P.day.b],1.2]];
  if(P.hour){items.push([P.hour.s,1]);items.push([BR_MAIN[P.hour.b],1]);}
  items.forEach(([s,w])=>{const t=tenGod(d,s);gs[TGG[t]]+=w;tc[t]++;});
  const strong=(gs[0]+gs[4])>=(gs[1]+gs[2]+gs[3]);
  let top=0;for(let i=1;i<5;i++)if(gs[i]>gs[top])top=i;

  const spouseG=sex==="m"?2:3, sg=gs[spouseG];
  const mixed=sex==="m"?(tc[4]>0&&tc[5]>0):(tc[6]>0&&tc[7]>0);

}

function favorEl(a){
  const me=STEM_EL[a.d],c=a.cnt;let cand;
  if(a.strong)cand=[(me+1)%5,(me+2)%5,(me+3)%5];else cand=[(me+4)%5,me];
  let best=cand[0];for(const e of cand)if(c[e]<c[best])best=e;return best;
}
function monthScores(yearS,a,dayB){
  const out=[];
  for(let i=0;i<12;i++){
    const mS=([2,4,6,8,0][yearS%5]+i)%10,mB=(2+i)%12,g=TGG[tenGod(a.d,mS)];let sc=50;
    if(a.strong)sc+=[-15,20,30,10,-5][g];else sc+=[10,0,10,-5,15][g];
    const r=brRel(mB,dayB);if(r==="chung")sc-=12;else if(r==="yukhap")sc+=6;
    out.push({m:((i+1)%12)+1,sc:Math.max(20,Math.min(100,sc))});
  }
  return out;
}

function pilHTML(p){

function sylScore(e,a,fav){
  if(e===fav)return 1;
  if(e===(fav+4)%5)return 0.5;
  if(e===a.topEl&&a.cnt[e]>=3)return -0.7;
  if(e===(fav+3)%5)return -0.4;
  return 0;
}
function nameEval(sur,given,a,fav){
  const chars=[...sur,...given],gi=[...given].map(elOfCh),sEl=elOfCh(sur[0]);
  let sum=0;gi.forEach(e=>sum+=sylScore(e,a,fav));sum+=0.5*sylScore(sEl,a,fav);
  const combined=sum/(gi.length+0.5);
  let flow=0;const seq=[sEl,...gi];
  for(let i=1;i<seq.length;i++){const d=(seq[i]-seq[i-1]+5)%5;if(d===1)flow+=0.1;else if(d===2||d===3)flow-=0.1;}
  const st=chars.map(strokesOf),total=st.reduce((x,y)=>x+y,0),gv=[...given].reduce((x,c)=>x+strokesOf(c),0);
  const suriN=(SURI_OK.has(total)?1:0)+(SURI_OK.has(gv)?1:0);
  const par=st.map(x=>x%2),yy=par.every(x=>x===par[0])?-3:2;
  const score=Math.round(clampN(55+32*combined+10*flow+[-4,1,5][suriN]+yy,18,98));
  const hitFav=gi.filter(e=>e===fav).length,hitGen=gi.filter(e=>e===(fav+4)%5).length;
  const hitExc=(a.cnt[a.topEl]>=3&&a.topEl!==fav)?gi.filter(e=>e===a.topEl).length:0;
  const elCnt=[0,0,0,0,0];chars.forEach(c=>{const e=elOfCh(c);if(e!=null)elCnt[e]++;});
  return {score,chars,gi,sEl,st,total,gv,suriN,yy,flow,hitFav,hitGen,hitExc,elCnt};
}

/* ---------- 레이더 차트 ---------- */
function radarSVG(labels,series,max,lcol){
  const n=labels.length,cx=150,cy=142,r=92,pt=(i,v)=>{const a=-Math.PI/2+i*2*Math.PI/n,rr=r*v/max;return [cx+rr*Math.cos(a),cy+rr*Math.sin(a)];};
  let g="";
  [0.25,0.5,0.75,1].forEach(f=>{g+='<polygon points="'+labels.map((_,i)=>pt(i,max*f).map(x=>x.toFixed(1)).join(",")).join(" ")+'" fill="none" stroke="#5A2A3A" stroke-width="'+(f===1?2:1)+'"/>';});
  labels.forEach((_,i)=>{const p=pt(i,max);g+='<line x1="'+cx+'" y1="'+cy+'" x2="'+p[0].toFixed(1)+'" y2="'+p[1].toFixed(1)+'" stroke="#5A2A3A" stroke-width="1"/>';});
  series.forEach(s=>{const ps=s.v.map((v,i)=>pt(i,Math.max(max*0.04,Math.min(max,v))));
    g+='<polygon points="'+ps.map(p=>p.map(x=>x.toFixed(1)).join(",")).join(" ")+'" fill="'+s.c+'" fill-opacity="'+(s.o||0.3)+'" stroke="'+s.c+'" stroke-width="3" stroke-linejoin="round"/>';
    ps.forEach(p=>{g+='<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="4.5" fill="'+s.c+'" stroke="#120709" stroke-width="1.5"/>';});});
  labels.forEach((t,i)=>{const p=pt(i,max*1.27),c=lcol?lcol[i]:"#FFC83D",w=Math.max(40,t.length*13+14);
    g+='<rect x="'+(p[0]-w/2).toFixed(1)+'" y="'+(p[1]-13).toFixed(1)+'" width="'+w+'" height="24" rx="12" fill="'+c+'"/><text x="'+p[0].toFixed(1)+'" y="'+(p[1]+4.5).toFixed(1)+'" text-anchor="middle" font-size="13" font-weight="900" fill="'+((c==="#F4F1EA"||c==="#E6A100"||c==="#FFC83D")?"#111":"#fff")+'">'+t+'</text>';});
  return '<svg viewBox="0 0 300 290" style="width:100%;max-width:340px;display:block;margin:4px auto 0" role="img">'+g+'</svg>';
}

   +li("③ 일주","율리우스 적일 "+J+"<br>→ ("+J+"+49)÷60의 나머지 "+((J+49)%60)+"<br>→ "+((J+49)%60)+"번째 간지 = "+gz(p.P.day.s,p.P.day.b))+'</div>'

   +'<div style="margin-top:14px"><span class="role rs">출처 (누르면 열려요)</span>'+[["한국천문연구원 달력자료 · 24절기 시각","https://astro.kasi.re.kr/kor/life/post/calendarData?year=2026"],["음양력 변환 자료 (한국천문연구원 기반)","https://github.com/usingsky/korean_lunar_calendar_py"],["사주팔자 · 십성·십이운성·신살 (위키백과)","https://ko.wikipedia.org/wiki/사주팔자"],["연월일시 궁위 연구 (학술 논문)","https://koreascience.kr/article/JAKO202408861392018.pdf"],["구성기학 9 Star Ki (위키백과)","https://en.wikipedia.org/wiki/9_Star_Ki"],["2026년 연반·월반 대조 자료","https://www.masterseanchan.com/fengshui-2026-flying-star-chart/"]].map(x=>'<div style="font-size:14px;line-height:1.9;margin-top:2px">· '+lk(x[0],x[1])+'</div>').join("")+'</div></div>';

function hjEval(objs,sl,a,fav){
  const st=objs.map(o=>o.w),S=st.slice(0,sl).reduce((x,y)=>x+y,0),G=st.slice(sl),gs=G.reduce((x,y)=>x+y,0);
  const raw=[gs,S+G[0],G.length>1?S+G[G.length-1]:S,S+gs];
  const NM=[["원격","초년 · 1~20세"],["형격","청년 · 20~40세"],["이격","중년 · 40~60세"],["정격","말년 · 총운"]];
  const kk=raw.map((r,i)=>{const v=sur81(r),s=SURI81[v];return {n:NM[i][0],age:NM[i][1],raw:r,v,g:s.g,k:s.k,u:s.u};});
  const wt=[.2,.3,.2,.3],suri=kk.reduce((s,k,i)=>s+wt[i]*k.g/2,0);
  const gi=objs.slice(sl),els=gi.map(o=>o.e);
  const elAvg=els.reduce((s,e)=>s+(e==null?0:sylScore(e,a,fav)),0)/Math.max(1,gi.length);
  const par=st.map(x=>x%2),yy=par.every(x=>x===par[0])?-4:3;
  const score=Math.round(clampN(42+34*suri+22*elAvg+yy,18,98));
  return {kk,suri,els,elAvg,yy,score,st,S,gs,hitFav:els.filter(e=>e===fav).length,unknown:els.filter(e=>e==null).length,
    good:kk.filter(k=>k.g===2).length,bad:kk.filter(k=>k.g===0).length};

function hjBest(surObjs,given,a,fav){
  const lists=[...given].map(s=>hjGood(s,14));if(lists.some(l=>!l.length))return null;
  let best=null;const sl=surObjs.length;
  const walk=(i,acc)=>{if(i===lists.length){const ev=hjEval([...surObjs,...acc],sl,a,fav);
      const t=ev.score+acc.filter(o=>o.edu).length*3+acc.filter(o=>HJ_POS.test(o.m)).length*2+acc.filter(o=>o.e===fav).length;
      if(!best||t>best.t)best={t,objs:acc.slice(),ev};return;}
    for(const o of lists[i]){if(acc.some(x=>x.c===o.c))continue;acc.push(o);walk(i+1,acc);acc.pop();}};
  walk(0,[]);return best;}
function hjPickList(nm,surObjs,a,fav,sex,count,seed){
  const base=namePickList(nm.sur,a,fav,sex,24,seed,nm.given),out=[];

  out.sort((x,y)=>y.tot-x.tot);
  const res=[],cf={};for(const x of out){const k=x.g[0];if((cf[k]||0)>=2)continue;cf[k]=(cf[k]||0)+1;res.push(x);if(res.length>=count)break;}

const QM_TERM=["동지","소한","대한","입춘","우수","경칩","춘분","청명","곡우","입하","소만","망종","하지","소서","대서","입추","처서","백로","추분","한로","상강","입동","소설","대설"];
const QM_JU=[[1,7,4],[2,8,5],[3,9,6],[8,5,2],[9,6,3],[1,7,4],[3,9,6],[4,1,7],[5,2,8],[4,1,7],[5,2,8],[6,3,9],[9,3,6],[8,2,5],[7,1,4],[2,5,8],[1,4,7],[9,3,6],[7,1,4],[6,9,3],[5,8,2],[6,9,3],[5,8,2],[4,7,1]];

const QM_DOOR={1:["휴문","休",3,"쉬고 사람 만나기 좋은 문 · 부탁·화해"],8:["생문","生",3,"재물과 기회가 생기는 문 · 영업·투자"],3:["상문","傷",-2,"다툼과 경쟁의 문 · 승부·빚 받기"],4:["두문","杜",0,"막고 숨기는 문 · 정리·보안"],9:["경문","景",1,"빛과 문서의 문 · 시험·홍보·발표"],2:["사문","死",-3,"멈추고 끝내는 문 · 마무리"],7:["경문","驚",-2,"놀람과 구설의 문 · 말조심"],6:["개문","開",3,"열고 시작하는 문 · 개업·취업·계약"]};
const QM_STAR={1:["천봉","蓬",-1],2:["천예","芮",-1],3:["천충","沖",0],4:["천보","輔",1],5:["천금","禽",1],6:["천심","心",1],7:["천주","柱",-1],8:["천임","任",1],9:["천영","英",0]};
const QM_GOD=[["직부","值符",1],["등사","螣蛇",-1],["태음","太陰",1],["육합","六合",1],["백호","白虎",-1],["현무","玄武",-1],["구지","九地",1],["구천","九天",1]];
const QM_Q=[4,5,6,7,8,9,3,2,1];
function qimen(y,m,d,hIdx,hourDec){
  const P=pillars(y,m,d,hIdx),jd=jdKST(y,m,d,hourDec==null?hIdx*2:hourDec),lon=sunLonJD(jd);
  const k=Math.floor((((lon-270)%360+360)%360)/15),yang=k<12;

  const ju=QM_JU[k][yuan],gp={};
  for(let i=0;i<9;i++){const pal=yang?((ju-1+i)%9)+1:((ju-1-i)%9+9)%9+1;gp[pal]=QM_Q[i];}
  const palOf=s=>+Object.keys(gp).find(x=>gp[x]===s);
  const hi=idx60(P.hour.s,P.hour.b),xun=Math.floor(hi/10),yi=[4,5,6,7,8,9][xun];
  const X=palOf(yi),X2=X===5?2:X,T=P.hour.s===0?X:palOf(P.hour.s),T2=T===5?2:T,pos=q=>QM_RING.indexOf(q);
  const off=(pos(T2)-pos(X2)+8)%8,star={},hs={},door={},god={};
  QM_RING.forEach(r=>{const src=QM_RING[(pos(r)-off+8)%8];star[r]=src;hs[r]=[gp[src]].concat(src===2?[gp[5]]:[]);});
  const n=hi%10,D=yang?((X-1+n)%9)+1:((X-1-n)%9+9)%9+1,D2=D===5?2:D,doff=(pos(D2)-pos(X2)+8)%8;
  QM_RING.forEach(r=>{door[r]=QM_RING[(pos(r)-doff+8)%8];});
  for(let i=0;i<8;i++){const r=yang?QM_RING[(pos(T2)+i)%8]:QM_RING[(pos(T2)-i+8)%8];god[r]=i;}
  const sc={};QM_RING.forEach(r=>{sc[r]=QM_DOOR[door[r]][2]+QM_GOD[god[r]][2]+QM_STAR[star[r]][2]+(hs[r].some(s=>s>=1&&s<=3)?1:0)
    +(star[r]===2?QM_STAR[5][2]:0);});
  const ord=[...QM_RING].sort((a,b)=>sc[b]-sc[a]);

}

    B("한 줄 조언",r.k===2?"밀고 나가세요. 지금 흐름이 내 편이에요.":r.k===1?"반은 열려 있어요. 준비를 더 하고 때를 맞추세요.":"지금은 무리하지 마세요. 지키고 기다리면 다음 기회가 와요."),
    B("괘를 세운 방법","동전 세 닢을 여섯 번 던져<br>아래에서 위로 쌓았어요.<br>앞면 3 · 뒷면 2로 더해서<br>6과 9는 움직이는 효예요.<br>"+YTRI[r.pal.t][0]+"궁("+EL[r.pe]+") 괘 · 세효는 "+r.pal.se+"효<br>경방 납갑법으로 지지를 붙였어요.")]));
}

/* ---------- 결과 화면 (운세·점 탭) ---------- */
function renderFate(p){
  const c=ctx(p),r=dangsaju(p),adm=isAdmin(),{n,q}=qmNow(),bd=QM_DOOR[q.door[q.best]],wd=QM_DOOR[q.door[q.worst]];
  const head='<div class="card full"><div class="who"><span>나</span>'+sexChip(p.sex)+'<small>'+c.who+' · '+(p.lun?"음력 "+p.lun.y+"."+(p.lun.leap?"윤":"")+p.lun.m+"."+p.lun.d:"양력 "+p.sol.y+"."+p.sol.m+"."+p.sol.d)+'</small></div><div class="pil-head"><div>시</div><div>일</div><div>월</div><div>년</div></div><div class="pil">'+pilHTML(c.P)+'</div><div class="note">'+dateLine(p)+'</div></div>';
  const dang=r?'<div class="card full"><h2>🀄 당사주 · 나의 네 별</h2><div class="teaser">나를 맡은 별은 ‘'+DSJ[r.d][0]+'('+DSJ[r.d][1]+')’ · '+DSJ[r.d][3]+'</div>'+dsjBoard(r)
    +'<p style="margin-top:10px">'+S(DSJ[r.d][4]+" "+(adm?DSJ[r.d][5]:""))+'</p>'+lockBox(DUMMY_TXT,"초년~말년 평생 풀이 열기")+'</div>':'';
  const gi='<div class="card half"><h2>🧭 기문둔갑 · 지금 길방</h2><div class="teaser">'+n.m+'월 '+n.d+'일 '+SIJIN[q.hIdx][0].split(" · ")[0]+' · '+q.term+' '+(q.yang?"양":"음")+'둔 '+q.ju+'국</div>'
    +'<div class="qbig"><div style="border-color:'+KC[2]+'"><small>가장 좋은 방향</small><b style="color:'+KC[2]+'">'+QM_DIR[q.best]+'</b><span>'+bd[0]+' '+bd[1]+'</span></div><div style="border-color:'+KC[0]+'"><small>피할 방향</small><b style="color:'+KC[0]+'">'+QM_DIR[q.worst]+'</b><span>'+wd[0]+' '+wd[1]+'</span></div></div>'
    +'<p style="margin-top:10px">'+doorTxt(bd)+'</p>'+lockBox(DUMMY_TXT,"기문판·오늘 좋은 시간 열기")+'</div>';
  const yk='<div class="card half" id="ykcard"><h2>🪙 육효점 · 동전 점</h2><div class="teaser">궁금한 일 하나를 골라 동전을 던져요</div><div id="ykbody">'+yukFree(p)+'</div></div>';
  $("result").innerHTML=head+dang+gi+yk+fateEvidence(p,q)+menuHTML(p)
    +'<div class="actions full"><button class="btn line" id="share" type="button">결과 공유하기</button><button class="btn line" id="again" type="button">다시 하기</button></div>';
  LAST={text:(r?"내 당사주 별은 ‘"+DSJ[r.d][0]+"’! ":"")+"오늘 기문 길방은 "+QM_DIR[q.best]+"쪽 - 한국뇌궁합연구소"};
  bindCommon();wireMenu(p);wireYuk(p);
}
function wireYuk(p){
  const box=$("ykbody");if(!box)return;
  box.onclick=e=>{const t=e.target;
    if(t.closest(".yqb")){if(YK.lines.length>=6)return;YK.q=+t.closest(".yqb").dataset.q;box.innerHTML=yukFree(p);if(typeof adminOpen==="function")adminOpen();return;}
    if(t.id==="y_toss"){YK.lines.push(tossOnce());}
    else if(t.id==="y_all"){while(YK.lines.length<6)YK.lines.push(tossOnce());}
    else if(t.id==="y_new"){YK.lines=[];}
    else return;
    box.innerHTML=yukFree(p);if(typeof adminOpen==="function")adminOpen();
    if(YK.lines.length===6||t.id==="y_new"){renderPaid(p,false);if(typeof adminOpen==="function")adminOpen();}};
}
function fateEvidence(p,q){
  const r=dangsaju(p);
  return '<div class="card full"><h2>🔍 이 풀이의 근거</h2><div class="teaser" style="font-size:15px">어떻게 셌는지 그대로 보여 드려요</div><div class="blks"><div class="blk">'
   +'<span class="role rg">① 당사주</span><div class="evt">'+(r?"띠 "+BR_K[r.y]+" → "+DSJ[r.y][0]+"<br>음력 "+r.lun.m+"월 → "+DSJ[r.m][0]+"<br>음력 "+r.lun.d+"일 → "+DSJ[r.d][0]+(r.h!=null?"<br>"+SIJIN[p.hIdx][0].split(" · ")[0]+" → "+DSJ[r.h][0]:""):"음력 범위 밖")+'<br>열두 별을 자(子)부터 해(亥)까지<br>차례로 세는 전통 셈법이에요.</div>'
   +'<span class="role rg" style="margin-top:12px">② 기문둔갑</span><div class="evt">절기 ‘'+q.term+'’ · '+["상","중","하"][q.yuan]+'원 → '+(q.yang?"양":"음")+'둔 '+q.ju+'국<br>지금 시주 '+gz(q.P.hour.s,q.P.hour.b)+'<br>시가기문 연국, 탁보법으로 국을 정했어요.<br>유파에 따라 국이 다를 수 있어요.</div></div><div class="blk">'
   +'<span class="role rg">③ 육효점</span><div class="evt">동전 세 닢 × 여섯 번 (앞 3 · 뒤 2)<br>6·9는 움직이는 효로 변괘를 만들어요.<br>경방 팔궁 · 납갑 · 세응 · 육친으로<br>오늘 일진·이번 달 월건과 견줘 판단해요.</div>'
   +'<span class="role rg" style="margin-top:12px">④ 한계</span><div class="evt">세 가지 모두 재미로 보는 전통 점법이에요.<br>풀이 문장은 연구소가 직접 썼어요.</div></div></div>'
   +'<div style="margin-top:14px"><span class="role rs">출처 (누르면 열려요)</span>'+[["당사주 12성과 보는 법","https://m.cafe.daum.net/tongmaek/SpHL/1"],["기문둔갑 (위키백과)","https://ko.wikipedia.org/wiki/기문둔갑"],["육효 · 경방역 (위키백과)","https://zh.wikipedia.org/wiki/京房易"],["주역 64괘 (위키백과)","https://ko.wikipedia.org/wiki/주역"]].map(x=>'<div style="font-size:14px;line-height:1.9;margin-top:2px">· <a href="'+x[1]+'" target="_blank" rel="noopener" style="color:#7CC8FF;font-weight:900;text-decoration:underline">'+x[0]+'</a></div>').join("")+'</div></div>';
}

$("go").onclick=function(){
  const A=getPerson("A");if(A.err){$("err").textContent=A.err;return;}
  let B=null;
  if(MODE==="name"){const nm=parseName($("nm").value);if(nm.err){$("err").textContent=nm.err;return;}A.name=nm;
    if(typeof HJS!=="undefined"&&HJS.name===nm.full){A.hanja=HJS.sel.slice();A.hanjaFor=nm.full;}}
  if(MODE==="match"){B=getPerson("B");if(B.err){$("err").textContent=B.err;return;}}
  $("err").textContent="";
  const md=MODE;
  window.RERENDER=function(){if(md==="read")renderReading(A);else if(md==="name")renderName(A);else if(md==="fate")renderFate(A);else renderMatch(A,B);if(typeof adminOpen==="function")adminOpen();};
  window.RERENDER();
  $("form").style.display="none";$("result").classList.add("on");window.scrollTo(0,0);
};
buildForm();
